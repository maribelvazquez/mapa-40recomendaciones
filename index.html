rohibición de revelar?","a":"No, porque esa prohibición no pretende inhibir el intercambio de información de la R.18","o":["Sí, porque ningún tercero, ni siquiera dentro del grupo, puede saber que existe el reporte","Sí, salvo que el supervisor autorice por escrito cada intercambio dentro del grupo","No, pero sólo si la función de cumplimiento del grupo está en el mismo país","No, porque esa prohibición no pretende inhibir el intercambio de información de la R.18"],"x":"La R.21 aclara que la prohibición de revelar no pretende inhibir el intercambio de información de la R.18, y la INR.18 prevé que las funciones de grupo reciban información que puede incluir el hecho de que se presentó un reporte, con salvaguardas contra la revelación.","ref":"R.21, inciso (b); INR.18, párr. 4","d":{"Sí, porque ningún tercero, ni siquiera dentro del grupo, puede saber que existe el reporte":"La R.21 aclara que la prohibición no inhibe el intercambio de la R.18, y la INR.18 permite compartir dentro del grupo el hecho del reporte.","Sí, salvo que el supervisor autorice por escrito cada intercambio dentro del grupo":"El estándar no exige autorización escrita del supervisor por cada intercambio; pide salvaguardas de confidencialidad (INR.18).","No, pero sólo si la función de cumplimiento del grupo está en el mismo país":"La INR.18 no limita el intercambio a funciones de grupo del mismo país."}},{"id":"G065","tema":"D","tipo":"cifra","q":"Según las Notas a las R.22 y R.23, un casino debe aplicar DDC cuando sus clientes realizan operaciones financieras iguales o superiores a:","a":"USD/EUR 3,000","o":["USD/EUR 10,000","USD/EUR 3,000","USD/EUR 15,000","USD/EUR 1,000"],"x":"El umbral designado para casinos es de USD/EUR 3,000, y no aparece en el texto de la R.22 sino en su Nota. USD/EUR 15,000 es el umbral de los comerciantes de metales y piedras preciosas en efectivo y de las operaciones ocasionales de IF.","ref":"INR.22/23, párr. 1; INR.22, párr. 2","d":{"USD/EUR 10,000":"El estándar no prevé un umbral de 10,000.","USD/EUR 15,000":"15,000 es el umbral de los comerciantes de metales y piedras preciosas en efectivo y de las operaciones ocasionales de IF.","USD/EUR 1,000":"1,000 es el umbral de DDC de los PSAV (INR.15) y el tope de minimis de transferencias (INR.16)."}},{"id":"G066","tema":"D","tipo":"cifra","q":"Ahora se trata de un comerciante de piedras preciosas que recibe pagos en efectivo. Según las Notas a las R.22 y R.23, ¿a partir de qué monto aplican la DDC y el reporte de operaciones sospechosas?","a":"USD/EUR 15,000","o":["USD/EUR 15,000","USD/EUR 10,000","USD/EUR 7,500","USD/EUR 3,000"],"x":"Para comerciantes de metales y de piedras preciosas en operaciones en efectivo, el umbral es de USD/EUR 15,000, tanto para la DDC (R.22) como para el reporte (R.23). USD/EUR 3,000 es exclusivo de los casinos.","ref":"INR.22/23, párr. 1; R.22, inciso (c); R.23, inciso (b)","d":{"USD/EUR 10,000":"El estándar no prevé un umbral de 10,000.","USD/EUR 7,500":"El estándar no prevé un umbral de 7,500.","USD/EUR 3,000":"3,000 es el umbral exclusivo de los casinos (INR.22/23)."}},{"id":"G067","tema":"D","tipo":"caso","q":"Un agente inmobiliario interviene en la compraventa de una casa. Según la Nota a la R.22, ¿a quién debe aplicar la DDC?","a":"Tanto al comprador como al vendedor del inmueble","o":["Sólo al comprador, que es quien aporta los recursos","Tanto al comprador como al vendedor del inmueble","Sólo al vendedor, que es quien contrató su servicio","Sólo a quien le paga la comisión por la operación"],"x":"La INR.22 dice que los agentes inmobiliarios deben cumplir la R.10 respecto de compradores y vendedores. Limitarla a quien paga o a quien aporta los recursos deja fuera a una de las partes.","ref":"INR.22, párr. 1","d":{"Sólo al comprador, que es quien aporta los recursos":"La INR.22 incluye también al vendedor; no depende de quién aporta los recursos.","Sólo al vendedor, que es quien contrató su servicio":"La INR.22 incluye también al comprador; no depende de quién contrató el servicio.","Sólo a quien le paga la comisión por la operación":"La INR.22 se refiere a compradores y vendedores, no a quien paga la comisión."}},{"id":"G068","tema":"D","tipo":"trampa","q":"Una abogada, sujeta a obligaciones como APNFD, intenta disuadir a su cliente de realizar una actividad ilegal. Según la Nota a la R.23, esa conducta:","a":"No constituye revelación (tipping-off)","o":["Es válida sólo si ya reportó","Es revelación, salvo que actúe como notaria","Constituye la revelación prohibida por la R.21","No constituye revelación (tipping-off)"],"x":"La INR.23 aclara que, cuando abogados, notarios, otros profesionales jurídicos independientes o contadores intentan disuadir a un cliente de una actividad ilegal, eso no equivale a revelar. La precisión está en la Nota a la R.23, no en el texto de la R.21.","ref":"INR.23, párr. 4","d":{"Es válida sólo si ya reportó":"La INR.23 no condiciona la excepción a haber reportado antes.","Es revelación, salvo que actúe como notaria":"La INR.23 incluye por igual a abogados, notarios, otros profesionales jurídicos y contadores; no hay excepción sólo para notarios.","Constituye la revelación prohibida por la R.21":"Está en la Nota a la R.23: disuadir al cliente no constituye la revelación que prohíbe la R.21."}},{"id":"G069","tema":"D","tipo":"caso","q":"Un contador que actúa como profesional jurídico independiente obtiene cierta información mientras determina la situación jurídica de su cliente, en circunstancias sujetas a secreto profesional. Según la Nota a la R.23, respecto de esa información:","a":"No está obligado a reportarla como operación sospechosa","o":["Debe reportarla siempre, porque el secreto profesional no aplica en materia de PLD/FT","Debe enviarla a su colegio profesional","Debe reportarla sólo si la operación es en efectivo y alcanza USD/EUR 15,000","No está obligado a reportarla como operación sospechosa"],"x":"La INR.23 dice que abogados, notarios, otros profesionales jurídicos independientes y contadores que actúan como tales no están obligados a reportar si obtuvieron la información en circunstancias sujetas a secreto profesional o privilegio legal. Enviar reportes a un organismo autorregulador es una opción que el país puede permitir, no una vía para la información privilegiada.","ref":"INR.23, párrs. 1 y 2","d":{"Debe reportarla siempre, porque el secreto profesional no aplica en materia de PLD/FT":"La INR.23 exime del reporte la información obtenida bajo secreto profesional o privilegio legal.","Debe enviarla a su colegio profesional":"Enviar reportes al organismo autorregulador es una opción que el país «puede» permitir (INR.23, párr. 3), no un destino obligatorio de información privilegiada.","Debe reportarla sólo si la operación es en efectivo y alcanza USD/EUR 15,000":"15,000 en efectivo es el umbral de comerciantes de metales y piedras preciosas, no un criterio para profesionales jurídicos."}},{"id":"G070","tema":"E","tipo":"cifra","q":"Si un país define la participación de control en una persona moral mediante un umbral porcentual de propiedad, ¿qué máximo fija la Nota a la R.24?","a":"25 %","o":["10 %","25 %","50 %","33 %"],"x":"La nota al pie 64 de la INR.24 dice que el umbral se determina según la evaluación de riesgo del país, con un máximo de 25 %. La INR.10 menciona el 25 % sólo como ejemplo; la INR.24 lo convierte en tope.","ref":"INR.24, nota al pie 64","d":{"10 %":"El estándar no fija 10 %; la INR.24 (nota al pie 64) fija un máximo de 25 %.","50 %":"50 % superaría el tope; la INR.24 (nota al pie 64) fija un máximo de 25 %.","33 %":"El estándar no prevé 33 %; el tope de la INR.24 (nota al pie 64) es 25 %."}},{"id":"G071","tema":"E","tipo":"caso","q":"Una sociedad que no cotiza en bolsa pretende emitir nuevas acciones al portador para atraer inversionistas. Según la R.24, el país:","a":"No debe permitir la emisión de nuevas acciones al portador","o":["Puede permitirla si la sociedad lleva un registro interno actualizado de sus tenedores","No debe permitir la emisión de nuevas acciones al portador","Puede permitirla si las acciones se inmovilizan en una institución financiera regulada","Debe permitirla con DDC reforzada"],"x":"La R.24 dice que los países no deben permitir la emisión de nuevas acciones al portador. La inmovilización o la conversión a forma nominativa son mecanismos para las acciones al portador ya existentes (INR.24, párr. 12), no para autorizar nuevas. Estos requisitos no aplican a sociedades cotizadas sujetas a requisitos de revelación que aseguren la transparencia del beneficiario final (INR.24, nota al pie 78).","ref":"R.24; INR.24, párr. 12 y nota al pie 78","d":{"Puede permitirla si la sociedad lleva un registro interno actualizado de sus tenedores":"El registro interno no es una vía prevista para emitir nuevas acciones al portador: la R.24 prohíbe su emisión.","Puede permitirla si las acciones se inmovilizan en una institución financiera regulada":"La inmovilización es un mecanismo para acciones al portador ya existentes (INR.24, párr. 12), no para autorizar nuevas.","Debe permitirla con DDC reforzada":"La R.24 no permite nuevas acciones al portador con DDC reforzada; prohíbe su emisión."}},{"id":"G072","tema":"E","tipo":"memoria","q":"Para que las autoridades obtengan o accedan rápida y eficientemente a la información de beneficiario final de las personas morales, la R.24 prevé:","a":"Un registro de beneficiarios finales o un mecanismo alternativo","o":["Un registro de beneficiarios finales o un mecanismo alternativo","Un registro público de beneficiarios finales con acceso universal y gratuito","Que la información quede sólo en poder de las IF y APNFD que atienden a la sociedad","Que la información la conserve de forma exclusiva la UIF del país"],"x":"La R.24 dice que la información debe poder obtenerse «a través de un registro de beneficiarios finales o de un mecanismo alternativo», y la INR.24 pide combinar varios mecanismos. El acceso público es algo que los países «podrían considerar», no una obligación.","ref":"R.24; INR.24, párrs. 7 y 11","d":{"Un registro público de beneficiarios finales con acceso universal y gratuito":"El acceso público es algo que los países «podrían considerar» (INR.24, párr. 11), no una obligación de la R.24.","Que la información quede sólo en poder de las IF y APNFD que atienden a la sociedad":"La R.24 sólo pide «considerar facilitar» el acceso de IF y APNFD; la información debe estar disponible para las autoridades vía registro o mecanismo alternativo.","Que la información la conserve de forma exclusiva la UIF del país":"El estándar no prevé que la UIF sea depositaria exclusiva; la R.24 habla de un registro o un mecanismo alternativo."}},{"id":"G073","tema":"E","tipo":"caso","q":"Julián figura como titular del 60 % de las acciones de una sociedad, pero vota y cobra dividendos siguiendo las instrucciones de Elena, persona física que no actúa por cuenta de nadie más. Para efectos del GAFI, ¿quién es el beneficiario final de esa participación de control?","a":"Elena, la persona física por cuenta de quien actúa Julián","o":["Ambos, porque comparten los derechos corporativos y los económicos","Julián, titular registral de las acciones","Elena, la persona física por cuenta de quien actúa Julián","Ninguno, hasta que un registro público reconozca formalmente el mandato"],"x":"Según el Glosario, el accionista nominal nunca es el beneficiario final por las acciones que tiene como nominal; hay que identificar a la persona física por cuenta de quien actúa. Que las acciones estén a su nombre no lo convierte en beneficiario final.","ref":"Glosario (accionista o director nominal); INR.24, nota al pie 80","d":{"Ambos, porque comparten los derechos corporativos y los económicos":"El Glosario dice que el accionista nominal nunca es beneficiario final por las acciones que tiene como nominal; no se comparte.","Julián, titular registral de las acciones":"Ser titular registral no basta: el Glosario dice que el accionista nominal nunca es el beneficiario final por esas acciones.","Ninguno, hasta que un registro público reconozca formalmente el mandato":"El estándar no condiciona la identificación a un reconocimiento registral; se identifica a la persona física por cuenta de quien actúa el nominal."}},{"id":"G074","tema":"E","tipo":"caso","q":"Leonardo es fiduciario de un fideicomiso expreso y, en esa calidad, inicia una relación de negocios con una IF. Según la Nota a la R.25, los países deben asegurar que Leonardo:","a":"Revele su calidad de fiduciario a la IF al iniciar la relación","o":["Revele su calidad de fiduciario a la IF al iniciar la relación","Informe sólo quién es el fideicomitente","Revele su calidad de fiduciario sólo si la operación supera los USD/EUR 15,000","Abra la cuenta a nombre propio, sin mencionar el fideicomiso, por ser el titular legal"],"x":"La INR.25 pide que los fiduciarios revelen su calidad a las IF y APNFD al iniciar una relación de negocios o al realizar una operación ocasional por encima del umbral. El umbral aplica sólo a las operaciones ocasionales, no a la apertura de una relación.","ref":"INR.25, párr. 4","d":{"Informe sólo quién es el fideicomitente":"La INR.25 pide que el fiduciario revele su propia calidad; no se limita a informar quién es el fideicomitente.","Revele su calidad de fiduciario sólo si la operación supera los USD/EUR 15,000":"El umbral aplica sólo a operaciones ocasionales; al iniciar una relación de negocios debe revelarse siempre (INR.25, párr. 4).","Abra la cuenta a nombre propio, sin mencionar el fideicomiso, por ser el titular legal":"Es justo lo que la INR.25 busca evitar: el fiduciario debe revelar su calidad a la IF."}},{"id":"G075","tema":"F","tipo":"caso","q":"Un empresario con antecedentes penales por fraude busca adquirir una participación de control en una casa de bolsa. Según la R.26, las autoridades competentes o supervisores deben:","a":"Tomar las medidas legales o regulatorias necesarias para impedirlo","o":["Tomar las medidas legales o regulatorias necesarias para impedirlo","Permitirlo, pero exigir a la casa de bolsa DDC reforzada durante cinco años","Permitirlo si ya cumplió su condena y otorga una garantía suficiente","Remitir el asunto a la UIF para que decida si lo reporta como operación sospechosa"],"x":"La R.26 exige tomar las medidas legales o regulatorias necesarias para impedir que delincuentes o sus asociados tengan una participación significativa o de control, sean beneficiarios finales de ella u ocupen funciones de dirección en una IF. No prevé permitirlo con garantías ni con DDC reforzada.","ref":"R.26","d":{"Permitirlo, pero exigir a la casa de bolsa DDC reforzada durante cinco años":"La R.26 exige impedirlo; no prevé permitirlo a cambio de DDC reforzada.","Permitirlo si ya cumplió su condena y otorga una garantía suficiente":"La R.26 no prevé excepciones por condena cumplida ni por garantías; pide medidas para impedirlo.","Remitir el asunto a la UIF para que decida si lo reporta como operación sospechosa":"No es materia de reporte de sospechas (R.20): la R.26 pide a supervisores y autoridades impedir la participación."}},{"id":"G076","tema":"F","tipo":"memoria","q":"Para las IF sujetas a los Principios Básicos, la R.26 dispone que:","a":"Las medidas prudenciales relevantes para LD/FT se apliquen de manera similar con fines PLD/FT","o":["Queden exentas de la supervisión PLD/FT, porque ya reciben una supervisión prudencial completa","Sean supervisadas exclusivamente por organismos autorreguladores del propio sector financiero","Las medidas prudenciales relevantes para LD/FT se apliquen de manera similar con fines PLD/FT","Basten un registro simple y un monitoreo, sin supervisión consolidada de grupo con fines PLD/FT"],"x":"La R.26 dice que las medidas regulatorias y de supervisión prudencial que también son relevantes para LD/FT deben aplicarse de manera similar con fines PLD/FT, incluida la supervisión consolidada de grupo. El registro o licencia con supervisión o monitoreo es el régimen para las «otras» IF.","ref":"R.26","d":{"Queden exentas de la supervisión PLD/FT, porque ya reciben una supervisión prudencial completa":"La R.26 dice lo contrario: las medidas prudenciales relevantes se aplican también con fines PLD/FT.","Sean supervisadas exclusivamente por organismos autorreguladores del propio sector financiero":"Los organismos autorreguladores sólo aparecen en la R.28 para ciertas APNFD, no para IF de Principios Básicos.","Basten un registro simple y un monitoreo, sin supervisión consolidada de grupo con fines PLD/FT":"Registro y monitoreo es el régimen de las «otras» IF; para las de Principios Básicos la R.26 incluye supervisión consolidada de grupo."}},{"id":"G077","tema":"F","tipo":"trampa","q":"La regla de que el supervisor revise el perfil de riesgo de LD/FT de una IF o grupo tanto de forma periódica como ante eventos o cambios importantes en su gestión y operaciones, ¿dónde se establece?","a":"En la Nota interpretativa de la R.26","o":["En el texto de la R.26","En el texto de la R.27","En la Nota interpretativa de la R.1","En la Nota interpretativa de la R.26"],"x":"La INR.26 detalla la supervisión basada en riesgo y pide revisar el perfil de riesgo de la IF o grupo periódicamente y cuando haya eventos o cambios importantes. La R.27 regula las facultades del supervisor y no tiene Nota; la INR.1 pide revisar perfiles de riesgo, pero remite a las Notas de las R.26 y R.28 para cuándo y cómo hacerlo.","ref":"INR.26, párr. 3","d":{"En el texto de la R.26":"Está en la Nota, no en el texto de la R.26 (INR.26, párr. 3).","En el texto de la R.27":"La R.27 trata de las facultades de los supervisores y no tiene Nota interpretativa.","En la Nota interpretativa de la R.1":"La INR.1 remite a las Notas de las R.26 y R.28 para revisar los perfiles de riesgo; la regla periódica y por eventos está en la INR.26."}},{"id":"G078","tema":"F","tipo":"memoria","q":"¿Qué recomendación establece que los supervisores deben poder realizar inspecciones, obligar a entregar información e imponer sanciones, incluida la facultad de retirar, restringir o suspender la licencia de una IF?","a":"R.27 (Facultades de los supervisores)","o":["R.26 (Regulación y supervisión de instituciones financieras)","R.35 (Sanciones)","R.31 (Facultades de las autoridades de investigación)","R.27 (Facultades de los supervisores)"],"x":"La R.27 regula las facultades de los supervisores: inspeccionar, obligar a entregar información y sancionar, incluso retirando, restringiendo o suspendiendo la licencia. La R.35 exige que existan sanciones eficaces, proporcionales y disuasivas, pero no enumera las facultades del supervisor.","ref":"R.27","d":{"R.26 (Regulación y supervisión de instituciones financieras)":"La R.26 trata de regulación y supervisión en general; las facultades concretas de inspeccionar y retirar licencias están en la R.27.","R.35 (Sanciones)":"La R.35 exige sanciones eficaces, proporcionales y disuasivas, pero no enumera las facultades del supervisor.","R.31 (Facultades de las autoridades de investigación)":"La R.31 da facultades a autoridades de investigación del orden público, no a los supervisores."}},{"id":"G079","tema":"F","tipo":"caso","q":"Un país encarga a un colegio de notarios vigilar el cumplimiento PLD/FT de sus miembros. Según la R.28, este esquema:","a":"Es válido si el organismo autorregulador puede asegurar que sus miembros cumplan","o":["Es válido sólo para los casinos, que admiten un régimen de autorregulación pleno","Es válido si el organismo autorregulador puede asegurar que sus miembros cumplan","No es válido, porque toda APNFD debe ser supervisada por una autoridad pública","Es válido, aunque el colegio no tenga sanciones disponibles contra sus miembros"],"x":"Para las APNFD distintas de los casinos, la R.28 permite que el monitoreo lo haga un supervisor o un organismo autorregulador apropiado, siempre que pueda asegurar que sus miembros cumplan. Los casinos, en cambio, requieren licencia y un régimen integral de regulación y supervisión.","ref":"R.28, inciso (b)","d":{"Es válido sólo para los casinos, que admiten un régimen de autorregulación pleno":"Es al revés: los casinos requieren licencia y un régimen integral de regulación y supervisión (R.28, inciso a).","No es válido, porque toda APNFD debe ser supervisada por una autoridad pública":"La R.28 permite que, para APNFD distintas de casinos, el monitoreo lo haga un organismo autorregulador apropiado.","Es válido, aunque el colegio no tenga sanciones disponibles contra sus miembros":"La R.28 exige que el supervisor u organismo autorregulador tenga sanciones eficaces, proporcionales y disuasivas."}},{"id":"G080","tema":"F","tipo":"trampa","q":"Una UIF utiliza la información disponible, incluida la que le proporcionan otras autoridades, para identificar tendencias y patrones de LD/FT que ayuden a fijar políticas. ¿Qué tipo de análisis es y dónde se define?","a":"Análisis estratégico; se define en la Nota a la R.29","o":["Análisis estratégico; se define en el texto de la R.29","Análisis operativo; se define en la Nota a la R.29","Análisis estratégico; se define en la Nota a la R.29","Análisis táctico; se define en el Glosario general"],"x":"Identificar tendencias y patrones para determinar amenazas, vulnerabilidades y políticas es análisis estratégico. La distinción entre análisis operativo y estratégico está en la INR.29; el texto de la R.29 sólo habla de recibir, analizar y diseminar.","ref":"INR.29, párr. 3","d":{"Análisis estratégico; se define en el texto de la R.29":"La distinción entre análisis operativo y estratégico está en la Nota (INR.29, párr. 3), no en el texto de la R.29.","Análisis operativo; se define en la Nota a la R.29":"Buscar tendencias y patrones es análisis estratégico; el operativo se centra en objetivos concretos.","Análisis táctico; se define en el Glosario general":"El estándar no prevé un «análisis táctico»; la INR.29 sólo distingue el operativo y el estratégico."}},{"id":"G081","tema":"F","tipo":"caso","q":"Esa misma UIF sigue el rastro de las transferencias de una red y determina vínculos entre tres personas y posibles productos del delito. ¿Qué tipo de análisis realiza?","a":"Análisis operativo","o":["Análisis operativo","Análisis de supervisión","Análisis de riesgo país","Análisis estratégico"],"x":"El análisis operativo identifica objetivos concretos (personas, bienes, redes), sigue el rastro de operaciones y determina vínculos con posibles productos del delito. El estratégico, en cambio, busca tendencias y patrones.","ref":"INR.29, párr. 3","d":{"Análisis de supervisión":"La INR.29 no prevé un «análisis de supervisión»; sólo distingue el análisis operativo y el estratégico.","Análisis de riesgo país":"La INR.29 no prevé un «análisis de riesgo país» como tipo de análisis de la UIF.","Análisis estratégico":"El estratégico busca tendencias y patrones; seguir el rastro de una red concreta es análisis operativo."}},{"id":"G082","tema":"F","tipo":"memoria","q":"Cuando una autoridad competente solicita información a la UIF, según la Nota a la R.29, la decisión de realizar el análisis o de diseminar la información:","a":"Permanece en la propia UIF","o":["Es de quien la solicita","Corresponde al supervisor de la institución reportante","Permanece en la propia UIF","Requiere una orden judicial previa"],"x":"La INR.29 dice que, ante una solicitud de una autoridad competente, la decisión de analizar o diseminar permanece en la UIF, lo que refleja su independencia operativa. Si la decidiera la autoridad que solicita, esa autonomía desaparecería.","ref":"INR.29, párrs. 4 y 8","d":{"Es de quien la solicita":"La INR.29 dice que la decisión permanece en la UIF, no en la autoridad que solicita.","Corresponde al supervisor de la institución reportante":"El supervisor no interviene en esa decisión; la INR.29 la deja en la UIF.","Requiere una orden judicial previa":"La INR.29 no condiciona la diseminación a orden judicial; la decisión es de la UIF."}},{"id":"G083","tema":"F","tipo":"memoria","q":"¿Qué funciones centrales asigna la R.29 a la UIF?","a":"Recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados","o":["Supervisar a las instituciones financieras, imponerles sanciones y otorgar licencias a las APNFD del país","Recibir los reportes, congelar sin demora las cuentas involucradas y decomisar los bienes de origen ilícito","Recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados","Recibir los reportes, investigar penalmente a los involucrados y ejercer la acción penal ante los tribunales"],"x":"La R.29 define a la UIF como centro nacional para recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados de ese análisis. Investigar y ejercer la acción penal corresponde a las autoridades de las R.30 y R.31, y supervisar a las R.26 a R.28.","ref":"R.29","d":{"Supervisar a las instituciones financieras, imponerles sanciones y otorgar licencias a las APNFD del país":"Supervisar, sancionar y otorgar licencias corresponde a los supervisores (R.26 a R.28), no a la UIF.","Recibir los reportes, congelar sin demora las cuentas involucradas y decomisar los bienes de origen ilícito":"Congelar y decomisar corresponde a las R.4, R.6 y R.7; la UIF recibe, analiza y disemina.","Recibir los reportes, investigar penalmente a los involucrados y ejercer la acción penal ante los tribunales":"Investigar y ejercer la acción penal es de las autoridades del orden público (R.30 y R.31), no de la UIF."}},{"id":"G084","tema":"F","tipo":"caso","q":"Una policía investiga una red de narcotráfico que genera grandes ganancias. Conforme a la R.30, además de investigar el delito, las autoridades designadas deben:","a":"Desarrollar una investigación financiera paralela y proactiva","o":["Solicitar al supervisor bancario una inspección de las cuentas de la red","Remitir el caso a la UIF para que investigue el componente financiero","Esperar la sentencia por narcotráfico antes de rastrear los bienes","Desarrollar una investigación financiera paralela y proactiva"],"x":"La R.30 pide, al menos en los delitos que generan grandes ganancias, una investigación financiera paralela y proactiva al investigar el LD, los delitos precedentes y el FT. La UIF analiza y disemina, pero no sustituye a la investigación de las autoridades del orden público.","ref":"R.30; INR.30, párr. 3","d":{"Solicitar al supervisor bancario una inspección de las cuentas de la red":"La inspección de un supervisor es de la R.27; la R.30 pide una investigación financiera de las propias autoridades.","Remitir el caso a la UIF para que investigue el componente financiero":"La UIF analiza y disemina (R.29); no sustituye la investigación financiera de las autoridades del orden público.","Esperar la sentencia por narcotráfico antes de rastrear los bienes":"Contradice el carácter «paralelo»: la investigación financiera va junto con la del delito, no después de la sentencia (INR.30)."}},{"id":"G085","tema":"F","tipo":"memoria","q":"¿Qué técnicas de investigación menciona expresamente la R.31?","a":"Operaciones encubiertas, intervención de comunicaciones, acceso a sistemas informáticos y entrega vigilada","o":["Operaciones encubiertas, intervención de comunicaciones, acceso a sistemas informáticos y entrega vigilada","Intervención de comunicaciones, testigos protegidos, cateos sin orden judicial y entregas vigiladas","Agentes encubiertos, pruebas de polígrafo, intervención de comunicaciones y congelamiento sin demora","Operaciones encubiertas, detención sin orden judicial, acceso a sistemas informáticos y entrega vigilada"],"x":"La R.31 enumera las operaciones encubiertas, la intervención de comunicaciones, el acceso a sistemas informáticos y la entrega vigilada. Las detenciones o cateos sin orden judicial, el polígrafo y los testigos protegidos no aparecen en el texto.","ref":"R.31","d":{"Intervención de comunicaciones, testigos protegidos, cateos sin orden judicial y entregas vigiladas":"La R.31 no menciona testigos protegidos ni cateos sin orden judicial, sino la toma de declaraciones y medidas obligatorias de registro.","Agentes encubiertos, pruebas de polígrafo, intervención de comunicaciones y congelamiento sin demora":"El polígrafo no aparece en la R.31, y el congelamiento sin demora es de las sanciones financieras dirigidas (R.6 y R.7).","Operaciones encubiertas, detención sin orden judicial, acceso a sistemas informáticos y entrega vigilada":"La detención sin orden judicial no figura entre las técnicas de investigación que enumera la R.31."}},{"id":"G086","tema":"F","tipo":"caso","q":"Unos fiscales necesitan saber si un investigado tiene cuentas en el sistema financiero sin alertarlo. Según la R.31, los países deben contar con:","a":"Mecanismos para identificar oportunamente titulares de cuentas y bienes sin notificarlo previamente al propietario","o":["Un requerimiento escrito al investigado para que declare sus cuentas en un plazo de tres días hábiles","Solicitudes a cada banco, que por transparencia deben notificarse también al titular de las cuentas","Mecanismos para identificar oportunamente titulares de cuentas y bienes sin notificarlo previamente al propietario","Una solicitud de asistencia legal mutua previa, aunque las cuentas se encuentren en el propio país"],"x":"La R.31 exige mecanismos para identificar oportunamente si personas físicas o morales tienen o controlan cuentas, y un proceso para identificar bienes sin notificación previa al propietario. Avisar al titular frustraría precisamente ese propósito.","ref":"R.31","d":{"Un requerimiento escrito al investigado para que declare sus cuentas en un plazo de tres días hábiles":"Pedirle al investigado que declare sus cuentas lo alertaría; la R.31 pide identificar bienes sin notificación previa al propietario.","Solicitudes a cada banco, que por transparencia deben notificarse también al titular de las cuentas":"Notificar al titular contradice la R.31, que exige identificar bienes sin notificación previa al propietario.","Una solicitud de asistencia legal mutua previa, aunque las cuentas se encuentren en el propio país":"La asistencia legal mutua (R.37) es para solicitudes entre países, no para cuentas en el propio país."}},{"id":"G087","tema":"D","tipo":"trampa","q":"¿Cuál de estos grupos está formado únicamente por recomendaciones que no tienen Nota interpretativa?","a":"R.9, R.21, R.31 y R.37","o":["R.11, R.21, R.29 y R.39","R.9, R.20, R.31 y R.37","R.9, R.21, R.31 y R.37","R.27, R.33, R.35 y R.38"],"x":"No tienen Nota las R.9, 11, 21, 27, 31, 33, 34, 35, 36, 37 y 39. La R.20 tiene Nota (operaciones intentadas y sin importar el monto), la R.29 también (análisis operativo y estratégico) y la R.38 también.","ref":"R.9; R.21; R.31; R.37 (sin Nota interpretativa)","d":{"R.11, R.21, R.29 y R.39":"La R.29 sí tiene Nota interpretativa (análisis operativo y estratégico).","R.9, R.20, R.31 y R.37":"La R.20 sí tiene Nota interpretativa (operaciones intentadas y sin importar el monto).","R.27, R.33, R.35 y R.38":"La R.38 sí tiene Nota interpretativa."}},{"id":"G088","tema":"F","tipo":"cifra","q":"Un país adopta un sistema de declaración para el transporte transfronterizo físico de efectivo e instrumentos negociables al portador. Según la Nota a la R.32, el umbral preestablecido no debe superar:","a":"USD/EUR 15,000","o":["USD/EUR 3,000","USD/EUR 10,000","USD/EUR 1,000","USD/EUR 15,000"],"x":"La INR.32 fija un umbral máximo preestablecido de USD/EUR 15,000 para el sistema de declaración, que abarca efectivo e instrumentos negociables al portador. El oro, los metales y las piedras preciosas no están incluidos en la R.32 (INR.32, párr. 8).","ref":"INR.32, párr. 3","d":{"USD/EUR 3,000":"3,000 es el umbral de DDC de los casinos (INR.22/23).","USD/EUR 10,000":"El estándar no prevé un umbral de 10,000; el tope de la INR.32 es 15,000.","USD/EUR 1,000":"1,000 es el umbral de los PSAV (INR.15) y el tope de minimis de transferencias (INR.16)."}},{"id":"G089","tema":"G","tipo":"cifra","q":"La R.36 pide a los países ser parte de la Convención de Palermo y de la Convención de las Naciones Unidas contra la Corrupción, entre otros instrumentos. ¿De qué años son, respectivamente?","a":"2000 y 2003","o":["2000 y 1999","1999 y 2005","2000 y 2003","1988 y 2003"],"x":"La R.36 cita la Convención de Palermo (2000) y la Convención contra la Corrupción (2003). El año 1988 es de la Convención de Viena y 1999 del Convenio sobre Financiación del Terrorismo.","ref":"R.36","d":{"2000 y 1999":"Acierta Palermo (2000), pero 1999 es el Convenio sobre Financiación del Terrorismo, no la Convención contra la Corrupción.","1999 y 2005":"1999 es el Convenio sobre Financiación del Terrorismo y 2005 el Convenio del Consejo de Europa que la R.36 sólo «alienta» ratificar; ninguno es Palermo ni la de Corrupción.","1988 y 2003":"1988 es la Convención de Viena (estupefacientes), no la de Palermo, que es de 2000."}},{"id":"G090","tema":"F","tipo":"memoria","q":"¿Qué recomendación pide mantener datos completos sobre reportes de operaciones sospechosas recibidos y diseminados, investigaciones, procesos y condenas, bienes congelados, incautados y decomisados, y solicitudes de cooperación internacional?","a":"R.33 (Estadísticas)","o":["R.2 (Cooperación y coordinación nacional)","R.29 (Unidades de inteligencia financiera)","R.33 (Estadísticas)","R.34 (Guía y retroalimentación)"],"x":"La R.33 exige mantener estadísticas completas sobre la eficacia y eficiencia del sistema PLD/FT, con esos rubros. La R.29 regula las funciones de la UIF, aunque los reportes de operaciones sospechosas sean uno de los rubros estadísticos.","ref":"R.33","d":{"R.2 (Cooperación y coordinación nacional)":"La R.2 trata de políticas nacionales y coordinación entre autoridades; no regula el mantenimiento de estadísticas.","R.29 (Unidades de inteligencia financiera)":"La R.29 regula a la UIF como centro de recepción, análisis y diseminación de reportes; llevar estadísticas de todo el sistema es de la R.33.","R.34 (Guía y retroalimentación)":"La R.34 trata de guías y retroalimentación a IF y APNFD, no de estadísticas sobre investigaciones, decomisos o cooperación."}},{"id":"G091","tema":"F","tipo":"memoria","q":"Los agentes inmobiliarios de un país no saben cómo detectar ni reportar operaciones sospechosas porque las autoridades y su supervisor nunca les han dado orientación. ¿Qué recomendación atiende directamente esta carencia?","a":"R.34, que pide establecer guías y dar retroalimentación","o":["R.34, que pide establecer guías y dar retroalimentación","R.29, que obliga a la UIF a analizar los reportes recibidos","R.28, que pide supervisar a las APNFD con base en riesgo","R.23, que obliga a las APNFD a reportar sus sospechas"],"x":"La R.34 pide a autoridades, supervisores y organismos autorreguladores establecer guías y dar retroalimentación a IF y APNFD, en particular para detectar y reportar operaciones sospechosas. La R.23 impone la obligación de reportar, pero no la de orientar.","ref":"R.34","d":{"R.29, que obliga a la UIF a analizar los reportes recibidos":"La R.29 regula cómo la UIF recibe y analiza reportes; no la obliga a orientar a los sujetos obligados sobre cómo detectarlos.","R.28, que pide supervisar a las APNFD con base en riesgo":"La R.28 pide supervisar a las APNFD en función del riesgo y sancionar; dar guías y retroalimentación es materia de la R.34.","R.23, que obliga a las APNFD a reportar sus sospechas":"La R.23 extiende a las APNFD la obligación de reportar (R.20), pero nada dice de orientarlas; la carencia descrita es de guía y retroalimentación (R.34)."}},{"id":"G092","tema":"F","tipo":"caso","q":"Una casa de cambio incumplió gravemente sus obligaciones de DDC. Según la R.35, las sanciones deben poder aplicarse:","a":"A la institución y también a sus directivos y a su alta dirección","o":["Sólo a la institución, porque la obligación de DDC es corporativa","A la institución y también a sus directivos y a su alta dirección","Sólo por la vía penal, porque las administrativas no son disuasivas","Sólo al oficial de cumplimiento, como responsable del programa"],"x":"La R.35 exige sanciones eficaces, proporcionales y disuasivas, sean penales, civiles o administrativas, aplicables no sólo a las IF y APNFD sino también a sus directivos y alta dirección. No se limita a una vía ni a una sola persona.","ref":"R.35","d":{"Sólo a la institución, porque la obligación de DDC es corporativa":"La R.35 dice expresamente que las sanciones deben aplicarse no sólo a IF y APNFD, sino también a sus directivos y alta dirección.","Sólo por la vía penal, porque las administrativas no son disuasivas":"La R.35 admite sanciones penales, civiles o administrativas; no limita la respuesta a la vía penal.","Sólo al oficial de cumplimiento, como responsable del programa":"La R.35 no menciona al oficial de cumplimiento; alcanza a la institución, a sus directivos y a su alta dirección."}},{"id":"G093","tema":"G","tipo":"caso","q":"El país A pide asistencia legal mutua al país B por un caso de LD que también involucra evasión fiscal. El país B quiere negarla precisamente por ese motivo. Según la R.37, B:","a":"No debe negarla con el único argumento de que involucra asuntos fiscales","o":["Debe negarla mientras A no acredite la doble incriminación, aun sin medidas coercitivas","Puede negarla, porque los asuntos fiscales están excluidos de la asistencia legal mutua","No debe negarla con el único argumento de que involucra asuntos fiscales","Puede negarla si no hay un memorándum firmado"],"x":"La R.37, inciso (c), prohíbe negarse a ejecutar una solicitud por el solo motivo de que el delito también involucra asuntos fiscales. Además, cuando la asistencia no implica acciones coercitivas, debe prestarse aun sin doble incriminación.","ref":"R.37, inciso (c)","d":{"Debe negarla mientras A no acredite la doble incriminación, aun sin medidas coercitivas":"Invierte la regla: la R.37 pide prestar la asistencia aun sin doble incriminación cuando no implica acciones coercitivas.","Puede negarla, porque los asuntos fiscales están excluidos de la asistencia legal mutua":"Es lo contrario del inciso (c) de la R.37, que prohíbe negarse por el solo hecho de que el delito involucre asuntos fiscales.","Puede negarla si no hay un memorándum firmado":"La R.37 (inciso a) prohíbe condiciones irrazonables o indebidamente restrictivas; el memorándum (MOU) aparece en la R.40 como herramienta, no como requisito."}},{"id":"G094","tema":"G","tipo":"trampa","q":"Al reconocer y ejecutar una orden extranjera de congelamiento, aseguramiento o decomiso, la Nota a la R.38 establece que el país requerido:","a":"Debe poder basarse en los hechos probados en la orden extranjera","o":["Debe poder basarse en los hechos probados en la orden extranjera","Sólo puede ejecutarla si deriva de un decomiso basado en una condena","Debe devolver siempre al país requirente la totalidad de los bienes decomisados","Debe iniciar primero una investigación nacional sobre los mismos hechos"],"x":"La INR.38 dice que el país requerido debe poder basarse en los hechos probados en la orden extranjera y que la ejecución no debe condicionarse a una investigación nacional. También abarca solicitudes de decomiso sin condena, y la R.38 prevé compartir o devolver los bienes, no devolverlos siempre.","ref":"INR.38, párrs. 1 y 2; R.38","d":{"Sólo puede ejecutarla si deriva de un decomiso basado en una condena":"La INR.38 (párr. 1) incluye solicitudes basadas en decomiso con y sin condena, conforme a la R.4.","Debe devolver siempre al país requirente la totalidad de los bienes decomisados":"La R.38 dice que los países deben poder «compartir o devolver» los bienes decomisados; no exige devolverlos siempre en su totalidad.","Debe iniciar primero una investigación nacional sobre los mismos hechos":"Invierte la INR.38 (párr. 2): la ejecución no debe condicionarse a realizar una investigación nacional."}},{"id":"G095","tema":"G","tipo":"caso","q":"El país B no extradita a sus nacionales. El país A le pide extraditar a un nacional de B acusado de FT. Conforme a la R.39, si A lo solicita, B debe:","a":"Someter el caso sin demora indebida a sus autoridades competentes para su enjuiciamiento","o":["Extraditarlo de todos modos, porque el FT no admite ninguna excepción por nacionalidad","Esperar a que A obtenga una sentencia firme antes de adoptar cualquier medida","Someter el caso sin demora indebida a sus autoridades competentes para su enjuiciamiento","Negar la extradición y archivar el asunto, porque la nacionalidad es causa suficiente"],"x":"La R.39 dice que cada país debe extraditar a sus nacionales o, si no lo hace sólo por razón de nacionalidad, someter el caso sin demora indebida a sus autoridades para su enjuiciamiento, a solicitud del país requirente. Negar y archivar deja un refugio seguro, que la R.39 busca evitar.","ref":"R.39","d":{"Extraditarlo de todos modos, porque el FT no admite ninguna excepción por nacionalidad":"La R.39 admite no extraditar a nacionales, siempre que el caso se someta sin demora indebida a las autoridades propias para su enjuiciamiento.","Esperar a que A obtenga una sentencia firme antes de adoptar cualquier medida":"La R.39 no exige sentencia firme; incluso prevé mecanismos simplificados, como extraditar con base sólo en órdenes de aprehensión.","Negar la extradición y archivar el asunto, porque la nacionalidad es causa suficiente":"Negar y archivar crearía el «refugio seguro» que la R.39 busca evitar; si no extradita por nacionalidad, debe someter el caso a enjuiciamiento."}},{"id":"G096","tema":"G","tipo":"caso","q":"La UIF del país A, de naturaleza administrativa, pide información a la UIF del país B, que es de tipo policial. B duda por la diferencia de naturaleza entre ambas. Según la Nota a la R.40:","a":"Deben intercambiar información, sin importar su distinta naturaleza","o":["B puede negarse, porque sólo coopera con UIF de su mismo modelo institucional","Deben intercambiar información, sin importar su distinta naturaleza","Deben pasar por asistencia legal mutua","Sólo pueden intercambiar si la UIF de A obtiene antes una orden judicial en su país"],"x":"La INR.40 dice que las UIF deben intercambiar información con UIF extranjeras sin importar su naturaleza (administrativa, policial, judicial u otra), y que no debe negarse la cooperación porque la contraparte tenga distinta naturaleza. La asistencia legal mutua es otra vía (R.37), no un requisito para el intercambio entre UIF.","ref":"INR.40, párrs. 2(d) y 7","d":{"B puede negarse, porque sólo coopera con UIF de su mismo modelo institucional":"La INR.40 (párr. 2d) prohíbe negar la cooperación porque la contraparte tenga distinta naturaleza o estatus.","Deben pasar por asistencia legal mutua":"La asistencia legal mutua es la vía de la R.37; el intercambio entre UIF es una forma de cooperación de la R.40 que no exige pasar por ella.","Sólo pueden intercambiar si la UIF de A obtiene antes una orden judicial en su país":"El estándar no prevé una orden judicial como requisito previo para el intercambio de información entre UIF (INR.40, párr. 7)."}},{"id":"G097","tema":"C","tipo":"trampa","q":"La exención humanitaria incorporada en junio de 2026 a los estándares sobre sanciones financieras dirigidas por terrorismo, ¿en qué parte de los estándares quedó?","a":"En la Nota interpretativa a la R.6","o":["En el texto de la Recomendación 6","En la Nota interpretativa a la R.6","En la Nota interpretativa a la R.7","En la definición de «sin demora» del Glosario"],"x":"La revisión de junio de 2026 modificó la INR.6 (párr. 5bis y su nota al pie), no el texto de la R.6. La R.7 trata de proliferación y el Glosario sólo define «sin demora».","ref":"INR.6, párr. 5bis; Anexo II","d":{"En el texto de la Recomendación 6":"Trampa texto/Nota: el texto de la R.6 no se modificó; el párr. 5bis se incorporó a su Nota interpretativa.","En la Nota interpretativa a la R.7":"La INR.7 regula sanciones por proliferación; la exención humanitaria de esta revisión se ubicó en la INR.6.","En la definición de «sin demora» del Glosario":"El Glosario sólo define «sin demora» (idealmente en horas tras la designación); la exención humanitaria no está ahí."}},{"id":"G098","tema":"C","tipo":"memoria","q":"Según la Nota interpretativa a la R.6, al aplicar congelamientos impuestos por el Consejo de Seguridad de la ONU, ¿qué resoluciones deben cumplir los países, según corresponda?","a":"Las resoluciones 2664, 2761 y 2615","o":["Las resoluciones 1267, 1988 y 1718","Las resoluciones 2664, 2761 y 2615","Sólo la resolución 1373 y sus sucesoras","Las resoluciones 1373, 1540 y 2231"],"x":"El párr. 5bis de la INR.6 pide cumplir las resoluciones 2664 (2022), 2761 (2024) y 2615 (2021), que contienen la exención humanitaria. La 1267 y la 1373 son la base de las designaciones, no de la exención.","ref":"INR.6, párr. 5bis","d":{"Las resoluciones 1267, 1988 y 1718":"La 1267 y la 1988 son la base de designaciones de los Comités 1267 (Al-Qaida) y 1988 (talibanes), y la 1718 es de proliferación (R.7); ninguna es la exención del párr. 5bis.","Sólo la resolución 1373 y sus sucesoras":"La 1373 sustenta las designaciones nacionales de la R.6 y no se habla de «sucesoras» de ella; el párr. 5bis remite a la 2664, 2761 y 2615.","Las resoluciones 1373, 1540 y 2231":"La 1373 es base de designaciones de la R.6, la 1540 sólo se cita en la INR.7 como obligación distinta y la 2231 no aparece en el estándar."}},{"id":"G101","tema":"A","tipo":"caso","q":"Un supervisor concluye que los riesgos específicos de un pequeño sector de APNFD están claramente identificados y entendidos, y decide que cada negocio del sector no necesita elaborar su propia evaluación de riesgos documentada. Según la Nota a la R.1, ¿es válida esa decisión?","a":"Sí; cada negocio queda relevado de documentar su evaluación individual, pero debe seguir entendiendo sus riesgos de LD/FT","o":["No: la R.1 exige a toda IF y APNFD una evaluación individual documentada, sin excepción","Sí, y con ello el sector queda eximido también de entender sus riesgos y de aplicar medidas reforzadas cuando sean mayores","Sí; cada negocio queda relevado de documentar su evaluación individual, pero debe seguir entendiendo sus riesgos de LD/FT","Sólo si el país exenta además al sector de todas las Recomendaciones por realizar una actividad ocasional"],"x":"La INR.1 (párr. 12) permite que las autoridades competentes u organismos autorreguladores determinen que no se requieren evaluaciones individuales documentadas si los riesgos específicos del sector están claramente identificados y entendidos, pero IF y APNFD deben entender siempre sus riesgos. El texto de la R.1 no regula esa documentación, y la discrecionalidad del enfoque basado en riesgo no exime de medidas reforzadas ante riesgos mayores (INR.1, párr. 1).","ref":"R.1; INR.1, párrs. 1 y 12","d":{"No: la R.1 exige a toda IF y APNFD una evaluación individual documentada, sin excepción":"La INR.1 (párr. 12) sí prevé la excepción: las autoridades u organismos autorreguladores pueden dispensar la evaluación documentada si los riesgos del sector están claros.","Sí, y con ello el sector queda eximido también de entender sus riesgos y de aplicar medidas reforzadas cuando sean mayores":"La dispensa sólo alcanza a documentar la evaluación: IF y APNFD deben entender siempre sus riesgos y atender los mayores (INR.1, párrs. 1 y 12).","Sólo si el país exenta además al sector de todas las Recomendaciones por realizar una actividad ocasional":"Mezcla figuras: la exención por actividad ocasional es del párr. 8 de la INR.1; la dispensa de documentar (párr. 12) no depende de ella."}},{"id":"G102","tema":"A","tipo":"trampa","q":"Un país decide no aplicar ciertas Recomendaciones a una persona que realiza una actividad financiera de forma ocasional o muy limitada, con riesgo bajo de LD/FT. ¿Dónde se prevé esa posibilidad y qué actividad queda excluida de ella?","a":"En la Nota a la R.1, que excluye de esa vía la transferencia de dinero o valores","o":["En el texto de la R.1, que excluye de esa vía la transferencia de dinero o valores","En la Nota a la R.1, que excluye de esa vía la transferencia de dinero o valores","En la Nota a la R.1, que excluye de esa vía el cambio de dinero y divisas","En la Nota a la R.10, que la limita a operaciones ocasionales por debajo de USD/EUR 15,000"],"x":"El párr. 8(b) de la INR.1 permite la exención cuando una actividad financiera distinta de la transferencia de dinero o valores se realiza de forma ocasional o muy limitada, con riesgo bajo de LD/FT. El texto de la R.1 no regula exenciones, y el umbral de USD/EUR 15,000 de la R.10 se refiere a la DDC en operaciones ocasionales, no a exenciones.","ref":"INR.1, párr. 8(b)","d":{"En el texto de la R.1, que excluye de esa vía la transferencia de dinero o valores":"Trampa texto/Nota: el texto de la R.1 no regula exenciones; la posibilidad está en la INR.1, párr. 8(b).","En la Nota a la R.1, que excluye de esa vía el cambio de dinero y divisas":"La INR.1, párr. 8(b), excluye la transferencia de dinero o valores, no el cambio de divisas.","En la Nota a la R.10, que la limita a operaciones ocasionales por debajo de USD/EUR 15,000":"El umbral de USD/EUR 15,000 es para la DDC en operaciones ocasionales (R.10); las exenciones por actividad limitada están en la INR.1."}},{"id":"G103","tema":"A","tipo":"caso","q":"Un país crea tres comités interinstitucionales: uno para LD, otro para FT y otro para FP. Un evaluador sostiene que eso incumple, porque debe existir un único marco de coordinación. Según la Nota a la R.2, ¿quién tiene razón?","a":"El país: la Nota admite un solo marco o marcos distintos para LD, FT y FP","o":["El evaluador: la Nota exige un solo marco, encabezado siempre por la UIF","El país, siempre que el comité de FP quede subordinado al de LD, como exige la R.1","El evaluador: los marcos separados sólo se admiten si no hay autoridad designada","El país: la Nota admite un solo marco o marcos distintos para LD, FT y FP"],"x":"La INR.2 (párr. 1) dice que los marcos interinstitucionales pueden ser uno solo o distintos para LD, FT y FP, y el párr. 2 dispone que deben encabezarlos una o más autoridades designadas u otro mecanismo. No exige que los dirija la UIF, y ni la R.1 ni la INR.2 subordinan un marco a otro.","ref":"R.2; INR.2, párrs. 1 y 2","d":{"El evaluador: la Nota exige un solo marco, encabezado siempre por la UIF":"La INR.2 (párr. 2) pide que los encabecen una o más autoridades designadas u otro mecanismo; no exige un marco único ni que lo dirija la UIF.","El país, siempre que el comité de FP quede subordinado al de LD, como exige la R.1":"Ni la R.1 ni la INR.2 subordinan un marco a otro; la INR.2 admite marcos distintos para LD, FT y FP.","El evaluador: los marcos separados sólo se admiten si no hay autoridad designada":"La INR.2 (párr. 1) admite marcos separados sin condición alguna; no los liga a la falta de autoridad designada."}},{"id":"G104","tema":"A","tipo":"trampa","q":"La mención de las autoridades de control de importaciones y exportaciones y de los registros de beneficiarios finales, donde existan, como posibles integrantes de los marcos de coordinación contra LD, FT y FP, ¿dónde aparece?","a":"En la Nota interpretativa a la R.2, en una lista que depende de cómo organiza sus funciones cada país","o":["En la Nota interpretativa a la R.2, en una lista que depende de cómo organiza sus funciones cada país","En el texto de la R.2, junto a la compatibilidad con la protección de datos y privacidad","En la Nota interpretativa a la R.1, entre los mecanismos que coordinan la evaluación nacional de riesgos","En la Nota interpretativa a la R.7, por su vínculo con los programas de proliferación"],"x":"El texto de la R.2 sólo menciona a formuladores de políticas, UIF, autoridades de orden público, supervisores y otras autoridades competentes. La lista ampliada, que incluye aduanas, autoridades fiscales, de control de importaciones y exportaciones, y registros de sociedades y de beneficiarios finales, está en la INR.2 (párr. 3) y depende de la organización nacional de funciones.","ref":"INR.2, párr. 3","d":{"En el texto de la R.2, junto a la compatibilidad con la protección de datos y privacidad":"Trampa texto/Nota: el texto de la R.2 sólo nombra a formuladores de políticas, UIF, autoridades de orden público y supervisores; la lista ampliada está en la INR.2.","En la Nota interpretativa a la R.1, entre los mecanismos que coordinan la evaluación nacional de riesgos":"La INR.1 trata de evaluación y mitigación de riesgos; la lista de autoridades que integran los marcos de coordinación está en la INR.2, párr. 3.","En la Nota interpretativa a la R.7, por su vínculo con los programas de proliferación":"La INR.7 regula sanciones financieras dirigidas por proliferación; no enlista a los integrantes de los marcos de coordinación nacional."}},{"id":"G105","tema":"A","tipo":"caso","q":"La UIF y la autoridad aduanera de un país sólo se comparten información operativa cuando una se la pide formalmente a la otra. Conforme a la Nota a la R.2, ¿qué le falta a ese esquema?","a":"Que el intercambio oportuno de información sea, cuando proceda, también proactivo y no sólo a petición","o":["Nada: la Nota limita el intercambio operativo entre autoridades nacionales a solicitudes formales","Un tratado de asistencia legal mutua, porque ese intercambio entre autoridades se rige por la R.37","Que el intercambio oportuno de información sea, cuando proceda, también proactivo y no sólo a petición","Que todo intercambio pase por la autoridad coordinadora de políticas, como canal único"],"x":"La INR.2 (párr. 4) pide mecanismos que permitan la cooperación operativa y, cuando proceda, la coordinación y el intercambio oportuno de información entre autoridades nacionales «tanto proactivo como a petición», con apoyos como formatos estándar, canales seguros, equipos conjuntos o plataformas de datos compartidas. El texto de la R.2 no precisa lo proactivo, y la R.37 regula la asistencia legal mutua entre países, no la coordinación interna.","ref":"R.2; INR.2, párr. 4","d":{"Nada: la Nota limita el intercambio operativo entre autoridades nacionales a solicitudes formales":"Invierte la INR.2 (párr. 4): el intercambio debe ser «tanto proactivo como a petición», no sólo por solicitud formal.","Un tratado de asistencia legal mutua, porque ese intercambio entre autoridades se rige por la R.37":"La R.37 regula la asistencia legal mutua entre países; la cooperación operativa entre autoridades nacionales es de la R.2 y su Nota.","Que todo intercambio pase por la autoridad coordinadora de políticas, como canal único":"La INR.2 no exige un canal único; propone formatos estándar, canales seguros, equipos conjuntos o plataformas de datos compartidas."}},{"id":"G106","tema":"B","tipo":"caso","q":"Los principios fundamentales del derecho interno de un país no admiten castigar a una misma persona por un delito y, además, por lavar las ganancias de ese delito. Según la Nota a la R.3, ¿qué margen tiene ese país?","a":"Prever que el delito de LD no se aplique a quien cometió el delito precedente","o":["Nada: debe sancionar el autolavado sin excepción, porque la R.3 abarca todos los delitos graves","Prever que el delito de LD no se aplique a quien cometió el delito precedente","Excluir al autor del precedente sólo cuando ese delito se cometió en el extranjero","Dejar de considerar precedente ese delito y retirarlo de las categorías designadas"],"x":"La INR.3 (párr. 6) dice que los países «podrán» prever que el delito de LD no se aplique a quien cometió el delito precedente cuando lo exijan los principios fundamentales de su derecho interno. Es una facultad acotada: no autoriza a retirar delitos de las categorías designadas ni depende del lugar donde se cometió el precedente.","ref":"R.3; INR.3, párr. 6","d":{"Nada: debe sancionar el autolavado sin excepción, porque la R.3 abarca todos los delitos graves":"La INR.3 (párr. 6) sí da margen: los países «podrán» excluir al autor del delito precedente si lo exigen sus principios fundamentales.","Excluir al autor del precedente sólo cuando ese delito se cometió en el extranjero":"La INR.3 (párr. 6) no distingue por el lugar del delito precedente; la condición es que lo exijan los principios fundamentales del derecho interno.","Dejar de considerar precedente ese delito y retirarlo de las categorías designadas":"La facultad sólo excluye al autor del precedente; no autoriza a retirar delitos de las categorías designadas, que deben cubrirse (INR.3, párr. 4)."}},{"id":"G107","tema":"B","tipo":"trampa","q":"Se lava en el país A dinero de una conducta cometida en el país B, donde esa conducta no es delito, pero que habría sido delito precedente de haber ocurrido en A. Según la Nota a la R.3, el país A:","a":"Podrá prever que basta con que la conducta hubiera sido delito precedente de ocurrir en su territorio","o":["Debe tratarla siempre como delito precedente, sin poder exigir que la conducta también sea delito en el país B","Tiene prohibido tratarla como delito precedente, porque falta que sea delito en el país B","Sólo podrá tratarla como delito precedente si el país B lo solicita por asistencia legal mutua","Podrá prever que basta con que la conducta hubiera sido delito precedente de ocurrir en su territorio"],"x":"La INR.3 (párr. 5) exige extender los delitos precedentes a conductas ocurridas en otro país que sean delito allí y que lo habrían sido en el propio país; además, los países «podrán» prever que el único requisito sea esto último. Es una facultad, no una obligación ni una prohibición.","ref":"INR.3, párr. 5","d":{"Debe tratarla siempre como delito precedente, sin poder exigir que la conducta también sea delito en el país B":"Convierte en obligación lo que la INR.3 (párr. 5) deja como «podrán»: la regla general sí exige que la conducta sea delito en el otro país.","Tiene prohibido tratarla como delito precedente, porque falta que sea delito en el país B":"La INR.3 (párr. 5) no lo prohíbe: permite expresamente que el único requisito sea que la conducta habría sido precedente en el propio país.","Sólo podrá tratarla como delito precedente si el país B lo solicita por asistencia legal mutua":"El estándar no condiciona el trato como precedente a una solicitud de asistencia legal mutua del otro país."}},{"id":"G108","tema":"B","tipo":"trampa","q":"La lista de categorías designadas de delitos, que incluye por ejemplo los delitos fiscales y los delitos ambientales, ¿dónde está y qué exige la Nota a la R.3 respecto de ella?","a":"En el Glosario; la Nota exige incluir una gama de delitos dentro de cada categoría","o":["En el Glosario; la Nota exige incluir una gama de delitos dentro de cada categoría","En el texto de la R.3; la Nota permite elegir sólo las categorías que el país considere graves","En la Nota a la R.3; basta con incluir al menos un delito en la mayoría de las categorías","En el Glosario; la Nota permite omitir categorías si el país define los precedentes por umbral"],"x":"Las categorías designadas de delitos se definen en el Glosario, y la INR.3 (párr. 4) exige que, sea cual sea el enfoque adoptado, cada país incluya como mínimo una gama de delitos dentro de cada categoría. El Glosario deja a cada país definir esos delitos y qué los hace graves, pero no omitir categorías.","ref":"INR.3, párr. 4; Glosario","d":{"En el texto de la R.3; la Nota permite elegir sólo las categorías que el país considere graves":"Las categorías están en el Glosario, no en el texto de la R.3; y la INR.3 exige cubrir todas las categorías, no elegir algunas.","En la Nota a la R.3; basta con incluir al menos un delito en la mayoría de las categorías":"La lista está en el Glosario, no en la INR.3; y la Nota exige una gama de delitos dentro de cada categoría, no de la mayoría.","En el Glosario; la Nota permite omitir categorías si el país define los precedentes por umbral":"Ubica bien la lista, pero la INR.3 (párr. 4) exige cubrir cada categoría «sea cual sea el enfoque», incluido el de umbral."}},{"id":"G109","tema":"B","tipo":"caso","q":"Un investigado por fraude muere antes del juicio. Ya gastó las ganancias del delito, y la fiscalía pretende decomisar sin condena un terreno que compró con dinero lícito, por un valor equivalente. ¿Lo prevé el texto de la R.4?","a":"No: el decomiso sin condena de la R.4 abarca bienes del delito, no bienes de valor equivalente","o":["Sí: la R.4 prevé el decomiso sin condena tanto de bienes del delito como de valor equivalente","Sí, siempre que los herederos no demuestren el origen lícito del terreno, carga que la R.4 impone","No: el decomiso sin condena de la R.4 abarca bienes del delito, no bienes de valor equivalente","No: la R.4 sólo prevé el decomiso sin condena en casos de FT, no en delitos como el fraude"],"x":"La R.4 distingue: el inciso (e) prevé el decomiso basado en condena de bienes del delito y de valor equivalente, y el inciso (f), el decomiso sin condena sólo de bienes del delito (también INR.4, párr. 11, que lo extiende al LD, a los delitos precedentes y al FT). Exigir al infractor que demuestre el origen lícito es algo que los países «deben considerar» (INR.4, párr. 12), no una obligación.","ref":"R.4, incisos (e) y (f); INR.4, párrs. 11 y 12","d":{"Sí: la R.4 prevé el decomiso sin condena tanto de bienes del delito como de valor equivalente":"Confunde incisos: el valor equivalente aparece en el decomiso basado en condena (inciso e); el decomiso sin condena (inciso f) sólo abarca bienes del delito.","Sí, siempre que los herederos no demuestren el origen lícito del terreno, carga que la R.4 impone":"Exigir que se demuestre el origen lícito es algo que los países «deben considerar» (INR.4, párr. 12), y se refiere al infractor, no a sus herederos.","No: la R.4 sólo prevé el decomiso sin condena en casos de FT, no en delitos como el fraude":"La INR.4 (párr. 11) extiende el decomiso sin condena al LD, a los delitos precedentes y al FT; no lo limita al FT."}},{"id":"G110","tema":"B","tipo":"trampa","q":"¿En qué parte de los estándares se establece que preservar el valor de los bienes congelados, incautados o decomisados debe incluir, cuando proceda, su venta anticipada al decomiso?","a":"En la Nota interpretativa a la R.4, en su apartado sobre gestión y disposición de bienes","o":["En el texto de la R.4, en el inciso sobre la administración eficaz de los bienes","En el Glosario, dentro de la definición de «decomiso» como privación permanente","En la Nota interpretativa a la R.7, junto a los intereses que generan las cuentas congeladas","En la Nota interpretativa a la R.4, en su apartado sobre gestión y disposición de bienes"],"x":"El inciso (h) de la R.4 sólo pide administrar eficazmente los bienes congelados, incautados o decomisados; la venta anticipada al decomiso como forma de preservar su valor está en la INR.4 (párr. 14). El Glosario define el decomiso como privación permanente, y la INR.7 trata los intereses de cuentas congeladas, no esta venta.","ref":"INR.4, párr. 14","d":{"En el texto de la R.4, en el inciso sobre la administración eficaz de los bienes":"Trampa texto/Nota: el inciso (h) de la R.4 sólo pide administrar eficazmente los bienes; la venta anticipada está en la INR.4, párr. 14.","En el Glosario, dentro de la definición de «decomiso» como privación permanente":"El Glosario define el decomiso como privación permanente de bienes, pero no habla de preservar su valor mediante venta anticipada.","En la Nota interpretativa a la R.7, junto a los intereses que generan las cuentas congeladas":"La INR.7 (párr. 10) trata de intereses que se abonan a cuentas congeladas por proliferación, no de la venta anticipada al decomiso."}},{"id":"G111","tema":"B","tipo":"caso","q":"Durante una investigación por corrupción, se detecta que Ernesto «vendió» su casa a su cuñada por una fracción de su valor de mercado y la sigue usando. Según la Nota a la R.4, esa casa:","a":"Puede considerarse bien del delito o de valor equivalente, aunque esté a nombre de un tercero","o":["Puede considerarse bien del delito o de valor equivalente, aunque esté a nombre de un tercero","Queda fuera de las medidas, porque la titularidad formal de un tercero siempre prevalece","Sólo puede alcanzarse si antes se condena a la cuñada por LD como delito autónomo","Puede decomisarse, y la Nota impide proteger a cualquier tercero, incluso a los que actuaron de buena fe"],"x":"La INR.4 (párr. 3) extiende los bienes del delito y de valor equivalente a los que poseen o detentan terceros, sin perjuicio de los terceros de buena fe; da como ejemplos los bienes bajo control efectivo del investigado a nombre de familiares y los transferidos por un monto muy superior o inferior al de mercado. La protección de los terceros de buena fe se mantiene.","ref":"R.4; INR.4, párr. 3","d":{"Queda fuera de las medidas, porque la titularidad formal de un tercero siempre prevalece":"La INR.4 (párr. 3) dice lo contrario: los bienes del delito incluyen los que poseen o detentan terceros que no son de buena fe.","Sólo puede alcanzarse si antes se condena a la cuñada por LD como delito autónomo":"La INR.4 (párr. 3) no exige condenar al tercero; basta que la casa esté bajo control efectivo del investigado o se haya transferido muy por debajo del valor de mercado.","Puede decomisarse, y la Nota impide proteger a cualquier tercero, incluso a los que actuaron de buena fe":"La INR.4 (párr. 3) protege expresamente los derechos de los terceros de buena fe."}},{"id":"G112","tema":"B","tipo":"trampa","q":"Según la Nota a la R.4, cuando es necesario actuar lo más rápido posible, las autoridades competentes deben poder congelar e incautar bienes del delito y de valor equivalente:","a":"Sin orden judicial y con revisión judicial en un plazo; si eso contraría principios fundamentales, con otro mecanismo que evite a tiempo la disipación","o":["Sólo con orden judicial previa, dictada tras notificar al afectado y escucharlo en audiencia, para respetar sus derechos procesales y de propiedad","Sin orden judicial y con revisión judicial en un plazo; si eso contraría principios fundamentales, con otro mecanismo que evite a tiempo la disipación","Sin orden judicial y sin posibilidad de revisión judicial posterior, pues lo único que importa es evitar la disipación de los bienes del delito y de valor equivalente","Sin orden judicial, pero únicamente cuando se demuestre ante un juez que existe un riesgo inminente y concreto de disipación de los bienes"],"x":"La INR.4 (párr. 6) pide poder congelar e incautar sin orden judicial cuando sea necesario actuar con la mayor rapidez, con revisión judicial dentro de un plazo; si eso contraría principios fundamentales del derecho interno, se admite un mecanismo alternativo que permita actuar con la rapidez suficiente. La solicitud inicial puede ser ex parte (párr. 5a) y las medidas no deben condicionarse, por ejemplo, a demostrar el riesgo de disipación (párr. 5b).","ref":"R.4, inciso (d); INR.4, párrs. 5 y 6","d":{"Sólo con orden judicial previa, dictada tras notificar al afectado y escucharlo en audiencia, para respetar sus derechos procesales y de propiedad":"Contradice la INR.4 (párr. 5a): la solicitud inicial puede hacerse ex parte o sin notificación previa al afectado.","Sin orden judicial y sin posibilidad de revisión judicial posterior, pues lo único que importa es evitar la disipación de los bienes del delito y de valor equivalente":"La INR.4 (párr. 6) exige que la medida sin orden judicial pueda revisarse judicialmente dentro de un plazo.","Sin orden judicial, pero únicamente cuando se demuestre ante un juez que existe un riesgo inminente y concreto de disipación de los bienes":"La INR.4 (párr. 5b) pide no condicionar las medidas provisionales, por ejemplo, a demostrar el riesgo de disipación."}},{"id":"G113","tema":"C","tipo":"caso","q":"Desde el país A, Tomás envía fondos a una organización terrorista que opera sólo en el país B, donde también planea sus actos. Conforme a la Nota a la R.5, el delito de FT:","a":"Debe aplicarse aunque Tomás esté en un país distinto al de la organización o al de los actos","o":["Debe aplicarse aunque Tomás esté en un país distinto al de la organización o al de los actos","Sólo puede perseguirse en el país B, donde se ubica la organización y ocurrirán los actos","Sólo se configura si el país A designó a la organización conforme a la resolución 1373 (2001)","Sólo se configura cuando el acto terrorista ya ocurrió en el país B y puede vincularse a los fondos"],"x":"La INR.5 (párr. 12) dice que los delitos de FT deben aplicarse sin importar si el presunto responsable está en el mismo país o en uno distinto de aquel donde se ubica la organización o donde ocurrió u ocurrirá el acto. La designación conforme a la resolución 1373 pertenece a las sanciones financieras de la R.6, no es requisito del delito, y tampoco se exige vincular los fondos a un acto concreto (párr. 6).","ref":"INR.5, párrs. 6 y 12","d":{"Sólo puede perseguirse en el país B, donde se ubica la organización y ocurrirán los actos":"La INR.5 (párr. 12) dice que el FT se aplica sin importar que el responsable esté en otro país, distinto del de la organización o del acto.","Sólo se configura si el país A designó a la organización conforme a la resolución 1373 (2001)":"La designación conforme a la resolución 1373 es materia de las sanciones financieras de la R.6, no un elemento del delito de FT de la R.5.","Sólo se configura cuando el acto terrorista ya ocurrió en el país B y puede vincularse a los fondos":"La INR.5 (párr. 6) dice que el delito no exige que los fondos se hayan usado en un acto ni que se vinculen a un acto específico."}},{"id":"G114","tema":"C","tipo":"trampa","q":"¿Cuál de estas afirmaciones aparece en el texto de la R.5 y no sólo en su Nota interpretativa?","a":"Debe tipificarse el financiamiento de terroristas individuales, aun sin vínculo con un acto terrorista específico","o":["El FT incluye financiar el viaje de personas a un Estado distinto al de su residencia o nacionalidad para recibir entrenamiento terrorista","Los delitos de FT deben abarcar cualquier fondo u otro activo, sin importar que su origen sea legítimo o ilegítimo","Debe tipificarse el financiamiento de terroristas individuales, aun sin vínculo con un acto terrorista específico","También debe ser delito la tentativa de cometer el delito de FT, además de las conductas de complicidad y organización"],"x":"El texto de la R.5 pide tipificar el FT con base en el Convenio sobre Financiación del Terrorismo, incluido el financiamiento de organizaciones terroristas y de terroristas individuales aun sin vínculo con un acto específico, y designarlo delito precedente de LD. Los viajes, el origen legítimo o ilegítimo de los fondos y la tentativa son precisiones de la INR.5 (párrs. 3, 5 y 10).","ref":"R.5; INR.5, párrs. 3, 5 y 10","d":{"El FT incluye financiar el viaje de personas a un Estado distinto al de su residencia o nacionalidad para recibir entrenamiento terrorista":"Está en la Nota, no en el texto: el financiamiento de viajes de terroristas es precisión de la INR.5, párr. 3.","Los delitos de FT deben abarcar cualquier fondo u otro activo, sin importar que su origen sea legítimo o ilegítimo":"Está en la Nota, no en el texto: que los fondos sean de origen legítimo o ilegítimo es de la INR.5, párr. 5.","También debe ser delito la tentativa de cometer el delito de FT, además de las conductas de complicidad y organización":"Está en la Nota, no en el texto: la tentativa (párr. 10) y la complicidad u organización (párr. 11) son precisiones de la INR.5."}},{"id":"G115","tema":"C","tipo":"caso","q":"Una empresa de logística recauda fondos para una organización terrorista. Los principios fundamentales del derecho interno del país no admiten la responsabilidad penal de las personas morales. Según la Nota a la R.5:","a":"Deben aplicarse a la empresa sanciones civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas","o":["La empresa queda fuera del alcance de la R.5, porque el delito de FT sólo puede atribuirse a personas físicas que actúan con dolo","Deben aplicarse a la empresa sanciones civiles o administrativas, que sustituyen y extinguen la responsabilidad penal de sus directivos","Sólo pueden sancionarse las personas físicas; a la empresa únicamente se le pueden congelar fondos si se la designa conforme a la R.6","Deben aplicarse a la empresa sanciones civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas"],"x":"La INR.5 (párr. 9) exige responsabilidad y sanciones penales para las personas morales y, cuando eso no sea posible por principios fundamentales del derecho interno, civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas. Las sanciones a la empresa no sustituyen las de sus directivos, y todas deben ser eficaces, proporcionales y disuasivas.","ref":"INR.5, párr. 9","d":{"La empresa queda fuera del alcance de la R.5, porque el delito de FT sólo puede atribuirse a personas físicas que actúan con dolo":"La INR.5 (párr. 9) exige responsabilidad de las personas morales, y si la penal no es posible, civil o administrativa.","Deben aplicarse a la empresa sanciones civiles o administrativas, que sustituyen y extinguen la responsabilidad penal de sus directivos":"La INR.5 (párr. 9) dice que esas sanciones son «sin perjuicio» de la responsabilidad penal de las personas físicas; no la sustituyen ni la extinguen.","Sólo pueden sancionarse las personas físicas; a la empresa únicamente se le pueden congelar fondos si se la designa conforme a la R.6":"Sí puede sancionarse a la empresa (vía civil o administrativa, INR.5 párr. 9); el congelamiento por designación es un régimen distinto, el de la R.6."}},{"id":"G116","tema":"C","tipo":"caso","q":"Marta no aporta ni recauda dinero, pero organiza y dirige a dos personas para que reúnan fondos destinados a un terrorista individual. Según la Nota a la R.5, la conducta de Marta:","a":"También debe ser delito, porque la Nota incluye organizar o dirigir a otros para cometer el delito de FT","o":["No es delito: el FT exige que la persona aporte o recaude fondos directamente y por sí misma","También debe ser delito, porque la Nota incluye organizar o dirigir a otros para cometer el delito de FT","Sólo es delito si los fondos llegan al terrorista y se usan efectivamente en un acto terrorista","Sólo es delito si Marta pertenece formalmente a una organización designada por el Consejo de Seguridad de la ONU"],"x":"La INR.5 (párr. 11b) dice que también debe ser delito organizar o dirigir a otros para cometer el delito de FT. Además, el delito no exige que los fondos se hayan usado en un acto terrorista (párr. 6) ni depende de una designación, que es materia de las sanciones financieras de la R.6.","ref":"INR.5, párrs. 6 y 11(b)","d":{"No es delito: el FT exige que la persona aporte o recaude fondos directamente y por sí misma":"La INR.5 (párr. 11b) tipifica también organizar o dirigir a otros para cometer el FT, aunque la persona no aporte fondos.","Sólo es delito si los fondos llegan al terrorista y se usan efectivamente en un acto terrorista":"La INR.5 (párr. 6) dice que el delito no exige que los fondos se usen efectivamente en un acto terrorista.","Sólo es delito si Marta pertenece formalmente a una organización designada por el Consejo de Seguridad de la ONU":"El delito de FT no depende de designaciones; éstas son materia de las sanciones financieras dirigidas de la R.6."}},{"id":"G117","tema":"C","tipo":"caso","q":"Las autoridades de un país tienen motivos razonables para creer que una empresa local apoya un programa de armas de destrucción masiva y quieren designarla ellas mismas para aplicarle las sanciones de la R.7. ¿Qué establecen la R.7 y su Nota?","a":"En la R.7 designan el Consejo de Seguridad o sus Comités; el país podría considerar tener procedimientos para proponerla","o":["Pueden designarla conforme a la resolución 1373 (2001), igual que en las sanciones financieras dirigidas por terrorismo de la R.6","Deben designarla sin demora, porque la Nota a la R.7 obliga a todos los países a presentar propuestas de designación","En la R.7 designan el Consejo de Seguridad o sus Comités; el país podría considerar tener procedimientos para proponerla","Pueden designarla por su cuenta, siempre que la designación no se condicione a la existencia de un proceso penal"],"x":"Según la R.7 y la INR.7 (párrs. 3 y 5), las designaciones las hacen el Consejo de Seguridad o sus Comités de sanciones; no existe una vía nacional como la de la resolución 1373 en la R.6. La INR.7 (párr. 4) dice que los países «podrían considerar» establecer autoridad y procedimientos para proponer designaciones, y el párr. 3 aclara que no hay obligación específica de presentarlas.","ref":"R.7; INR.7, párrs. 3, 4 y 5","d":{"Pueden designarla conforme a la resolución 1373 (2001), igual que en las sanciones financieras dirigidas por terrorismo de la R.6":"La vía nacional de la resolución 1373 es exclusiva de la R.6 (terrorismo); en la R.7 sólo designan el Consejo de Seguridad o sus Comités.","Deben designarla sin demora, porque la Nota a la R.7 obliga a todos los países a presentar propuestas de designación":"Convierte en obligación lo que la INR.7 (párr. 4) deja como «podrían considerar»; el párr. 3 aclara que no hay obligación específica de proponer.","Pueden designarla por su cuenta, siempre que la designación no se condicione a la existencia de un proceso penal":"En la R.7 el país no designa por su cuenta; esa facultad nacional sólo existe para terrorismo, vía la resolución 1373 (R.6)."}},{"id":"G118","tema":"C","tipo":"trampa","q":"Sobre contar con autoridad y procedimientos para proponer personas o entidades al Consejo de Seguridad para su designación, ¿qué contraste hay entre las Notas a la R.6 y a la R.7?","a":"La Nota a la R.6 dice que los países necesitan tenerlos; la Nota a la R.7, que podrían considerar establecerlos","o":["La Nota a la R.7 dice que los países necesitan tenerlos; la Nota a la R.6, que podrían considerar establecerlos","La Nota a la R.6 dice que los países necesitan tenerlos; la Nota a la R.7, que podrían considerar establecerlos","Ambas Notas los establecen como obligación estricta, con el mismo lenguaje y sin distinguir entre ambos regímenes de sanciones","Ninguna de las dos los menciona; sólo aparecen en el Glosario, dentro de la definición de «designación»"],"x":"La INR.6 (párr. 4) dice que los países «necesitan» tener autoridad y procedimientos para proponer designaciones a los Comités 1267 y 1988 y para designar conforme a la resolución 1373. La INR.7 (párr. 4) usa un lenguaje más débil: los países «podrían considerar» establecerlos, pues no hay obligación específica de proponer designaciones (párr. 3).","ref":"INR.7, párrs. 3 y 4; INR.6, párr. 4","d":{"La Nota a la R.7 dice que los países necesitan tenerlos; la Nota a la R.6, que podrían considerar establecerlos":"Invierte las Notas: la INR.6 (párr. 4) dice «necesitan» y la INR.7 (párr. 4) «podrían considerar».","Ambas Notas los establecen como obligación estricta, con el mismo lenguaje y sin distinguir entre ambos regímenes de sanciones":"Las Notas usan lenguaje distinto: obligación en la INR.6 («necesitan») y mera posibilidad en la INR.7 («podrían considerar»).","Ninguna de las dos los menciona; sólo aparecen en el Glosario, dentro de la definición de «designación»":"Ambas Notas los mencionan en su párr. 4; el Glosario define «designación», pero no regula esos procedimientos."}},{"id":"G119","tema":"C","tipo":"caso","q":"Una cuenta bancaria quedó congelada conforme a la resolución 1718 (2006) y sigue generando intereses. Según la Nota a la R.7, ¿qué corresponde hacer con esos intereses?","a":"Permitir que se abonen a la cuenta congelada, siempre que también queden suj
