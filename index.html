INR.3, párr. 7(a)","d":{"Sólo con prueba directa, como una confesión o un documento firmado, porque el LD exige un dolo plenamente acreditado":"La INR.3, párr. 7(a), permite inferir intención y conocimiento de circunstancias fácticas objetivas; no exige prueba directa.","Sólo si antes se obtuvo una condena por el delito precedente que generó los fondos y se probó su participación en él":"La INR.3, párr. 4, dice que no es necesaria una condena por el delito precedente para probar que los bienes son producto del delito.","Mediante la presunción legal de que todo uso de efectivo fraccionado constituye LD, salvo prueba en contrario a cargo de Arturo":"El estándar no prevé presunciones automáticas de LD; la inversión de carga de la INR.4, párr. 12, es para el decomiso, no para probar el delito."}},{"id":"E006","tema":"B","tipo":"caso","q":"La defensa de una persona procesada por LD alega que los bienes lavados valen apenas USD 800 y que sólo una parte proviene, de forma indirecta, de un robo. De acuerdo con la Nota a la R.3, ¿qué alcance debe tener el delito de LD?","a":"Debe extenderse a cualquier tipo de bien que represente directa o indirectamente el producto del delito, sin importar su valor","o":["Debe aplicarse sólo a bienes cuyo valor supere el umbral designado de USD/EUR 15,000, para concentrar los recursos en casos relevantes","Debe abarcar únicamente los bienes que representan directamente el producto del delito; los indirectos corresponden al decomiso por valor equivalente","Debe extenderse a cualquier tipo de bien que represente directa o indirectamente el producto del delito, sin importar su valor","Puede limitarse a efectivo y valores, siempre que el país incluya una gama de delitos dentro de cada una de las categorías designadas"],"x":"La INR.3, párr. 4, dice que el delito de LD debe extenderse a cualquier tipo de bien, independientemente de su valor, que represente directa o indirectamente el producto del delito. El umbral de USD/EUR 15,000 es el de la DDC para operaciones ocasionales (R.10), no un límite del tipo penal.","ref":"INR.3, párr. 4","d":{"Debe aplicarse sólo a bienes cuyo valor supere el umbral designado de USD/EUR 15,000, para concentrar los recursos en casos relevantes":"USD/EUR 15,000 es el umbral de DDC para operaciones ocasionales (R.10); el delito de LD aplica sin importar el valor (INR.3, párr. 4).","Debe abarcar únicamente los bienes que representan directamente el producto del delito; los indirectos corresponden al decomiso por valor equivalente":"La INR.3, párr. 4, incluye bienes que representen directa o indirectamente el producto; el valor equivalente es figura del decomiso (R.4), no un límite del delito.","Puede limitarse a efectivo y valores, siempre que el país incluya una gama de delitos dentro de cada una de las categorías designadas":"Mezcla dos reglas del párr. 4 de la INR.3: la «gama de delitos por categoría» se refiere a los delitos precedentes; los bienes pueden ser de cualquier tipo."}},{"id":"E007","tema":"B","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.3?","a":"Debe haber delitos accesorios, como conspiración, tentativa, complicidad, facilitación y asesoramiento, salvo que lo impidan principios fundamentales del derecho interno","o":["Tipificar el delito únicamente con base en la complicidad, la tentativa o la conspiración no es suficiente para cumplir con la Recomendación","El delito no debe exigir que los fondos u otros activos se hayan usado efectivamente ni que estén vinculados a uno o más actos específicos","El decomiso puede extenderse a otros bienes de la persona condenada por LD, delitos precedentes o FT cuando el tribunal esté convencido de que provienen de una conducta delictiva","Debe haber delitos accesorios, como conspiración, tentativa, complicidad, facilitación y asesoramiento, salvo que lo impidan principios fundamentales del derecho interno"],"x":"La INR.3, párr. 7(d), exige delitos accesorios al LD (participación, asociación o conspiración, tentativa, complicidad, facilitación y asesoramiento), salvo que no lo permitan los principios fundamentales del derecho interno. Las afirmaciones sobre tipificar sólo con figuras accesorias y sobre no exigir vínculo con un acto específico son de la INR.5 (FT, párrs. 4 y 6), y el decomiso ampliado es de la INR.4 (párr. 10).","ref":"INR.3, párr. 7(d)","d":{"Tipificar el delito únicamente con base en la complicidad, la tentativa o la conspiración no es suficiente para cumplir con la Recomendación":"Es de la INR.5, párr. 4, sobre el delito de FT, no de la INR.3.","El delito no debe exigir que los fondos u otros activos se hayan usado efectivamente ni que estén vinculados a uno o más actos específicos":"Es de la INR.5, párr. 6, sobre el delito de FT, no de la INR.3.","El decomiso puede extenderse a otros bienes de la persona condenada por LD, delitos precedentes o FT cuando el tribunal esté convencido de que provienen de una conducta delictiva":"Es el decomiso ampliado de la INR.4, párr. 10, no de la INR.3."}},{"id":"E008","tema":"B","tipo":"memoria","q":"¿Qué recomendación, en su Nota interpretativa, pide a los países considerar la creación de un fondo de recuperación de activos al que se deposite todo o parte de lo decomisado, para fines de aplicación de la ley, salud, educación u otros apropiados?","a":"R.4 · Decomiso y medidas provisionales","o":["R.4 · Decomiso y medidas provisionales","R.38 · Asistencia legal mutua: congelamiento y decomiso","R.30 · Responsabilidades de las autoridades de investigación","R.33 · Estadísticas"],"x":"La INR.4, párr. 15, dice que los países deberían considerar establecer un fondo de recuperación de activos con todo o parte de lo decomisado. La INR.38 trata de compartir lo decomisado con otros países y de deducir o compartir costos extraordinarios, no de un fondo nacional.","ref":"INR.4, párr. 15","d":{"R.38 · Asistencia legal mutua: congelamiento y decomiso":"La INR.38 trata de compartir lo decomisado con otros países y de deducir o compartir costos extraordinarios, no de un fondo nacional.","R.30 · Responsabilidades de las autoridades de investigación":"La INR.30 trata de la investigación financiera y las autoridades investigadoras; no menciona un fondo de recuperación de activos.","R.33 · Estadísticas":"La R.33 no tiene Nota interpretativa; pide estadísticas de bienes decomisados, no un fondo."}},{"id":"E009","tema":"C","tipo":"caso","q":"Raúl lleva la contabilidad de un grupo que, como él sabe, pretende financiar a una organización terrorista. No aporta ni recauda fondos, pero contribuye intencionalmente a la operación del grupo. Conforme a la Nota a la R.5, su conducta:","a":"Debe ser delito, como contribución intencional a la comisión de un delito de FT por un grupo que actúa con un propósito común","o":["No es delito de FT, porque éste exige que la persona aporte o recaude directamente fondos u otros activos destinados al terrorismo","Debe ser delito, como contribución intencional a la comisión de un delito de FT por un grupo que actúa con un propósito común","Sólo es delito si los fondos llegan a usarse en un acto terrorista concreto que pueda atribuirse al grupo del que forma parte","Debe tratarse sólo como delito precedente de LD, ya que Raúl no tuvo la intención directa de financiar el terrorismo"],"x":"La INR.5, párr. 11(c), exige tipificar la contribución a la comisión de un delito de FT por un grupo con propósito común, si es intencional y se hace para promover su actividad delictiva o con conocimiento de la intención del grupo. No se requiere aportar fondos directamente ni que éstos se usen en un acto concreto (párr. 6).","ref":"INR.5, párrs. 6 y 11(c)","d":{"No es delito de FT, porque éste exige que la persona aporte o recaude directamente fondos u otros activos destinados al terrorismo":"La INR.5, párr. 11(c), tipifica también la contribución intencional al delito de FT de un grupo; no hace falta aportar ni recaudar fondos.","Sólo es delito si los fondos llegan a usarse en un acto terrorista concreto que pueda atribuirse al grupo del que forma parte":"La INR.5, párr. 6, dice que el FT no requiere que los fondos se usen ni se vinculen a un acto terrorista concreto.","Debe tratarse sólo como delito precedente de LD, ya que Raúl no tuvo la intención directa de financiar el terrorismo":"Raúl conoce la intención del grupo, supuesto previsto en la INR.5, párr. 11(c)(ii): es delito de FT, no sólo un delito precedente de LD."}},{"id":"E010","tema":"C","tipo":"trampa","q":"Respecto de la tentativa de cometer el delito de FT, ¿qué establece la Nota interpretativa a la R.5?","a":"Que intentar cometer el delito de FT también debe ser delito","o":["Que tipificar el FT sólo como tentativa o conspiración es suficiente, siempre que las penas sean eficaces, proporcionales y disuasivas","Que la tentativa sólo debe castigarse si los fondos llegaron a ponerse a disposición del terrorista o de la organización terrorista","Que la tentativa debe tipificarse, salvo que no lo permitan los principios fundamentales del derecho interno del país","Que intentar cometer el delito de FT también debe ser delito"],"x":"La INR.5, párr. 10, dice que también debe ser delito intentar cometer el FT, sin la salvedad de los principios fundamentales; esa salvedad aparece para los delitos accesorios al LD en la INR.3 (párr. 7(d)). Además, tipificar el FT únicamente mediante tentativa, complicidad o conspiración no es suficiente (INR.5, párr. 4).","ref":"INR.5, párrs. 4 y 10","d":{"Que tipificar el FT sólo como tentativa o conspiración es suficiente, siempre que las penas sean eficaces, proporcionales y disuasivas":"Al revés: la INR.5, párr. 4, dice que tipificar el FT sólo por tentativa, complicidad o conspiración no es suficiente.","Que la tentativa sólo debe castigarse si los fondos llegaron a ponerse a disposición del terrorista o de la organización terrorista":"El estándar no prevé esa condición; además, la INR.5, párr. 6, no exige que los fondos se usen efectivamente.","Que la tentativa debe tipificarse, salvo que no lo permitan los principios fundamentales del derecho interno del país":"La salvedad de los principios fundamentales del derecho interno es de los delitos accesorios al LD (INR.3, párr. 7(d)); la tentativa de FT no la tiene."}},{"id":"E011","tema":"C","tipo":"memoria","q":"Una persona designada por el Comité 1267 necesita parte de sus fondos congelados para pagar alimentos y renta. ¿Qué recomendación, en su Nota, pide autorizar ese acceso conforme a los procedimientos de la resolución 1452 (2002) y sus sucesoras?","a":"R.6 · Sanciones financieras dirigidas: terrorismo y FT","o":["R.7 · Sanciones financieras dirigidas: proliferación","R.4 · Decomiso y medidas provisionales","R.38 · Asistencia legal mutua: congelamiento y decomiso","R.6 · Sanciones financieras dirigidas: terrorismo y FT"],"x":"La INR.6, párr. 10, pide autorizar el acceso a fondos congelados necesarios para gastos básicos, ciertos honorarios o gastos extraordinarios conforme a la resolución 1452 (2002); para designaciones con base en la 1373 remite también a la resolución 1963 (2010). La INR.7 regula el acceso según las condiciones de exención de las resoluciones 1718, 1737 o 2231, propias de la proliferación.","ref":"INR.6, párr. 10; INR.7, párr. 9","d":{"R.7 · Sanciones financieras dirigidas: proliferación":"La INR.7 remite a las exenciones de las resoluciones 1718, 1737 o 2231, sobre proliferación; el Comité 1267 y la resolución 1452 son de la INR.6.","R.4 · Decomiso y medidas provisionales":"La R.4 trata del decomiso y las medidas provisionales sobre bienes de origen delictivo, no del acceso a fondos congelados por sanciones de la ONU.","R.38 · Asistencia legal mutua: congelamiento y decomiso":"La INR.38 trata de la asistencia legal mutua para congelar y decomisar a petición de otro país, no de sanciones financieras dirigidas."}},{"id":"E012","tema":"C","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.6?","a":"Debe informarse a los designados en la Lista de Sanciones de Al-Qaida que pueden presentar peticiones de exclusión ante la Oficina del Ombudsperson de la ONU","o":["Un designado conforme a la resolución 1737 (2006) puede hacer pagos debidos por contratos anteriores a su designación, siempre que se notifique previamente al Comité","Debe informarse a los designados en la Lista de Sanciones de Al-Qaida que pueden presentar peticiones de exclusión ante la Oficina del Ombudsperson de la ONU","Debe permitirse abonar a las cuentas congeladas los intereses u otras ganancias que generen, siempre que éstos también permanezcan congelados","La obligación de congelar se activa con las designaciones de los Comités de Sanciones 1718 o 1737 cuando actúan conforme al Capítulo VII de la Carta"],"x":"La INR.6, párr. 11, pide informar a los designados en la Lista de Sanciones de Al-Qaida de la disponibilidad de la Oficina del Ombudsperson (resolución 1904 (2009)). Los pagos por contratos previos de designados conforme a la resolución 1737, el abono de intereses a cuentas congeladas y los Comités 1718 y 1737 pertenecen a la INR.7, sobre proliferación (párrs. 11, 10 y 5).","ref":"INR.6, párr. 11; INR.7, párrs. 5, 10 y 11","d":{"Un designado conforme a la resolución 1737 (2006) puede hacer pagos debidos por contratos anteriores a su designación, siempre que se notifique previamente al Comité":"Es de la INR.7, párr. 11, sobre proliferación (resolución 1737), no de la INR.6.","Debe permitirse abonar a las cuentas congeladas los intereses u otras ganancias que generen, siempre que éstos también permanezcan congelados":"Es de la INR.7, párr. 10, que lo permite para cuentas congeladas conforme a las resoluciones 1718 o 1737, no de la INR.6.","La obligación de congelar se activa con las designaciones de los Comités de Sanciones 1718 o 1737 cuando actúan conforme al Capítulo VII de la Carta":"Los Comités 1718 y 1737 son de proliferación: eso está en la INR.7, no en la INR.6."}},{"id":"E013","tema":"C","tipo":"cifra","q":"Una entidad designada conforme a la resolución 1737 (2006) debe un pago derivado de un contrato celebrado antes de su designación. El país determinó que el contrato no se relaciona con artículos prohibidos y que el pago no lo recibirá un designado. Según la Nota a la R.7, ¿con cuánta anticipación debe notificar al Comité de Sanciones 1737 antes de autorizarlo?","a":"Diez días hábiles","o":["Tres días hábiles","Cinco días hábiles","Treinta días naturales","Diez días hábiles"],"x":"La INR.7, párr. 11(c), exige notificar previamente al Comité 1737 la intención de hacer o recibir esos pagos, o de autorizar el descongelamiento, diez días hábiles antes de la autorización. Tres días hábiles es el plazo de la INR.16 (párr. 12) para que la IF ordenante entregue la información de una transferencia nacional.","ref":"INR.7, párr. 11","d":{"Tres días hábiles":"Tres días hábiles es el plazo de la INR.16 (párr. 12) para que la IF ordenante entregue la información de una transferencia nacional.","Cinco días hábiles":"La INR.7, párr. 11(c), fija diez días hábiles, no cinco.","Treinta días naturales":"La INR.7, párr. 11(c), habla de días hábiles, y son diez, no treinta naturales."}},{"id":"E014","tema":"C","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.7?","a":"Los países deben vigilar que las IF y APNFD cumplan las obligaciones de la R.7, y su incumplimiento debe tener sanciones civiles, administrativas o penales","o":["Al aplicar los congelamientos impuestos por la ONU, deben cumplirse las disposiciones humanitarias de las resoluciones 2664 (2022), 2761 (2024) y 2615 (2021)","Los países deben vigilar que las IF y APNFD cumplan las obligaciones de la R.7, y su incumplimiento debe tener sanciones civiles, administrativas o penales","Para designar conforme a la resolución 1373 se aplica el estándar de «motivos razonables», y la designación no depende de que exista un proceso penal","Debe permitirse, a solicitud, que una designación nacional sea revisada ante un tribunal o ante otra autoridad competente independiente"],"x":"La INR.7, párr. 6(f), pide medidas para vigilar y asegurar el cumplimiento de las IF y APNFD con las obligaciones de la R.7, con sanciones civiles, administrativas o penales por incumplir. Las disposiciones humanitarias, el estándar de motivos razonables para la resolución 1373 y la revisión de designaciones nacionales están en la INR.6 (párrs. 5bis, 4(d) y 8).","ref":"INR.7, párr. 6(f)","d":{"Al aplicar los congelamientos impuestos por la ONU, deben cumplirse las disposiciones humanitarias de las resoluciones 2664 (2022), 2761 (2024) y 2615 (2021)":"Las disposiciones humanitarias de las resoluciones 2664, 2761 y 2615 están en la INR.6 (párr. 5bis), sobre terrorismo y FT.","Para designar conforme a la resolución 1373 se aplica el estándar de «motivos razonables», y la designación no depende de que exista un proceso penal":"El estándar de «motivos razonables» para designar conforme a la resolución 1373 es de la INR.6, sobre terrorismo y FT.","Debe permitirse, a solicitud, que una designación nacional sea revisada ante un tribunal o ante otra autoridad competente independiente":"La revisión de una designación nacional ante un tribunal u otra autoridad independiente está en la INR.6, párr. 8 (designaciones conforme a la 1373)."}},{"id":"E015","tema":"C","tipo":"caso","q":"Una empresa no designada actúa por instrucciones de una entidad designada por el Comité 1718. Un banco duda si debe congelar los fondos de la empresa, porque su nombre no aparece en la lista. Conforme a la Nota a la R.7, ¿qué corresponde?","a":"Congelar sin demora y sin previo aviso: la obligación abarca los fondos de quienes actúan en nombre o bajo la dirección de designados","o":["Esperar a que el Comité 1718 designe expresamente a la empresa, porque el congelamiento sólo alcanza a quienes figuran en la lista","Aplicar DDC reforzada y presentar un reporte de operación sospechosa, sin congelar, al no tratarse de una persona designada","Congelar sin demora y sin previo aviso: la obligación abarca los fondos de quienes actúan en nombre o bajo la dirección de designados","Congelar sólo los fondos que puedan vincularse con un acto, plan o amenaza concretos de proliferación de armas de destrucción masiva o su financiamiento"],"x":"La INR.7, párr. 6(a), extiende la obligación de congelar, sin demora y sin previo aviso, a los fondos de personas y entidades que actúan en nombre o bajo la dirección de designados, y no sólo a los ligados a un acto, plan o amenaza concretos. Limitarse a la DDC reforzada y al reporte dejaría sin cumplir la obligación estricta de la R.7.","ref":"INR.7, párr. 6(a)","d":{"Esperar a que el Comité 1718 designe expresamente a la empresa, porque el congelamiento sólo alcanza a quienes figuran en la lista":"La INR.7, párr. 6(a), extiende el congelamiento a quienes actúan en nombre o bajo la dirección de designados, aunque no figuren en la lista.","Aplicar DDC reforzada y presentar un reporte de operación sospechosa, sin congelar, al no tratarse de una persona designada":"La R.7 impone una obligación estricta de congelar, no basada en riesgo (INR.1, párr. 3); la DDC reforzada y el reporte no la sustituyen.","Congelar sólo los fondos que puedan vincularse con un acto, plan o amenaza concretos de proliferación de armas de destrucción masiva o su financiamiento":"La INR.7, párr. 6(a), dice lo contrario: el congelamiento abarca todos los fondos del designado, no sólo los ligados a un acto, plan o amenaza concretos."}},{"id":"E016","tema":"C","tipo":"caso","q":"En una capacitación, un supervisor explica a varias fundaciones por qué algunas OSFL pueden estar en riesgo de abuso para FT. De acuerdo con la Nota a la R.8, ¿qué razón es correcta?","a":"Gozan de confianza pública y acceso a fondos considerables; en algunos contextos manejan mucho efectivo y algunas operan cerca de zonas de riesgo terrorista","o":["Son sujetos obligados que deben aplicar DDC a todos sus donantes y beneficiarios, y en general carecen de los recursos, sistemas y experiencia para hacerlo","Operan sin fines de lucro, y esa condición basta por sí misma para colocarlas en riesgo alto de FT según la definición funcional del GAFI","La mayoría de ellas representa un riesgo alto de FT, por lo que todas deben estar sujetas al mismo nivel de supervisión y monitoreo","Gozan de confianza pública y acceso a fondos considerables; en algunos contextos manejan mucho efectivo y algunas operan cerca de zonas de riesgo terrorista"],"x":"La INR.8, párr. 3, explica que las OSFL gozan de confianza pública, con acceso a fuentes considerables de fondos; en algunos contextos manejan mucho efectivo, y algunas tienen presencia global cerca de zonas expuestas a actividad terrorista. La Nota aclara que no son sujetos obligados ni deben aplicar DDC (párr. 5(e)), que la definición es funcional y no depende del simple hecho de no tener fines de lucro (párr. 1) y que la mayoría puede representar riesgo bajo (párr. 6).","ref":"INR.8, párrs. 1, 3, 5(e) y 6","d":{"Son sujetos obligados que deben aplicar DDC a todos sus donantes y beneficiarios, y en general carecen de los recursos, sistemas y experiencia para hacerlo":"Contradice la INR.8 (párr. 5(e)): las OSFL no son sujetos obligados ni se les debe exigir DDC; lo de «carecen de recursos» no lo dice el estándar.","Operan sin fines de lucro, y esa condición basta por sí misma para colocarlas en riesgo alto de FT según la definición funcional del GAFI":"Invierte la INR.8 (párr. 1): la definición funcional se basa en actividades y características de riesgo, no en el simple hecho de operar sin fines de lucro.","La mayoría de ellas representa un riesgo alto de FT, por lo que todas deben estar sujetas al mismo nivel de supervisión y monitoreo":"Contradice la INR.8: el párr. 6 dice que la mayoría puede representar riesgo bajo, y el párr. 7(b) rechaza el enfoque de «talla única» en la supervisión."}},{"id":"E017","tema":"C","tipo":"caso","q":"Las autoridades detectan que una asociación cultural es usada por un grupo terrorista para alentar y facilitar el reclutamiento de jóvenes, sin que se haya detectado movimiento de fondos hacia el grupo. ¿Encaja esta conducta en el «abuso para FT» que define la Nota a la R.8?","a":"Sí, porque el abuso para FT incluye dar apoyo logístico y alentar o facilitar el reclutamiento terrorista","o":["Sí, porque el abuso para FT incluye dar apoyo logístico y alentar o facilitar el reclutamiento terrorista","No, porque el abuso para FT se limita a recaudar o mover fondos para terroristas u organizaciones terroristas","No, porque la R.8 sólo se ocupa de los terroristas que se hacen pasar por entidades legítimas mediante OSFL ficticias","Sólo si la asociación conocía la conducta, ya que el abuso para FT exige que la OSFL apoye conscientemente al grupo"],"x":"El glosario de la INR.8 define el abuso para FT como la explotación de las OSFL por terroristas para recaudar o mover fondos, dar apoyo logístico, alentar o facilitar el reclutamiento terrorista o apoyar de otro modo a terroristas y sus operaciones. No se limita al movimiento de fondos, y la Nota contempla tanto a las OSFL explotadas como a las que apoyan a sabiendas (párr. 5(d)).","ref":"INR.8, glosario («abuso para FT»); párrs. 3 y 5(d)","d":{"No, porque el abuso para FT se limita a recaudar o mover fondos para terroristas u organizaciones terroristas":"Es la trampa del nombre: el glosario de la INR.8 define el abuso para FT más allá de recaudar o mover fondos; incluye apoyo logístico y reclutamiento.","No, porque la R.8 sólo se ocupa de los terroristas que se hacen pasar por entidades legítimas mediante OSFL ficticias":"Confunde el inciso (a) de la R.8 (terroristas que se hacen pasar por entidades legítimas) con todo su alcance; también cubre explotar entidades legítimas y desviar fondos.","Sólo si la asociación conocía la conducta, ya que el abuso para FT exige que la OSFL apoye conscientemente al grupo":"La INR.8 (párr. 5(d)) cubre tanto a las OSFL explotadas por terroristas como a las que los apoyan a sabiendas; el conocimiento de la OSFL no es requisito."}},{"id":"E018","tema":"C","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.8?","a":"Los países deben alentar a las OSFL a operar por canales financieros y de pago regulados, siempre que sea factible, considerando los riesgos del efectivo","o":["Los países deben alentar a las OSFL a operar por canales financieros y de pago regulados, siempre que sea factible, considerando los riesgos del efectivo","Las OSFL deben aplicar DDC a sus donantes cuando reciban donativos en efectivo iguales o superiores al umbral designado de USD/EUR 15,000","Las OSFL deben reportar a la UIF las operaciones sospechosas de sus donantes y beneficiarios, en los mismos términos que las APNFD","Las medidas de protección contra el FT deben aplicarse a todas las organizaciones del ámbito sin fines de lucro, estén o no en la definición del GAFI"],"x":"La INR.8, párr. 7(a)(iv), pide alentar a las OSFL a operar por canales financieros y de pago regulados, siempre que sea factible, considerando las capacidades de cada sector financiero y los riesgos del efectivo. La misma Nota dice que las OSFL no son sujetos obligados ni deben aplicar DDC, y que aplicar medidas a organizaciones fuera de la definición funcional no es acorde con la R.8 (párr. 5(e)).","ref":"INR.8, párrs. 5(e) y 7(a)(iv)","d":{"Las OSFL deben aplicar DDC a sus donantes cuando reciban donativos en efectivo iguales o superiores al umbral designado de USD/EUR 15,000":"Mezcla fuentes: USD/EUR 15,000 es el umbral de operaciones ocasionales de la R.10 para IF; la INR.8 (párr. 5(e)) dice que las OSFL no deben aplicar DDC.","Las OSFL deben reportar a la UIF las operaciones sospechosas de sus donantes y beneficiarios, en los mismos términos que las APNFD":"La INR.8 (párr. 5(e)) dice que las OSFL no son sujetos obligados; el reporte de operaciones sospechosas es de la R.20 y, para APNFD, de la R.23.","Las medidas de protección contra el FT deben aplicarse a todas las organizaciones del ámbito sin fines de lucro, estén o no en la definición del GAFI":"Invierte la INR.8 (párr. 5(e)): aplicar medidas a organizaciones fuera de la definición funcional del GAFI no es acorde con la R.8."}},{"id":"E019","tema":"D","tipo":"trampa","q":"Varias recomendaciones se ocupan del secreto o la confidencialidad que la ley impone a las IF. ¿Cuál de estos enunciados corresponde a la R.9?","a":"Los países deben asegurar que las leyes de secreto de las IF no inhiban la aplicación de las Recomendaciones del GAFI","o":["No debe negarse la asistencia legal mutua porque las leyes exigen a las IF o APNFD guardar secreto, salvo que aplique el privilegio profesional legal","Las IF y su personal deben estar protegidos de responsabilidad penal y civil por violar restricciones de divulgación si reportan de buena fe a la UIF","Los países deben asegurar que las leyes de secreto de las IF no inhiban la aplicación de las Recomendaciones del GAFI","Las autoridades no deben rechazar una solicitud de cooperación de una contraparte extranjera alegando el secreto que la ley impone a las IF"],"x":"La R.9 tiene un solo enunciado: los países deben asegurar que las leyes de secreto de las IF no inhiban la aplicación de las Recomendaciones; no tiene Nota interpretativa. La negativa a la asistencia legal mutua por secreto es de la R.37(d), la protección a quien reporta de buena fe es de la R.21(a) y la cooperación con contrapartes extranjeras es de la INR.40 (párr. 2(b)).","ref":"R.9; R.21(a); R.37(d); INR.40, párr. 2(b)","d":{"No debe negarse la asistencia legal mutua porque las leyes exigen a las IF o APNFD guardar secreto, salvo que aplique el privilegio profesional legal":"Eso es de la R.37(d), sobre asistencia legal mutua, no de la R.9.","Las IF y su personal deben estar protegidos de responsabilidad penal y civil por violar restricciones de divulgación si reportan de buena fe a la UIF":"Eso es de la R.21(a), que protege a quien reporta de buena fe a la UIF, no de la R.9.","Las autoridades no deben rechazar una solicitud de cooperación de una contraparte extranjera alegando el secreto que la ley impone a las IF":"Eso es de la INR.40 (párr. 2(b)), sobre cooperación con contrapartes extranjeras; la R.9 no tiene Nota interpretativa."}},{"id":"E020","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.10?","a":"Un riesgo menor para identificar y verificar al cliente no significa automáticamente un riesgo menor para todas las medidas de DDC, en especial el monitoreo continuo","o":["Los registros obtenidos mediante la DDC deben conservarse al menos cinco años después de terminada la relación de negocios o de la fecha de la operación ocasional","Debe determinarse si los beneficiarios de una póliza de seguro de vida son PEP a más tardar al momento del pago e informar a la alta gerencia antes del pago si se identifican riesgos mayores","Un riesgo menor para identificar y verificar al cliente no significa automáticamente un riesgo menor para todas las medidas de DDC, en especial el monitoreo continuo","Cuando una IF se apoya en un tercero, debe obtener de inmediato la información necesaria sobre los elementos (a) a (c) de las medidas de DDC"],"x":"La INR.10, párr. 18, aclara que un riesgo menor para identificación y verificación no implica automáticamente un riesgo menor para todas las medidas de DDC, en particular para el monitoreo continuo de operaciones. La conservación por cinco años es de la R.11, la verificación de PEP en seguros de vida es de la INR.12 y la obtención inmediata de información del tercero es de la R.17(a).","ref":"INR.10, párr. 18","d":{"Los registros obtenidos mediante la DDC deben conservarse al menos cinco años después de terminada la relación de negocios o de la fecha de la operación ocasional":"Eso es del texto de la R.11 (conservación de registros), que además no tiene Nota interpretativa.","Debe determinarse si los beneficiarios de una póliza de seguro de vida son PEP a más tardar al momento del pago e informar a la alta gerencia antes del pago si se identifican riesgos mayores":"Eso es de la INR.12, sobre beneficiarios PEP de seguros de vida, no de la Nota a la R.10.","Cuando una IF se apoya en un tercero, debe obtener de inmediato la información necesaria sobre los elementos (a) a (c) de las medidas de DDC":"Eso está en el texto de la R.17, criterio (a), no en la Nota a la R.10."}},{"id":"E021","tema":"D","tipo":"cifra","q":"La Nota a la R.10 menciona las pólizas de seguro de vida con prima baja como ejemplo de situación de riesgo potencialmente menor. ¿Qué montos usa como referencia?","a":"Prima anual menor a USD/EUR 1,000 o prima única menor a USD/EUR 2,500","o":["Prima anual menor a USD/EUR 3,000 o prima única menor a USD/EUR 15,000","Prima anual menor a USD/EUR 1,000 o prima única menor a USD/EUR 2,500","Prima anual menor a USD/EUR 1,000 o prima única menor a USD/EUR 1,500","Prima anual menor a USD/EUR 2,500 o prima única menor a USD/EUR 10,000"],"x":"La INR.10, párr. 17(b), da como ejemplo de riesgo potencialmente menor las pólizas de seguro de vida con prima baja, p. ej., prima anual menor a USD/EUR 1,000 o prima única menor a USD/EUR 2,500. Es un ejemplo orientativo (párr. 14), no un umbral obligatorio; USD/EUR 3,000 y 15,000 son los umbrales de casinos y de comerciantes de metales y piedras preciosas.","ref":"INR.10, párrs. 14 y 17(b)","d":{"Prima anual menor a USD/EUR 3,000 o prima única menor a USD/EUR 15,000":"Son los umbrales de casinos (USD/EUR 3,000) y de comerciantes de metales y piedras preciosas (USD/EUR 15,000) de la Nota a las R.22 y 23, no las primas de la INR.10.","Prima anual menor a USD/EUR 1,000 o prima única menor a USD/EUR 1,500":"Acierta la prima anual, pero la prima única que da la INR.10 (párr. 17(b)) es menor a USD/EUR 2,500, no a 1,500.","Prima anual menor a USD/EUR 2,500 o prima única menor a USD/EUR 10,000":"Desplaza las cifras: 2,500 es la prima única, no la anual, y USD/EUR 10,000 no aparece en la INR.10."}},{"id":"E022","tema":"D","tipo":"cifra","q":"Un cliente ocasional, sin relación de negocios con la IF, hizo una operación el 10 de febrero de 2026. Conforme a la R.11, ¿hasta cuándo, como mínimo, debe la IF conservar los registros obtenidos mediante la DDC de esa operación?","a":"Hasta el 10 de febrero de 2031","o":["Hasta el 10 de febrero de 2031","Hasta el 10 de febrero de 2028","Hasta el 10 de febrero de 2036","Hasta que la autoridad competente confirme que ya no los requiere"],"x":"La R.11 exige conservar los registros de DDC, expedientes y correspondencia al menos cinco años después de terminada la relación de negocios o después de la fecha de la operación ocasional. Como no hubo relación, el plazo corre desde la operación: 10 de febrero de 2031.","ref":"R.11","d":{"Hasta el 10 de febrero de 2028":"Cuenta sólo dos años; la R.11 exige al menos cinco años desde la fecha de la operación ocasional.","Hasta el 10 de febrero de 2036":"Cuenta diez años; la R.11 fija un mínimo de cinco, no de diez.","Hasta que la autoridad competente confirme que ya no los requiere":"La R.11 fija un plazo mínimo objetivo de cinco años; no lo condiciona a una confirmación de la autoridad."}},{"id":"E023","tema":"D","tipo":"caso","q":"Una IF abre una cuenta a Sofía, directora adjunta de un organismo internacional, y su análisis concluye que la relación presenta un riesgo mayor. Conforme a la R.12, además de la DDC normal, ¿qué debe hacer la IF?","a":"Obtener aprobación de la alta gerencia, establecer con medidas razonables el origen del patrimonio y de los fondos, y aplicar monitoreo continuo reforzado","o":["Nada adicional, porque las medidas reforzadas de la R.12 sólo se exigen a las PEP extranjeras y nunca a funcionarios de organismos internacionales","Rechazar la relación, porque la R.12 prohíbe establecer relaciones de negocios de mayor riesgo con personas que ejercen funciones prominentes","Informar a la UIF antes de abrir la cuenta y esperar su autorización expresa para iniciar la relación de negocios con Sofía","Obtener aprobación de la alta gerencia, establecer con medidas razonables el origen del patrimonio y de los fondos, y aplicar monitoreo continuo reforzado"],"x":"Para PEP nacionales y personas con funciones prominentes en organizaciones internacionales, la R.12 pide medidas razonables para identificarlas y, si la relación es de mayor riesgo, aplicar las medidas (b), (c) y (d): aprobación de la alta gerencia, origen del patrimonio y de los fondos, y monitoreo continuo reforzado. No prohíbe la relación ni exige autorización de la UIF.","ref":"R.12, incisos (b) a (d) y segundo párrafo; Glosario (PEP)","d":{"Nada adicional, porque las medidas reforzadas de la R.12 sólo se exigen a las PEP extranjeras y nunca a funcionarios de organismos internacionales":"Contradice la R.12: para quienes tienen funciones prominentes en organismos internacionales, si la relación es de mayor riesgo, exige las medidas (b), (c) y (d).","Rechazar la relación, porque la R.12 prohíbe establecer relaciones de negocios de mayor riesgo con personas que ejercen funciones prominentes":"La R.12 no prohíbe relaciones con PEP; exige medidas adicionales, entre ellas la aprobación de la alta gerencia para establecerlas.","Informar a la UIF antes de abrir la cuenta y esperar su autorización expresa para iniciar la relación de negocios con Sofía":"La R.12 no prevé autorización de la UIF; la aprobación que exige es de la alta gerencia de la propia IF."}},{"id":"E024","tema":"D","tipo":"memoria","q":"¿Qué recomendación exige a las IF evaluar los controles PLD/FT de la institución representada y obtener la aprobación de la alta gerencia antes de establecer nuevas relaciones de ese tipo?","a":"R.13 · Banca corresponsal","o":["R.12 · Personas expuestas políticamente (PEP)","R.17 · Dependencia en terceros","R.18 · Controles internos y sucursales y filiales extranjeras","R.13 · Banca corresponsal"],"x":"La R.13, incisos (b) y (c), pide evaluar los controles PLD/FT de la institución representada y obtener aprobación de la alta gerencia antes de establecer nuevas relaciones de corresponsalía. La R.12 también exige aprobación de la alta gerencia, pero para relaciones con PEP, no con instituciones representadas.","ref":"R.13, incisos (b) y (c)","d":{"R.12 · Personas expuestas políticamente (PEP)":"La R.12 también pide aprobación de la alta gerencia, pero para relaciones con PEP; no habla de evaluar los controles de una institución representada.","R.17 · Dependencia en terceros":"La R.17 trata de apoyarse en la DDC de un tercero, no de evaluar los controles de una institución representada en una corresponsalía.","R.18 · Controles internos y sucursales y filiales extranjeras":"La R.18 trata de los programas PLD/FT propios y de grupo, no de las relaciones de corresponsalía con otras instituciones."}},{"id":"E025","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la R.14?","a":"Los proveedores de servicios de transferencia de dinero o valores que usan agentes deben incluirlos en sus programas PLD/FT y vigilar su cumplimiento","o":["Quienes prestan servicios de cambio de dinero o divisas deben, como mínimo, tener licencia o registro y estar sujetos a sistemas eficaces de monitoreo","Los PSAV deben ser supervisados o monitoreados por una autoridad competente, y no por un organismo autorregulador, con un enfoque basado en riesgo","Los proveedores de servicios de transferencia de dinero o valores que usan agentes deben incluirlos en sus programas PLD/FT y vigilar su cumplimiento","Las IF deben monitorear los pagos o transferencias para detectar los que carecen de la información requerida del ordenante o del beneficiario"],"x":"La R.14 pide que los proveedores de servicios de transferencia de dinero o valores que usan agentes los incluyan en sus programas PLD/FT y vigilen su cumplimiento. La licencia o registro de quienes cambian dinero o divisas está en la R.26, la supervisión de PSAV por una autoridad competente en la INR.15 (párr. 5) y el monitoreo de información faltante en la R.16.","ref":"R.14","d":{"Quienes prestan servicios de cambio de dinero o divisas deben, como mínimo, tener licencia o registro y estar sujetos a sistemas eficaces de monitoreo":"Eso es de la R.26, que exige licencia o registro a quienes cambian dinero o divisas; la R.14 se refiere a la transferencia de dinero o valores.","Los PSAV deben ser supervisados o monitoreados por una autoridad competente, y no por un organismo autorregulador, con un enfoque basado en riesgo":"Eso es de la INR.15 (párr. 5), sobre la supervisión de PSAV, no de la R.14.","Las IF deben monitorear los pagos o transferencias para detectar los que carecen de la información requerida del ordenante o del beneficiario":"Eso es de la R.16 (transparencia en pagos), no de la R.14."}},{"id":"E026","tema":"D","tipo":"caso","q":"El supervisor de PSAV del país A, que es un banco central, pide información al supervisor de PSAV del país B, que es una comisión de valores; además, B llama «plataformas de criptoactivos» a lo que A llama PSAV. B duda en responder. Según la Nota a la R.15, ¿qué procede?","a":"Intercambiar la información con prontitud y de forma constructiva, sin importar la naturaleza de los supervisores ni la denominación de los PSAV","o":["Negarse hasta que ambos países homologuen en su ley la denominación y el estatus de los PSAV, para evitar confusiones jurídicas","Canalizar la petición sólo por asistencia legal mutua, porque los supervisores de naturaleza distinta no son contrapartes entre sí","Responder sólo a través de las UIF de ambos países, que son las únicas autoridades autorizadas para intercambiar información sobre los PSAV","Intercambiar la información con prontitud y de forma constructiva, sin importar la naturaleza de los supervisores ni la denominación de los PSAV"],"x":"La INR.15, párr. 8, dice que los supervisores de PSAV deben intercambiar información con sus contrapartes extranjeras con prontitud y de forma constructiva, sin importar la naturaleza o el estatus de los supervisores ni las diferencias en la nomenclatura o el estatus de los PSAV. Ni la asistencia legal mutua ni la vía de las UIF son condición para ello.","ref":"INR.15, párr. 8","d":{"Negarse hasta que ambos países homologuen en su ley la denominación y el estatus de los PSAV, para evitar confusiones jurídicas":"La INR.15 (párr. 8) pide intercambiar sin importar las diferencias de nomenclatura o estatus de los PSAV; el estándar no exige homologar denominaciones.","Canalizar la petición sólo por asistencia legal mutua, porque los supervisores de naturaleza distinta no son contrapartes entre sí":"La INR.15 (párr. 8) pide intercambiar sin importar la naturaleza o estatus de los supervisores; el estándar no obliga a canalizarlo por asistencia legal mutua.","Responder sólo a través de las UIF de ambos países, que son las únicas autoridades autorizadas para intercambiar información sobre los PSAV":"La INR.15 (párr. 8) obliga a los propios supervisores de PSAV a intercambiar información; el estándar no reserva ese intercambio a las UIF."}},{"id":"E027","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.15?","a":"Los países deben considerar los activos virtuales como «bienes», «productos», «fondos», «fondos u otros activos» u otro «valor equivalente»","o":["No se requiere que la información acompañe las transferencias entre IF cuando el ordenante y el beneficiario son IF que actúan por cuenta propia","Los países deben considerar los activos virtuales como «bienes», «productos», «fondos», «fondos u otros activos» u otro «valor equivalente»","Los agentes deben tener licencia o registro propios, o el proveedor debe mantener una lista actualizada de ellos, accesible a las autoridades competentes","Los supervisores financieros deben contar con recursos adecuados y con independencia operativa y autonomía suficientes para evitar influencias indebidas"],"x":"La INR.15, párr. 1, pide considerar los activos virtuales como bienes, productos, fondos, fondos u otros activos u otro valor equivalente, y aplicarles las medidas pertinentes. La excepción de transferencias entre IF es de la INR.16 (párr. 13), la lista de agentes de la R.14 y los recursos e independencia de los supervisores de la INR.26 (párr. 6).","ref":"INR.15, párr. 1","d":{"No se requiere que la información acompañe las transferencias entre IF cuando el ordenante y el beneficiario son IF que actúan por cuenta propia":"Eso es de la INR.16 (párr. 13), sobre transferencias entre IF, no de la Nota a la R.15.","Los agentes deben tener licencia o registro propios, o el proveedor debe mantener una lista actualizada de ellos, accesible a las autoridades competentes":"Eso es del texto de la R.14, sobre los agentes de servicios de transferencia de dinero o valores.","Los supervisores financieros deben contar con recursos adecuados y con independencia operativa y autonomía suficientes para evitar influencias indebidas":"Eso es de la INR.26 (párr. 6), sobre los recursos y la independencia de los supervisores financieros."}},{"id":"E028","tema":"D","tipo":"caso","q":"Un cliente usa su tarjeta de débito no para comprar bienes, sino para enviar dinero a otra persona en el extranjero. Según la Nota a la R.16, ¿qué información debe acompañar esa transferencia?","a":"La exigible a los pagos transfronterizos, porque el régimen especial de tarjetas sólo cubre la compra de bienes o servicios","o":["Sólo el número de la tarjeta, porque todas las transferencias que derivan de una operación con tarjeta quedan exceptuadas del resto de los requisitos","La exigible a los pagos transfronterizos, porque el régimen especial de tarjetas sólo cubre la compra de bienes o servicios","Ninguna, porque las operaciones con tarjeta de débito se tratan como retiros de efectivo y basta con el número de cuenta","El número de la tarjeta y los nombres de las instituciones emisora y adquirente, que se proporcionan sólo a solicitud"],"x":"La INR.16, párr. 17, dice que si una tarjeta de crédito, débito o prepagada se usa para otro tipo de pago, como una transferencia entre personas, la operación queda sujeta a los requisitos aplicables a transferencias nacionales o transfronterizas. El régimen del número de tarjeta y de la información del emisor y del adquirente a solicitud aplica sólo a compras de bienes o servicios (párr. 16).","ref":"INR.16, párrs. 16 y 17","d":{"Sólo el número de la tarjeta, porque todas las transferencias que derivan de una operación con tarjeta quedan exceptuadas del resto de los requisitos":"El régimen del número de tarjeta (INR.16, párr. 16) sólo cubre compras de bienes o servicios; no exceptúa toda transferencia hecha con tarjeta.","Ninguna, porque las operaciones con tarjeta de débito se tratan como retiros de efectivo y basta con el número de cuenta":"Toma el régimen de retiros de efectivo nacionales (INR.16, párr. 18); una transferencia a otra persona no es un retiro de efectivo.","El número de la tarjeta y los nombres de las instituciones emisora y adquirente, que se proporcionan sólo a solicitud":"Ese es el régimen del párr. 16 para compras de bienes o servicios; el párr. 17 dice que otras transferencias siguen los requisitos de pagos nacionales o transfronterizos."}},{"id":"E029","tema":"D","tipo":"caso","q":"Una IF quiere apoyarse en la DDC que ya realizó una agencia de viajes que conoce bien al cliente, pero que no está regulada ni supervisada en materia PLD/FT. Según la Nota a la R.17, ¿puede considerarse un «tercero» para estos efectos?","a":"No: los terceros son IF o APNFD supervisadas o monitoreadas que cumplen los requisitos de la R.17","o":["Sí, siempre que la IF obtenga de inmediato la información de los elementos (a) a (c) de la DDC y conserve copias","Sí, porque en la dependencia en terceros la responsabilidad última de la DDC se traslada al tercero que la realizó","No: los terceros son IF o APNFD supervisadas o monitoreadas que cumplen los requisitos de la R.17","Sí, si la agencia aplica la DDC con los procedimientos de la IF y bajo su control, como en una subcontratación"],"x":"La INR.17, párr. 3, define a los terceros como IF o APNFD supervisadas o monitoreadas que cumplen los requisitos de la R.17; además deben estar sujetos a requisitos de DDC y conservación conforme a las R.10 y 11 (párr. 1). Obtener la información de inmediato no basta si el tercero no es elegible, y la responsabilidad última siempre queda en la IF que se apoya.","ref":"INR.17, párrs. 1 y 3; R.17","d":{"Sí, siempre que la IF obtenga de inmediato la información de los elementos (a) a (c) de la DDC y conserve copias":"Obtener la información de inmediato (R.17(a)) es un criterio adicional; no suple que el tercero sea IF o APNFD supervisada o monitoreada (INR.17, párr. 3).","Sí, porque en la dependencia en terceros la responsabilidad última de la DDC se traslada al tercero que la realizó":"Invierte la R.17: la responsabilidad última de la DDC permanece en la IF que se apoya en el tercero.","Sí, si la agencia aplica la DDC con los procedimientos de la IF y bajo su control, como en una subcontratación":"Eso describe una subcontratación o agencia, que la INR.17 (párr. 1) excluye expresamente del alcance de la R.17."}},{"id":"E030","tema":"D","tipo":"memoria","q":"¿Qué recomendación exige a los grupos financieros implementar programas PLD/FT a nivel de grupo, incluidas políticas y procedimientos para compartir información dentro del grupo con fines PLD/FT?","a":"R.18 · Controles internos y sucursales y filiales extranjeras","o":["R.17 · Dependencia en terceros","R.18 · Controles internos y sucursales y filiales extranjeras","R.21 · Revelación (tipping-off) y confidencialidad","R.26 · Regulación y supervisión de instituciones financieras"],"x":"La R.18 exige a los grupos financieros programas PLD/FT a nivel de grupo, con políticas y procedimientos para compartir información. La R.21 sólo aclara que la prohibición de revelar no pretende inhibir ese intercambio, y la R.26 trata de la supervisión consolidada de grupo por parte del supervisor.","ref":"R.18; R.21(b); R.26","d":{"R.17 · Dependencia en terceros":"La R.17 trata de apoyarse en la DDC de terceros, no de programas PLD/FT a nivel de grupo.","R.21 · Revelación (tipping-off) y confidencialidad":"La R.21(b) sólo aclara que la prohibición de revelar no pretende inhibir el intercambio de la R.18; no impone los programas de grupo.","R.26 · Regulación y supervisión de instituciones financieras":"La R.26 trata de la regulación y de la supervisión consolidada de grupo por el supervisor, no de los programas que debe implementar el grupo."}},{"id":"E031","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.19?","a":"Un ejemplo de contramedida es exigir a las IF revisar, modificar o, si es necesario, terminar sus relaciones de corresponsalía con IF del país en cuestión","o":["Un ejemplo de contramedida es exigir a las IF revisar, modificar o, si es necesario, terminar sus relaciones de corresponsalía con IF del país en cuestión","Antes de establecer una relación de corresponsalía, la IF debe reunir información suficiente sobre la institución representada y evaluar sus controles PLD/FT","Si las medidas adicionales no bastan, las autoridades del país de origen deberían considerar, según corresponda, pedir al grupo cerrar sus operaciones en el país anfitrión","Los países sujetos a sanciones o embargos, por ejemplo de la ONU, se mencionan como un factor de riesgo geográfico potencialmente mayor"],"x":"La INR.19, párr. 2(g), incluye entre los ejemplos de contramedidas exigir a las IF revisar, modificar o terminar relaciones de corresponsalía con IF del país en cuestión. La evaluación de la institución representada es de la R.13, el cierre de operaciones en el país anfitrión de la INR.18 (párr. 5) y los factores de riesgo geográfico de la INR.10 (párr. 15).","ref":"INR.19, párr. 2(g)","d":{"Antes de establecer una relación de corresponsalía, la IF debe reunir información suficiente sobre la institución representada y evaluar sus controles PLD/FT":"Eso es de la R.13 (banca corresponsal), incisos (a) y (b), no de la Nota a la R.19.","Si las medidas adicionales no bastan, las autoridades del país de origen deberían considerar, según corresponda, pedir al grupo cerrar sus operaciones en el país anfitrión":"Eso es de la INR.18 (párr. 5), sobre sucursales y filiales en países anfitriones con requisitos menos estrictos.","Los países sujetos a sanciones o embargos, por ejemplo de la ONU, se mencionan como un factor de riesgo geográfico potencialmente mayor":"Eso es de la INR.10 (párr. 15), como factor de riesgo geográfico, no una contramedida de la INR.19."}},{"id":"E032","tema":"D","tipo":"memoria","q":"Una IF tiene motivos razonables para sospechar que ciertos fondos son producto de una actividad delictiva. ¿Qué recomendación le exige, por ley, reportar con prontitud su sospecha a la UIF?","a":"R.20 · Reporte de operaciones sospechosas","o":["R.29 · Unidades de inteligencia financiera (UIF)","R.21 · Revelación (tipping-off) y confidencialidad","R.20 · Reporte de operaciones sospechosas","R.10 · Debida diligencia del cliente (DDC)"],"x":"La R.20 obliga a la IF, por ley, a reportar con prontitud a la UIF cuando sospecha o tiene motivos razonables para sospechar que los fondos son producto de una actividad delictiva o se relacionan con el FT. La R.29 regula a la UIF que recibe los reportes, y la R.10 sólo pide considerar un reporte cuando no puede completarse la DDC.","ref":"R.20","d":{"R.29 · Unidades de inteligencia financiera (UIF)":"La R.29 regula a la UIF que recibe y analiza los reportes; la obligación de reportar de las IF está en la R.20.","R.21 · Revelación (tipping-off) y confidencialidad":"La R.21 protege a quien reporta y prohíbe revelar el reporte; no crea la obligación de reportar.","R.10 · Debida diligencia del cliente (DDC)":"La R.10 sólo pide considerar un reporte cuando no puede completarse la DDC; la obligación general de reportar sospechas es de la R.20."}},{"id":"E033","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la R.21?","a":"La prohibición de revelar que se presenta un reporte de operación sospechosa no pretende inhibir el intercambio de información previsto en la R.18","o":["Cuando un abogado o un contador que actúa como profesional jurídico independiente intenta disuadir a su cliente de una actividad ilegal, eso no constituye revelación","La prohibición de revelar que se presenta un reporte de operación sospechosa no pretende inhibir el intercambio de información previsto en la R.18","Si la IF cree razonablemente que aplicar la DDC alertará al cliente, puede no continuar ese proceso y debe presentar un reporte de operación sospechosa","Los intercambios de información dentro del grupo deben tener salvaguardas adecuadas de confidencialidad y uso, incluidas las necesarias para prevenir la revelación"],"x":"La R.21(b) prohíbe revelar que se presenta un reporte a la UIF y precisa que eso no pretende inhibir el intercambio de información de la R.18; la R.21 no tiene Nota. La disuasión que no es revelación está en la INR.23 (párr. 4), la opción de no continuar la DDC en la INR.10 (párr. 3) y las salvaguardas del intercambio de grupo en la INR.18 (párr. 4).","ref":"R.21(b); INR.10, párr. 3; INR.18, párr. 4; INR.23, párr. 4","d":{"Cuando un abogado o un contador que actúa como profesional jurídico independiente intenta disuadir a su cliente de una actividad ilegal, eso no constituye revelación":"Eso está en la INR.23 (párr. 4); la R.21 no tiene Nota interpretativa.","Si la IF cree razonablemente que aplicar la DDC alertará al cliente, puede no continuar ese proceso y debe presentar un reporte de operación sospechosa":"Eso está en la INR.10 (párr. 3), sobre DDC y riesgo de revelación, no en la R.21.","Los intercambios de información dentro del grupo deben tener salvaguardas adecuadas de confidencialidad y uso, incluidas las necesarias para prevenir la revelación":"Eso está en la INR.18 (párr. 4), sobre el intercambio de información dentro del grupo."}},{"id":"E034","tema":"D","tipo":"caso","q":"Un despacho ofrece, como parte de su negocio, domicilio social y dirección de correspondencia para sociedades de sus clientes. Según la R.22, ¿cuándo le aplican los requisitos de DDC y de conservación de registros?","a":"Cuando prepara o realiza operaciones para un cliente respecto de esa actividad, como proveedor de servicios a sociedades y fideicomisos","o":["Cuando prepara o realiza operaciones para un cliente respecto de esa actividad, como proveedor de servicios a sociedades y fideicomisos","Sólo cuando recibe del cliente pagos en efectivo iguales o superiores al umbral designado de USD/EUR 15,000","Sólo cuando interviene en la compraventa de inmuebles por cuenta de su cliente, igual que un agente inmobiliario","Nunca, porque dar un domicilio es un servicio administrativo que no está entre las actividades de las APNFD"],"x":"La R.22(e) incluye a los proveedores de servicios a sociedades y fideicomisos cuando preparan o realizan operaciones para un cliente respecto de proporcionar domicilio social, dirección comercial o de correspondencia o administrativa a una sociedad u otra persona o estructura jurídica. El umbral de USD/EUR 15,000 en efectivo es de los comerciantes de metales y piedras preciosas.","ref":"R.22, inciso (e)","d":{"Sólo cuando recibe del cliente pagos en efectivo iguales o superiores al umbral designado de USD/EUR 15,000":"USD/EUR 15,000 en efectivo es el umbral de los comerciantes de metales y piedras preciosas (R.22(c) y Nota a las R.22 y 23); para proveedores de servicios a sociedades no hay umbral.","Sólo cuando interviene en la compraventa de inmuebles por cuenta de su cliente, igual que un agente inmobiliario":"Toma el inciso (b) de la R.22 (agentes inmobiliarios); proporcionar domicilio social es una actividad propia del inciso (e).","Nunca, porque dar un domicilio es un servicio administrativo que no está entre las actividades de las APNFD":"La R.22(e) incluye expresamente proporcionar domicilio social o dirección de correspondencia entre las actividades de los proveedores de servicios a sociedades y fideicomisos."}},{"id":"E035","tema":"D","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.23?","a":"Puede permitirse que abogados, notarios y contadores envíen sus reportes a su organismo autorregulador, si éste coopera adecuadamente con la UIF","o":["Los agentes inmobiliarios deben cumplir los requisitos de la R.10 respecto tanto de los compradores como de los vendedores del inmueble","Puede permitirse que abogados, notarios y contadores envíen sus reportes a su organismo autorregulador, si éste coopera adecuadamente con la UIF","La UIF es la agencia central para recibir las revelaciones de los sujetos obligados, que como mínimo incluyen los reportes de operaciones sospechosas","Los casinos deben poder vincular la información de DDC de un cliente con las operaciones que éste realiza en el casino"],"x":"La INR.23, párr. 3, permite que abogados, notarios, otros profesionales jurídicos independientes y contadores envíen sus reportes a su organismo autorregulador, siempre que existan formas apropiadas de cooperación entre éste y la UIF. La DDC a comprador y vendedor y la vinculación de la DDC con las operaciones en casinos son de la INR.22 (párrs. 1 y 2), y la recepción central de reportes es de la INR.29 (párr. 2).","ref":"INR.23, párr. 3","d":{"Los agentes inmobiliarios deben cumplir los requisitos de la R.10 respecto tanto de los compradores como de los vendedores del inmueble":"Eso es de la INR.22 (párr. 1), sobre agentes inmobiliarios, no de la Nota a la R.23.","La UIF es la agencia central para recibir las revelaciones de los sujetos obligados, que como mínimo incluyen los reportes de operaciones sospechosas":"Eso es de la INR.29 (párr. 2), sobre la UIF como agencia central de recepción.","Los casinos deben poder vincular la información de DDC de un cliente con las operaciones que éste realiza en el casino":"Eso es de la INR.22 (párr. 2), sobre casinos, no de la Nota a la R.23."}},{"id":"E036","tema":"E","tipo":"cifra","q":"El beneficiario final de una sociedad cambió el 1 de marzo. Según la Nota a la R.24, ¿qué ejemplo de plazo razonable da para que la información de beneficiario final se considere actualizada?","a":"Un mes después del cambio","o":["Un mes después del cambio","Tres días hábiles después del cambio","Seis meses después del cambio","Al presentar la siguiente declaración anual de la sociedad"],"x":"La INR.24, párr. 9, define la información actualizada como la más vigente posible, actualizada dentro de un plazo razonable tras cualquier cambio (p. ej., dentro de un mes). Es un ejemplo, no un plazo rígido; la INR.25 usa el mismo concepto de plazo razonable para los fideicomisos, sin fijar ejemplo.","ref":"INR.24, párr. 9","d":{"Tres días hábiles después del cambio":"Tres días hábiles es el plazo de la INR.16 para que la IF ordenante entregue información a solicitud, no el ejemplo de la INR.24.","Seis meses después del cambio":"La INR.24 (párr. 9) pone como ejemplo un mes; seis meses no aparece como plazo de actualización.","Al presentar la siguiente declaración anual de la sociedad":"La INR.24 (párr. 9) pide actualizar en un plazo razonable tras cualquier cambio (p. ej., un mes); no lo liga a una declaración anual."}},{"id":"E037","tema":"E","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.25?","a":"Los fiduciarios deben tener información básica sobre otros agentes y prestadores de servicios del fideicomiso, como asesores de inversión, contadores y asesores fiscales","o":["Todas las sociedades creadas en el país deben inscribirse en un registro de sociedades y llevar un registro de sus accionistas o socios","Los accionistas y directores nominales deben revelar su calidad de nominales y la identidad de quien los nombra a la sociedad y al registro","Los fiduciarios deben tener información básica sobre otros agentes y prestadores de servicios del fideicomiso, como asesores de inversión, contadores y asesores fiscales","Debe prohibirse emitir nuevas acciones al portador y, para las existentes, aplicar mecanismos como su conversión a nominativas o su inmovilización"],"x":"La INR.25, párr. 1, pide que los fiduciarios residentes o que administran fideicomisos en el país conserven información básica sobre otros agentes regulados y prestadores de servicios, como asesores o gestores de inversión, contadores y asesores fiscales. Los demás enunciados pertenecen a la INR.24, sobre personas morales (párrs. 4, 12 y 13).","ref":"INR.25, párr. 1","d":{"Todas las sociedades creadas en el país deben inscribirse en un registro de sociedades y llevar un registro de sus accionistas o socios":"Eso es de la INR.24, sobre el registro de sociedades y de accionistas de personas morales, no de la Nota a la R.25.","Los accionistas y directores nominales deben revelar su calidad de nominales y la identidad de quien los nombra a la sociedad y al registro":"Eso es de la INR.24 (párr. 13), sobre accionistas y directores nominales de personas morales.","Debe prohibirse emitir nuevas acciones al portador y, para las existentes, aplicar mecanismos como su conversión a nominativas o su inmovilización":"Eso es de la INR.24 (párr. 12) y del texto de la R.24, sobre acciones al portador; la R.25 trata de fideicomisos."}},{"id":"E038","tema":"F","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.26?","a":"El supervisor debe tener acceso in situ y extra situ a la información sobre riesgos de clientes, productos y servicios, incluida la calidad de la función de cumplimiento","o":["Los supervisores u organismos autorreguladores deben tener facultades adecuadas para desempeñar sus funciones, incluidas las de vigilar y sancionar a las APNFD","La unidad debe ser operativamente independiente y autónoma, con el derecho propio de remitir o diseminar información a las autoridades competentes","Los supervisores deben poder hacer indagaciones por cuenta de sus contrapartes extranjeras para facilitar la supervisión eficaz de los grupos","El supervisor debe tener acceso in situ y extra situ a la información sobre riesgos de clientes, productos y servicios, incluida la calidad de la función de cumplimiento"],"x":"La INR.26, párr. 2(b), pide que los supervisores tengan acceso in situ y extra situ a la información sobre riesgos de clientes, productos y servicios, incluida la calidad de la función de cumplimiento. Las facultades de supervisores u organismos autorreguladores sobre APNFD son de la INR.28 (párr. 4), la independencia con derecho a diseminar es de la UIF (INR.29, párr. 8) y las indagaciones por cuenta de contrapartes extranjeras son de la INR.40 (párr. 13).","ref":"INR.26, párr. 2(b)","d":{"Los supervisores u organismos autorreguladores deben tener facultades adecuadas para desempeñar sus funciones, incluidas las de vigilar y sancionar a las APNFD":"Eso es de la INR.28 (párr. 4), sobre supervisores u organismos autorreguladores de APNFD, no de la Nota a la R.26.","La unidad debe ser operativamente independiente y autónoma, con el derecho propio de remitir o diseminar información a las autoridades competentes":"Eso describe a la UIF (INR.29, párr. 8), no al supervisor financiero de la INR.26.","Los supervisores deben poder hacer indagaciones por cuenta de sus contrapartes extranjeras para facilitar la supervisión eficaz de los grupos":"Eso es de la INR.40 (párr. 13), sobre la cooperación entre supervisores financieros."}},{"id":"E039","tema":"F","tipo":"memoria","q":"Un país exige licencia a los bancos, pero permite que las casas de cambio de divisas operen con un simple aviso, sin licencia ni registro. ¿Qué recomendación exige que quienes prestan servicios de cambio de dinero o divisas tengan, como mínimo, licencia o registro y estén sujetos a sistemas eficaces de monitoreo?","a":"R.26 · Regulación y supervisión de instituciones financieras","o":["R.26 · Regulación y supervisión de instituciones financieras","R.14 · Servicios de transferencia de dinero o valores","R.27 · Facultades de los supervisores","R.28 · Regulación y supervisión de APNFD"],"x":"La R.26 dice que, como mínimo, las IF que prestan servicios de transferencia de dinero o valores o de cambio de dinero o divisas deben tener licencia o registro y estar sujetas a sistemas eficaces de monitoreo. La R.14 exige licencia o registro a los proveedores de transferencia de dinero o valores (y, para sus agentes, licencia o registro o una lista actualizada), pero no menciona el cambio de divisas.","ref":"R.26; R.14","d":{"R.14 · Servicios de transferencia de dinero o valores":"La R.14 exige licencia o registro a los proveedores de transferencia de dinero o valores, pero no menciona el cambio de divisas.","R.27 · Facultades de los supervisores":"La R.27 trata de las facultades de los supervisores (inspeccionar, requerir información, sancionar), no de licencias a casas de cambio.","R.28 · Regulación y supervisión de APNFD":"La R.28 regula a las APNFD; las casas de cambio son IF y su licencia o registro está en la R.26."}},{"id":"E040","tema":"F","tipo":"caso","q":"Un banco aplica un enfoque basado en riesgo con amplio margen de discreción para decidir qué medidas aplica a cada segmento de clientes. Según la Nota a la R.26, ¿cómo debe tomarlo en cuenta el supervisor?","a":"Considerando el grado de discreción permitido y revisando las evaluaciones de riesgo que lo sustentan y la idoneidad e implementación de sus políticas y controles","o":["Considerando el grado de discreción permitido y revisando las evaluaciones de riesgo que lo sustentan y la idoneidad e implementación de sus políticas y controles","Limitándose a verificar que el banco tenga una evaluación de riesgo documentada, porque el margen de discreción es responsabilidad exclusiva de su consejo","Eliminando ese margen de discreción y exigiendo DDC reforzada a todos los clientes hasta que el banco demuestre que su riesgo es bajo","Inspeccionándolo con la misma frecuencia e intensidad que a los demás bancos, para no favorecer a quienes aplican un enfoque basado en riesgo"],"x":"La INR.26, párr. 4, dice que la supervisión de IF que aplican un EBR debe tomar en cuenta el grado de discreción que se les permite y abarcar una revisión de las evaluaciones de riesgo que sustentan esa discreción y de la idoneidad e implementación de sus políticas, controles internos y procedimientos. Además, la frecuencia e intensidad de la supervisión deben basarse en el perfil de riesgo (párr. 2).","ref":"INR.26, párrs. 2 y 4","d":{"Limitándose a verificar que el banco tenga una evaluación de riesgo documentada, porque el margen de discreción es responsabilidad exclusiva de su consejo":"La INR.26 (párr. 4) pide revisar las evaluaciones que sustentan la discreción y la idoneidad e implementación de políticas y controles, no sólo que exista el documento.","Eliminando ese margen de discreción y exigiendo DDC reforzada a todos los clientes hasta que el banco demuestre que su riesgo es bajo":"El estándar no prevé que el supervisor elimine la discreción ni que imponga DDC reforzada a todos; la INR.26 pide tomarla en cuenta y revisarla.","Inspeccionándolo con la misma frecuencia e intensidad que a los demás bancos, para no favorecer a quienes aplican un enfoque basado en riesgo":"Contradice la INR.26 (párr. 2): la frecuencia e intensidad de la supervisión deben basarse en el perfil de riesgo de cada institución."}},{"id":"E041","tema":"F","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la R.27?","a":"Los supervisores deben tener facultades adecuadas para supervisar o vigilar a las IF y asegurar su cumplimiento PLD/FT, incluida la de realizar inspecciones","o":["Los supervisores financieros deben contar con recursos financieros, humanos y técnicos adecuados, y con independencia operativa y autonomía suficientes","Las autoridades competentes deben asegurar que los casinos tengan licencia y que se les supervise eficazmente en su cumplimiento PLD/FT","Las autoridades deben tomar medidas para impedir que delincuentes o sus asociados tengan una participación significativa o de control, o un cargo directivo, en una IF","Los supervisores deben tener facultades adecuadas para supervisar o vigilar a las IF y asegurar su cumplimiento PLD/FT, incluida la de realizar inspecciones"],"x":"La R.27, que no tiene Nota, otorga a los supervisores facultades para supervisar o vigilar y asegurar el cumplimiento de las IF, incluida la de inspeccionar, obligar a entregar información y sancionar. Los recursos e independencia de los supervisores están en la INR.26 (párr. 6), el régimen de casinos en la R.28 y el filtro contra delincuentes en la R.26.","ref":"R.27","d":{"Los supervisores financieros deben contar con recursos financieros, humanos y técnicos adecuados, y con independencia operativa y autonomía suficientes":"Eso es de la INR.26 (párr. 6), sobre recursos e independencia de los supervisores; la R.27 no tiene Nota interpretativa.","Las autoridades competentes deben asegurar que los casinos tengan licencia y que se les supervise eficazmente en su cumplimiento PLD/FT":"Eso es de la R.28(a), sobre casinos, no de la R.27.","Las autoridades deben tomar medidas para impedir que delincuentes o sus asociados tengan una participación significativa o de control, o un cargo directivo, en una IF":"Eso es del texto de la R.26 (filtro contra delincuentes en las IF), no de la R.27."}},{"id":"E042","tema":"F","tipo":"caso","q":"El supervisor de casinos de un país sostiene que sus facultades de inspección y sanción derivan directamente de la R.27. ¿Qué precisión es correcta?","a":"La R.27 se refiere a los supervisores de IF; la supervisión de casinos y demás APNFD está en la R.28, con sanciones acordes con la R.35","o":["Es correcto, porque la R.27 abarca por igual a todos los supervisores, sean de IF, de APNFD o de PSAV, sin ninguna distinción","La R.27 sólo aplica a los organismos autorreguladores, por lo que un supervisor gubernamental de casinos carece de esas facultades","Las facultades sobre casinos derivan de la R.35, que es la única recomendación que regula la supervisión y las sanciones aplicables a las APNFD","La R.27 se refiere a los supervisores de IF; la supervisión de casinos y demás APNFD está en la R.28, con sanciones acordes con la R.35"],"x":"La R.27 habla de las facultades de los supervisores para asegurar el cumplimiento de las «instituciones financieras». Para las APNFD, la R.28 exige un régimen integral para casinos y sistemas eficaces de monitoreo para las demás, con sanciones acordes con la R.35; la R.35 regula las sanciones, no la supervisión.","ref":"R.27; R.28; R.35","d":{"Es correcto, porque la R.27 abarca por igual a todos los supervisores, sean de IF, de APNFD o de PSAV, sin ninguna distinción":"La R.27 se refiere expresamente a las «instituciones financieras»; las APNFD se supervisan conforme a la R.28 y los PSAV conforme a la INR.15.","La R.27 sólo aplica a los organismos autorreguladores, por lo que un supervisor gubernamental de casinos carece de esas facultades":"La R.27 no menciona a los organismos autorreguladores; éstos aparecen en la R.28(b) como opción para APNFD distintas de los casinos.","Las facultades sobre casinos derivan de la R.35, que es la única recomendación que regula la supervisión y las sanciones aplicables a las APNFD":"La R.35 regula las sanciones; la supervisión de las APNFD, incluidos los casinos, está en la R.28."}},{"id":"E043","tema":"F","tipo":"memoria","q":"Un país permite que una persona condenada por LD sea operadora de un casino, aunque no sea accionista ni directiva. ¿Qué recomendación exige impedir que delincuentes o sus asociados sean operadores de un casino?","a":"R.28 · Regulación y supervisión de APNFD","o":["R.28 · Regulación y supervisión de APNFD","R.22 · APNFD: debida diligencia","R.26 · Regulación y supervisión de instituciones financieras","R.23 · APNFD: otras medidas"],"x":"La R.28(a) exige, como mínimo, que los casinos tengan licencia y que se impida a delincuentes o sus asociados tener una participación significativa o de control, ser sus beneficiarios finales, tener un cargo directivo o ser operadores de un casino. La R.26 contiene un filtro similar, pero para las IF, y no menciona a los operadores.","ref":"R.28, inciso (a)","d":{"R.22 · APNFD: debida diligencia":"La R.22 extiende la DDC y la conservación de registros a las APNFD; no regula quién puede operar un casino.","R.26 · Regulación y supervisión de instituciones financieras":"La R.26 tiene un filtro parecido, pero para las IF, y no menciona a los operadores.","R.23 · APNFD: otras medidas":"La R.23 aplica a las APNFD las R.18 a 21 (controles, países de mayor riesgo, reportes y confidencialidad); no regula la idoneidad de los operadores."}},{"id":"E044","tema":"F","tipo":"caso","q":"La UIF analiza un reporte de un banco y necesita los expedientes de DDC que conserva un notario que participó en la operación, aunque éste no presentó ningún reporte. Según la Nota a la R.29, ¿qué procede?","a":"La UIF debe poder obtener y usar información adicional de los sujetos obligados, que puede incluir la que conservan conforme a las R.10, 11 y 22","o":["La UIF sólo puede usar la información que el notario le haya reportado; para obtener lo demás debe pedir a la fiscalía una orden judicial","La UIF debe poder obtener y usar información adicional de los sujetos obligados, que puede incluir la que conservan conforme a las R.10, 11 y 22","La UIF debe pedir la información al colegio de notarios como organismo autorregulador, ya que no puede requerirla directamente","La UIF sólo puede obtener información adicional del sujeto obligado que presentó el reporte original, en este caso el banco"],"x":"La INR.29, párr. 5, dice que, además de lo que se le reporta, la UIF debe poder obtener y usar información adicional de los sujetos obligados según lo necesite para su análisis, y que ésta puede incluir la que conservan conforme a las R.10, 11 y 22. Ni la R.29 ni su Nota limitan esa facultad al sujeto obligado que reportó.","ref":"R.29; INR.29, párr. 5","d":{"La UIF sólo puede usar la información que el notario le haya reportado; para obtener lo demás debe pedir a la fiscalía una orden judicial":"La R.29 y la INR.29 (párr. 5) facultan a la UIF a obtener información adicional de los sujetos obligados; el estándar no exige una orden judicial vía fiscalía.","La UIF debe pedir la información al colegio de notarios como organismo autorregulador, ya que no puede requerirla directamente":"La INR.23 (párr. 3) permite enviar reportes por medio del organismo autorregulador; eso no limita la facultad de la UIF de requerir información adicional.","La UIF sólo puede obtener información adicional del sujeto obligado que presentó el reporte original, en este caso el banco":"Ni la R.29 ni la INR.29 limitan la facultad al sujeto obligado que reportó; se refieren a los sujetos obligados en general."}},{"id":"E045","tema":"F","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la Nota interpretativa a la R.29?","a":"Se alienta el uso de software analítico para procesar información, pero estas herramientas no pueden sustituir por completo el juicio humano","o":["Una investigación financiera indaga los asuntos financieros vinculados a una actividad delictiva para dimensionar redes, rastrear bienes y obtener pruebas","Se alienta el uso de software analítico para procesar información, pero estas herramientas no pueden sustituir por completo el juicio humano","Las unidades deben intercambiar información con sus homólogas extranjeras sin importar si son de naturaleza administrativa, policial o judicial","La información obtenida mediante el sistema de declaración o revelación de efectivo transfronterizo debe estar disponible para la UIF"],"x":"La INR.29, párr. 3, alienta a las UIF a usar software analítico y aclara que no puede sustituir por completo el juicio humano en el análisis. La definición de investigación financiera es de la INR.30 (párr. 2), el intercambio entre UIF de distinta naturaleza de la INR.40 (párr. 7) y el acceso de la UIF a las declaraciones de efectivo de la INR.32 (párr. 5(c)).","ref":"INR.29, párr. 3","d":{"Una investigación financiera indaga los asuntos financieros vinculados a una actividad delictiva para dimensionar redes, rastrear bienes y obtener pruebas":"Esa definición de investigación financiera es de la INR.30 (párr. 2), no de la Nota a la R.29.","Las unidades deben intercambiar información con sus homólogas extranjeras sin importar si son de naturaleza administrativa, policial o judicial":"Eso es de la INR.40 (párr. 7), sobre el intercambio entre UIF de distinta naturaleza.","La información obtenida mediante el sistema de declaración o revelación de efectivo transfronterizo debe estar disponible para la UIF":"Eso es de la INR.32 (párr. 5(c)), sobre declaraciones de transporte transfronterizo de efectivo."}},{"id":"E046","tema":"F","tipo":"memoria","q":"¿Qué recomendación pide a los países usar, cuando sea necesario, grupos multidisciplinarios permanentes o temporales especializados en investigaciones financieras o patrimoniales?","a":"R.30 · Responsabilidades de las autoridades de investigación","o":["R.31 · Facultades de las autoridades de investigación","R.30 · Responsabilidades de las autoridades de investigación","R.40 · Otras formas de cooperación internacional","R.4 · Decomiso y medidas provisionales"],"x":"La R.30 pide usar, cuando sea necesario, grupos multidisciplinarios permanentes o temporales especializados en investigaciones financieras o patrimoniales, y asegurar investigaciones cooperativas con otros países. La R.31 trata de las facultades y técnicas de investigación, y la INR.40 (párr. 17) de los equipos conjuntos de investigación con contrapartes extranjeras.","ref":"R.30","d":{"R.31 · Facultades de las autoridades de investigación":"La R.31 trata de facultades y técnicas de investigación (cateos, operaciones encubiertas, acceso a información), no de grupos multidisciplinarios.","R.40 · Otras formas de cooperación internacional":"La INR.40 (párr. 17) habla de equipos conjuntos de investigación con contrapartes extranjeras, no de grupos multidisciplinarios nacionales.","R.4 · Decomiso y medidas provisionales":"La R.4 trata de decomiso y medidas provisionales; los grupos multidisciplinarios están en la R.30."}},{"id":"E047","tema":"F","tipo":"trampa","q":"¿Cuál de estos enunciados corresponde a la R.31?","a":"Las autoridades deben tener acceso oportuno a una amplia gama de información para rastrear bienes del delito, que puede incluir registros de ciudadanía, residencia o prestaciones sociales","o":["Las autoridades deben tener acceso oportuno a una amplia gama de información para rastrear bienes del delito, que puede incluir registros de ciudadanía, residencia o prestaciones sociales","Los países deberían considerar permitir que se posponga la detención de sospechosos o el aseguramiento del dinero para identificar a los involucrados o reunir pruebas","La unidad debe tener acceso oportuno a la información financiera, administrativa y de aplicación de la ley que requiere para desempeñar adecuadamente sus funciones","Los países deben asegurar que las autoridades de investigación de delitos precedentes puedan investigar el LD y el FT relacionados en una investigación paralela, o remitir el caso a otra agencia"],"x":"La R.31, que no tiene Nota, pide que las autoridades tengan acceso oportuno a una amplia gama de información para identificar y rastrear bienes, que puede incluir, entre otros, los registros de ciudadanía, residencia o prestaciones sociales. P
