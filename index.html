3","d":{"Los castigados con pena mínima de más de un año de prisión":"Un año es el umbral para sistemas basados en penas máximas, no en penas mínimas (INR.3, párr. 3).","Los castigados con pena mínima de más de dos años de prisión":"El estándar no fija «más de dos años» en ningún supuesto de umbral de la INR.3.","Los castigados con pena mínima de más de tres meses de prisión":"El estándar no prevé «tres meses»; para penas mínimas, la INR.3 exige más de seis meses."}},{"id":"G009","tema":"B","tipo":"caso","q":"En un juicio por LD contra Andrés, su defensa alega que no puede acreditarse que el dinero sea producto de un fraude porque nadie ha sido condenado por ese fraude. Conforme a la Nota a la R.3, ¿qué aplica?","a":"Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","o":["Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","La condena por el delito precedente sólo se exige cuando el valor de los bienes supera el umbral de USD/EUR 15,000","La condena previa por el delito precedente es indispensable, salvo que el fraude se haya cometido en otro país","El delito de LD sólo se configura si una sentencia firme declara antes el origen ilícito de cada bien involucrado"],"x":"La INR.3 dice que, al probar que los bienes son producto del delito, no debe ser necesario que alguien haya sido condenado por el delito precedente. Además, el delito de LD se extiende a cualquier bien sin importar su valor, por lo que no hay umbral de monto.","ref":"INR.3, párr. 4","d":{"La condena por el delito precedente sólo se exige cuando el valor de los bienes supera el umbral de USD/EUR 15,000":"La INR.3 (párr. 4) extiende el LD a cualquier bien sin importar su valor; USD/EUR 15,000 es el umbral de operaciones ocasionales de la R.10.","La condena previa por el delito precedente es indispensable, salvo que el fraude se haya cometido en otro país":"La INR.3 no exige condena previa en ningún caso; además, el delito precedente puede haberse cometido en otro país (párr. 5).","El delito de LD sólo se configura si una sentencia firme declara antes el origen ilícito de cada bien involucrado":"Contradice la INR.3 (párr. 4): no hace falta condena por el delito precedente para probar que los bienes son producto del delito."}},{"id":"G010","tema":"B","tipo":"memoria","q":"Según la R.3, ¿con base en qué instrumentos deben los países tipificar el delito de LD?","a":"Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","o":["La Convención contra la Corrupción (2003) y el Convenio sobre Financiación del Terrorismo (1999)","La Convención de Palermo (2000) y la Convención Interamericana contra el Terrorismo (2002)","Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","La Convención de Viena (1988) y el Convenio sobre Ciberdelincuencia (2001)"],"x":"La R.3 y su Nota fundan el delito de LD en las Convenciones de Viena (1988) y de Palermo (2000). El Convenio sobre Financiación del Terrorismo es la base del delito de FT (R.5), y los demás instrumentos aparecen en la R.36.","ref":"R.3; INR.3, párr. 1","d":{"La Convención contra la Corrupción (2003) y el Convenio sobre Financiación del Terrorismo (1999)":"Esos instrumentos aparecen en la R.4 y la R.36; el Convenio sobre Financiación del Terrorismo es la base del delito de FT (R.5), no del de LD.","La Convención de Palermo (2000) y la Convención Interamericana contra el Terrorismo (2002)":"Mezcla Palermo con la Convención Interamericana contra el Terrorismo, que la R.36 sólo alienta a ratificar «cuando proceda».","La Convención de Viena (1988) y el Convenio sobre Ciberdelincuencia (2001)":"Mezcla Viena con el Convenio sobre Ciberdelincuencia, que la R.36 sólo alienta a ratificar «cuando proceda»."}},{"id":"G011","tema":"B","tipo":"memoria","q":"¿Qué recomendación pide a los países políticas y marcos operativos que prioricen la recuperación de activos, tanto en el contexto nacional como en el internacional?","a":"R.4 (Decomiso y medidas provisionales)","o":["R.36 (Instrumentos internacionales)","R.38 (Asistencia legal mutua: congelamiento y decomiso)","R.4 (Decomiso y medidas provisionales)","R.30 (Responsabilidades de las autoridades de investigación)"],"x":"La R.4 abre con la obligación de priorizar la recuperación de activos en ambos contextos. La R.38 trata de responder a solicitudes extranjeras de congelamiento y decomiso, no de fijar esa prioridad general.","ref":"R.4","d":{"R.36 (Instrumentos internacionales)":"La R.36 pide adherirse a las convenciones internacionales; no fija la prioridad de recuperar activos.","R.38 (Asistencia legal mutua: congelamiento y decomiso)":"La R.38 regula cómo responder a solicitudes extranjeras de congelamiento y decomiso, no la prioridad general nacional e internacional.","R.30 (Responsabilidades de las autoridades de investigación)":"La R.30 asigna a las autoridades de investigación la responsabilidad de investigar y rastrear bienes, pero la prioridad de recuperación de activos abre la R.4."}},{"id":"G012","tema":"B","tipo":"caso","q":"La UIF de un país recibe información de que una transferencia sospechosa de LD está por ejecutarse y necesita tiempo para analizarla. Según la Nota a la R.4, el país debe facultar a la UIF u otra autoridad para:","a":"Suspender la operación o negar su consentimiento de inmediato, por un plazo máximo especificado","o":["Ordenar al banco que cierre la cuenta y explique al cliente el motivo de la suspensión de su operación","Suspender la operación o negar su consentimiento de inmediato, por un plazo máximo especificado","Decomisar los fondos de inmediato, sin sentencia y sin posibilidad de revisión judicial posterior","Congelar la cuenta por tiempo indefinido hasta que el cliente acredite el origen lícito de sus recursos"],"x":"La INR.4 pide que la UIF u otra autoridad pueda actuar de inmediato para suspender una operación o negar su consentimiento, con una duración máxima especificada que dé tiempo al análisis y, en su caso, a iniciar un congelamiento o incautación. Es una medida temporal: no autoriza plazos indefinidos, cierres de cuenta con aviso al cliente ni decomisos inmediatos.","ref":"R.4, inciso (b); INR.4, párr. 4","d":{"Ordenar al banco que cierre la cuenta y explique al cliente el motivo de la suspensión de su operación":"La INR.4 no prevé cerrar cuentas, y explicar el motivo al cliente chocaría con la prohibición de revelar de la R.21.","Decomisar los fondos de inmediato, sin sentencia y sin posibilidad de revisión judicial posterior":"Es una medida temporal de suspensión; la INR.4 (párr. 6) incluso exige que el congelamiento o la incautación sin orden judicial sean revisables judicialmente.","Congelar la cuenta por tiempo indefinido hasta que el cliente acredite el origen lícito de sus recursos":"La INR.4 exige especificar una duración máxima para la suspensión; no admite plazos indefinidos."}},{"id":"G013","tema":"B","tipo":"trampa","q":"Sobre exigir al infractor que demuestre el origen lícito de los bienes que podrían decomisarse, la Nota a la R.4 establece que los países:","a":"Deben considerar adoptar medidas con ese fin","o":["Deben considerar adoptar medidas con ese fin","Tienen prohibido adoptarlas","Sólo pueden adoptarlas en casos de FT vinculados a designaciones de la ONU","Deben adoptarlas obligatoriamente para todos los delitos precedentes"],"x":"La INR.4 usa un modal débil: los países «deben considerar» medidas que exijan al infractor demostrar el origen lícito de los bienes. No es una obligación absoluta ni una prohibición.","ref":"INR.4, párr. 12","d":{"Tienen prohibido adoptarlas":"No hay prohibición: la INR.4 (párr. 12) pide a los países «considerar» esas medidas.","Sólo pueden adoptarlas en casos de FT vinculados a designaciones de la ONU":"La INR.4 no limita esa medida al FT ni a las designaciones de la ONU; esas designaciones son materia de la R.6.","Deben adoptarlas obligatoriamente para todos los delitos precedentes":"Convierte en obligación lo que la INR.4 deja como «deben considerar»."}},{"id":"G014","tema":"C","tipo":"caso","q":"Luisa entrega a sabiendas parte de su salario a una organización terrorista. La fiscalía no puede demostrar a qué atentado concreto se destinaron los fondos. Según la R.5 y su Nota, ¿se configura el FT?","a":"Sí, aunque los fondos sean lícitos y no se vinculen a un acto concreto","o":["No, porque los fondos son de origen lícito","No, porque debe demostrarse que los fondos se usaron efectivamente en un acto terrorista","Sí, pero sólo si la organización está designada por el Consejo de Seguridad de la ONU","Sí, aunque los fondos sean lícitos y no se vinculen a un acto concreto"],"x":"La R.5 tipifica el financiamiento de organizaciones terroristas aun sin vínculo con un acto específico, y la INR.5 aclara que abarca fondos de origen legítimo o ilegítimo. El FT no exige que los fondos provengan de un delito, a diferencia de lo que ocurre con el LD.","ref":"R.5; INR.5, párrs. 5 y 6","d":{"No, porque los fondos son de origen lícito":"La INR.5 (párr. 5) dice que el FT abarca fondos de origen legítimo o ilegítimo.","No, porque debe demostrarse que los fondos se usaron efectivamente en un acto terrorista":"La INR.5 (párr. 6) dice que no se requiere que los fondos se hayan usado en un acto terrorista ni que se vinculen a uno concreto.","Sí, pero sólo si la organización está designada por el Consejo de Seguridad de la ONU":"La R.5 no exige designación de la ONU; la designación es materia de las sanciones financieras de la R.6."}},{"id":"G015","tema":"C","tipo":"caso","q":"Un grupo reúne dinero para pagar los boletos de avión de tres personas que viajarán a un Estado distinto al de su residencia para recibir entrenamiento terrorista. Según la Nota a la R.5, esa recaudación:","a":"Es FT, porque la Nota incluye el financiamiento de viajes con esos fines","o":["Sólo es FT si el dinero proviene de actividades ilícitas ya sentenciadas por un juez","No es FT mientras los viajeros no cometan o intenten cometer un acto terrorista","Es sólo una tentativa no punible","Es FT, porque la Nota incluye el financiamiento de viajes con esos fines"],"x":"La INR.5 incluye en el FT el financiamiento de viajes a otro Estado para perpetrar, planear o preparar actos terroristas, o para dar o recibir entrenamiento terrorista. No hace falta que el acto se cometa, y la tentativa de FT también debe tipificarse (párr. 10).","ref":"INR.5, párr. 3","d":{"Sólo es FT si el dinero proviene de actividades ilícitas ya sentenciadas por un juez":"La INR.5 (párr. 5) incluye fondos de cualquier origen, lícito o ilícito; el FT no exige un delito previo ni sentencia.","No es FT mientras los viajeros no cometan o intenten cometer un acto terrorista":"La INR.5 (párr. 6) no exige que el acto terrorista llegue a cometerse o intentarse.","Es sólo una tentativa no punible":"La INR.5 (párr. 10) exige tipificar también la tentativa de FT; además, aquí ya hay FT consumado."}},{"id":"G016","tema":"C","tipo":"trampa","q":"Un país tipifica el FT únicamente mediante las figuras de complicidad, tentativa o conspiración respecto de otros delitos. Conforme a la Nota a la R.5, esto:","a":"Es insuficiente para cumplir con la Recomendación","o":["Cumple, si las penas son disuasivas","Cumple para personas morales; sólo las personas físicas requieren un tipo autónomo","Es insuficiente para cumplir con la Recomendación","Cumple, si además el FT queda designado como delito precedente de LD"],"x":"La INR.5 dice expresamente que tipificar el FT sólo a partir de la complicidad, la tentativa o la conspiración no basta. Designar el FT como delito precedente es otra obligación de la R.5, que no sustituye al tipo penal autónomo.","ref":"INR.5, párr. 4","d":{"Cumple, si las penas son disuasivas":"La severidad de las penas no subsana la falta de un tipo penal autónomo (INR.5, párr. 4).","Cumple para personas morales; sólo las personas físicas requieren un tipo autónomo":"El estándar no prevé esa distinción; la INR.5 (párr. 9) pide responsabilidad también para personas morales, sin excusar el tipo autónomo.","Cumple, si además el FT queda designado como delito precedente de LD":"Designar el FT como delito precedente es otra obligación de la R.5; no sustituye al tipo penal autónomo."}},{"id":"G017","tema":"C","tipo":"memoria","q":"En la R.6, ¿quién designa a las personas y entidades sujetas a congelamiento y con base en qué resoluciones?","a":"El Consejo de Seguridad conforme a la 1267 (1999) y sucesoras, y el propio país conforme a la 1373 (2001)","o":["El Consejo de Seguridad conforme a la 1267 (1999) y sucesoras, y el propio país conforme a la 1373 (2001)","El Consejo de Seguridad conforme a la 1373 (2001), y el propio país conforme a la 1267 (1999) y sucesoras","El Consejo de Seguridad conforme a la 1540 (2004), y el propio país conforme a la 2231 (2015) y sucesoras","El Consejo de Seguridad conforme a la 1718 (2006) y sucesoras, y el propio país conforme a la 1737 (2006)"],"x":"La R.6 cubre a las personas designadas por el Consejo de Seguridad o bajo su autoridad (incluida la resolución 1267 y sus sucesoras) y a las designadas por el propio país conforme a la 1373. Las resoluciones 1718 y 1737 corresponden a la proliferación (R.7).","ref":"R.6","d":{"El Consejo de Seguridad conforme a la 1373 (2001), y el propio país conforme a la 1267 (1999) y sucesoras":"Invierte las resoluciones: la 1267 es del Consejo de Seguridad y la 1373 es la que permite al propio país designar (R.6).","El Consejo de Seguridad conforme a la 1540 (2004), y el propio país conforme a la 2231 (2015) y sucesoras":"La 1540 impone obligaciones de no proliferación aparte de la R.7 (INR.7, nota al pie 24) y la 2231 es de Irán; ninguna es de la R.6.","El Consejo de Seguridad conforme a la 1718 (2006) y sucesoras, y el propio país conforme a la 1737 (2006)":"Las resoluciones 1718 y 1737 son de proliferación y pertenecen a la R.7, no a la R.6."}},{"id":"G018","tema":"C","tipo":"caso","q":"Las autoridades de un país evalúan designar, conforme a la resolución 1373, a una persona respecto de la cual hay motivos razonables para creer que financia el terrorismo, aunque no existe un proceso penal abierto. Según la Nota a la R.6:","a":"Pueden designarla: la designación no debe condicionarse a que exista un proceso penal","o":["Deben acreditar su culpabilidad más allá de toda duda razonable antes de poder designarla","Sólo pueden proponerla al Comité 1267, único órgano facultado para designar en materia de terrorismo","Deben esperar a que el Ministerio Público inicie formalmente una investigación penal contra ella","Pueden designarla: la designación no debe condicionarse a que exista un proceso penal"],"x":"La INR.6 fija como estándar probatorio los «motivos razonables» o la «base razonable» y dice que las designaciones no deben condicionarse a la existencia de un proceso penal. En la 1373, el propio país designa, así que no depende del Comité 1267.","ref":"INR.6, párr. 4(d)","d":{"Deben acreditar su culpabilidad más allá de toda duda razonable antes de poder designarla":"El estándar probatorio de la INR.6 es «motivos razonables» o «base razonable», no prueba más allá de toda duda razonable.","Sólo pueden proponerla al Comité 1267, único órgano facultado para designar en materia de terrorismo":"Con la resolución 1373 el propio país designa; el Comité 1267 sólo recibe propuestas para su lista.","Deben esperar a que el Ministerio Público inicie formalmente una investigación penal contra ella":"La INR.6 dice que la designación no debe condicionarse a que exista un proceso penal."}},{"id":"G019","tema":"C","tipo":"trampa","q":"La obligación de que las IF y APNFD reporten a las autoridades los activos congelados conforme a la R.6, incluidas las operaciones intentadas, ¿dónde se establece?","a":"En la Nota interpretativa de la R.6","o":["En el texto de la R.20","En la Nota interpretativa de la R.6","En el texto de la R.6","En el Glosario general"],"x":"El texto de la R.6 sólo ordena congelar sin demora y no poner fondos a disposición; el reporte de activos congelados y de operaciones intentadas lo detalla la INR.6. No confundir con la R.20, que regula el reporte de operaciones sospechosas.","ref":"INR.6, párr. 6(e)","d":{"En el texto de la R.20":"El texto de la R.20 regula el reporte de operaciones sospechosas a la UIF, no el reporte de activos congelados.","En el texto de la R.6":"El texto de la R.6 sólo ordena congelar sin demora y no poner fondos a disposición; el reporte lo detalla la Nota.","En el Glosario general":"El Glosario define términos como «sin demora» o «designación»; no impone la obligación de reportar activos congelados."}},{"id":"G020","tema":"C","tipo":"cifra","q":"Según el Glosario, en el caso de designaciones del Consejo de Seguridad o de sus Comités de sanciones, «sin demora» significa, idealmente:","a":"En cuestión de horas desde la designación","o":["En un plazo de tres días hábiles","Dentro de los cinco días hábiles siguientes a la notificación al sujeto obligado","Dentro del mes siguiente, igual que la actualización del beneficiario final","En cuestión de horas desde la designación"],"x":"El Glosario define «sin demora» como, idealmente, en cuestión de horas desde la designación del Consejo de Seguridad o de su Comité. Los tres días hábiles corresponden a otro plazo (INR.16, párr. 12).","ref":"Glosario (sin demora)","d":{"En un plazo de tres días hábiles":"Tres días hábiles es el plazo para entregar información de una transferencia nacional a solicitud (INR.16, párr. 12), no el de «sin demora».","Dentro de los cinco días hábiles siguientes a la notificación al sujeto obligado":"El estándar no prevé «cinco días hábiles»; el Glosario habla, idealmente, de horas.","Dentro del mes siguiente, igual que la actualización del beneficiario final":"Un mes es el ejemplo de plazo para actualizar la información de beneficiario final (INR.24), no el de «sin demora»."}},{"id":"G021","tema":"C","tipo":"caso","q":"Un banco detecta que una empresa cliente acaba de ser designada por el Comité 1718 del Consejo de Seguridad. Conforme a la R.7 y su Nota, ¿qué debe hacer?","a":"Congelar sin demora y sin aviso previo sus fondos y no ponerle fondos a disposición","o":["Congelar sin demora y sin aviso previo sus fondos y no ponerle fondos a disposición","Aplicar DDC reforzada y congelar los fondos sólo si su matriz de riesgo de FP resulta alta","Presentar un reporte de operación sospechosa y esperar instrucciones de la UIF antes de congelar","Congelar únicamente los fondos que puedan vincularse con un acto concreto de proliferación"],"x":"La R.7 exige congelar sin demora los fondos de las personas designadas por el Consejo de Seguridad y no ponerles fondos a disposición; la INR.7 añade «sin aviso previo» y abarca todos sus fondos, no sólo los ligados a un acto concreto. No es una obligación basada en riesgo (INR.1, párr. 3).","ref":"R.7; INR.7, párr. 6(a)","d":{"Aplicar DDC reforzada y congelar los fondos sólo si su matriz de riesgo de FP resulta alta":"La obligación de la R.7 no se basa en riesgo (INR.1, párr. 3): se congela siempre, sin depender de la matriz de riesgo.","Presentar un reporte de operación sospechosa y esperar instrucciones de la UIF antes de congelar":"La INR.7 exige congelar sin demora y sin aviso previo; el reporte de operación sospechosa es de la R.20 y no sustituye ni retrasa el congelamiento.","Congelar únicamente los fondos que puedan vincularse con un acto concreto de proliferación":"La INR.7 abarca todos los fondos de la persona designada, no sólo los ligados a un acto concreto de proliferación."}},{"id":"G022","tema":"C","tipo":"caso","q":"Los fondos de Rodrigo quedaron congelados porque su nombre coincide con el de una persona designada en materia de proliferación. Tras verificar que no es la persona designada, la Nota a la R.7 prevé:","a":"Descongelarlos oportunamente mediante procedimientos públicamente conocidos","o":["Decomisarlos si no acredita su origen lícito","Mantener el congelamiento hasta que el Consejo de Seguridad lo excluya formalmente de la lista","Que Rodrigo tramite su exclusión de la lista ante el Punto Focal creado por la resolución 1730","Descongelarlos oportunamente mediante procedimientos públicamente conocidos"],"x":"Para los falsos positivos, la INR.7 exige procedimientos públicamente conocidos para descongelar oportunamente una vez verificado que la persona no está designada. El Punto Focal de la resolución 1730 sirve para pedir la exclusión de quienes sí están designados, no para homónimos.","ref":"INR.7, párrs. 7 y 8","d":{"Decomisarlos si no acredita su origen lícito":"El decomiso es de la R.4; para falsos positivos, la INR.7 (párr. 8) prevé descongelar una vez verificado que no es la persona designada.","Mantener el congelamiento hasta que el Consejo de Seguridad lo excluya formalmente de la lista":"Esperar la exclusión de la lista aplica a quienes sí están designados (INR.7, párr. 7), no a un homónimo.","Que Rodrigo tramite su exclusión de la lista ante el Punto Focal creado por la resolución 1730":"El Punto Focal de la resolución 1730 sirve para que una persona designada pida su exclusión, no para homónimos que nunca estuvieron en la lista."}},{"id":"G023","tema":"C","tipo":"caso","q":"Una autoridad propone obligar a todas las OSFL del país a aplicar DDC a sus donantes y beneficiarios, sin distinguir niveles de riesgo. Según la Nota a la R.8, la propuesta:","a":"No es acorde: las OSFL no son sujetos obligados y no debe exigírseles DDC","o":["Es acorde, siempre que la DDC se limite a los donativos que superen el umbral de USD/EUR 15,000","No es acorde: las OSFL no son sujetos obligados y no debe exigírseles DDC","Es acorde sólo para OSFL en zonas de conflicto","Es acorde, porque la R.8 exige tratar a las OSFL con las mismas medidas preventivas que a las IF"],"x":"La INR.8 dice que las OSFL no son sujetos obligados, que no debe exigírseles DDC y que las medidas no proporcionales al riesgo de FT evaluado no son acordes con la R.8. El enfoque es focalizado, proporcional y basado en riesgo, no igual al de las IF.","ref":"R.8; INR.8, párr. 5(e)","d":{"Es acorde, siempre que la DDC se limite a los donativos que superen el umbral de USD/EUR 15,000":"USD/EUR 15,000 es el umbral de operaciones ocasionales de la R.10; a las OSFL no debe exigírseles DDC en ningún monto (INR.8).","Es acorde sólo para OSFL en zonas de conflicto":"La INR.8 menciona las zonas de conflicto para reconocer la labor de las OSFL, no para exigirles DDC.","Es acorde, porque la R.8 exige tratar a las OSFL con las mismas medidas preventivas que a las IF":"La R.8 pide medidas focalizadas y proporcionales al riesgo de FT; la INR.8 dice que las OSFL no son sujetos obligados."}},{"id":"G024","tema":"C","tipo":"memoria","q":"De acuerdo con la Nota a la R.8, ¿a qué organizaciones se aplica la Recomendación?","a":"Sólo a las que caen en la definición funcional de OSFL del GAFI","o":["A todas las personas morales autorizadas para recibir donativos deducibles de impuestos","Sólo a las que caen en la definición funcional de OSFL del GAFI","A todas las organizaciones del país que operan sin fines de lucro, sin importar su actividad","Sólo a las clasificadas de alto riesgo de LD"],"x":"La INR.8 adopta una definición funcional: persona moral, estructura jurídica u organización que principalmente recauda o desembolsa fondos con fines benéficos, religiosos, culturales, educativos, sociales o fraternos, o para otras «buenas obras». Aclara que no se aplica a todo el universo sin fines de lucro, y el riesgo que interesa es el de FT, no el de LD.","ref":"INR.8, párr. 1","d":{"A todas las personas morales autorizadas para recibir donativos deducibles de impuestos":"La definición del GAFI es funcional, por actividades, no por la forma jurídica ni por el régimen fiscal.","A todas las organizaciones del país que operan sin fines de lucro, sin importar su actividad":"La INR.8 (párr. 1) aclara que la R.8 no se aplica a todo el universo de organizaciones sin fines de lucro.","Sólo a las clasificadas de alto riesgo de LD":"La R.8 se ocupa del riesgo de FT, no del de LD."}},{"id":"G025","tema":"D","tipo":"memoria","q":"¿Qué recomendación busca que la confidencialidad que la ley impone a las instituciones financieras no obstaculice la aplicación de los estándares del GAFI?","a":"R.9 (Leyes de secreto de las instituciones financieras)","o":["R.37 (Asistencia legal mutua)","R.9 (Leyes de secreto de las instituciones financieras)","R.2 (Cooperación y coordinación nacional)","R.21 (Revelación y confidencialidad)"],"x":"La R.9 pide que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones. La R.21 usa la palabra «confidencialidad», pero regula la protección de quien reporta y la prohibición de revelar un reporte.","ref":"R.9","d":{"R.37 (Asistencia legal mutua)":"La R.37 regula la asistencia legal mutua entre países, no el secreto financiero de las IF.","R.2 (Cooperación y coordinación nacional)":"La R.2 regula la cooperación y coordinación nacional entre autoridades, no el secreto de las IF.","R.21 (Revelación y confidencialidad)":"La R.21 usa la palabra «confidencialidad», pero regula la protección de quien reporta y la prohibición de revelar un reporte."}},{"id":"G026","tema":"D","tipo":"cifra","q":"Un cliente ocasional acude a una IF para una operación en efectivo que no es una transferencia. Conforme a la R.10, ¿a partir de qué monto debe aplicarse DDC?","a":"Por encima de USD/EUR 15,000","o":["Igual o superior a USD/EUR 3,000","Por encima de USD/EUR 1,000","Por encima de USD/EUR 15,000","Por encima de USD/EUR 10,000"],"x":"La R.10 fija el umbral designado de las operaciones ocasionales en USD/EUR 15,000, y en este caso la cifra está en el propio texto de la Recomendación. USD/EUR 3,000 es el umbral de casinos (INR.22/23) y USD/EUR 1,000 el de PSAV (INR.15).","ref":"R.10; INR.10, párr. 22","d":{"Igual o superior a USD/EUR 3,000":"USD/EUR 3,000 es el umbral de los casinos (INR.22/23), no el de la R.10 para IF.","Por encima de USD/EUR 1,000":"USD/EUR 1,000 es el umbral de operaciones ocasionales de los PSAV (INR.15), no el de las IF.","Por encima de USD/EUR 10,000":"El estándar no prevé un umbral de USD/EUR 10,000; la R.10 fija USD/EUR 15,000."}},{"id":"G027","tema":"D","tipo":"caso","q":"El mismo cliente ocasional regresa y, en un mismo día, hace cuatro operaciones de USD 5,000 cada una que parecen vinculadas entre sí. Según la Nota a la R.10, la IF:","a":"Debe aplicar DDC, porque se consideran operaciones vinculadas por encima del umbral","o":["No debe aplicar DDC, porque ninguna operación individual supera los USD/EUR 15,000","Debe aplicar DDC, porque se consideran operaciones vinculadas por encima del umbral","Debe aplicar DDC únicamente si el cliente resulta ser PEP o reside en el extranjero","Sólo debe presentar un reporte de operación sospechosa, sin identificar al cliente"],"x":"La INR.10 aclara que superar el umbral incluye tanto una sola operación como varias que parecen vinculadas; aquí suman USD 20,000. Mirar sólo cada operación por separado es justo lo que la Nota busca impedir.","ref":"INR.10, párr. 22","d":{"No debe aplicar DDC, porque ninguna operación individual supera los USD/EUR 15,000":"La INR.10 (párr. 22) cuenta como una sola las operaciones que parecen vinculadas; mirar cada una por separado es justo la trampa.","Debe aplicar DDC únicamente si el cliente resulta ser PEP o reside en el extranjero":"El umbral de la INR.10 no depende de que el cliente sea PEP o extranjero; basta con que las operaciones vinculadas lo superen.","Sólo debe presentar un reporte de operación sospechosa, sin identificar al cliente":"No hay base para omitir la identificación; aun con sospecha, la INR.10 (párr. 1) pide identificar y verificar además de reportar."}},{"id":"G028","tema":"D","tipo":"caso","q":"Un cliente potencial, representante de una sociedad, se niega a revelar quién es su beneficiario final. Conforme a la R.10, ¿qué debe hacer la IF?","a":"No iniciar la relación y considerar presentar un reporte de operación sospechosa","o":["Abrir la cuenta y completar la DDC en 30 días","No iniciar la relación y considerar presentar un reporte de operación sospechosa","No iniciar la relación y presentar en todos los casos un reporte de operación sospechosa a la UIF","Abrir la cuenta con DDC simplificada y presentar siempre un reporte de operación sospechosa"],"x":"Si no puede cumplir la DDC, la R.10 exige no abrir la cuenta ni iniciar la relación, y «considerar» un reporte de operación sospechosa. El distractor «presentar en todos los casos» convierte en absoluto un modal que el texto deja en «considerar».","ref":"R.10","d":{"Abrir la cuenta y completar la DDC en 30 días":"La R.10 permite verificar después sólo si el riesgo está controlado y es esencial para no interrumpir el negocio; los 30 días no están en el estándar.","No iniciar la relación y presentar en todos los casos un reporte de operación sospechosa a la UIF":"Convierte en absoluto un modal que la R.10 deja en «considerar» un reporte.","Abrir la cuenta con DDC simplificada y presentar siempre un reporte de operación sospechosa":"Si no puede cumplir la DDC, no se abre la cuenta; además, la DDC simplificada no se permite ante sospecha (INR.10, párr. 21)."}},{"id":"G029","tema":"D","tipo":"trampa","q":"La regla de que, si una IF cree razonablemente que aplicar la DDC alertará al cliente sospechoso, puede no continuar ese proceso y debe presentar un reporte de operación sospechosa, ¿dónde se encuentra?","a":"En la Nota interpretativa de la R.10","o":["En la Nota interpretativa de la R.20","En el texto de la R.10","En la Nota interpretativa de la R.10","En el texto de la R.21"],"x":"Está en la INR.10 (sección A, DDC y revelación). La R.21 prohíbe revelar que se presenta un reporte y no tiene Nota interpretativa; el texto de la R.10 no contempla dejar de aplicar la DDC por riesgo de alertar al cliente.","ref":"INR.10, párr. 3","d":{"En la Nota interpretativa de la R.20":"La INR.20 define la actividad delictiva y exige reportar operaciones intentadas; no trata de dejar la DDC por riesgo de alertar al cliente.","En el texto de la R.10":"Está en la Nota, no en el texto de la R.10, que no prevé dejar la DDC por riesgo de alertar al cliente.","En el texto de la R.21":"El texto de la R.21 prohíbe revelar un reporte, pero no regula la DDC; además, la R.21 no tiene Nota interpretativa."}},{"id":"G030","tema":"D","tipo":"memoria","q":"Respecto del propósito y la naturaleza que se pretende dar a la relación de negocios, el inciso (c) de la R.10 pide a la IF:","a":"Entenderlos y, cuando proceda, obtener información sobre ellos","o":["Documentarlos sólo si el cliente es PEP","Verificarlos con fuentes independientes antes de iniciar cualquier relación de negocios","Entenderlos y, cuando proceda, obtener información sobre ellos","Obtener siempre documentación comprobatoria de fuentes independientes que los acredite"],"x":"El inciso (c) de la R.10 dice «entender y, cuando proceda, obtener información» sobre el propósito y la naturaleza de la relación. La verificación con fuentes independientes corresponde a la identidad del cliente (inciso a), no al propósito.","ref":"R.10, inciso (c)","d":{"Documentarlos sólo si el cliente es PEP":"El inciso (c) de la R.10 se aplica a todos los clientes, no sólo a las PEP.","Verificarlos con fuentes independientes antes de iniciar cualquier relación de negocios":"La verificación con fuentes independientes corresponde a la identidad del cliente (inciso a), no al propósito de la relación.","Obtener siempre documentación comprobatoria de fuentes independientes que los acredite":"Convierte en «siempre» lo que el inciso (c) deja en «cuando proceda», y confunde con la verificación del inciso (a)."}},{"id":"G031","tema":"D","tipo":"caso","q":"Una IF analiza a una sociedad con capital muy pulverizado: ninguna persona física tiene una participación de control ni ejerce el control por otros medios. Según la Nota a la R.10, ¿a quién debe identificar la IF en ese supuesto?","a":"A la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía","o":["A la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía","A todos los accionistas con una participación igual o superior al 10 % del capital","A nadie: en ese supuesto la IF queda eximida de identificar al beneficiario final","Al accionista persona moral que tenga la mayor participación en el capital social"],"x":"La INR.10 establece medidas en cascada: participación de control, luego control por otros medios y, si no se identifica a nadie, la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía. El Glosario aclara que esto no cambia la definición de beneficiario final, que siempre es una persona física; una persona moral no puede serlo.","ref":"INR.10, párr. 5(b)(i) y nota al pie 39; Glosario (beneficiario final, nota al pie 98)","d":{"A todos los accionistas con una participación igual o superior al 10 % del capital":"El estándar no fija un 10 %; la nota al pie 40 de la INR.10 sólo da como ejemplo de umbral un 25 %.","A nadie: en ese supuesto la IF queda eximida de identificar al beneficiario final":"La INR.10 establece medidas en cascada: si nadie controla, se identifica al funcionario administrativo de mayor jerarquía; no hay exención.","Al accionista persona moral que tenga la mayor participación en el capital social":"El beneficiario final siempre es una persona física; una persona moral no puede serlo (Glosario)."}},{"id":"G032","tema":"D","tipo":"caso","q":"Una aseguradora emite una póliza de vida cuyos beneficiarios son «los hijos del asegurado al ocurrir el siniestro». Según la Nota a la R.10, ¿cuándo debe verificarse la identidad de esos beneficiarios?","a":"Al momento del pago de la póliza","o":["Al momento del pago de la póliza","Dentro de los 30 días siguientes a su designación","Al emitirse la póliza de seguro","Sólo si la suma asegurada supera los USD/EUR 15,000"],"x":"Para beneficiarios designados por características o por clase, la INR.10 pide obtener información suficiente desde la designación y verificar su identidad al momento del pago. No hay umbral de monto para esta regla.","ref":"INR.10, párrs. 6 y 7","d":{"Dentro de los 30 días siguientes a su designación":"El estándar no prevé un plazo de 30 días; la verificación ocurre al momento del pago (INR.10, párr. 7).","Al emitirse la póliza de seguro":"Al designarse sólo se obtiene información suficiente; la verificación de la identidad ocurre al pago (INR.10, párrs. 6 y 7).","Sólo si la suma asegurada supera los USD/EUR 15,000":"La INR.10 no fija ningún umbral de monto para verificar a los beneficiarios; USD/EUR 15,000 es el umbral de operaciones ocasionales."}},{"id":"G033","tema":"D","tipo":"memoria","q":"¿Qué ejemplos da la Nota a la R.10 de situaciones en que puede completarse la verificación de identidad después de establecer la relación, para no interrumpir la operación normal del negocio?","a":"Los negocios no presenciales y las operaciones con valores","o":["Las PEP nacionales y las cuentas de banca privada de alto patrimonio","Las relaciones de corresponsalía y las cuentas de transferencia de pagos","Los negocios no presenciales y las operaciones con valores","Los clientes no residentes y los negocios intensivos en efectivo"],"x":"La INR.10 cita los negocios no presenciales y las operaciones con valores como ejemplos de verificación posterior. Los clientes no residentes, los negocios intensivos en efectivo y la banca privada aparecen, en cambio, como ejemplos de mayor riesgo.","ref":"INR.10, párr. 11","d":{"Las PEP nacionales y las cuentas de banca privada de alto patrimonio":"La banca privada aparece en la INR.10 como ejemplo de mayor riesgo, y las PEP tienen medidas adicionales en la R.12; no son ejemplos de verificación posterior.","Las relaciones de corresponsalía y las cuentas de transferencia de pagos":"La corresponsalía y las cuentas de transferencia de pagos exigen medidas adicionales de la R.13, no verificación posterior.","Los clientes no residentes y los negocios intensivos en efectivo":"Los clientes no residentes y los negocios intensivos en efectivo son ejemplos de mayor riesgo en la INR.10 (párr. 15), no de verificación posterior."}},{"id":"G034","tema":"D","tipo":"cifra","q":"Una IF terminó la relación de negocios con un cliente el 31 de marzo de 2026. Conforme a la R.11, ¿hasta cuándo, como mínimo, debe conservar su expediente de DDC?","a":"Hasta el 31 de marzo de 2031","o":["Hasta el 31 de marzo de 2036","Hasta el 31 de marzo de 2029","Hasta el 31 de marzo de 2027","Hasta el 31 de marzo de 2031"],"x":"La R.11 exige conservar la información de DDC al menos cinco años después de terminada la relación o de la fecha de la operación ocasional. Diez años no es el mínimo del GAFI, y un plazo menor a cinco no cumple.","ref":"R.11","d":{"Hasta el 31 de marzo de 2036":"Diez años excede el mínimo; la R.11 pide al menos cinco años desde que termina la relación.","Hasta el 31 de marzo de 2029":"Tres años es menos que el mínimo de cinco años de la R.11.","Hasta el 31 de marzo de 2027":"Un año es muy inferior al mínimo de cinco años de la R.11."}},{"id":"G035","tema":"D","tipo":"memoria","q":"Además de los registros de operaciones y de DDC, la R.11 exige conservar los resultados de los análisis realizados, por ejemplo:","a":"Las indagaciones sobre antecedentes y propósito de operaciones complejas, inusuales y de gran monto","o":["Los dictámenes de auditoría externa sobre los estados financieros anuales de la institución","Las evaluaciones de desempeño del personal de cumplimiento y los registros de sus capacitaciones","Las indagaciones sobre antecedentes y propósito de operaciones complejas, inusuales y de gran monto","Las actas del consejo en las que se aprueba el presupuesto anual del área de cumplimiento"],"x":"La R.11 menciona como ejemplo de análisis a conservar las indagaciones para establecer los antecedentes y el propósito de operaciones complejas, inusuales y de gran monto. Las capacitaciones y la auditoría son elementos de los programas que detalla la Nota a la R.18 (INR.18, párr. 1), no los ejemplos de análisis que da la R.11.","ref":"R.11","d":{"Los dictámenes de auditoría externa sobre los estados financieros anuales de la institución":"La R.11 no menciona los dictámenes de auditoría de estados financieros; la auditoría independiente es un elemento de los programas (INR.18).","Las evaluaciones de desempeño del personal de cumplimiento y los registros de sus capacitaciones":"La capacitación del personal es un elemento de los programas de la INR.18, no un ejemplo de los análisis que la R.11 pide conservar.","Las actas del consejo en las que se aprueba el presupuesto anual del área de cumplimiento":"La R.11 no menciona actas del consejo ni presupuestos; su ejemplo son las indagaciones sobre operaciones complejas, inusuales y de gran monto."}},{"id":"G036","tema":"D","tipo":"caso","q":"Un banco recibe como cliente a un exministro de un país extranjero. Además de la DDC normal, ¿qué exige la R.12?","a":"Aprobación de la alta dirección, medidas razonables sobre origen del patrimonio y de los fondos, y monitoreo reforzado","o":["Aprobación de la alta dirección, medidas razonables sobre origen del patrimonio y de los fondos, y monitoreo reforzado","Monitoreo reforzado durante el cargo y cierre obligatorio de la cuenta un año después de que concluya su función pública","Aprobación de la alta dirección y de las demás medidas adicionales, pero sólo si la relación se califica de riesgo mayor","Aprobación del consejo de administración y reporte a la UIF de cada operación que el exministro realice en la cuenta"],"x":"Para PEP extranjeras, la R.12 exige siempre, además de la DDC normal, sistemas para detectarlas, aprobación de la alta dirección, medidas razonables sobre el origen del patrimonio y de los fondos, y monitoreo reforzado. Condicionar las medidas a un riesgo mayor corresponde a las PEP nacionales o de organismos internacionales.","ref":"R.12, incisos (a) a (d)","d":{"Monitoreo reforzado durante el cargo y cierre obligatorio de la cuenta un año después de que concluya su función pública":"La R.12 no obliga a cerrar la cuenta ni fija un año tras el cargo; exige aprobación, origen del patrimonio y fondos, y monitoreo reforzado.","Aprobación de la alta dirección y de las demás medidas adicionales, pero sólo si la relación se califica de riesgo mayor":"Condicionar las medidas a un riesgo mayor corresponde a las PEP nacionales o de organismos internacionales; con PEP extranjeras se aplican siempre.","Aprobación del consejo de administración y reporte a la UIF de cada operación que el exministro realice en la cuenta":"La R.12 pide aprobación de la alta dirección, no del consejo, y no exige reportar a la UIF cada operación."}},{"id":"G037","tema":"D","tipo":"caso","q":"Ahora el cliente es un senador de su propio país y la IF concluye que la relación no presenta riesgo mayor. Conforme a la R.12:","a":"Aplica la DDC normal; las medidas (b), (c) y (d) se exigen si la relación es de riesgo mayor","o":["Debe obtener siempre la aprobación de la alta dirección, igual que con una PEP extranjera","Aplica la DDC normal; las medidas (b), (c) y (d) se exigen si la relación es de riesgo mayor","Debe negar la relación, porque la R.12 no permite mantener cuentas de PEP nacionales","Debe aplicar DDC simplificada, porque las PEP nacionales se consideran de menor riesgo"],"x":"Para PEP nacionales, la R.12 pide medidas razonables para determinar su calidad y aplicar las medidas (b), (c) y (d) sólo en relaciones de riesgo mayor. A diferencia de las PEP extranjeras, la aprobación de la alta dirección no es automática.","ref":"R.12","d":{"Debe obtener siempre la aprobación de la alta dirección, igual que con una PEP extranjera":"La aprobación automática de la alta dirección es para PEP extranjeras; con PEP nacionales sólo aplica si la relación es de riesgo mayor.","Debe negar la relación, porque la R.12 no permite mantener cuentas de PEP nacionales":"La R.12 no prohíbe tener PEP nacionales como clientes; sólo exige medidas adicionales si el riesgo es mayor.","Debe aplicar DDC simplificada, porque las PEP nacionales se consideran de menor riesgo":"La R.12 no califica a las PEP nacionales como de menor riesgo; pide medidas razonables para identificarlas y evaluar su riesgo."}},{"id":"G038","tema":"D","tipo":"trampa","q":"¿Dónde se precisa que la definición de PEP no pretende abarcar a los funcionarios de rango medio o de menor jerarquía?","a":"En el Glosario general","o":["En el Glosario general","En el texto de la R.12","En la Nota interpretativa de la R.10","En la Nota interpretativa de la R.12"],"x":"La aclaración sobre mandos medios está en la definición de PEP del Glosario. La INR.12 sólo trata de los beneficiarios de pólizas de seguros de vida que resultan ser PEP.","ref":"Glosario (PEP)","d":{"En el texto de la R.12":"El texto de la R.12 regula las medidas para PEP, pero no define quién es PEP ni excluye a los mandos medios.","En la Nota interpretativa de la R.10":"La INR.10 trata de la DDC en general y no contiene la definición de PEP.","En la Nota interpretativa de la R.12":"La INR.12 sólo trata de los beneficiarios de pólizas de seguros de vida que resultan ser PEP."}},{"id":"G039","tema":"D","tipo":"caso","q":"El beneficiario de una póliza de seguro de vida resulta ser una PEP y la aseguradora identifica riesgos mayores. Según la Nota a la R.12, además de la DDC normal, debe:","a":"Informar a la alta dirección antes del pago y examinar a fondo toda la relación con el contratante","o":["Obtener autorización previa de la UIF y retener el pago hasta recibir su respuesta por escrito","Informar a la alta dirección antes del pago y examinar a fondo toda la relación con el contratante","Exigir al beneficiario que acredite que dejó su cargo público al menos un año antes de la fecha del pago","Congelar el pago sin demora y reportarlo a la autoridad como aplicación de sanciones financieras dirigidas"],"x":"La INR.12 pide, ante riesgos mayores, informar a la alta dirección antes del pago, examinar a fondo toda la relación con el contratante y considerar un reporte de operación sospechosa. No exige autorización de la UIF ni congelamiento, que es propio de las R.6 y R.7.","ref":"INR.12","d":{"Obtener autorización previa de la UIF y retener el pago hasta recibir su respuesta por escrito":"La INR.12 no exige autorización de la UIF ni retener el pago; pide informar a la alta dirección y considerar un reporte.","Exigir al beneficiario que acredite que dejó su cargo público al menos un año antes de la fecha del pago":"El estándar no prevé ningún plazo de un año fuera del cargo para pagar a una PEP.","Congelar el pago sin demora y reportarlo a la autoridad como aplicación de sanciones financieras dirigidas":"El congelamiento sin demora es propio de las sanciones financieras dirigidas de las R.6 y R.7, no de las PEP."}},{"id":"G040","tema":"D","tipo":"caso","q":"Un banco recibe una solicitud de corresponsalía de un banco que no tiene presencia física donde fue constituido (sólo un agente local) y que no pertenece a un grupo financiero regulado. Según la R.13:","a":"Debe rechazarla, porque la corresponsalía con bancos pantalla está prohibida","o":["Debe aceptarla con DDC reforzada y reportarla a la UIF como operación inusual","Debe rechazarla, porque la corresponsalía con bancos pantalla está prohibida","Puede aceptarla si el banco solicitante no ofrece cuentas de transferencia de pagos","Puede aceptarla con aprobación de la alta dirección y tras evaluar sus controles PLD/FT"],"x":"Según el Glosario, un banco sin presencia física en su país de constitución y no afiliado a un grupo supervisado es un banco pantalla, y la R.13 prohíbe iniciar o continuar corresponsalía con él. La aprobación de la alta dirección es un requisito para corresponsalías permitidas, no una forma de validar a un banco pantalla.","ref":"R.13; Glosario (banco pantalla)","d":{"Debe aceptarla con DDC reforzada y reportarla a la UIF como operación inusual":"La prohibición de la R.13 con bancos pantalla es absoluta; ninguna DDC reforzada ni reporte la convierte en una relación permitida.","Puede aceptarla si el banco solicitante no ofrece cuentas de transferencia de pagos":"La R.13 prohíbe iniciar o continuar la corresponsalía con bancos pantalla, ofrezcan o no cuentas de transferencia de pagos.","Puede aceptarla con aprobación de la alta dirección y tras evaluar sus controles PLD/FT":"La aprobación de la alta dirección es requisito para corresponsalías permitidas (inciso c), no una forma de validar a un banco pantalla."}},{"id":"G041","tema":"D","tipo":"memoria","q":"Respecto de las cuentas de transferencia de pagos (payable-through accounts), la R.13 pide al banco corresponsal estar satisfecho de que el banco respondiente:","a":"Aplicó DDC a los clientes con acceso directo y puede dar esa información si se le pide","o":["Reporta a la UIF del país del corresponsal cada operación realizada por sus propios clientes","Aplicó DDC a los clientes con acceso directo y puede dar esa información si se le pide","Obtuvo autorización de su supervisor antes de abrir cada subcuenta a nombre de sus clientes","Impide a sus clientes el acceso directo a las cuentas que mantiene en el banco corresponsal"],"x":"El inciso (e) de la R.13 exige que el respondiente haya aplicado DDC a los clientes con acceso directo a las cuentas del corresponsal y pueda proporcionar esa información a solicitud. Estas cuentas se definen justamente por el uso directo de terceros (INR.13), por lo que no se trata de impedirlo.","ref":"R.13, inciso (e); INR.13","d":{"Reporta a la UIF del país del corresponsal cada operación realizada por sus propios clientes":"La R.13 no exige reportar a la UIF cada operación; pide que el respondiente haya aplicado DDC y pueda proporcionarla a solicitud.","Obtuvo autorización de su supervisor antes de abrir cada subcuenta a nombre de sus clientes":"El estándar no prevé autorización del supervisor para cada subcuenta.","Impide a sus clientes el acceso directo a las cuentas que mantiene en el banco corresponsal":"Estas cuentas se definen justamente porque terceros las usan directamente (INR.13); la R.13 no pide impedir ese acceso."}},{"id":"G042","tema":"D","tipo":"caso","q":"Una empresa de remesas trabaja con 300 agentes que no tienen licencia ni registro propios ante una autoridad. Conforme a la R.14, ¿qué alternativa le permite cumplir?","a":"Mantener una lista vigente de sus agentes accesible a las autoridades competentes","o":["Exigir a cada agente una licencia bancaria completa antes de que pague remesas","Pedir a los agentes que apliquen DDC simplificada a todos los beneficiarios","Reportar a la UIF cada remesa pagada por sus agentes, sin importar el monto","Mantener una lista vigente de sus agentes accesible a las autoridades competentes"],"x":"La R.14 permite que los agentes tengan licencia o registro, o bien que el proveedor mantenga una lista vigente de agentes accesible a las autoridades. Además, debe incluirlos en sus programas PLD/FT y vigilar que cumplan.","ref":"R.14","d":{"Exigir a cada agente una licencia bancaria completa antes de que pague remesas":"La R.14 pide que el agente tenga licencia o registro ante una autoridad, no una licencia bancaria completa, y además ofrece la alternativa de la lista.","Pedir a los agentes que apliquen DDC simplificada a todos los beneficiarios":"La R.14 no menciona DDC simplificada; ésta sólo se permite cuando el riesgo es menor, no como alternativa a la licencia de los agentes.","Reportar a la UIF cada remesa pagada por sus agentes, sin importar el monto":"La R.14 no exige reportar cada remesa; el reporte de operaciones sospechosas es de la R.20 y depende de la sospecha, no del monto."}},{"id":"G043","tema":"D","tipo":"trampa","q":"Un banco ya autorizado, cuya licencia le permite prestar servicios de transferencia de dinero y que está sujeto a todas las obligaciones del GAFI, ¿requiere una licencia o registro separado como proveedor de estos servicios?","a":"No necesariamente: la Nota a la R.14 dice que el país no necesita imponerlo","o":["No, pero sólo si el banco no utiliza agentes para pagar las transferencias a sus clientes","Sí: el texto de la R.14 exige licencia o registro específico a todo proveedor, sin excepción","No necesariamente: la Nota a la R.14 dice que el país no necesita imponerlo","Sí, salvo que sus transferencias queden por debajo del umbral de minimis de USD/EUR 1,000"],"x":"La INR.14 aclara que el país no necesita imponer un sistema separado de licencia o registro a las IF ya autorizadas para prestar estos servicios y sujetas a todas las obligaciones aplicables. El texto de la R.14 exige licencia o registro, pero la excepción está en su Nota.","ref":"INR.14","d":{"No, pero sólo si el banco no utiliza agentes para pagar las transferencias a sus clientes":"La excepción de la INR.14 no depende de que el banco use o no agentes; depende de que ya tenga licencia y esté sujeto a todas las obligaciones.","Sí: el texto de la R.14 exige licencia o registro específico a todo proveedor, sin excepción":"El texto de la R.14 sí pide licencia o registro, pero la INR.14 admite la excepción para IF ya autorizadas.","Sí, salvo que sus transferencias queden por debajo del umbral de minimis de USD/EUR 1,000":"USD/EUR 1,000 es el umbral de minimis de las transferencias (INR.16) y el de PSAV (INR.15); no exime de licencia ni registro."}},{"id":"G044","tema":"D","tipo":"caso","q":"Un banco planea lanzar el próximo mes una aplicación de pagos basada en una tecnología nueva. Según la R.15, ¿cuándo debe evaluar los riesgos de LD/FT del producto?","a":"Antes del lanzamiento, y adoptar medidas para gestionarlos y mitigarlos","o":["Dentro de los seis meses posteriores al lanzamiento, con datos reales de uso","Sólo cuando el supervisor lo solicite durante una visita de inspección","En la siguiente evaluación anual de riesgos, junto con los demás productos","Antes del lanzamiento, y adoptar medidas para gestionarlos y mitigarlos"],"x":"La R.15 dice que, en el caso de las IF, la evaluación de riesgos debe hacerse antes del lanzamiento de nuevos productos, prácticas o tecnologías, con medidas para gestionar y mitigar esos riesgos. Esperar a tener datos reales de uso invierte el orden que exige el texto.","ref":"R.15","d":{"Dentro de los seis meses posteriores al lanzamiento, con datos reales de uso":"Invierte el orden: la R.15 exige evaluar antes del lanzamiento, no después con datos reales de uso.","Sólo cuando el supervisor lo solicite durante una visita de inspección":"La R.15 impone la evaluación como obligación de la IF antes del lanzamiento, no sólo cuando el supervisor la pida.","En la siguiente evaluación anual de riesgos, junto con los demás productos":"La R.15 pide evaluar antes del lanzamiento; esperar a la siguiente evaluación anual lo deja para después."}},{"id":"G045","tema":"D","tipo":"cifra","q":"Un proveedor de servicios de activos virtuales (PSAV) atiende a un cliente ocasional. Según la Nota a la R.15, ¿por encima de qué monto debe aplicar DDC?","a":"USD/EUR 1,000","o":["USD/EUR 3,000","USD/EUR 15,000","USD/EUR 10,000","USD/EUR 1,000"],"x":"La INR.15 fija en USD/EUR 1,000 el umbral de DDC para operaciones ocasionales de los PSAV. Es un umbral obligatorio para la DDC, a diferencia del umbral de minimis opcional de la INR.16, y distinto de los USD/EUR 15,000 de la R.10 para IF.","ref":"INR.15, párr. 7(a)","d":{"USD/EUR 3,000":"3,000 es el umbral de DDC de los casinos (INR.22/23), no el de los PSAV.","USD/EUR 15,000":"15,000 es el umbral de operaciones ocasionales de las IF en la R.10; la INR.15 lo baja a 1,000 para los PSAV.","USD/EUR 10,000":"El estándar no prevé un umbral de 10,000 en ninguna Recomendación ni Nota."}},{"id":"G046","tema":"D","tipo":"memoria","q":"Según la Nota a la R.15, ¿quién debe supervisar o monitorear a los PSAV en materia PLD/FT?","a":"Una autoridad competente, y no un organismo autorregulador","o":["Una autoridad competente, y no un organismo autorregulador","Los propios PSAV, mediante esquemas de autorregulación certificados","Un auditor externo acreditado, designado por cada PSAV cada año","Un organismo autorregulador del sector de activos virtuales"],"x":"La INR.15 dice que los PSAV deben ser supervisados o monitoreados por una autoridad competente (no por un organismo autorregulador), con supervisión basada en riesgo. Esto los distingue de ciertas APNFD, que sí pueden quedar a cargo de organismos autorreguladores (R.28).","ref":"INR.15, párr. 5","d":{"Los propios PSAV, mediante esquemas de autorregulación certificados":"La INR.15 exige una autoridad competente; la autorregulación no sustituye esa supervisión.","Un auditor externo acreditado, designado por cada PSAV cada año":"El estándar no prevé delegar la supervisión en un auditor externo; la INR.15 la asigna a una autoridad competente.","Un organismo autorregulador del sector de activos virtuales":"La INR.15 lo excluye expresamente («not a SRB»); los organismos autorreguladores sólo caben para ciertas APNFD (R.28)."}},{"id":"G047","tema":"D","tipo":"caso","q":"Un PSAV persona moral fue constituido en el país A y ofrece sus servicios a clientes en el país B. Según la Nota a la R.15, como mínimo debe tener licencia o registro en:","a":"El país A; el país B también puede exigírselo","o":["El país B, donde están sus clientes, y nunca en el país A","Ambos países, en todos los casos","El país A; el país B también puede exigírselo","Ningún país, si sólo intercambia unos activos virtuales por otros"],"x":"La INR.15 exige, como mínimo, licencia o registro en la jurisdicción donde se creó el PSAV, y permite que otras jurisdicciones donde ofrece servicios también lo exijan. El intercambio entre activos virtuales es una actividad de PSAV según el Glosario, así que no lo exime.","ref":"INR.15, párr. 3; Glosario (PSAV)","d":{"El país B, donde están sus clientes, y nunca en el país A":"Invierte la regla: el mínimo es donde se creó (país A); el país B sólo «puede» exigirlo además.","Ambos países, en todos los casos":"Convierte en obligación lo que la INR.15 deja como facultad: el país donde ofrece servicios «puede» exigir licencia, no debe.","Ningún país, si sólo intercambia unos activos virtuales por otros":"El Glosario incluye el intercambio entre activos virtuales como actividad de PSAV, así que también requiere licencia o registro."}},{"id":"G048","tema":"D","tipo":"trampa","q":"Con la revisión de junio de 2025, ¿cómo trata la Nota a la R.16 los USD/EUR 1,000 en las transferencias transfronterizas?","a":"Los países pueden adoptar un umbral de minimis no mayor a USD/EUR 1,000","o":["Sólo aplica a retiros de efectivo con tarjeta","Los países deben aplicar un umbral fijo de USD/EUR 1,000 a toda transferencia transfronteriza","Los países pueden adoptar un umbral de minimis no mayor a USD/EUR 1,000","Por debajo de USD/EUR 1,000 las transferencias no deben llevar información alguna del ordenante"],"x":"La INR.16 dice que los países «pueden» adoptar un umbral de minimis «no mayor a» USD/EUR 1,000, que es opcional y máximo. Aun por debajo del umbral, la transferencia debe llevar nombre y cuenta (o referencia única) del ordenante y del beneficiario, y ese umbral excluye expresamente los retiros de efectivo.","ref":"INR.16, párrs. 8 y 10","d":{"Sólo aplica a retiros de efectivo con tarjeta":"Es al revés: la INR.16 excluye los retiros de efectivo del umbral de minimis.","Los países deben aplicar un umbral fijo de USD/EUR 1,000 a toda transferencia transfronteriza":"Convierte en obligación fija lo que la INR.16 deja como opción («pueden») y como tope («no mayor a»).","Por debajo de USD/EUR 1,000 las transferencias no deben llevar información alguna del ordenante":"Aun por debajo del umbral, la INR.16 exige nombre y cuenta (o referencia única) del ordenante y del beneficiario."}},{"id":"G049","tema":"D","tipo":"memoria","q":"Cuando el ordenante de una transferencia transfronteriza por encima del umbral de minimis es una persona física, ¿qué dato suyo debe acompañar el mensaje, además del nombre, la cuenta y el domicilio?","a":"Su fecha de nacimiento, o sólo el año si no se tiene completa","o":["Su número de pasaporte vigente y todas sus nacionalidades","Su ocupación y el origen de los recursos que está transfiriendo","Su identificador fiscal y el propósito declarado de la operación","Su fecha de nacimiento, o sólo el año si no se tiene completa"],"x":"La INR.16 exige la fecha de nacimiento del ordenante persona física, y basta el año si no se cuenta con la fecha completa. Los identificadores (BIC, LEI o identificador oficial único) se piden para personas morales, y el origen de los recursos no forma parte del mensaje.","ref":"INR.16, párr. 9(d) y nota al pie 55","d":{"Su número de pasaporte vigente y todas sus nacionalidades":"La INR.16 no pide pasaporte ni nacionalidades; para persona física pide la fecha de nacimiento.","Su ocupación y el origen de los recursos que está transfiriendo":"Ni la ocupación ni el origen de los recursos forman parte de la información que acompaña la transferencia (INR.16, párr. 9).","Su identificador fiscal y el propósito declarado de la operación":"Los identificadores (BIC, LEI o identificador oficial único) se piden a personas morales, y el propósito no está en la lista del párr. 9."}},{"id":"G050","tema":"D","tipo":"cifra","q":"Una transferencia nacional llegó sólo con el número de cuenta del ordenante, porque la información completa puede obtenerse por otros medios. La IF beneficiaria la solicita. Según la Nota a la R.16, la IF ordenante debe entregarla:","a":"Dentro de los tres días hábiles siguientes a la solicitud","o":["Dentro de los tres días hábiles siguientes a la solicitud","Dentro de las 24 horas naturales siguientes a la solicitud","Dentro de los cinco días hábiles siguientes a la solicitud","Dentro de los 30 días naturales siguientes a la solicitud"],"x":"La INR.16 dispone que la IF ordenante entregue la información dentro de los tres días hábiles siguientes a la solicitud de la IF beneficiaria, de la intermediaria o de las autoridades. Las autoridades del orden público, en cambio, deben poder exigir su entrega inmediata.","ref":"INR.16, párrs. 11 y 12","d":{"Dentro de las 24 horas naturales siguientes a la solicitud":"Confunde con la entrega «inmediata» que pueden exigir las autoridades del orden público; para la IF el plazo es de tres días hábiles.","Dentro de los cinco días hábiles siguientes a la solicitud":"El estándar no prevé cinco días hábiles; la INR.16 fija tres días hábiles.","Dentro de los 30 días naturales siguientes a la solicitud":"El estándar no prevé 30 días naturales; la INR.16 fija tres días hábiles."}},{"id":"G051","tema":"D","tipo":"memoria","q":"Cuando un país permite que las IF se apoyen en terceros para realizar elementos de la DDC, la R.17 establece que la responsabilidad última de esas medidas recae en:","a":"La IF que se apoya en el tercero","o":["La IF que se apoya en el tercero","Ambas instituciones, en la proporción que pacten por contrato","El supervisor del tercero","El tercero que aplicó la DDC originalmente al cliente"],"x":"La R.17 dice que, cuando se permite el apoyo en terceros, la responsabilidad última de la DDC permanece en la IF que se apoya en el tercero. Además, la R.17 usa un modal permisivo: los países «podrán» permitirlo.","ref":"R.17","d":{"Ambas instituciones, en la proporción que pacten por contrato":"La R.17 no permite repartir la responsabilidad por contrato: permanece en la IF que se apoya en el tercero.","El supervisor del tercero":"La R.17 no traslada la responsabilidad al supervisor del tercero; sólo pide que el tercero esté regulado y supervisado.","El tercero que aplicó la DDC originalmente al cliente":"Invierte la regla: aunque el tercero aplicó la DDC, la responsabilidad última queda en la IF que se apoya en él."}},{"id":"G052","tema":"D","tipo":"trampa","q":"Una IF contrata a un despacho para que aplique la DDC en su nombre, con los procedimientos de la IF y bajo su control. ¿Se rige esta relación por la R.17?","a":"No: la Nota a la R.17 excluye la subcontratación y las relaciones de agencia","o":["No: la Nota a la R.17 excluye la subcontratación y las relaciones de agencia","Sí: es el caso típico de apoyo en terceros que regula el texto de la R.17","Sólo si el despacho forma parte del mismo grupo financiero que la IF","Sí, siempre que el despacho esté ubicado en un país de riesgo bajo"],"x":"La INR.17 aclara que la R.17 no se aplica a la subcontratación ni a las relaciones de agencia, en las que el tercero aplica los procedimientos de la IF bajo su control. En el apoyo en terceros, el tercero usa sus propios procedimientos y suele tener una relación independiente con el cliente.","ref":"INR.17, párr. 1","d":{"Sí: es el caso típico de apoyo en terceros que regula el texto de la R.17":"Es justo lo contrario: con procedimientos de la IF y bajo su control es subcontratación, que la INR.17 excluye de la R.17.","Sólo si el despacho forma parte del mismo grupo financiero que la IF":"La pertenencia al grupo flexibiliza criterios del apoyo en terceros (R.17), pero no convierte la subcontratación en apoyo en terceros.","Sí, siempre que el despacho esté ubicado en un país de riesgo bajo":"El riesgo país es un criterio para el apoyo en terceros (R.17, inciso d), no un factor que haga aplicable la R.17 a la subcontratación."}},{"id":"G053","tema":"D","tipo":"memoria","q":"El consejo de un banco aprobó un documento con políticas, procedimientos y controles, un programa continuo de capacitación del personal y una función de auditoría independiente para probar el sistema. ¿Qué recomendación desarrolla estos elementos?","a":"R.18 (Controles internos y sucursales y filiales extranjeras)","o":["R.26 (Regulación y supervisión de instituciones financieras)","R.1 (Evaluación de riesgos y enfoque basado en riesgo)","R.18 (Controles internos y sucursales y filiales extranjeras)","R.34 (Guía y retroalimentación)"],"x":"Esos tres elementos (políticas, procedimientos y controles; capacitación continua; auditoría independiente) integran los programas PLD/FT de la R.18 y su Nota. La R.26 trata de la regulación y supervisión por parte de las autoridades, no del programa interno de la IF.","ref":"R.18; INR.18, párr. 1","d":{"R.26 (Regulación y supervisión de instituciones financieras)":"La R.26 trata de la regulación y supervisión que hacen las autoridades, no del programa interno de la IF.","R.1 (Evaluación de riesgos y enfoque basado en riesgo)":"La R.1 trata de la evaluación de riesgos y el enfoque basado en riesgo, no de los tres componentes del programa PLD/FT.","R.34 (Guía y retroalimentación)":"La R.34 trata de las guías y retroalimentación que dan las autoridades, no del programa interno de la IF."}},{"id":"G054","tema":"D","tipo":"memoria","q":"Según la Nota a la R.18, los arreglos de gestión del cumplimiento deben incluir:","a":"La designación de un oficial de cumplimiento a nivel directivo","o":["La contratación de un auditor externo certificado por el supervisor","La designación de un oficial de cumplimiento a nivel directivo","Un comité de cumplimiento integrado sólo por consejeros independientes","Un oficial de cumplimiento que dependa jerárquicamente de la UIF"],"x":"La INR.18 dice que los arreglos de gestión del cumplimiento deben incluir la designación de un oficial de cumplimiento a nivel directivo. La auditoría que exige es una función independiente para probar el sistema, no un auditor certificado por el supervisor.","ref":"INR.18, párr. 3","d":{"La contratación de un auditor externo certificado por el supervisor":"La INR.18 pide una función de auditoría independiente para probar el sistema, no un auditor certificado por el supervisor.","Un comité de cumplimiento integrado sólo por consejeros independientes":"El estándar no prevé un comité de consejeros independientes; la INR.18 pide un oficial de cumplimiento a nivel directivo.","Un oficial de cumplimiento que dependa jerárquicamente de la UIF":"El estándar no prevé que el oficial dependa de la UIF; es parte de los arreglos internos de gestión del cumplimiento."}},{"id":"G055","tema":"D","tipo":"caso","q":"La filial de un grupo financiero opera en un país anfitrión con requisitos PLD/FT menos estrictos que los del país de origen, y la ley local impide aplicar algunas medidas del país de origen. Según la Nota a la R.18, el grupo debe:","a":"Aplicar medidas adicionales para gestionar el riesgo e informar a su supervisor de origen","o":["Cerrar de inmediato la filial, sin posibilidad de aplicar medidas adicionales previas","Aplicar medidas adicionales para gestionar el riesgo e informar a su supervisor de origen","Limitarse a las exigencias del país anfitrión, porque rige el principio de territorialidad","Aplicar las normas del país de origen aunque lo prohíban las leyes del país anfitrión"],"x":"La INR.18 pide aplicar los requisitos del país de origen en la medida en que lo permita la ley del anfitrión; si no lo permite, aplicar medidas adicionales e informar al supervisor de origen. El cierre es una acción que el supervisor de origen puede considerar después, si las medidas adicionales no bastan.","ref":"INR.18, párr. 5","d":{"Cerrar de inmediato la filial, sin posibilidad de aplicar medidas adicionales previas":"El cierre lo considera después el supervisor de origen si las medidas adicionales no bastan; no es el primer paso (INR.18, párr. 5).","Limitarse a las exigencias del país anfitrión, porque rige el principio de territorialidad":"La INR.18 pide aplicar los requisitos del país de origen en la medida en que lo permita la ley del anfitrión, no limitarse a este.","Aplicar las normas del país de origen aunque lo prohíban las leyes del país anfitrión":"La INR.18 condiciona los requisitos de origen a lo que permita la ley del anfitrión; si no lo permite, se aplican medidas adicionales."}},{"id":"G056","tema":"D","tipo":"caso","q":"El GAFI hace un llamado a aplicar debida diligencia reforzada respecto de cierto país. Un banco recibe instrucciones de pago de una empresa constituida en ese país. Conforme a la R.19, el banco:","a":"Debe aplicar DDC reforzada, eficaz y proporcional a los riesgos","o":["Sólo debe presentar a la UIF un reporte de operación sospechosa por cada pago","Debe aplicar DDC reforzada, eficaz y proporcional a los riesgos","Puede decidir libremente si refuerza la DDC, según su apetito de riesgo","Debe rechazar toda operación con personas de ese país, sin excepción"],"x":"La R.19 obliga a aplicar DDC reforzada, eficaz y proporcional a los riesgos, a las relaciones y operaciones con personas de países respecto de los cuales el GAFI lo pide. No es opcional (INR.10, nota al pie 44) ni equivale a prohibir todas las operaciones.","ref":"R.19","d":{"Sólo debe presentar a la UIF un reporte de operación sospechosa por cada pago":"La R.19 exige DDC reforzada; el reporte de la R.20 depende de una sospecha, no de cada pago con ese país.","Puede decidir libremente si refuerza la DDC, según su apetito de riesgo":"La R.19 dice «should be required»: la DDC reforzada es obligatoria, no a criterio del apetito de riesgo.","Debe rechazar toda operación con personas de ese país, sin excepción":"Limitar operaciones es una posible contramedida del país (INR.19, párr. 2(e)), no una prohibición automática que imponga la R.19 al banco."}},{"id":"G057","tema":"D","tipo":"memoria","q":"Además de hacerlo cuando el GAFI lo pida, la R.19 establece que los países deben poder aplicar contramedidas:","a":"De manera independiente, sin que medie un llamado del GAFI","o":["Sólo cuando lo autorice una resolución del Consejo de Seguridad","Sólo cuando lo solicite el organismo regional al estilo del GAFI","Sólo después de una evaluación mutua con resultados deficientes","De manera independiente, sin que medie un llamado del GAFI"],"x":"La R.19 dice que los países deben poder aplicar contramedidas cuando el GAFI lo pida y también de manera independiente, siempre de forma eficaz y proporcional a los riesgos. No se condiciona a resoluciones de la ONU ni a evaluaciones mutuas.","ref":"R.19; INR.19, párr. 2","d":{"Sólo cuando lo autorice una resolución del Consejo de Seguridad":"Las resoluciones del Consejo de Seguridad son la base de las sanciones financieras dirigidas (R.6 y R.7), no de las contramedidas de la R.19.","Sólo cuando lo solicite el organismo regional al estilo del GAFI":"La R.19 no menciona a los organismos regionales al estilo del GAFI como detonante de contramedidas.","Sólo después de una evaluación mutua con resultados deficientes":"La R.19 no condiciona las contramedidas a una evaluación mutua; pueden aplicarse de manera independiente."}},{"id":"G058","tema":"D","tipo":"trampa","q":"Un cliente intenta depositar USD 300 con indicios claros de que provienen de una extorsión y se retira cuando le piden identificación. ¿Qué exige el GAFI y dónde se precisa?","a":"Reportarla aunque no se concretó ni importe el monto; lo precisa la Nota a la R.20","o":["Reportarla aunque no se concretó ni importe el monto; lo precisa el texto de la R.20","Reportarla sólo si supera el umbral de USD/EUR 15,000; lo fija el texto de la R.10","Reportarla aunque no se concretó ni importe el monto; lo precisa la Nota a la R.20","No reportarla, porque la R.20 sólo abarca las operaciones efectivamente realizadas"],"x":"El texto de la R.20 obliga a reportar con prontitud las sospechas; la precisión de que se reportan también las operaciones intentadas y sin importar el monto está en la INR.20. El distractor más tentador dice lo mismo, pero lo ubica en el texto de la Recomendación.","ref":"INR.20, párr. 3","d":{"Reportarla aunque no se concretó ni importe el monto; lo precisa el texto de la R.20":"Lo de operaciones intentadas y sin importar el monto está en la Nota (INR.20, párr. 3), no en el texto de la R.20.","Reportarla sólo si supera el umbral de USD/EUR 15,000; lo fija el texto de la R.10":"15,000 es el umbral de DDC para operaciones ocasionales de la R.10; el reporte de sospechas no tiene umbral.","No reportarla, porque la R.20 sólo abarca las operaciones efectivamente realizadas":"La INR.20 incluye expresamente las operaciones intentadas."}},{"id":"G059","tema":"D","tipo":"memoria","q":"Según la R.20, si una IF sospecha o tiene motivos razonables para sospechar que ciertos fondos son producto de una actividad delictiva o se relacionan con el FT, debe:","a":"Reportar con prontitud su sospecha a la UIF, por obligación establecida en ley","o":["Terminar la relación y explicar al cliente el motivo por el que se cierra su cuenta","Congelar sin demora los fondos y notificarlo al Consejo de Seguridad de la ONU","Reportar con prontitud su sospecha a la UIF, por obligación establecida en ley","Informar a su supervisor financiero en la siguiente visita de inspección ordinaria"],"x":"La R.20 exige, por ley, reportar con prontitud la sospecha a la UIF. El congelamiento sin demora corresponde a las sanciones financieras dirigidas (R.6 y R.7), y explicar al cliente el motivo violaría la prohibición de revelar (R.21).","ref":"R.20","d":{"Terminar la relación y explicar al cliente el motivo por el que se cierra su cuenta":"Explicar al cliente el motivo podría violar la prohibición de revelar (R.21); la R.20 exige reportar a la UIF.","Congelar sin demora los fondos y notificarlo al Consejo de Seguridad de la ONU":"El congelamiento sin demora es de las sanciones financieras dirigidas (R.6 y R.7), no la respuesta a una sospecha de la R.20.","Informar a su supervisor financiero en la siguiente visita de inspección ordinaria":"La R.20 exige reportar «con prontitud» a la UIF, no al supervisor ni en la siguiente inspección."}},{"id":"G060","tema":"D","tipo":"trampa","q":"Un país no tiene una obligación expresa de reportar operaciones sospechosas y argumenta que sus bancos reportan para evitar ser procesados por LD. Según la Nota a la R.20, esto:","a":"No es aceptable: la obligación de reportar debe ser directa y obligatoria","o":["Es aceptable si en la práctica los bancos reportan con prontitud a la UIF","Es aceptable siempre que la UIF emita guías y retroalimentación a los bancos","Es aceptable si se complementa con reportes obligatorios de operaciones en efectivo","No es aceptable: la obligación de reportar debe ser directa y obligatoria"],"x":"La INR.20 exige que el reporte sea una obligación directa y obligatoria, y rechaza el llamado «reporte indirecto», motivado por el temor a ser procesado. Que los bancos reporten en la práctica no subsana la falta de la obligación legal.","ref":"INR.20, párr. 4","d":{"Es aceptable si en la práctica los bancos reportan con prontitud a la UIF":"Es exactamente el «reporte indirecto» que la INR.20 declara inaceptable, aunque en la práctica se reporte.","Es aceptable siempre que la UIF emita guías y retroalimentación a los bancos":"Las guías y la retroalimentación son de la R.34; no sustituyen la obligación directa de reportar.","Es aceptable si se complementa con reportes obligatorios de operaciones en efectivo":"Los reportes de efectivo son información adicional que puede pedir la ley nacional (INR.29); no reemplazan el reporte de sospechas."}},{"id":"G061","tema":"D","tipo":"caso","q":"Un analista de una IF sospecha que los fondos de un cliente provienen de un delito fiscal, aunque no tiene pruebas ni conoce el monto defraudado. Conforme a la R.20 y el Glosario, ¿surge la obligación de reportar?","a":"Sí, porque los delitos fiscales están entre las categorías de delitos designadas","o":["No, porque los delitos fiscales quedan fuera de los delitos precedentes del GAFI","Sólo si el monto supera el umbral de USD/EUR 15,000 previsto en la R.10","Sí, porque los delitos fiscales están entre las categorías de delitos designadas","No, porque debe tener certeza del delito y del monto defraudado antes de reportar"],"x":"La R.20 se activa con la sospecha, no con la certeza, y la «actividad delictiva» remite a los delitos precedentes; el Glosario incluye los delitos fiscales entre las categorías de delitos designadas. La R.21 protege incluso a quien no conocía con precisión el delito subyacente.","ref":"R.20; INR.20, párr. 1; Glosario (categorías de delitos designadas)","d":{"No, porque los delitos fiscales quedan fuera de los delitos precedentes del GAFI":"El Glosario incluye los delitos fiscales (directos e indirectos) entre las categorías de delitos designadas.","Sólo si el monto supera el umbral de USD/EUR 15,000 previsto en la R.10":"15,000 es el umbral de DDC de la R.10; el reporte de sospechas va sin importar el monto (INR.20).","No, porque debe tener certeza del delito y del monto defraudado antes de reportar":"La R.20 se activa con sospecha o motivos razonables para sospechar, no con certeza; la R.21 protege aun sin conocer el delito con precisión."}},{"id":"G062","tema":"D","tipo":"memoria","q":"Según la nota sobre la base legal de los requisitos para IF, APNFD y PSAV, ¿qué recomendaciones contienen requisitos específicos que deben establecerse en ley?","a":"R.10, R.11 y R.20","o":["R.10, R.12 y R.21","R.11, R.16 y R.20","R.18, R.20 y R.22","R.10, R.11 y R.20"],"x":"La nota sobre la base legal remite a los requisitos específicos de ley de las R.10, 11 y 20; lo demás puede estar en ley o en medios coercitivos. En la R.10 debe constar en ley el principio de aplicar DDC (las obligaciones concretas pueden ir en medios coercitivos); en la R.11, la obligación de conservar registros de operaciones e información de DDC; y en la R.20, la obligación de reportar.","ref":"Nota sobre la base legal, párr. 1; R.10; R.11; R.20","d":{"R.10, R.12 y R.21":"Sólo la R.10 es correcta; la R.12 y la R.21 no figuran en la nota sobre la base legal.","R.11, R.16 y R.20":"Acierta la R.11 y la R.20, pero la R.16 no figura en la nota sobre la base legal; falta la R.10.","R.18, R.20 y R.22":"Sólo la R.20 es correcta; la R.18 y la R.22 pueden establecerse en ley o en medios coercitivos."}},{"id":"G063","tema":"D","tipo":"caso","q":"Una oficial de cumplimiento reportó de buena fe a la UIF una operación; después se comprobó que no hubo delito. El cliente la demanda por violar la cláusula de confidencialidad de su contrato. Según la R.21:","a":"Está protegida por ley frente a la responsabilidad penal y civil, aunque no haya habido delito","o":["Está protegida sólo si identificó con precisión cuál era el delito precedente involucrado","Responde en la vía civil por el incumplimiento contractual, aunque no en la vía penal","Está protegida por ley frente a la responsabilidad penal y civil, aunque no haya habido delito","Es responsable, porque la protección legal sólo opera cuando el delito llega a comprobarse"],"x":"La R.21 protege por ley, frente a la responsabilidad penal y civil, a quien reporta de buena fe a la UIF, aunque no supiera con precisión cuál era la actividad delictiva y sin importar si esta ocurrió realmente. La protección cubre ambas vías, no sólo la penal.","ref":"R.21, inciso (a)","d":{"Está protegida sólo si identificó con precisión cuál era el delito precedente involucrado":"La R.21 protege «aunque no supiera con precisión» cuál era la actividad delictiva subyacente.","Responde en la vía civil por el incumplimiento contractual, aunque no en la vía penal":"La R.21 protege frente a la responsabilidad penal y también civil, incluida la derivada de restricciones contractuales.","Es responsable, porque la protección legal sólo opera cuando el delito llega a comprobarse":"La R.21 protege «sin importar si la actividad ilícita ocurrió realmente»."}},{"id":"G064","tema":"D","tipo":"caso","q":"La sucursal de un banco comparte con la función de cumplimiento del grupo el hecho de que presentó un reporte de operación sospechosa sobre un cliente común. ¿Viola esto la p
