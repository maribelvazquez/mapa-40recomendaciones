egal. Esa salvedad no incluye el secreto bancario, y la R.37 no tiene Nota interpretativa que lo exceptúe.","ref":"R.37, inciso (d)"},{"id":"G313","tema":"G","tipo":"caso","q":"El país A obtuvo una orden de decomiso sin condena sobre un inmueble ubicado en el país B, porque el presunto responsable murió antes del juicio. B responde que sólo coopera con decomisos basados en una condena. Según la Nota a la R.38, B:","a":"Debe poder asistir, al menos cuando el responsable no está disponible por muerte, fuga o ausencia, en la medida compatible con sus principios fundamentales","o":["Puede negarse, porque la R.38 y su Nota sólo abarcan las órdenes de decomiso derivadas de una sentencia condenatoria firme en el país requirente","Debe poder asistir, al menos cuando el responsable no está disponible por muerte, fuga o ausencia, en la medida compatible con sus principios fundamentales","Debe exigir que A obtenga antes una condena en rebeldía, porque el decomiso sin condena sólo opera en el ámbito interno regulado por la R.4","Sólo puede congelar el inmueble como medida provisional, pero nunca ejecutar un decomiso sin condena que haya sido ordenado por otro país"],"x":"La INR.38, párr. 1, incluye las solicitudes basadas en decomiso con y sin condena, como en la R.4, y su nota al pie 93 exige, como mínimo, poder asistir cuando el responsable no está disponible por muerte, fuga o ausencia, o es desconocido, en la medida compatible con los principios fundamentales del derecho interno. El texto de la R.38 no distingue el tipo de decomiso; la precisión está en su Nota.","ref":"INR.38, párr. 1 y nota al pie 93"},{"id":"G314","tema":"G","tipo":"trampa","q":"¿Dónde se precisa que los países deben poder compartir bienes decomisados con otros países, en particular cuando el decomiso resulta de acciones coordinadas de las autoridades de orden público, y acordar, cuando proceda, cómo descontar o compartir costos sustanciales o extraordinarios?","a":"En la Nota interpretativa a la R.38, dedicada a congelamiento y decomiso","o":["En el texto de la R.38, que detalla las acciones coordinadas y los costos","En la Nota interpretativa a la R.4, junto con la devolución a propietarios","En la Nota interpretativa a la R.38, dedicada a congelamiento y decomiso","En la Nota interpretativa a la R.40, sobre autoridades de orden público"],"x":"La precisión sobre compartir bienes, en particular tras acciones coordinadas, y sobre los costos sustanciales o extraordinarios está en la INR.38, párr. 6. El texto de la R.38 sólo dice «compartir o devolver» los bienes decomisados, sin esos detalles; la INR.4, párr. 17, habla de devolver bienes a sus legítimos propietarios o compensar a las víctimas, no de compartirlos con otros países.","ref":"INR.38, párr. 6; R.38; INR.4, párr. 17"},{"id":"G315","tema":"G","tipo":"memoria","q":"La obligación de contar con medidas que permitan reconocer y ejecutar órdenes extranjeras de congelamiento, incautación o decomiso corresponde a:","a":"R.38 · Asistencia legal mutua: congelamiento y decomiso","o":["Nota interpretativa a la R.4 · Decomiso y medidas provisionales","R.40 · Otras formas de cooperación internacional","Nota interpretativa a la R.37 · Asistencia legal mutua","R.38 · Asistencia legal mutua: congelamiento y decomiso"],"x":"La R.38 pide que las medidas permitan reconocer y ejecutar órdenes extranjeras de congelamiento, incautación o decomiso; es el espejo internacional de la R.4, que regula las facultades internas. La R.37 no tiene Nota interpretativa y la R.40 cubre otras formas de cooperación distintas de la asistencia legal mutua.","ref":"R.38; R.4"},{"id":"G316","tema":"G","tipo":"trampa","q":"¿Dónde se establece que los países deben contar con mecanismos simplificados de extradición, como la transmisión directa de solicitudes de detención provisional y la extradición simplificada de quien renuncia al procedimiento formal?","a":"En el texto de la R.39, conforme a los principios fundamentales del derecho interno","o":["En el texto de la R.39, conforme a los principios fundamentales del derecho interno","En la Nota interpretativa a la R.38, junto con la ejecución de órdenes extranjeras","En la Nota interpretativa a la R.39, que desarrolla los procedimientos simplificados","En la Nota interpretativa a la R.40, en la cooperación entre autoridades de orden público"],"x":"Los mecanismos simplificados de extradición están en el texto de la R.39, «de conformidad con los principios fundamentales del derecho interno». La R.39 no tiene Nota interpretativa, y las Notas a las R.38 y R.40 no tratan la extradición.","ref":"R.39"},{"id":"G317","tema":"G","tipo":"caso","q":"El país A pide al país B extraditar a Óscar por LD. B exige doble incriminación. En B la conducta sí es delito, pero tiene otro nombre y está en otro capítulo de su código penal. La defensa de Óscar pide negar la extradición por esa diferencia. Según la R.39:","a":"El requisito se tiene por satisfecho, porque ambos países tipifican la conducta subyacente","o":["Procede negarla, porque el delito debe tener la misma denominación y categoría en ambos países","Procede concederla sin revisar la doble incriminación, porque la extradición no es coercitiva","Procede negarla, salvo que la Nota interpretativa a la R.39 amplíe la definición de LD","El requisito se tiene por satisfecho, porque ambos países tipifican la conducta subyacente"],"x":"La R.39 dice que, cuando se exija doble incriminación para extraditar, el requisito se tiene por satisfecho aunque los países ubiquen o nombren distinto el delito, siempre que ambos tipifiquen la conducta subyacente. La regla de prestar ayuda sin doble incriminación cuando no hay acciones coercitivas es de la R.37 (asistencia legal mutua), no de la extradición, y la R.39 no tiene Nota.","ref":"R.39"},{"id":"G318","tema":"G","tipo":"memoria","q":"¿Qué recomendación pide asegurar que el LD y el FT sean delitos extraditables y no ofrecer refugios seguros a personas acusadas de FT, actos terroristas u organizaciones terroristas?","a":"R.39 · Extradición","o":["R.39 · Extradición","R.5 · Delito de financiamiento al terrorismo","R.37 · Asistencia legal mutua","R.6 · Sanciones financieras dirigidas: terrorismo y FT"],"x":"La R.39, inciso (a), pide que el LD y el FT sean delitos extraditables, y su párrafo inicial pide no dar refugio seguro a personas acusadas de FT, actos terroristas u organizaciones terroristas. La R.5 obliga a tipificar el FT, pero no regula la extradición.","ref":"R.39, párrafo inicial e inciso (a)"},{"id":"G319","tema":"G","tipo":"caso","q":"La UIF del país A pide a la UIF del país B información sobre la empresa Tornavía. En B ya existe una investigación penal abierta sobre esa misma empresa. Según la Nota a la R.40, B:","a":"No debe negarse por ese solo motivo, salvo que la asistencia obstaculice esa investigación","o":["Debe negarse siempre, porque compartir información pondría en riesgo la investigación abierta","Puede negarse sin más, porque la Nota a la R.40 sólo prohíbe negarse por asuntos fiscales o secreto","No debe negarse por ese solo motivo, salvo que la asistencia obstaculice esa investigación","Debe remitirla a asistencia legal mutua, porque la R.40 no aplica si hay investigaciones abiertas"],"x":"La INR.40, párr. 2(c), prohíbe negar la asistencia porque haya una investigación o procedimiento en curso en el país requerido, salvo que la asistencia lo obstaculice. La misma lista incluye, además de los asuntos fiscales y el secreto de IF o APNFD, la distinta naturaleza de la contraparte, así que no se limita a esos dos motivos.","ref":"INR.40, párr. 2(c)"},{"id":"G320","tema":"G","tipo":"trampa","q":"¿Dónde se establece que la información intercambiada en la cooperación internacional sólo debe usarse para el fin con que se pidió, y que difundirla a otras autoridades o terceros requiere autorización previa de la autoridad requerida?","a":"En la Nota interpretativa a la R.40, entre las salvaguardas de la información","o":["En la Nota interpretativa a la R.40, entre las salvaguardas de la información","En la R.37, inciso (e), que regula la autorización previa para difundirla","En el texto de la R.40, que detalla usos permitidos y la autorización previa","En la Nota interpretativa a la R.39, sobre el manejo de solicitudes de extradición"],"x":"La limitación de uso y la autorización previa para difundir están en la INR.40, párr. 3. El texto de la R.40 sólo pide procesos para resguardar la información recibida, sin esos detalles; la R.37, inciso (e), trata la confidencialidad de las solicitudes de asistencia legal mutua, y la R.39 no tiene Nota.","ref":"INR.40, párr. 3; R.40"},{"id":"G321","tema":"G","tipo":"caso","q":"El supervisor financiero del país A necesita información que conserva la UIF del país B; no son autoridades homólogas. Según la Nota a la R.40:","a":"Deben permitir el intercambio indirecto; quien pide debe aclarar el fin y por cuenta de quién lo hace","o":["No procede ningún intercambio, porque la Nota a la R.40 sólo regula la cooperación entre autoridades homólogas","Deben permitir el intercambio directo; el indirecto sólo se alienta cuando proceda","Sólo procede si la UIF de B obtiene una orden judicial y canaliza la información por asistencia legal mutua","Deben permitir el intercambio indirecto; quien pide debe aclarar el fin y por cuenta de quién lo hace"],"x":"La INR.40, párr. 21, dice que los países deben permitir el intercambio indirecto con autoridades no homólogas, y que la autoridad que pide siempre debe aclarar el fin y por cuenta de quién lo hace. El intercambio directo con no homólogas sólo «se alienta» (párr. 22): la opción que invierte los modales es falsa.","ref":"INR.40, párrs. 21 y 22"},{"id":"G401","tema":"F","tipo":"caso","q":"El supervisor financiero de un país inspecciona a todos los bancos con la misma frecuencia e intensidad, sin atender a su perfil de riesgo. Según la Nota interpretativa a la R.26, la frecuencia e intensidad de la supervisión deben basarse en:","a":"Los riesgos de LD/FT, las políticas y controles de cada IF o grupo según su perfil de riesgo y los del país","o":["El análisis estratégico que la UIF le disemine sobre tendencias y patrones, como fija la Nota a la R.29","El tamaño de los activos de cada IF, criterio que el texto de la R.26 fija para las sujetas a los Principios Básicos","Los riesgos de LD/FT, las políticas y controles de cada IF o grupo según su perfil de riesgo y los del país","Un calendario idéntico para todas las IF, porque la Nota a la R.26 exige igualdad de trato entre supervisadas"],"x":"La INR.26 pide que la frecuencia e intensidad de la supervisión in situ y extra situ se basen en los riesgos de LD/FT, en las políticas, controles y procedimientos de la IF o grupo según el perfil de riesgo que evalúa el supervisor, y en los riesgos del país. El análisis estratégico es una función de la UIF que describe la INR.29, no un criterio para programar la supervisión.","ref":"INR.26, párr. 2"},{"id":"G402","tema":"F","tipo":"trampa","q":"La regla de que los supervisores financieros cuenten con recursos financieros, humanos y técnicos adecuados, y con independencia operativa y autonomía suficientes para estar libres de influencia o interferencia indebida, ¿dónde se establece?","a":"En la Nota interpretativa a la R.26, en su apartado sobre recursos","o":["En la Nota interpretativa a la R.26, en su apartado sobre recursos","En el texto de la R.27, junto a las facultades del supervisor","En la Nota interpretativa a la R.29, sobre la independencia operativa","En el texto de la R.26, junto a la prohibición de bancos pantalla"],"x":"El párrafo 6 de la INR.26 exige recursos adecuados e independencia operativa y autonomía para los supervisores financieros. La INR.29 también habla de independencia operativa, pero de la UIF, no del supervisor; y la R.27, que no tiene Nota, se limita a las facultades.","ref":"INR.26, párr. 6"},{"id":"G403","tema":"F","tipo":"caso","q":"Unos inversionistas piden al país Gamma licencia para un banco que se constituirá ahí, donde sólo tendrá un agente local y personal de bajo nivel, sin afiliación a un grupo financiero regulado sujeto a supervisión consolidada efectiva. Según la R.26, Gamma debe:","a":"No aprobar su establecimiento ni su operación continua, por tratarse de un banco pantalla","o":["Aprobarlo si el agente local aplica debida diligencia reforzada a todos los clientes del banco","Aprobarlo y exigir a sus bancos corresponsales que lo monitoreen conforme al texto de la R.13","Aprobarlo como IF sujeta a los Principios Básicos, con supervisión consolidada de grupo","No aprobar su establecimiento ni su operación continua, por tratarse de un banco pantalla"],"x":"Sin mente y dirección significativas en el país y sin afiliación a un grupo regulado, es un banco pantalla (Glosario: un agente local o personal de bajo nivel no constituye presencia física), y la R.26 dice que los países no deben aprobar su establecimiento ni su operación continua. La R.13 no permite monitorearlo: prohíbe a las IF entrar o seguir en relaciones de corresponsalía con bancos pantalla.","ref":"R.26; Glosario (banco pantalla); R.13"},{"id":"G404","tema":"F","tipo":"trampa","q":"De las siguientes afirmaciones sobre el enfoque basado en riesgo, ¿cuál proviene de la Nota interpretativa a la R.26 y NO del texto de la R.1?","a":"El supervisor, según su comprensión de los riesgos, asigna sus recursos a la supervisión PLD/FT","o":["Los países deben identificar, evaluar y entender sus riesgos de LD/FT y designar un mecanismo coordinador","El supervisor, según su comprensión de los riesgos, asigna sus recursos a la supervisión PLD/FT","Los países deben exigir a las IF y APNFD identificar, evaluar y mitigar sus riesgos de LD, FT y FP","Donde identifiquen riesgos menores, los países deben permitir y alentar medidas simplificadas, según corresponda"],"x":"La INR.26 define el enfoque basado en riesgo de la supervisión como el proceso general por el que el supervisor asigna sus recursos a la supervisión PLD/FT según su comprensión de los riesgos. Las otras tres afirmaciones están en el texto de la R.1, que regula el enfoque basado en riesgo del país y de las instituciones, no el del supervisor.","ref":"INR.26, párr. 1; R.1"},{"id":"G405","tema":"F","tipo":"trampa","q":"Un instructor afirma que la facultad del supervisor para obligar a una IF a entregar cualquier información relevante para vigilar su cumplimiento PLD/FT está en la Nota interpretativa a la R.27. ¿Qué es lo correcto?","a":"Está en el texto de la R.27, recomendación que no tiene Nota interpretativa","o":["Está en la Nota a la R.27, que detalla las facultades de inspección y requerimiento","Está en la Nota a la R.26, en el párrafo sobre los recursos de los supervisores","Está en el texto de la R.27, recomendación que no tiene Nota interpretativa","Está en la Nota a la R.29, donde se regula la información adicional de los sujetos obligados"],"x":"La R.27 no tiene Nota interpretativa: la facultad de obligar a entregar información, junto con la de inspeccionar y sancionar, está en su propio texto. La INR.29 permite a la UIF, no al supervisor, obtener información adicional de los sujetos obligados, y la INR.26 trata de recursos e independencia, no de esta facultad.","ref":"R.27"},{"id":"G406","tema":"F","tipo":"caso","q":"Durante una inspección PLD/FT, una compañía de seguros se niega a entregar al supervisor sus expedientes de clientes, alegando que sólo los dará si antes existe un reporte de operación sospechosa sobre ellos. Según la R.27:","a":"El supervisor debe estar facultado para obligarla a entregar toda información relevante para vigilar el cumplimiento","o":["El supervisor debe estar facultado para obligarla a entregar toda información relevante para vigilar el cumplimiento","La compañía tiene razón, porque la R.27 limita los requerimientos a clientes que ya fueron reportados a la UIF","Sólo la UIF puede pedir esos expedientes, pues la Nota a la R.29 le reserva la obtención de información adicional","El supervisor sólo puede pedirlos con autorización previa del organismo autorregulador del sector de seguros"],"x":"La R.27 dice que los supervisores deben estar autorizados para obligar a las IF a entregar cualquier información relevante para vigilar el cumplimiento, sin condicionarlo a un reporte previo. La INR.29 faculta a la UIF a obtener información adicional para su análisis, pero no le reserva esa información ni limita las facultades del supervisor.","ref":"R.27"},{"id":"G407","tema":"F","tipo":"memoria","q":"La R.27 dice que los supervisores deben poder imponer sanciones por incumplir los requisitos PLD/FT «en línea con» otra recomendación. ¿Cuál es y qué pide?","a":"La R.35, que pide una gama de sanciones eficaces, proporcionales y disuasivas","o":["La R.26, que pide sanciones graduadas según el perfil de riesgo de cada IF supervisada","La R.34, que pide dar guías y retroalimentación a la IF antes de poder sancionarla","La R.28, que pide que las sanciones las imponga un organismo autorregulador del sector","La R.35, que pide una gama de sanciones eficaces, proporcionales y disuasivas"],"x":"La R.27 remite a la R.35 para las sanciones del supervisor, y la R.35 exige una gama de sanciones eficaces, proporcionales y disuasivas, penales, civiles o administrativas. La R.34 trata de guías y retroalimentación, pero no las pone como condición previa para sancionar.","ref":"R.27; R.35"},{"id":"G408","tema":"F","tipo":"trampa","q":"¿Dónde se prevé que el supervisor u organismo autorregulador impida que delincuentes sean acreditados profesionalmente o controlen una APNFD, por ejemplo evaluando a las personas con un criterio de idoneidad («fit and proper»)?","a":"En el texto de la R.28, inciso (b)","o":["En la Nota a la R.28","En el texto de la R.28, inciso (b)","En el texto de la R.26, primer párrafo","En la Nota a las R.22 y 23"],"x":"El texto de la R.28 pide al supervisor u organismo autorregulador impedir que delincuentes sean acreditados profesionalmente o tengan el control o funciones de dirección, por ejemplo con una prueba de idoneidad. La INR.28 se ocupa del enfoque basado en riesgo, las facultades y los recursos; la R.26 impide el control de IF por delincuentes, pero no habla de acreditación profesional ni de APNFD.","ref":"R.28, inciso (b)"},{"id":"G409","tema":"F","tipo":"caso","q":"Un país permite operar casinos sin licencia, siempre que un organismo autorregulador de la industria del juego los vigile con un enfoque basado en riesgo. Según la R.28, este esquema:","a":"Es insuficiente, porque los casinos, como mínimo, deben tener licencia y estar efectivamente supervisados","o":["Es suficiente, porque la Nota a la R.28 permite que un organismo autorregulador supervise a cualquier APNFD","Es suficiente si el organismo exige DDC desde USD/EUR 3,000, umbral de la Nota a las R.22 y 23","Es insuficiente, porque los casinos, como mínimo, deben tener licencia y estar efectivamente supervisados","Es insuficiente, porque la Nota a la R.29 exige que los casinos sean supervisados directamente por la UIF"],"x":"La R.28, inciso (a), somete a los casinos a un régimen integral de regulación y supervisión que, como mínimo, incluye licencia y supervisión efectiva garantizada por autoridades competentes. La opción del organismo autorregulador está en el inciso (b) y sólo aplica a las demás APNFD; el umbral de USD/EUR 3,000 de la INR.22/23 es de DDC y no sustituye la licencia.","ref":"R.28, inciso (a)"},{"id":"G410","tema":"F","tipo":"caso","q":"Un organismo autorregulador de contadores públicos va a decidir con qué frecuencia e intensidad revisa a sus miembros en materia PLD/FT. Según la Nota interpretativa a la R.28, debe basarse en:","a":"Su comprensión de los riesgos de LD/FT y las características de las APNFD, en particular su diversidad y número","o":["Su comprensión de los riesgos de LD/FT y las características de las APNFD, en particular su diversidad y número","Un mismo calendario para todos, porque el enfoque basado en riesgo de la supervisión sólo se exige en la Nota a la R.26","El análisis operativo que la UIF le disemine sobre cada despacho, según la Nota interpretativa a la R.29","El umbral de USD/EUR 15,000 de la R.10, para revisar sólo a los despachos con operaciones ocasionales mayores"],"x":"La INR.28 pide a supervisores y organismos autorreguladores fijar la frecuencia e intensidad de su supervisión o monitoreo con base en su comprensión de los riesgos de LD/FT, considerando las características de las APNFD, en particular su diversidad y número. El enfoque basado en riesgo de la supervisión no es exclusivo de la INR.26: la INR.28 lo replica para las APNFD.","ref":"INR.28, párr. 2"},{"id":"G411","tema":"F","tipo":"trampa","q":"¿Dónde se establece que la UIF debe solicitar su membresía en el Grupo Egmont?","a":"En la Nota interpretativa a la R.29","o":["En el texto de la R.29, entre sus funciones centrales","En la Nota a la R.40","En el texto de la R.40, sobre otras formas de cooperación","En la Nota interpretativa a la R.29"],"x":"El párrafo 13 de la INR.29 dice que la UIF debe tener en cuenta la Declaración de Propósitos y los Principios del Grupo Egmont, y solicitar su membresía. El texto de la R.29 sólo define recibir, analizar y diseminar, y ni la R.40 ni su Nota contienen esa obligación.","ref":"INR.29, párr. 13"},{"id":"G412","tema":"F","tipo":"trampa","q":"Según la Nota interpretativa a la R.29, respecto de un sistema en el que las IF y APNFD reporten todas las operaciones en efectivo, nacionales e internacionales, por encima de un monto fijo, los países:","a":"Deben considerar la viabilidad y utilidad de un sistema de ese tipo","o":["Deben implementarlo con un umbral máximo de USD/EUR 15,000","Deben considerar la viabilidad y utilidad de un sistema de ese tipo","Tienen prohibido adoptarlo, porque la UIF sólo recibe reportes de operaciones sospechosas","Deben implementarlo, porque el texto de la R.29 lo incluye en la función de recepción"],"x":"El párrafo 14 de la INR.29 sólo pide considerar la viabilidad y utilidad de reportar operaciones en efectivo por encima de un monto fijo; no lo impone. El umbral máximo de USD/EUR 15,000 es el de la declaración de efectivo en frontera de la INR.32, y el párrafo 2 de la INR.29 prevé que la UIF reciba los reportes de efectivo que exija la legislación nacional.","ref":"INR.29, párrs. 14 y 2"},{"id":"G413","tema":"F","tipo":"caso","q":"Un país decide ubicar su UIF dentro de la estructura de la fiscalía. Según la Nota interpretativa a la R.29:","a":"Es posible, siempre que las funciones centrales de la UIF sean distintas de las de la fiscalía","o":["No es posible, porque la Nota exige un modelo único de UIF administrativa fuera de cualquier autoridad","Es posible, y entonces la UIF puede fusionar su análisis con la investigación penal de la fiscalía","Es posible, siempre que las funciones centrales de la UIF sean distintas de las de la fiscalía","No es posible, porque el texto de la R.29 exige que la UIF dependa del supervisor financiero"],"x":"La INR.29 permite establecer la UIF como parte de una autoridad existente, pero sus funciones centrales deben ser distintas de las de esa autoridad (párr. 9), y aclara que la R.29 no prejuzga el modelo de UIF (párr. 1). Fusionar funciones rompería esa separación y la independencia operativa.","ref":"INR.29, párrs. 1 y 9"},{"id":"G414","tema":"F","tipo":"trampa","q":"La definición de «investigación financiera» como la indagación de los asuntos financieros vinculados a una actividad delictiva, para dimensionar redes, rastrear bienes y desarrollar pruebas, ¿dónde se encuentra?","a":"En la Nota interpretativa a la R.30","o":["En la Nota interpretativa a la R.30","En el Glosario general de las Recomendaciones","En la Nota interpretativa a la R.31","En el texto de la R.30"],"x":"El párrafo 2 de la INR.30 define la investigación financiera y el párrafo 3, la investigación financiera paralela. El texto de la R.30 usa el término pero no lo define, el Glosario general no lo incluye y la R.31 no tiene Nota interpretativa.","ref":"INR.30, párr. 2"},{"id":"G415","tema":"F","tipo":"caso","q":"Una agencia anticorrupción con facultades de aplicación de la ley detecta que un funcionario lavó sobornos. Según la Nota interpretativa a la R.30, esa agencia:","a":"Podrá ser designada para investigar ese LD, con facultades para rastrear e iniciar el congelamiento e incautación","o":["Debe limitarse a remitir el caso a la UIF, que según la Nota a la R.29 decide si abre la investigación penal por LD","Debe abstenerse, porque la R.30 reserva la investigación de LD y FT exclusivamente a la policía designada del país","Sólo puede actuar como supervisor, con las facultades de inspección y sanción que le otorga el texto de la R.27","Podrá ser designada para investigar ese LD, con facultades para rastrear e iniciar el congelamiento e incautación"],"x":"La INR.30, párr. 6, dice que las autoridades anticorrupción con facultades de aplicación de la ley pueden ser designadas para investigar el LD y FT derivados de delitos de corrupción, con facultades suficientes para identificar, rastrear e iniciar el congelamiento e incautación de bienes. La UIF analiza y disemina, pero no abre investigaciones penales.","ref":"INR.30, párr. 6"},{"id":"G416","tema":"F","tipo":"caso","q":"Un investigador de un fraude descubre que las ganancias se lavaron, pero su agencia no investiga LD. Según la Nota interpretativa a la R.30, quien investiga delitos precedentes debe:","a":"Estar autorizado para investigar el LD relacionado o poder remitir el caso a otra agencia que lo continúe","o":["Esperar a que exista condena firme por el fraude antes de iniciar cualquier investigación por el LD relacionado","Estar autorizado para investigar el LD relacionado o poder remitir el caso a otra agencia que lo continúe","Remitir el caso a la UIF, que conforme a la Nota a la R.29 se encarga de investigar el lavado","Cerrar la línea financiera si el fraude se cometió en el extranjero, fuera de su jurisdicción"],"x":"La INR.30, párr. 3, pide que los investigadores de delitos precedentes puedan investigar el LD o FT relacionado durante una investigación paralela, o remitir el caso a otra agencia que le dé seguimiento. El texto de la R.30 incluye los casos en que el delito precedente ocurre fuera de la jurisdicción, y la UIF no investiga: analiza y disemina.","ref":"INR.30, párr. 3; R.30"},{"id":"G417","tema":"F","tipo":"trampa","q":"Las operaciones encubiertas, la intervención de comunicaciones, el acceso a sistemas informáticos y la entrega vigilada, como lista de técnicas de investigación, ¿dónde se enumeran?","a":"En el texto de la R.31, que carece de Nota interpretativa propia","o":["En la Nota interpretativa a la R.31, sobre técnicas especiales","En el texto de la R.30, dentro de la investigación financiera paralela","En el texto de la R.31, que carece de Nota interpretativa propia","En la Nota a la R.29, dentro del análisis operativo de la UIF"],"x":"Las cuatro técnicas se enumeran en el texto de la R.31, que carece de Nota interpretativa. El análisis operativo de la INR.29 es una función de la UIF, no una lista de técnicas; y aunque la INR.30, párr. 4, menciona entregas vigiladas y operaciones encubiertas, sólo lo hace para pedir que se consideren medidas para posponer detenciones o incautaciones.","ref":"R.31"},{"id":"G418","tema":"F","tipo":"caso","q":"Para rastrear bienes de una investigada por LD, una fiscalía pide acceso a la información de la autoridad fiscal y de los registros de inmuebles, vehículos y acciones. Según la R.31:","a":"Los países deben garantizar acceso oportuno a una amplia gama de información, que puede incluir la fiscal y la de registros de bienes","o":["Los países deben garantizar acceso oportuno a una amplia gama de información, que puede incluir la fiscal y la de registros de bienes","Sólo puede consultar información de beneficiario final, porque la Nota a la R.31 excluye la información en poder de la autoridad fiscal","Debe pedirla a la UIF, que según la Nota a la R.30 decide si la disemina a las autoridades de investigación","Sólo puede acceder a esos registros cuando exista sentencia condenatoria firme por el delito precedente"],"x":"La R.31 pide acceso oportuno a una amplia gama de información para identificar y rastrear bienes, que puede incluir, sin limitarse a ella, la información básica y de beneficiario final, la fiscal y la de registros de bienes, ciudadanía, residencia o prestaciones sociales. La R.31 no tiene Nota, y la decisión de diseminar de la UIF está en la INR.29, no en la INR.30.","ref":"R.31"},{"id":"G419","tema":"F","tipo":"caso","q":"En una investigación por LD, los fiscales necesitan que una agencia inmobiliaria entregue sus expedientes de una compraventa, catear las oficinas de una empresa y tomar declaración a dos empleados. Según la R.31, las autoridades competentes:","a":"Deben poder usar medidas obligatorias para exigir registros a IF, APNFD y otras personas, catear lugares y tomar declaraciones","o":["Sólo pueden exigir registros a las IF, porque las APNFD entregan información únicamente a su supervisor u organismo autorregulador","Sólo pueden obtener los expedientes a través del supervisor de la agencia, que los requiere con las facultades de la R.27","Necesitan que la agencia haya enviado antes un reporte de operación sospechosa sobre esa compraventa a la UIF","Deben poder usar medidas obligatorias para exigir registros a IF, APNFD y otras personas, catear lugares y tomar declaraciones"],"x":"La R.31 incluye facultades para usar medidas obligatorias para la presentación de registros en poder de IF, APNFD y otras personas físicas o morales, para catear personas y lugares, para tomar declaraciones de testigos y para incautar y obtener pruebas. Las facultades de la R.27 son del supervisor y no sustituyen las de quien investiga.","ref":"R.31"},{"id":"G420","tema":"F","tipo":"trampa","q":"¿Dónde se establece que las autoridades que investigan LD, delitos precedentes y FT deben poder pedir toda la información relevante que tenga la UIF?","a":"En el texto de la R.31, último párrafo","o":["En la Nota interpretativa a la R.31","En el texto de la R.31, último párrafo","En el texto de la R.29, sobre el acceso de la UIF","En la Nota interpretativa a la R.30"],"x":"La última oración de la R.31 dice que, al investigar LD, delitos precedentes y FT, las autoridades competentes deben poder pedir toda la información relevante en poder de la UIF. La R.31 no tiene Nota; el texto de la R.29 regula el acceso de la UIF a información, no el de quien investiga; y la INR.30 no lo contiene.","ref":"R.31"},{"id":"G421","tema":"F","tipo":"caso","q":"Una policía detecta un envío de dinero ilícito y, en vez de detener al mensajero, deja que continúe bajo vigilancia para identificar a los receptores. ¿Qué afirmación es correcta según los estándares?","a":"La entrega vigilada figura en la R.31, y la Nota a la R.30 pide considerar medidas para posponer la detención que la hacen posible","o":["La entrega vigilada está regulada en la Nota interpretativa a la R.31, que la limita a los casos de financiamiento al terrorismo","La R.30 obliga a detener de inmediato a todo sospechoso, por lo que la entrega vigilada contraviene los estándares del GAFI en todos los casos","La entrega vigilada figura en la R.31, y la Nota a la R.30 pide considerar medidas para posponer la detención que la hacen posible","La entrega vigilada sólo es válida si la UIF la autoriza previamente, conforme a su independencia operativa de la Nota a la R.29"],"x":"La R.31 enumera la entrega vigilada entre las técnicas de investigación. La INR.30, párr. 4, pide a los países considerar medidas para posponer o no realizar la detención o la incautación con el fin de identificar a los involucrados o reunir pruebas, pues sin ellas no pueden usarse entregas vigiladas ni operaciones encubiertas. La R.31 no tiene Nota.","ref":"R.31; INR.30, párr. 4"},{"id":"G422","tema":"F","tipo":"caso","q":"En un país, los viajeros no presentan por adelantado ninguna declaración, escrita ni oral, pero deben dar información veraz sobre el efectivo que llevan cuando la autoridad se la pide. Según la Nota interpretativa a la R.32, se trata de:","a":"Un sistema de revelación, que la Nota admite para cumplir la R.32","o":["Un sistema de revelación, que la Nota admite para cumplir la R.32","Un sistema de declaración oral, como el de canal rojo y canal verde","Un sistema inválido, porque la R.32 exige siempre una declaración escrita","Un sistema de declaración escrita para quienes superan el umbral"],"x":"La INR.32, párr. 4, describe el sistema de revelación: no hay declaración previa, escrita ni oral, pero el viajero debe responder con veracidad cuando la autoridad lo pide. En la declaración oral, en cambio, el viajero debe declarar activamente (usualmente, eligiendo el canal rojo o el verde); y la R.32 admite un sistema de declaración y/o de revelación.","ref":"INR.32, párr. 4; R.32"},{"id":"G423","tema":"F","tipo":"caso","q":"Un país aplica un sistema de declaración escrita a quienes entran con efectivo y un sistema de revelación a quienes salen. Según los estándares:","a":"Es válido, porque la Nota a la R.32 dice que no tienen que usar el mismo tipo de sistema para entrar y para salir","o":["No es válido, porque el texto de la R.32 exige usar el mismo tipo de sistema para la entrada y para la salida","No es válido, porque la Nota a la R.32 exige controlar sólo la entrada de efectivo e instrumentos al portador","Es válido sólo si ambos sistemas usan el umbral de USD/EUR 15,000 que fija el texto de la R.10 para la DDC","Es válido, porque la Nota a la R.32 dice que no tienen que usar el mismo tipo de sistema para entrar y para salir"],"x":"La INR.32, párr. 2, dice que los países no tienen que usar el mismo tipo de sistema para el transporte entrante y el saliente, siempre que tanto la entrada como la salida queden cubiertas (párr. 5a). El umbral máximo de USD/EUR 15,000 del sistema de declaración está en la INR.32, no en la R.10.","ref":"INR.32, párrs. 2 y 5(a)"},{"id":"G424","tema":"F","tipo":"caso","q":"Un viajero cruza la frontera con efectivo por encima del umbral y no lo declara, como exige el sistema de declaración del país. No hay otro indicio de LD o FT. Según la Nota a la R.32, las autoridades:","a":"Deben poder detener o retener el efectivo por un tiempo razonable para determinar si hay pruebas de LD o FT","o":["Deben devolverlo de inmediato, porque sin sospecha de LD o FT la Nota a la R.32 no permite retenerlo","Deben poder detener o retener el efectivo por un tiempo razonable para determinar si hay pruebas de LD o FT","Deben decomisarlo en el acto, porque según la R.32 toda declaración falsa conlleva el decomiso inmediato del efectivo","Sólo pueden multarlo, porque omitir la declaración no se considera declaración falsa según la Nota a la R.32"],"x":"La INR.32, párr. 5(e), prevé detener o retener efectivo por un tiempo razonable cuando hay sospecha de LD/FT o cuando hay declaración falsa, y su glosario incluye en la declaración falsa no declarar cuando se debe. El decomiso de la R.32 se prevé para el efectivo relacionado con FT, LD o delitos precedentes; la declaración falsa, por sí sola, lleva a sanciones.","ref":"INR.32, párr. 5(e) y glosario de la INR.32; R.32"},{"id":"G425","tema":"F","tipo":"trampa","q":"Un manual afirma que los rubros de estadísticas (reportes de operaciones sospechosas, investigaciones, procesos y condenas, bienes congelados, incautados y decomisados, y solicitudes de cooperación) se enumeran en la Nota interpretativa a la R.33. ¿Qué es lo correcto?","a":"Se enumeran en el propio texto de la R.33, que no tiene Nota interpretativa","o":["Se enumeran en la Nota a la R.33, que desglosa los rubros estadísticos mínimos","Se enumeran en la Nota a la R.29, dentro de la función de recepción de la UIF","Se enumeran en el propio texto de la R.33, que no tiene Nota interpretativa","Se enumeran en la Nota a la R.1, como insumo de la evaluación de riesgos"],"x":"La R.33 no tiene Nota interpretativa: los rubros de estadísticas están en su propio texto. La INR.29 describe la recepción de reportes por la UIF y la INR.1 la evaluación de riesgos, pero ninguna enumera estadísticas.","ref":"R.33"},{"id":"G426","tema":"F","tipo":"caso","q":"Un país lleva estadísticas de investigaciones, procesos y condenas por LD, pero no por FT, porque considera que el terrorismo se mide con otros indicadores. Según la R.33:","a":"Debe llevarlas también por FT, porque la R.33 incluye investigaciones, procesos y condenas de LD y de FT","o":["Debe llevarlas también por FT, porque la R.33 incluye investigaciones, procesos y condenas de LD y de FT","Cumple, porque las estadísticas de FT se regulan por separado en la Nota interpretativa a la R.5, no en la R.33","Cumple, porque la R.33 sólo cubre LD y el FT se mide con los congelamientos de la R.6","Incumple sólo en condenas; las investigaciones de FT se contabilizan según la Nota a la R.30"],"x":"La R.33 pide estadísticas sobre investigaciones, procesos y condenas tanto de LD como de FT. Ni la INR.5 ni la INR.30 contienen reglas estadísticas: la obligación completa está en el texto de la R.33, que no tiene Nota.","ref":"R.33"},{"id":"G427","tema":"F","tipo":"memoria","q":"Según la R.33, las estadísticas sobre reportes de operaciones sospechosas deben abarcar:","a":"Tanto los recibidos como los diseminados","o":["Sólo los reportes que derivaron en condena","Sólo los recibidos por la UIF, por sector","Los reportes que las IF analizaron y descartaron","Tanto los recibidos como los diseminados"],"x":"La R.33 pide estadísticas sobre los reportes de operaciones sospechosas recibidos y diseminados, y aparte sobre investigaciones, procesos y condenas por LD y FT. No limita la medición a los que terminan en condena ni a lo que recibe la UIF.","ref":"R.33"},{"id":"G428","tema":"F","tipo":"trampa","q":"La obligación de establecer guías y dar retroalimentación que ayuden a las IF y APNFD, en particular a detectar y reportar operaciones sospechosas, ¿dónde se establece?","a":"En el texto de la R.34","o":["En la Nota a la R.34","En el texto de la R.34","En la Nota interpretativa a la R.20","En la Nota interpretativa a la R.29"],"x":"La guía y la retroalimentación a IF y APNFD están en el texto de la R.34, que no tiene Nota interpretativa. La INR.20 regula el reporte (intentadas, sin importar el monto) y la INR.29 las funciones de la UIF, pero ninguna contiene esta obligación.","ref":"R.34"},{"id":"G429","tema":"F","tipo":"caso","q":"Un colegio de notarios, que actúa como organismo autorregulador, se niega a emitir guías PLD/FT para sus miembros porque, según el Glosario, no es una autoridad competente. Según la R.34:","a":"Debe hacerlo: la R.34 incluye expresamente a los organismos autorreguladores, junto con autoridades competentes y supervisores","o":["Tiene razón: la R.34 sólo obliga a las autoridades competentes, y el Glosario excluye de ellas a los organismos autorreguladores","Tiene razón: dar guías y retroalimentación sobre reportes corresponde en exclusiva a la UIF que recibe esos reportes","Debe hacerlo: la R.34 incluye expresamente a los organismos autorreguladores, junto con autoridades competentes y supervisores","Debe hacerlo sólo si el país lo designó supervisor de notarios bajo la R.28; si no, la obligación recae en la UIF"],"x":"El Glosario aclara que los organismos autorreguladores no son autoridades competentes, pero la R.34 nombra por separado a las autoridades competentes, los supervisores y los organismos autorreguladores como obligados a establecer guías y dar retroalimentación. No es tarea exclusiva de la UIF.","ref":"R.34; Glosario"},{"id":"G430","tema":"F","tipo":"caso","q":"Las autoridades de un país publican guías para detectar operaciones sospechosas dirigidas sólo a bancos y casas de bolsa, y nunca a joyerías, agentes inmobiliarios ni contadores. A la luz de la R.34:","a":"Es insuficiente, porque las guías y la retroalimentación deben asistir tanto a las IF como a las APNFD","o":["Es insuficiente, porque las guías y la retroalimentación deben asistir tanto a las IF como a las APNFD","Es suficiente, porque las guías a las APNFD las regula la Nota interpretativa a las R.22 y 23 y no la R.34","Es suficiente, porque la R.34 sólo pide guías para las IF sujetas a los Principios Básicos","Es insuficiente, pero sólo para joyerías, pues son las únicas APNFD con umbral en efectivo"],"x":"La R.34 pide guías y retroalimentación que asistan a las IF y a las APNFD en la aplicación de las medidas nacionales PLD/FT, en particular para detectar y reportar operaciones sospechosas. No distingue entre sectores ni remite a los Principios Básicos, que son materia de la R.26.","ref":"R.34"},{"id":"G431","tema":"F","tipo":"memoria","q":"Según la R.35, las sanciones deben poder aplicarse a las personas físicas o morales que incumplan los requisitos PLD/FT y que estén cubiertas por:","a":"Las R.6 y 8 a 23","o":["Las R.10 a 23","Las R.6 a 23, incluida la R.7","Las R.1 a 40","Las R.6 y 8 a 23"],"x":"La R.35 se refiere a las personas cubiertas por las R.6 y 8 a 23: incluye las sanciones financieras dirigidas por terrorismo (R.6), las OSFL (R.8) y las medidas preventivas (R.9 a 23), y deja fuera la R.7. Limitarla a las R.10 a 23 omitiría las R.6, 8 y 9.","ref":"R.35"},{"id":"G432","tema":"F","tipo":"trampa","q":"¿Dónde se establece que las sanciones PLD/FT pueden ser penales, civiles o administrativas y deben poder aplicarse no sólo a las IF y APNFD, sino también a sus directivos y alta dirección?","a":"En el texto de la R.35","o":["En la Nota a la R.35","En el texto de la R.35","En el texto de la R.27, sobre facultades","En la Nota interpretativa a la R.28"],"x":"Ambos elementos están en el texto de la R.35, que no tiene Nota interpretativa. La R.27 da al supervisor la facultad de sancionar y remite a la R.35, y la INR.28 habla de facultades para sancionar de supervisores y organismos autorreguladores, pero ninguna menciona a directivos y alta dirección.","ref":"R.35"},{"id":"G433","tema":"F","tipo":"caso","q":"La ley de un país sólo permite al supervisor revocar la licencia de una IF, sea cual sea la gravedad del incumplimiento PLD/FT; no prevé multas, amonestaciones ni otras medidas. Según la R.35:","a":"Es insuficiente, porque debe existir una gama de sanciones eficaces, proporcionales y disuasivas, no una sola","o":["Es suficiente, porque la R.35 sólo pide que las sanciones sean disuasivas y revocar la licencia lo es","Es suficiente, siempre que la Nota interpretativa a la R.35 admita la revocación como sanción única","Es insuficiente, porque debe existir una gama de sanciones eficaces, proporcionales y disuasivas, no una sola","Es insuficiente, porque sólo la Nota a la R.26 permite retirar licencias y la R.35 no lo admite"],"x":"La R.35 exige una gama de sanciones eficaces, proporcionales y disuasivas; una única sanción máxima no es proporcional a incumplimientos menores. La R.35 no tiene Nota, y la facultad de retirar, restringir o suspender la licencia está en el texto de la R.27, no en la INR.26.","ref":"R.35; R.27"}]}
</script>

<script>
(function(){
const D = JSON.parse(document.getElementById("datos").textContent);
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const RUTA = D.meta.ruta||"financiero";
const ACENTOS = {financiero:["morado","turquesa"], av:["verde","turquesa"], transversal:["morado","verde"], gratuito:["morado","turquesa"]}[RUTA]||["morado","turquesa"];
const COLORES = ["c-principal","c-"+ACENTOS[0],"c-"+ACENTOS[1],"c-negro"];
const colorDe = (v,i)=>v?("c-"+v):COLORES[i%4];
document.documentElement.setAttribute("data-ruta", RUTA);
const RUTAS = {financiero:"Ruta Sector financiero", av:"Ruta Actividades vulnerables", transversal:"Transversales", gratuito:"Gratuitos"};

/* ---------- encabezado, portada, trampas, pie ---------- */
$("#brand").innerHTML = `<b>360EDUCA</b><span>${esc(D.meta.modulo||"")}</span><span class="ruta">${esc(RUTAS[D.meta.ruta||"financiero"])}</span>`;
$("#nav").innerHTML = D.secciones.filter(s=>s.nav).map(s=>`<a href="#${s.id}"${s.tipo==="simulador"?' class="cta"':""}>${esc(s.nav)}</a>`).join("");
const mapa0 = D.secciones.find(s=>s.tipo==="mapa");
let rhythm = "";
if(mapa0 && D.meta.ritmo!==false){
  const counts = mapa0.ramas.map(r=>r.items.length);
  rhythm = `<div><div class="rhythm${mapa0.ramas.length>4?" many":""}">${mapa0.ramas.map((r,i)=>`<div class="rh ${colorDe(r.color,i)}"><span class="big">${r.items.length}</span><span class="lb">${esc(r.corto||r.letra)}</span><span class="q">${esc(r.ritmo||r.pregunta||"")}</span></div>`).join("")}</div>
  <div class="rh-cap">${counts.join(" · ")} = ${counts.reduce((a,b)=>a+b,0)} ${esc(D.meta.unidad||"")}</div></div>`;
}
$("#hero").innerHTML = `<div><div class="lbl">${esc(D.meta.eyebrow||"")}</div>
  <h1>${esc(D.meta.h1_antes||"")} <mark>${esc(D.meta.h1_resaltado||"")}</mark> ${esc(D.meta.h1_despues||"")}</h1>
  <p>${D.meta.intro||""}</p></div>${rhythm}`;
$("#traps").innerHTML = (D.trampas||[]).map((t,i)=>`<div class="trapc"><span class="tag">Trampa ${D.trampas.length>1?i+1:"de examen"}</span><p><b>${esc(t.titulo)}</b> ${t.texto}</p></div>`).join("");
if(!(D.trampas||[]).length) $("#traps").hidden=true;
$("#pie").innerHTML = `<b>GMC360 · 360Educa</b> — ${D.meta.fuente||""} Material didáctico; los textos están resumidos, consulta la publicación oficial para la redacción íntegra.`;

/* ---------- secciones ---------- */
const head = s=>!s.titulo?"":`<div class="sec-head"><h2>${esc(s.titulo)}</h2>${s.intro?`<p>${s.intro}</p>`:""}</div>`;
const chant = f=>f?`<div class="chant"><div class="lbl">${esc(f.titulo||"Para recitar en voz alta")}</div><p>${f.html}</p></div>`:"";
const R = {};
let ITEMS = {}; // id -> {item, rama, color}
R.mapa = (s,si)=>{
  const n = s.ramas.length;
  const ramas = s.ramas.map((r,i)=>{
    const col = colorDe(r.color,i);
    let lista;
    if(r.estilo==="ficha"){
      lista = `<ul class="leaves" style="margin-top:10px">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="frac"><button aria-expanded="false" data-ficha="${id}"><span class="rom">${esc(it.etiqueta)}</span><span><span class="nm">${esc(it.nombre)}</span><span class="hookt">${esc([it.verbo,it.gancho].filter(Boolean).join(" · "))}</span></span><span class="cnt">${esc(it.conteo||"")}</span></button><ul class="inc" hidden>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul></li>`}).join("")}</ul>`;
    } else {
      lista = `<ul class="leaves">${r.items.map((it,j)=>{const id=`${s.id}-${i}-${j}`;ITEMS[id]={it,r,col};
        return `<li class="leaf"><button class="chip${it.destacado?" star":""}" data-item="${id}"><span class="num">${esc(it.etiqueta)}</span><span class="nm">${esc(it.nombre)}${(it.sub||it.verbo)?`<span class="sub">${esc([it.sub,it.verbo].filter(Boolean).join(" · "))}</span>`:""}${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}</span><span class="ord">${esc(it.orden!=null?it.orden:j+1)}</span></button></li>`}).join("")}</ul>`;
    }
    return `<div class="branch ${col} b${i+1}"><div class="bhead"><span class="let">${esc(r.letra)}</span><div class="ti">${esc(r.titulo)}</div></div>${r.pregunta||r.verbos?`<div class="hk${r.verbos?" v":""}">${esc(r.verbos||r.pregunta)}</div>`:""}${lista}</div>`;
  });
  let fr = s.frase;
  if(fr && !fr.html){ const its=s.ramas.flatMap(r=>r.items); fr={titulo:fr.titulo, html: its.map((it,j)=>`<span><i>${esc(it.orden!=null?it.orden:it.etiqueta)}</i>${esc(it.verbo)}</span>`).join(" · ")}; }
  let cuerpo = ramas.join("");
  if(n>4){ // más de 4 ramas: dos columnas en orden, balanceadas por número de elementos
    const pesos = s.ramas.map(r=>r.items.length+2), total = pesos.reduce((a,b)=>a+b,0);
    let k=1, mejor=Infinity, acum=0;
    for(let j=1;j<n;j++){ acum+=pesos[j-1]; const dif=Math.abs(total-2*acum); if(dif<mejor){mejor=dif;k=j;} }
    cuerpo = `<div class="col izq">${ramas.slice(0,k).join("")}</div><div class="col der">${ramas.slice(k).join("")}</div>`;
  }
  return head(s)+`<div class="map ${n>4?"nmany":"n"+n}"><svg class="wires" aria-hidden="true"></svg><div class="core"><span class="t">${esc(s.centro.t)}</span><span class="s">${s.centro.s||""}</span></div>${cuerpo}</div>`+chant(fr);
};
R.tarjetas = s=>head(s)+`<div class="cards">${s.tarjetas.map((c,i)=>{
  const col = colorDe(c.color,i);
  const top = c.encabezado?`<div class="chead"><div class="t">${esc(c.titulo)}</div>${c.subtitulo?`<div class="a">${esc(c.subtitulo)}</div>`:""}</div>`:(c.barra?`<div class="bar"></div>`:"");
  const body = c.filas? c.filas.map(f=>`<div class="frow"><span class="k">${esc(f.k)}</span>${f.v}</div>`).join("")
    : `<div class="cbody">${c.etiqueta?`<div class="lbl">${esc(c.etiqueta)}</div>`:""}${c.encabezado?"":`<h3>${esc(c.titulo)}</h3>`}${c.ref?`<span class="art">${esc(c.ref)}</span>`:""}${c.html?`<p>${c.html}</p>`:""}${c.lista?`<ul>${c.lista.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
  return `<div class="card ${col}${c.ancho?" wide":""}">${top}${body}</div>`;}).join("")}</div>${s.nota?`<div class="note">${s.nota}</div>`:""}`;
R.escala = s=>{const cols=["var(--principal-linea)","#2f9e93","#a663cc","var(--negro)","var(--gris)"];
  return head(s)+`<div class="card"><div class="cbody">${s.etiqueta?`<div class="lbl">${esc(s.etiqueta)}</div>`:""}${s.subtitulo?`<h3>${esc(s.subtitulo)}</h3>`:""}<div class="scale">${s.niveles.map((l,i)=>`<div class="lvl" style="--lc:${cols[i%5]}"><div class="n">${i+1}</div><div class="t">${esc(l.t)}</div><div class="d">${esc(l.d||"")}</div>${l.req?`<div class="req">${esc(l.req)}</div>`:""}</div>`).join("")}</div>${s.memo?`<p class="memo">${s.memo}</p>`:""}</div></div>`;};
R.pasos = s=>head(s)+`<ol class="track" style="--n:${s.pasos.length}" role="tablist" data-pasos="${s.id}">${s.pasos.map((p,i)=>`<li><button class="pill" role="tab" aria-selected="${i===0}" data-paso="${s.id}:${i}"><span class="circ">${i+1}</span><span class="nm">${esc(p.nombre)}</span></button></li>`).join("")}</ol><div class="stepd" id="stepd-${s.id}" role="tabpanel" aria-live="polite"></div>`+chant(s.frase);
R.flujo = s=>head(s)+`<div class="lanes">${s.carriles.map((c,i)=>`<div class="lane"><div class="lhead ${colorDe(c.color,i)}"><span class="t">${esc(c.titulo)}</span>${c.sub?`<span class="s">${esc(c.sub)}</span>`:""}</div><div class="flow">${c.nodos.map(n=>`<div class="node"><h4>${esc(n.titulo)}</h4>${n.ref?`<span class="art">${esc(n.ref)}</span>`:""}${n.texto?`<p>${n.texto}</p>`:""}${n.plazo?`<span class="plazo">${esc(n.plazo)}</span>`:""}${n.nota?`<p>${n.nota}</p>`:""}</div>`).join('<div class="arrow" aria-hidden="true">→</div>')}</div></div>`).join("")}</div>`;
R.cifras = s=>head(s)+`<div class="nums">${s.cifras.map(c=>`<div class="numt"><div class="v">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="d">${esc(c[2])}</div><div class="r">${esc(c[3])}</div></div>`).join("")}</div>`;
R.simulador = s=>head({titulo:s.titulo||"Modo examen",intro:s.intro||"Opción múltiple con 4 opciones. Practica por tema en rondas de 10, o haz un simulacro de 30 o 50 que no repite reactivos hasta agotar el banco. Contesta con clic o con las teclas A, B, C, D."})+
  `<div class="simbar"><button class="qsim" data-n="30" aria-pressed="false">Simulacro de 30</button><button class="qsim" data-n="50" aria-pressed="false">Simulacro de 50</button><span class="bankinfo" id="bankinfo"></span><button class="linkbtn" id="simReset">Reiniciar mi avance</button></div>
   <div class="lbl" style="margin-bottom:6px">O practica por tema (rondas de 10)</div><div class="modes" id="modes" role="group" aria-label="Tipo de práctica"></div><div class="quiz" id="quiz" aria-live="polite"></div>`;
$("#secciones").innerHTML = D.secciones.map((s,i)=>`<section class="block${s.tipo==="simulador"?" sim":""}" id="${s.id}">${R[s.tipo](s,i)}</section>`).join("");

/* ---------- conectores del mapa ---------- */
function wires(map){
  const svg=map.querySelector("svg.wires"); if(getComputedStyle(svg).display==="none") return;
  const Rr=map.getBoundingClientRect(), C=map.querySelector(".core").getBoundingClientRect();
  svg.setAttribute("width",Rr.width); svg.setAttribute("height",Rr.height); svg.setAttribute("viewBox",`0 0 ${Rr.width} ${Rr.height}`);
  let out="";
  map.querySelectorAll(".branch").forEach(b=>{
    const H=b.querySelector(".bhead").getBoundingClientRect(), right=H.left>C.left, cy=C.top+C.height/2-Rr.top;
    const x1=(right?C.right:C.left)-Rr.left, x2=(right?H.left:H.right)-Rr.left, y2=H.top+H.height/2-Rr.top, mx=(x1+x2)/2;
    const col=[...b.classList].find(c=>c.startsWith("c-"));
    out+=`<path class="${col}" d="M${x1},${cy} C${mx},${cy} ${mx},${y2} ${x2},${y2}"/>`;
  });
  svg.innerHTML=out;
}
const redraw=()=>document.querySelectorAll(".map").forEach(wires);
addEventListener("resize",redraw);
if(window.ResizeObserver){const ro=new ResizeObserver(redraw);document.querySelectorAll(".map").forEach(m=>ro.observe(m));}
document.fonts && document.fonts.ready.then(redraw); redraw();

/* ---------- pasos ---------- */
const PASOS={};
function showPaso(sid,i){
  const s=D.secciones.find(x=>x.id===sid), n=s.pasos.length; i=(i+n)%n; PASOS[sid]=i; const p=s.pasos[i];
  document.querySelectorAll(`[data-paso^="${sid}:"]`).forEach(b=>b.setAttribute("aria-selected",b.dataset.paso===`${sid}:${i}`));
  $("#stepd-"+sid).innerHTML=`<div class="big">${i+1}</div><div><div class="lbl">Paso ${i+1} de ${n}</div><h3>${esc(p.nombre)}</h3>${p.ref?`<span class="art">${esc(p.ref)}</span>`:""}${p.gancho?`<div class="hook">${esc(p.gancho)}</div>`:""}<ul>${(p.puntos||[]).map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="stepnav"><button class="btn ghost" data-pnav="${sid}:${i-1}">← Anterior</button><button class="btn" data-pnav="${sid}:${i+1}">Siguiente paso →</button></div></div>`;
}
D.secciones.filter(s=>s.tipo==="pasos").forEach(s=>showPaso(s.id,0));

/* ---------- recitar, panel y clics ---------- */
const recite=$("#recite");
recite.addEventListener("click",()=>{const on=document.body.classList.toggle("recite");recite.setAttribute("aria-pressed",on);recite.textContent=on?"Mostrar nombres":"Modo recitar";document.querySelectorAll(".shown").forEach(e=>e.classList.remove("shown"));});
let lastFocus=null;
function openItem(id){
  const {it,r,col}=ITEMS[id], h=$("#dHead");
  h.className="dhead "+col;
  $("#dTitle").textContent=it.panel||it.etiqueta;
  $("#dBody").innerHTML=`<div class="lbl">${esc(r.titulo)} · ${esc(it.etiqueta)}</div><div class="hook">${esc(it.nombre)}${it.verbo?` — «${esc(it.verbo)}»`:""}</div>${it.desc?`<p style="margin:0 0 12px">${esc(it.desc)}</p>`:""}<ul>${(it.puntos||[]).map(p=>`<li>${p}</li>`).join("")}</ul>${it.ir?`<a class="btn" href="${esc(it.ir)}" id="dGo" style="margin-top:16px">Ver el detalle</a>`:""}`;
  lastFocus=document.activeElement; $("#scrim").hidden=false; $("#drawer").hidden=false; $("#dClose").focus();
  const go=$("#dGo"); if(go) go.addEventListener("click",closeD);
}
function closeD(){$("#scrim").hidden=true;$("#drawer").hidden=true;if(lastFocus)lastFocus.focus();}
$("#dClose").addEventListener("click",closeD); $("#scrim").addEventListener("click",closeD);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden)closeD();});
document.addEventListener("click",e=>{
  const rec=document.body.classList.contains("recite");
  const chip=e.target.closest("[data-item]");
  if(chip){ if(rec&&!chip.classList.contains("shown")){chip.classList.add("shown");return;} openItem(chip.dataset.item); return; }
  const fb=e.target.closest("[data-ficha]");
  if(fb){ const li=fb.parentElement; if(rec&&!li.classList.contains("shown")){li.classList.add("shown");return;} const inc=li.querySelector(".inc"),open=inc.hidden; inc.hidden=!open; fb.setAttribute("aria-expanded",open); return; }
  const pill=e.target.closest("[data-paso]");
  if(pill){ if(rec&&!pill.classList.contains("shown")) pill.classList.add("shown"); const [sid,i]=pill.dataset.paso.split(":"); showPaso(sid,+i); return; }
  const pn=e.target.closest("[data-pnav]");
  if(pn){ const [sid,i]=pn.dataset.pnav.split(":"); showPaso(sid,+i); }
});

/* ---------- simulador ---------- */
if(!D.secciones.some(s=>s.tipo==="simulador")) return;
const BANK=D.banco||[], TEMAS=D.temas||{};
const MODOS=[{k:"all",l:"Todo mezclado",f:()=>true}].concat((D.modos||[]).map(m=>({k:m.k,l:m.l,f:x=>(m.tema?x.tema===m.tema:true)&&(m.tipos?m.tipos.includes(x.tipo):true)})));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY=D.meta.clave||"mapa", SEEN="seen-"+KEY, SIM="sim-"+KEY;
let seen=new Set(store.get(SEEN,[])), MODE="all", ST=null;
const poolFor=k=>BANK.filter(MODOS.find(m=>m.k===k).f);
const simInfo=()=>`${BANK.length-store.get(SIM,[]).length} de ${BANK.length} sin salir en simulacro`;
const bankInfo=()=>`${BANK.length} reactivos verificados contra el texto oficial · ${simInfo()}`;
function startRound(){const pool=poolFor(MODE);const fresh=shuffle(pool.filter(x=>!seen.has(x.id))),old=shuffle(pool.filter(x=>seen.has(x.id)));start(fresh.concat(old).slice(0,10),{kind:"ronda",label:MODOS.find(m=>m.k===MODE).l});}
function startSim(n){
  let used=new Set(store.get(SIM,[])), rest=BANK.filter(x=>!used.has(x.id)), cycled=false;
  if(rest.length<n){cycled=true;const take=shuffle(rest);used=new Set();const more=shuffle(BANK.filter(x=>!take.includes(x))).slice(0,n-take.length);rest=take.concat(more);more.forEach(x=>used.add(x.id));}
  else{rest=shuffle(rest).slice(0,n);rest.forEach(x=>used.add(x.id));}
  store.set(SIM,[...used]); start(shuffle(rest),{kind:"simulacro",label:`Simulacro de ${n}`,n,cycled});
}
function start(list,meta){ST={list:list.map(q=>({...q,opts:shuffle(q.o)})),i:0,ok:0,miss:[],byTema:{},meta};document.querySelectorAll(".qmode,.qsim").forEach(b=>b.setAttribute("aria-pressed","false"));render();}
function render(){
  const box=$("#quiz"),n=ST.list.length; if(ST.i>=n) return renderEnd();
  const q=ST.list[ST.i];
  box.innerHTML=`<div class="qbar"><span>${esc(ST.meta.label)} · reactivo ${ST.i+1} de ${n}</span><span>Aciertos: ${ST.ok}</span></div><div class="qprog"><i style="width:${ST.i/n*100}%"></i></div>
  <div class="qtag"><span>${esc(TEMAS[q.tema]||q.tema)}</span>${q.tipo==="caso"?"<span>Caso práctico</span>":""}</div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" id="fb"></div>
  <div class="qactions"><button class="btn" id="qNext" hidden>${ST.i+1===n?"Ver resultado":"Siguiente"}</button><button class="btn ghost" id="qQuit">Terminar aquí</button></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  $("#qNext").addEventListener("click",()=>{ST.i++;render();});
  $("#qQuit").addEventListener("click",()=>{ST.list=ST.list.slice(0,ST.i);renderEnd();});
}
function answer(k){
  const q=ST.list[ST.i]; if(q.done) return; q.done=true; const good=q.opts[k]===q.a;
  const t=ST.byTema[q.tema]||(ST.byTema[q.tema]={ok:0,n:0}); t.n++; if(good){ST.ok++;t.ok++;} else ST.miss.push(q);
  seen.add(q.id); store.set(SEEN,[...seen]);
  $("#quiz").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.a)b.classList.add("right");else if(+b.dataset.k===k)b.classList.add("wrong");});
  $("#fb").innerHTML=`${good?'<span class="ok">Correcto</span>':'<span class="no">Incorrecto</span>'} ${esc(q.x)}<span class="ref">${esc(q.ref)}</span>`;
  const nb=$("#qNext"); nb.hidden=false; nb.focus();
}
function renderEnd(){
  const box=$("#quiz"),n=ST.list.length,pct=n?Math.round(ST.ok/n*100):0;
  const msg=pct>=90?"Listos para el examen.":pct>=75?"Muy bien: repasen los temas con menos aciertos.":pct>=60?"Van bien, pero hay que repasar.":"Toca volver al mapa y repasar antes del siguiente intento.";
  const rows=Object.entries(ST.byTema).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>`<div class="trow2"><span>${esc(TEMAS[k]||k)}</span><span class="tb"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></span><span class="tv">${v.ok}/${v.n}</span></div>`).join("");
  box.innerHTML=`<div class="printhead"><b>${esc(D.meta.titulo)}</b> · 360Educa · ${esc(ST.meta.label)} · ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div><div class="qbar"><span>${esc(ST.meta.label)} · resultado</span><span>${ST.ok}/${n}</span></div><div class="qprog"><i style="width:100%"></i></div>
  <div class="score"><span class="big">${pct}%</span><span>${ST.ok} de ${n} correctas. ${msg}</span></div>
  ${rows?`<div class="lbl" style="margin-top:14px">Aciertos por tema (de menor a mayor)</div><div class="trows">${rows}</div>`:""}
  ${ST.miss.length?`<details class="miss" open><summary class="lbl">Para repasar (${ST.miss.length})</summary><ul>${ST.miss.map(m=>`<li>${esc(m.q)}<br><b>→ ${esc(m.a)}.</b> ${esc(m.x)}<span class="ref">${esc(m.ref)}</span></li>`).join("")}</ul></details>`:""}
  <div class="qactions"><button class="btn" id="qAgain">${ST.meta.kind==="simulacro"?"Otro simulacro igual":"Otra ronda"}</button><button class="btn ghost" id="qPrint">Imprimir o guardar en PDF</button><a class="btn ghost" href="#${mapa0?mapa0.id:"top"}">Repasar el mapa</a></div>
  ${ST.meta.kind==="simulacro"?`<p class="siminfo">${simInfo()}${ST.meta.cycled?" · Se completó el banco y empezó una vuelta nueva.":""}</p>`:""}`;
  $("#qAgain").addEventListener("click",()=>ST.meta.kind==="simulacro"?startSim(ST.meta.n):startRound());
  $("#qPrint").addEventListener("click",()=>{const d=box.querySelector("details.miss");if(d)d.open=true;window.print();});
  $("#bankinfo").textContent=bankInfo();
}
document.addEventListener("keydown",e=>{
  if(!ST||e.target.closest("input,textarea")) return;
  const r=$("#quiz").getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
  const k="abcd1234".indexOf(e.key.toLowerCase()); if(k>=0&&ST.i<ST.list.length&&!ST.list[ST.i].done){answer(k%4);e.preventDefault();}
});
$("#modes").innerHTML=MODOS.map(m=>`<button class="qmode" data-m="${m.k}" aria-pressed="false">${esc(m.l)} <small>${poolFor(m.k).length}</small></button>`).join("");
document.querySelectorAll(".qmode").forEach(b=>b.addEventListener("click",()=>{MODE=b.dataset.m;startRound();b.setAttribute("aria-pressed","true");}));
document.querySelectorAll(".qsim").forEach(b=>b.addEventListener("click",()=>{startSim(+b.dataset.n);b.setAttribute("aria-pressed","true");}));
$("#simReset").addEventListener("click",()=>{store.set(SIM,[]);store.set(SEEN,[]);seen=new Set();$("#bankinfo").textContent=bankInfo();});
$("#bankinfo").textContent=bankInfo();
startRound(); document.querySelector('.qmode[data-m="all"]').setAttribute("aria-pressed","true");
})();
</script>
</body>
</html>
