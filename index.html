<script type="application/json" id="datos">
{"meta":{"titulo":"Mapa de las 40 Recomendaciones del GAFI","descripcion":"Mapa mental interactivo de las 40 Recomendaciones del GAFI (actualizadas a junio de 2026) con simulador de reactivos para la certificación CNBV PLD/FT.","repo":"mapa-40-recomendaciones-gafi","clave":"gafi40","ruta":"transversal","modulo":"Reto 40 · Certificación CNBV PLD/FT","unidad":"recomendaciones","eyebrow":"Estándares del GAFI · adoptados en 2012 · actualizados a junio de 2026","h1_antes":"Las 40","h1_resaltado":"Recomendaciones","h1_despues":"del GAFI","intro":"Las 40 en las 7 secciones oficiales del GAFI, de la A a la G. Toca cualquier recomendación para ver lo que dice y lo que agrega su Nota interpretativa; luego practica con reactivos tipo examen.","fuente":"Fuente: FATF (2012-2026), <i>International Standards on Combating Money Laundering and the Financing of Terrorism &amp; Proliferation · The FATF Recommendations<\/i>, adoptadas por el Pleno en febrero de 2012 y actualizadas a junio de 2026. Resumen y traducción didáctica de 360Educa."},"trampas":[{"titulo":"¿Recomendación o Nota?","texto":"Muchas reglas que se estudian como «de la Recomendación» viven en su <b>Nota interpretativa<\/b>: las operaciones <b>intentadas<\/b> y <b>sin importar el monto<\/b> (INR.20), el umbral de casinos de <b>USD/EUR 3,000<\/b> (INR.22/23) o el análisis <b>operativo vs. estratégico<\/b> (INR.29). Y 11 recomendaciones no tienen Nota: 9, 11, 21, 27, 31, 33, 34, 35, 36, 37 y 39."},{"titulo":"USD/EUR 1,000 no es un umbral obligatorio de pagos.","texto":"Desde la revisión de junio de 2025, la Nota a la R.16 dice que los países <b>pueden<\/b> adoptar un umbral <i>de minimis<\/i> <b>no mayor a<\/b> USD/EUR 1,000 (INR.16, párrs. 8 y 10). En cambio, para los PSAV el umbral de DDC en operaciones ocasionales <b>es<\/b> USD/EUR 1,000 (INR.15, párr. 7a)."},{"titulo":"R.6 ≠ R.7.","texto":"Las dos congelan <b>sin demora<\/b>. En terrorismo (R.6) designa el Consejo de Seguridad (1267 y sucesoras) <b>o el propio país<\/b> (1373); en proliferación (R.7), el Consejo de Seguridad o sus Comités. La obligación de congelar «sin demora» está en ambas Recomendaciones y se repite en sus Notas, pero su <b>definición<\/b> (idealmente, en cuestión de horas) está en el <b>Glosario<\/b>."}],"secciones":[{"tipo":"mapa","id":"mapa","nav":"Las 40","titulo":"Las 40 en sus 7 secciones","intro":"Las 7 secciones oficiales del GAFI, en su orden: 2 · 2 · 4 · 15 · 2 · 10 · 5 = 40. Cada tarjeta dice si tiene Nota interpretativa, su subgrupo oficial (cuando lo hay) y un verbo para recitar. Borde grueso: las más preguntadas. Activa el Modo recitar y di el nombre a partir del número.","centro":{"t":"Recomendaciones del GAFI","s":"40 en 7 secciones<br>29 con Nota"},"ramas":[{"letra":"A","titulo":"Políticas y coordinación","pregunta":"¿Cómo se organiza el país contra el LD/FT?","corto":"A · Políticas","ritmo":"Riesgos y coordinación","color":"morado","items":[{"etiqueta":"R.1","nombre":"Evaluación de riesgos y enfoque basado en riesgo","sub":"Con Nota","verbo":"Evalúo","desc":"El país identifica, evalúa y entiende sus riesgos de LD, FT y financiamiento a la proliferación y aplica medidas proporcionales. Exige lo mismo a IF y APNFD.","orden":1,"panel":"Recomendación 1","puntos":["<b>País:<\/b> identificar, evaluar y entender sus riesgos de LD/FT; designar una autoridad o mecanismo que coordine y asignar recursos para mitigarlos (R.1).","Riesgo mayor → el régimen debe atenderlo. Riesgo menor → <b>permitir y alentar<\/b> medidas simplificadas, según corresponda (R.1).","<b>Riesgo de financiamiento a la proliferación<\/b> = estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7. Aun con riesgo menor, esas sanciones se implementan completas (R.1).","<b>IF y APNFD:<\/b> identificar, evaluar y tomar acciones eficaces basadas en riesgo para mitigar sus riesgos de LD, FT y FP (R.1).","<b>Sólo en la Nota:<\/b> las medidas simplificadas no se permiten cuando hay sospecha de LD/FT (INR.1, párr. 2). IF y APNFD documentan y mantienen actualizadas sus evaluaciones, aunque las autoridades u organismos autorreguladores pueden eximir de la evaluación documentada individual si los riesgos del sector están claramente identificados y entendidos (INR.1, párr. 12)."],"destacado":true,"ir":"#nota"},{"etiqueta":"R.2","nombre":"Cooperación y coordinación nacional","sub":"Con Nota","verbo":"Coordino","desc":"Políticas nacionales contra LD, FT y proliferación, informadas por los riesgos y revisadas con regularidad, con autoridades que cooperan e intercambian información.","orden":2,"panel":"Recomendación 2","puntos":["Políticas nacionales informadas por los riesgos identificados y <b>revisadas regularmente<\/b>, con una autoridad o mecanismo responsable (R.2).","Formuladores de políticas, UIF, autoridades de orden público, supervisores y demás autoridades cooperan y, cuando proceda, coordinan e intercambian información, en lo político y en lo operativo (R.2).","Incluye la compatibilidad de los requisitos PLD/FT con las reglas de <b>protección de datos y privacidad<\/b> (R.2).","<b>Nota:<\/b> marcos interinstitucionales, que pueden ser uno solo o distintos para LD, FT y FP (INR.2, párr. 1)."],"destacado":false}]},{"letra":"B","titulo":"Lavado de dinero y decomiso","pregunta":"¿Qué delito tipifico y qué bienes le quito?","corto":"B · Lavado","ritmo":"Delito y decomiso","color":"turquesa","items":[{"etiqueta":"R.3","nombre":"Delito de lavado de dinero","sub":"Con Nota","verbo":"Tipifico","desc":"El país tipifica el lavado con base en las Convenciones de Viena y Palermo y lo aplica a todos los delitos graves, para abarcar la gama más amplia de delitos precedentes.","orden":3,"panel":"Recomendación 3","puntos":["Tipificar el LD con base en la <b>Convención de Viena<\/b> (1988) y la <b>Convención de Palermo<\/b> (2000) (R.3).","Aplicarlo a <b>todos los delitos graves<\/b>, con miras a incluir la gama más amplia de delitos precedentes (R.3).","<b>Nota:<\/b> los precedentes pueden definirse por todos los delitos, por umbral, por lista o combinando. Con umbral, como mínimo: todos los delitos graves según la ley nacional, o los de pena máxima de <b>más de un año<\/b> de prisión o, si el sistema usa mínimos, los de pena mínima de <b>más de seis meses<\/b> (INR.3, párrs. 2–3).","<b>Nota:<\/b> una gama de delitos dentro de cada una de las <b>21 categorías designadas<\/b> (INR.3, párr. 4; Glosario).","<b>Nota:<\/b> para probar que los bienes son producto del delito no es necesaria una condena por el delito precedente (INR.3, párr. 4)."],"destacado":true,"ir":"#nota"},{"etiqueta":"R.4","nombre":"Decomiso y medidas provisionales","sub":"Con Nota","verbo":"Decomiso","desc":"Priorizar la recuperación de activos: identificar, congelar, incautar y decomisar bienes del delito o de valor equivalente (sin condena, sólo los del delito) y administrarlos.","orden":4,"panel":"Recomendación 4","puntos":["Políticas y marcos operativos que <b>prioricen la recuperación de activos<\/b>, en el contexto nacional e internacional (R.4).","a)–d) Identificar, rastrear y evaluar bienes; suspender o negar el consentimiento a una operación; medidas de investigación; <b>congelar e incautar<\/b> con rapidez (R.4).","e) Decomiso <b>basado en condena<\/b> de bienes del delito y de <b>valor equivalente<\/b>; f) decomiso <b>sin condena<\/b> de bienes del delito (R.4).","g)–h) Ejecutar la orden de decomiso y <b>administrar eficazmente<\/b> los bienes congelados, incautados o decomisados (R.4).","Toma en cuenta Viena, Palermo, la Convención contra la Corrupción y el Convenio contra el Financiamiento del Terrorismo (R.4)."],"destacado":true,"ir":"#pares"}]},{"letra":"C","titulo":"Financiamiento al terrorismo y a la proliferación","pregunta":"¿Cómo le corto el dinero al terrorismo y a las armas?","corto":"C · Terrorismo y proliferación","ritmo":"FT, sanciones y OSFL","color":"negro","items":[{"etiqueta":"R.5","nombre":"Delito de financiamiento al terrorismo","sub":"Con Nota","verbo":"Penalizo","desc":"Tipificar el FT con base en el Convenio de 1999: financiar actos, organizaciones o terroristas individuales, aun sin vínculo con un acto concreto. Es delito precedente de LD.","orden":5,"panel":"Recomendación 5","puntos":["Tipificar el FT con base en el <b>Convenio Internacional para la Represión de la Financiación del Terrorismo<\/b> (R.5).","Abarca financiar actos terroristas, <b>organizaciones terroristas y terroristas individuales<\/b>, aun sin vínculo con un acto específico (R.5).","Los delitos de FT deben designarse como <b>delitos precedentes<\/b> de LD (R.5).","<b>Nota:<\/b> aplica a fondos de origen <b>lícito o ilícito<\/b>; no exige que se hayan usado en un acto ni que se vinculen a uno específico (INR.5, párrs. 5–6).","<b>Nota:<\/b> incluye financiar viajes a un Estado distinto del de residencia o nacionalidad para cometer, planear, preparar o participar en actos terroristas o para dar o recibir entrenamiento; la tentativa también es delito (INR.5, párrs. 3 y 10)."],"destacado":true},{"etiqueta":"R.6","nombre":"Sanciones financieras dirigidas: terrorismo y FT","sub":"Con Nota","verbo":"Congelo","desc":"Congelar sin demora los fondos de personas designadas por el Consejo de Seguridad de la ONU (1267 y sucesoras) o por el propio país (1373), y no ponerles fondos a disposición.","orden":6,"panel":"Recomendación 6","puntos":["Regímenes de sanciones financieras dirigidas para cumplir las resoluciones del <b>Consejo de Seguridad<\/b> sobre terrorismo y FT (R.6).","<b>Congelar sin demora<\/b> y asegurar que no se pongan fondos a disposición, directa o indirectamente (R.6).","Designados (i) por el Consejo de Seguridad bajo el Capítulo VII, incluida la <b>resolución 1267<\/b> y sucesoras, o (ii) <b>por el propio país<\/b> conforme a la <b>resolución 1373<\/b> (R.6).","<b>«Sin demora»<\/b> se define en el <b>Glosario<\/b>: idealmente en cuestión de horas desde la designación; para la 1373, al tener motivos razonables para sospechar o creer que alguien es terrorista (Glosario).","<b>Actualización de junio de 2026:<\/b> al aplicar congelamientos de la ONU, los países cumplen las resoluciones 2664 (2022), 2761 (2024) y 2615 (2021), según corresponda: la exención humanitaria (INR.6, párr. 5bis y nota al pie)."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.7","nombre":"Sanciones financieras dirigidas: proliferación","sub":"Con Nota","verbo":"Freno","desc":"Congelar sin demora los fondos de personas designadas por el Consejo de Seguridad de la ONU en materia de proliferación de armas de destrucción masiva y su financiamiento.","orden":7,"panel":"Recomendación 7","puntos":["Cumplir las resoluciones del Consejo de Seguridad para prevenir, suprimir y <b>desarticular<\/b> la proliferación de armas de destrucción masiva y su financiamiento (R.7).","<b>Congelar sin demora<\/b> y no poner fondos a disposición de personas o entidades designadas (R.7).","<b>Diferencia con la R.6:<\/b> aquí las designaciones son <b>del Consejo de Seguridad<\/b> (Capítulo VII); la R.7 no prevé la designación nacional de la resolución 1373 (R.6 vs. R.7).","Se liga con la R.1: el riesgo de FP se refiere estrictamente a incumplir o evadir estas sanciones, que se implementan completas aun con riesgo menor (R.1)."],"destacado":true,"ir":"#pares"},{"etiqueta":"R.8","nombre":"Organizaciones sin fines de lucro","sub":"Con Nota","verbo":"Protejo","desc":"Identificar qué organizaciones caen en la definición de OSFL del GAFI, evaluar su riesgo de FT y aplicar medidas focalizadas y proporcionales sin estorbar su labor legítima.","orden":8,"panel":"Recomendación 8","puntos":["Identificar las organizaciones que entran en la <b>definición de OSFL del GAFI<\/b> y evaluar sus riesgos de <b>financiamiento al terrorismo<\/b> (R.8).","Medidas <b>focalizadas, proporcionales y basadas en riesgo<\/b>, sin interrumpir ni desalentar indebidamente las actividades legítimas (R.8).","Protegerlas del abuso: (a) organizaciones terroristas que se hacen pasar por legítimas; (b) entidades legítimas usadas como conducto, incluso para escapar del congelamiento; (c) desvío clandestino de fondos destinados a fines legítimos (R.8).","Ojo: la R.8 habla del riesgo de <b>FT<\/b>, no del riesgo de LD (R.8)."],"destacado":true}]},{"letra":"D","titulo":"Medidas preventivas","pregunta":"¿Qué hacen las instituciones financieras y las APNFD?","corto":"D · Preventivas","ritmo":"Instituciones y APNFD","color":"principal","items":[{"etiqueta":"R.9","nombre":"Leyes de secreto de las instituciones financieras","sub":"Sin Nota","verbo":"Abro","desc":"Una regla corta y sin Nota: las leyes de secreto de las instituciones financieras no deben impedir que se implementen las Recomendaciones del GAFI.","orden":9,"panel":"Recomendación 9","puntos":["Los países aseguran que las leyes de secreto de las IF <b>no inhiban<\/b> la implementación de las Recomendaciones (R.9).","No tiene Nota interpretativa.","Se conecta con la R.37: no negar asistencia legal mutua porque la ley obliga a IF o APNFD a guardar secreto, salvo privilegio o secreto profesional legal (R.37, inciso d)."],"destacado":false},{"etiqueta":"R.10","nombre":"Debida diligencia del cliente (DDC)","sub":"Con Nota · DDC y registros","verbo":"Conozco","desc":"Prohíbe cuentas anónimas y fija cuándo aplicar DDC y sus cuatro medidas: identificar al cliente y al beneficiario final, entender el propósito y dar seguimiento.","orden":10,"panel":"Recomendación 10","puntos":["Prohibidas las <b>cuentas anónimas<\/b> o con nombres evidentemente ficticios (R.10).","<b>Cuándo:<\/b> (i) al establecer la relación; (ii) operaciones ocasionales por encima de <b>USD/EUR 15,000<\/b> o pagos y transferencias en los supuestos de la Nota a la R.16; (iii) sospecha de LD/FT; (iv) dudas sobre datos de identificación obtenidos antes (R.10).","<b>Qué:<\/b> (a) identificar y verificar al cliente; (b) identificar al beneficiario final y tomar medidas razonables para verificarlo; (c) entender el propósito y la naturaleza de la relación; (d) debida diligencia continua (R.10).","Se aplican las cuatro medidas; su <b>alcance<\/b> se determina con enfoque basado en riesgo (R.10).","Si no puede cumplir: no abrir la cuenta, no iniciar la relación o terminarla, y <b>considerar<\/b> un reporte de operación sospechosa (R.10).","<b>Nota:<\/b> si hay sospecha y la DDC alertaría al cliente, la institución puede no continuarla y debe presentar el reporte (INR.10, párr. 3)."],"destacado":true,"ir":"#ddc"},{"etiqueta":"R.11","nombre":"Conservación de registros","sub":"Sin Nota · DDC y registros","verbo":"Conservo","desc":"Guardar al menos cinco años los registros de operaciones y la información de DDC, suficientes para reconstruir cada operación y servir de prueba.","orden":11,"panel":"Recomendación 11","puntos":["Registros de operaciones nacionales e internacionales por <b>al menos cinco años<\/b> (R.11).","Deben permitir <b>reconstruir<\/b> operaciones individuales (montos y tipo de moneda) para servir, si hace falta, de prueba (R.11).","Registros de DDC, expedientes, correspondencia y resultados de análisis: al menos cinco años <b>después de terminada la relación<\/b> o de la fecha de la operación ocasional (R.11).","Obligación <b>por ley<\/b>; disponibles para las autoridades nacionales con la autorización apropiada (R.11).","No tiene Nota interpretativa."],"destacado":false,"ir":"#ddc"},{"etiqueta":"R.12","nombre":"Personas expuestas políticamente (PEP)","sub":"Con Nota · Medidas adicionales","verbo":"Intensifico","desc":"PEP extranjeras: siempre medidas adicionales. PEP nacionales y de organismos internacionales: cuando la relación es de mayor riesgo. Incluye familiares y allegados.","orden":12,"panel":"Recomendación 12","puntos":["<b>PEP extranjeras<\/b> (cliente o beneficiario final), además de la DDC normal: (a) sistemas para detectarlas; (b) aprobación de la <b>alta dirección<\/b>; (c) medidas razonables sobre el <b>origen del patrimonio y de los fondos<\/b>; (d) monitoreo continuo intensificado (R.12).","<b>PEP nacionales<\/b> y personas con funciones prominentes en <b>organismos internacionales<\/b>: medidas razonables para determinar si lo son; si la relación es de <b>mayor riesgo<\/b>, se aplican (b), (c) y (d) (R.12).","Todo lo anterior aplica también a <b>familiares y asociados cercanos<\/b> (R.12).","<b>Nota:<\/b> en seguros de vida, determinar si el beneficiario es PEP a más tardar al momento del pago; con mayor riesgo, informar a la alta dirección antes del pago (INR.12)."],"destacado":true,"ir":"#pares"},{"etiqueta":"R.13","nombre":"Banca corresponsal","sub":"Con Nota · Medidas adicionales","verbo":"Enlazo","desc":"En corresponsalías transfronterizas: conocer al banco respondiente y sus controles, obtener aprobación de la alta dirección y nunca operar con bancos pantalla.","orden":13,"panel":"Recomendación 13","puntos":["Además de la DDC normal: (a) información suficiente sobre el respondiente, su reputación y la calidad de su supervisión; (b) evaluar sus controles PLD/FT; (c) aprobación de la <b>alta dirección<\/b> antes de nuevas relaciones; (d) entender las responsabilidades de cada institución (R.13).","(e) Cuentas de transferencias de pagos (<i>payable-through accounts<\/i>): que el respondiente haya hecho DDC a quienes acceden directamente y pueda proporcionarla a solicitud (R.13).","<b>Prohibido<\/b> iniciar o continuar corresponsalía con <b>bancos pantalla<\/b>, y cerciorarse de que los respondientes no permitan su uso (R.13).","Banco pantalla: sin presencia física en el país donde se constituyó y obtuvo licencia, y no afiliado a un grupo con supervisión consolidada efectiva (Glosario)."],"destacado":false},{"etiqueta":"R.14","nombre":"Servicios de transferencia de dinero o valores","sub":"Con Nota · Medidas adicionales","verbo":"Licencio","desc":"Quien presta servicios de transferencia de dinero o valores necesita licencia o registro y supervisión; sus agentes también, o una lista actualizada de ellos.","orden":14,"panel":"Recomendación 14","puntos":["Personas físicas o morales que prestan estos servicios: <b>licencia o registro<\/b> y sistemas eficaces de monitoreo (R.14).","Identificar a quienes operan <b>sin licencia o registro<\/b> y aplicarles sanciones (R.14).","Agentes: con licencia o registro, <b>o<\/b> el proveedor mantiene una <b>lista actualizada<\/b> accesible a las autoridades; además los incluye en sus programas PLD/FT y los monitorea (R.14).","<b>Nota:<\/b> el país no necesita imponer licencia o registro separado a quien ya tiene licencia o registro como IF que le permite prestar esos servicios y ya está sujeta a todas las obligaciones aplicables del GAFI (INR.14)."],"destacado":false},{"etiqueta":"R.15","nombre":"Nuevas tecnologías y activos virtuales","sub":"Con Nota · Medidas adicionales","verbo":"Anticipo","desc":"Evaluar los riesgos de nuevos productos y tecnologías antes de lanzarlos, y que los proveedores de servicios de activos virtuales estén regulados y con licencia o registro.","orden":15,"panel":"Recomendación 15","puntos":["Países e IF identifican y evalúan los riesgos de LD/FT de nuevos productos, prácticas comerciales, mecanismos de entrega y tecnologías (R.15).","En las IF, la evaluación ocurre <b>antes del lanzamiento<\/b> (R.15).","<b>Proveedores de servicios de activos virtuales (PSAV):<\/b> regulados para PLD/FT, con <b>licencia o registro<\/b> y supervisión eficaz (R.15).","<b>Nota:<\/b> a los PSAV les aplican las R.10 a R.21; umbral de DDC en operaciones ocasionales: <b>USD/EUR 1,000<\/b> (INR.15, párr. 7a).","<b>Nota:<\/b> la R.16 aplica a transferencias de activos virtuales: el PSAV originador obtiene, conserva y envía la información del originador y del beneficiario (INR.15, párr. 7b)."],"destacado":true,"ir":"#nota"},{"etiqueta":"R.16","nombre":"Transparencia de pagos","sub":"Con Nota · Medidas adicionales","verbo":"Acompaño","desc":"Pagos y transferencias llevan la información exacta del originador y la del beneficiario durante toda la cadena; se monitorean y se congelan los de personas designadas.","orden":16,"panel":"Recomendación 16","puntos":["Incluir información <b>requerida y exacta del originador<\/b> e información <b>requerida del beneficiario<\/b> en pagos o transferencias y mensajes relacionados (R.16).","Información estructurada en lo posible, que <b>permanece<\/b> con el pago en toda la cadena (R.16).","Monitorear para detectar pagos sin la información requerida y tomar medidas (R.16).","Congelar y prohibir operaciones con personas designadas por resoluciones sobre terrorismo (1267, 1373) y proliferación (R.16).","<b>Nota (revisión de junio de 2025):<\/b> los países <b>pueden<\/b> adoptar un umbral <i>de minimis<\/i> <b>no mayor a USD/EUR 1,000<\/b> para pagos transfronterizos (salvo retiros de efectivo) y para pagos nacionales (INR.16, párrs. 8 y 10)."],"destacado":false,"ir":"#nota"},{"etiqueta":"R.17","nombre":"Dependencia en terceros","sub":"Con Nota · Terceros, controles y grupos","verbo":"Confío","desc":"Los países pueden permitir que la institución se apoye en terceros para parte de la DDC, con condiciones; la responsabilidad final sigue siendo de quien se apoya.","orden":17,"panel":"Recomendación 17","puntos":["Los países <b>podrán<\/b> permitir apoyarse en terceros para los elementos <b>(a) a (c)<\/b> de la DDC de la R.10 o para presentar negocios (R.17).","La <b>responsabilidad última<\/b> permanece en la IF que se apoya en el tercero (R.17).","Condiciones: la IF obtiene de inmediato la información de (a)–(c); se asegura de que el tercero entregue copias sin demora a solicitud; y se cerciora de que esté regulado, supervisado o monitoreado conforme a las R.10 y R.11. Además, el país considera el riesgo país al decidir dónde puede estar el tercero (R.17).","La R.17 menciona sólo los elementos (a)–(c); el seguimiento continuo (d) no está en esa lista (R.17).","<b>Nota:<\/b> no aplica a subcontratación (<i>outsourcing<\/i>) o agencia, donde el tercero aplica los procedimientos de la propia IF (INR.17, párr. 1)."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.18","nombre":"Controles internos y sucursales y filiales extranjeras","sub":"Con Nota · Terceros, controles y grupos","verbo":"Controlo","desc":"Programas PLD/FT en cada institución y a nivel de grupo, con intercambio de información, aplicados también en sucursales y filiales mayoritarias en el extranjero.","orden":18,"panel":"Recomendación 18","puntos":["IF: implementar <b>programas<\/b> contra LD/FT. Grupos financieros: programas de grupo con políticas para <b>compartir información<\/b> (R.18).","Sucursales y filiales de propiedad mayoritaria en el extranjero aplican medidas consistentes con el país de origen (R.18).","<b>Nota:<\/b> el programa incluye (a) políticas, procedimientos y controles internos, con gestión de cumplimiento y selección de personal; (b) capacitación continua; (c) auditoría independiente (INR.18, párr. 1).","<b>Nota:<\/b> designar un <b>oficial de cumplimiento a nivel directivo<\/b> (INR.18, párr. 3).","Puede venir parafraseado: «un documento con políticas, procedimientos y controles internos» describe el programa de la R.18."],"destacado":false},{"etiqueta":"R.19","nombre":"Países de mayor riesgo","sub":"Con Nota · Terceros, controles y grupos","verbo":"Refuerzo","desc":"Debida diligencia intensificada con personas e instituciones de países señalados por el GAFI, y contramedidas proporcionales, a llamado del GAFI o por decisión propia.","orden":19,"panel":"Recomendación 19","puntos":["IF: DDC <b>intensificada<\/b> en relaciones y operaciones con personas e IF de países para los que el GAFI lo pida; eficaz y proporcional al riesgo (R.19).","Países: aplicar <b>contramedidas<\/b> cuando el GAFI lo pida y también <b>por su cuenta<\/b>, sin llamado del GAFI (R.19).","<b>Nota:<\/b> ejemplos de contramedidas: limitar relaciones u operaciones, negar sucursales o filiales, prohibir apoyarse en terceros de ese país, revisar o terminar corresponsalías (INR.19, párr. 2)."],"destacado":false},{"etiqueta":"R.20","nombre":"Reporte de operaciones sospechosas","sub":"Con Nota · Reporte","verbo":"Reporto","desc":"Si la institución sospecha, o tiene motivos razonables para sospechar, que los fondos vienen de un delito o se ligan al FT, debe reportarlo con prontitud a la UIF.","orden":20,"panel":"Recomendación 20","puntos":["Obligación <b>por ley<\/b> de reportar <b>con prontitud<\/b> a la UIF (R.20).","Disparador: sospecha o <b>motivos razonables para sospechar<\/b> que los fondos son producto de una actividad delictiva o se relacionan con FT (R.20).","<b>Nota:<\/b> se reportan todas, <b>incluidas las intentadas<\/b>, <b>sin importar el monto<\/b> (INR.20, párr. 3).","<b>Nota:<\/b> obligación directa; el «reporte indirecto» no es aceptable (INR.20, párr. 4).","<b>Nota:<\/b> «actividad delictiva» = todo delito precedente de LD o, como mínimo, los que exige la R.3 (INR.20, párr. 1)."],"destacado":true,"ir":"#nota"},{"etiqueta":"R.21","nombre":"Revelación (tipping-off) y confidencialidad","sub":"Sin Nota · Reporte","verbo":"Callo","desc":"Protección legal a quien reporta de buena fe a la UIF, aunque no sepa qué delito hay, y prohibición de revelar que se presenta un reporte.","orden":21,"panel":"Recomendación 21","puntos":["(a) Protección legal frente a responsabilidad <b>penal y civil<\/b> al reportar de <b>buena fe<\/b>, aun sin saber con precisión la actividad delictiva y sin importar si ocurrió (R.21).","(b) Prohibición legal de revelar que se presenta a la UIF un reporte o información relacionada (R.21).","Aplica a las IF, sus directivos, funcionarios y empleados (R.21).","No impide compartir información dentro del grupo conforme a la R.18 (R.21).","No tiene Nota interpretativa."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.22","nombre":"APNFD: debida diligencia","sub":"Con Nota · APNFD","verbo":"Extiendo","desc":"La DDC y los registros de las R.10, 11, 12, 15 y 17 aplican a casinos, inmobiliarias, metales y piedras, abogados, notarios, contadores y servicios fiduciarios y societarios.","orden":22,"panel":"Recomendación 22","puntos":["Aplican las R.<b>10, 11, 12, 15 y 17<\/b> (R.22).","(a) <b>Casinos<\/b>: operaciones iguales o superiores al umbral designado, que es <b>USD/EUR 3,000<\/b> (R.22; INR.22/23, párr. 1).","(b) <b>Agentes inmobiliarios<\/b>: compraventa de inmuebles; DDC a compradores y vendedores (R.22; INR.22, párr. 1).","(c) <b>Metales y piedras preciosas<\/b>: operación <b>en efectivo<\/b> igual o superior a <b>USD/EUR 15,000<\/b> (R.22; INR.22/23, párr. 1).","(d) <b>Abogados, notarios, otros profesionales jurídicos y contadores<\/b> y (e) <b>proveedores de servicios fiduciarios y societarios<\/b>: cuando preparan o realizan operaciones en las actividades listadas (R.22)."],"destacado":false,"ir":"#nota"},{"etiqueta":"R.23","nombre":"APNFD: otras medidas","sub":"Con Nota · APNFD","verbo":"Sumo","desc":"Las R.18 a 21 (controles, países de riesgo, reporte y confidencialidad) aplican a todas las APNFD, con precisiones sobre cuándo reportan profesionistas y comerciantes.","orden":23,"panel":"Recomendación 23","puntos":["Aplican las R.<b>18 a 21<\/b> a todas las APNFD (R.23).","(a) Abogados, notarios, otros profesionales jurídicos y contadores reportan cuando, por o para un cliente, realizan una <b>operación financiera<\/b> en las actividades del inciso (d) de la R.22; se alienta enfáticamente a los países a extender el reporte al resto de las actividades profesionales de los contadores, incluida la auditoría (R.23).","(b) Metales y piedras preciosas: reportan en operaciones en efectivo iguales o superiores al umbral designado (R.23).","(c) Proveedores de servicios fiduciarios y societarios: en las actividades del inciso (e) de la R.22 (R.23).","<b>Nota:<\/b> los requisitos de grupo de la R.18 aplican a grupos de APNFD con estructura como la de un grupo financiero (INR.22/23, párr. 2)."],"destacado":false}]},{"letra":"E","titulo":"Transparencia y beneficiario final","pregunta":"¿Quién está detrás de sociedades y fideicomisos?","corto":"E · Transparencia","ritmo":"Beneficiario final","color":"turquesa","items":[{"etiqueta":"R.24","nombre":"Transparencia y beneficiario final de personas morales","sub":"Con Nota","verbo":"Descubro","desc":"Información adecuada, exacta y actualizada del beneficiario final de las personas morales, que las autoridades obtengan rápido mediante un registro u otro mecanismo.","orden":24,"panel":"Recomendación 24","puntos":["Evaluar los riesgos de mal uso de personas morales y prevenirlo (R.24).","Información <b>adecuada, exacta y actualizada<\/b> sobre beneficiario final y control, obtenible <b>rápida y eficientemente<\/b> por las autoridades, mediante un <b>registro de beneficiarios finales o un mecanismo alternativo<\/b> (R.24).","No permitir nuevas <b>acciones al portador<\/b> y prevenir el mal uso de las existentes; evitar el mal uso de accionistas y directores <b>nominales<\/b> (R.24).","<b>Beneficiario final:<\/b> la(s) persona(s) física(s) que en última instancia posee(n) o controla(n); sólo una persona física puede serlo (Glosario).","<b>Nota:<\/b> el umbral para identificar accionistas controladores puede basarse en un porcentaje fijado según la evaluación de riesgo del país, con un <b>máximo de 25%<\/b> (INR.24, nota al pie 64)."],"destacado":true,"ir":"#pares"},{"etiqueta":"R.25","nombre":"Transparencia y beneficiario final de estructuras jurídicas","sub":"Con Nota","verbo":"Develo","desc":"Lo mismo, pero para fideicomisos expresos y figuras similares: información adecuada, exacta y actualizada de fideicomitentes, fiduciarios y beneficiarios.","orden":25,"panel":"Recomendación 25","puntos":["Evaluar los riesgos de mal uso de <b>estructuras jurídicas<\/b> (fideicomisos expresos y similares) y prevenirlo (R.25).","Información sobre <b>fideicomitente(s), fiduciario(s) y beneficiario(s)<\/b>, obtenible de forma eficiente y oportuna por las autoridades (R.25).","En estructuras jurídicas, el beneficiario final incluye fideicomitente, fiduciario, protector (si lo hay), beneficiarios y cualquier persona física con control efectivo último (Glosario).","Contraste: R.24 = <b>personas morales<\/b> (sociedades); R.25 = <b>estructuras jurídicas<\/b> (fideicomisos)."],"destacado":false,"ir":"#pares"}]},{"letra":"F","titulo":"Facultades y responsabilidades de las autoridades","pregunta":"¿Quién supervisa, analiza, investiga y sanciona?","corto":"F · Autoridades","ritmo":"Supervisión y UIF","color":"negro","items":[{"etiqueta":"R.26","nombre":"Regulación y supervisión de instituciones financieras","sub":"Con Nota · Regulación y supervisión","verbo":"Regulo","desc":"Las IF deben estar reguladas y supervisadas, sin criminales en su control o dirección y sin bancos pantalla. Su Nota define la supervisión basada en riesgo.","orden":26,"panel":"Recomendación 26","puntos":["IF sujetas a regulación y supervisión adecuadas y aplicando eficazmente las Recomendaciones (R.26).","Impedir que criminales o sus asociados tengan participación significativa o de control, sean beneficiarios finales o ejerzan funciones de dirección (R.26).","No aprobar el establecimiento ni la operación continua de <b>bancos pantalla<\/b> (R.26).","IF sujetas a los Principios Básicos: las medidas prudenciales relevantes aplican también para PLD/FT, incluida la supervisión consolidada de grupo. Transferencia de dinero y cambio de divisas: como mínimo, licencia o registro (R.26).","<b>Nota:<\/b> el <b>enfoque basado en riesgo de la supervisión<\/b> es cómo el supervisor asigna sus recursos y supervisa a quien aplica EBR; frecuencia e intensidad según los riesgos (INR.26, párrs. 1–2)."],"destacado":true,"ir":"#pares"},{"etiqueta":"R.27","nombre":"Facultades de los supervisores","sub":"Sin Nota · Regulación y supervisión","verbo":"Inspecciono","desc":"El supervisor puede inspeccionar, exigir cualquier información pertinente e imponer sanciones disciplinarias y financieras, hasta retirar, restringir o suspender la licencia.","orden":27,"panel":"Recomendación 27","puntos":["Facultades para supervisar o monitorear y asegurar el cumplimiento, incluida la <b>realización de inspecciones<\/b> (R.27).","<b>Obligar a entregar<\/b> cualquier información relevante para monitorear el cumplimiento (R.27).","Imponer sanciones conforme a la R.35: disciplinarias y financieras, incluso <b>retirar, restringir o suspender la licencia<\/b>, cuando proceda (R.27).","No tiene Nota interpretativa."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.28","nombre":"Regulación y supervisión de APNFD","sub":"Con Nota · Regulación y supervisión","verbo":"Superviso","desc":"Casinos con régimen integral y licencia; las demás APNFD con monitoreo sensible al riesgo, a cargo de un supervisor o de un organismo autorregulador.","orden":28,"panel":"Recomendación 28","puntos":["(a) <b>Casinos<\/b>: régimen integral; como mínimo <b>licencia<\/b>, impedir que criminales los controlen u operen y supervisión efectiva (R.28).","(b) Demás APNFD: sistemas eficaces de monitoreo <b>sensibles al riesgo<\/b>, por un <b>supervisor<\/b> o un <b>organismo autorregulador<\/b> (R.28).","Impedir que criminales se acrediten profesionalmente o controlen; por ejemplo, con una prueba de idoneidad (<i>fit and proper<\/i>) (R.28).","Sanciones efectivas, proporcionales y disuasivas, conforme a la R.35 (R.28).","<b>Nota:<\/b> define también el enfoque basado en riesgo de la supervisión de APNFD (INR.28, párr. 1)."],"destacado":false},{"etiqueta":"R.29","nombre":"Unidades de inteligencia financiera (UIF)","sub":"Con Nota · Operativas y de orden público","verbo":"Analizo","desc":"Cada país tiene una UIF: centro nacional que recibe y analiza reportes de operaciones sospechosas y otra información, y disemina los resultados.","orden":29,"panel":"Recomendación 29","puntos":["Centro nacional para <b>recibir y analizar<\/b> (a) reportes de operaciones sospechosas y (b) otra información relevante sobre LD, delitos precedentes y FT, y para <b>diseminar<\/b> los resultados (R.29).","Puede obtener información adicional de los sujetos obligados y acceder oportunamente a información financiera, administrativa y policial (R.29).","<b>Nota · análisis operativo:<\/b> identifica <b>objetivos específicos<\/b> (personas, bienes, redes), sigue el rastro de operaciones y determina vínculos con el delito (INR.29, párr. 3).","<b>Nota · análisis estratégico:<\/b> identifica <b>tendencias y patrones<\/b> de LD/FT para determinar amenazas y vulnerabilidades y apoyar políticas (INR.29, párr. 3).","<b>Nota:<\/b> disemina <b>espontáneamente y a solicitud<\/b>; la decisión de analizar o diseminar sigue siendo de la UIF, que debe ser operativamente independiente y autónoma (INR.29, párrs. 4 y 8)."],"destacado":true,"ir":"#nota"},{"etiqueta":"R.30","nombre":"Responsabilidades de las autoridades de investigación","sub":"Con Nota · Operativas y de orden público","verbo":"Investigo","desc":"Autoridades designadas investigan LD y FT y, al menos en delitos que generan grandes ganancias, desarrollan una investigación financiera paralela y proactiva.","orden":30,"panel":"Recomendación 30","puntos":["Autoridades de orden público designadas, responsables de investigar LD/FT dentro de las políticas nacionales (R.30).","Al menos en delitos que generan <b>ganancias importantes<\/b>: investigación financiera <b>paralela y proactiva<\/b>, incluso si el delito precedente ocurrió en el extranjero (R.30).","Autoridades para identificar, rastrear e iniciar con rapidez el <b>congelamiento e incautación<\/b> de bienes (R.30).","Grupos multidisciplinarios permanentes o temporales e investigaciones cooperativas con otros países, cuando sea necesario (R.30).","<b>Nota:<\/b> investigación financiera paralela = la investigación financiera que se realiza junto con la investigación penal tradicional (INR.30, párr. 3)."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.31","nombre":"Facultades de las autoridades de investigación","sub":"Sin Nota · Operativas y de orden público","verbo":"Obtengo","desc":"Quien investiga accede a documentos e información, usa medidas obligatorias y técnicas como operaciones encubiertas o entregas vigiladas, e identifica activos sin avisar.","orden":31,"panel":"Recomendación 31","puntos":["Acceso a todos los documentos e información necesarios, con <b>medidas obligatorias<\/b>: exigir registros, registrar personas y lugares, tomar declaraciones e incautar pruebas (R.31).","Técnicas de investigación: <b>operaciones encubiertas, intervención de comunicaciones, acceso a sistemas informáticos y entrega vigilada<\/b> (R.31).","Acceso oportuno a información: beneficiario final, información fiscal, registros de bienes, de ciudadanía, residencia o beneficios sociales (R.31).","Mecanismos para saber a tiempo si alguien tiene o controla cuentas, e identificar activos <b>sin notificar previamente<\/b> al dueño; pedir información a la UIF (R.31).","No tiene Nota interpretativa (a diferencia de la R.30)."],"destacado":true,"ir":"#pares"},{"etiqueta":"R.32","nombre":"Transporte transfronterizo de efectivo","sub":"Con Nota · Operativas y de orden público","verbo":"Declaro","desc":"Detectar en frontera el transporte físico de efectivo e instrumentos negociables al portador, con declaración o revelación, y poder detenerlo, sancionar y decomisar.","orden":32,"panel":"Recomendación 32","puntos":["Sistema de <b>declaración y/o revelación<\/b> para detectar el transporte físico transfronterizo de efectivo e instrumentos negociables al portador (R.32).","Facultad para detener o retener si hay sospecha de FT, LD o delitos precedentes, o si hubo declaración o revelación falsa (R.32).","Sanciones efectivas, proporcionales y disuasivas por declaración falsa, y decomiso conforme a la R.4 (R.32).","<b>Nota:<\/b> en el sistema de declaración, el umbral preestablecido es de <b>máximo USD/EUR 15,000<\/b> (INR.32, párr. 3).","<b>Nota:<\/b> no es obligatorio usar el mismo sistema para entradas y salidas (INR.32, párr. 2)."],"destacado":false},{"etiqueta":"R.33","nombre":"Estadísticas","sub":"Sin Nota · Requisitos generales","verbo":"Cuento","desc":"Estadísticas completas sobre la eficacia del sistema: reportes recibidos y diseminados, investigaciones, procesos, condenas, bienes y cooperación internacional.","orden":33,"panel":"Recomendación 33","puntos":["Estadísticas integrales sobre la eficacia y eficiencia del sistema PLD/FT (R.33).","Incluyen: reportes de operaciones sospechosas recibidos y diseminados; investigaciones, procesos y condenas; bienes congelados, incautados y decomisados; asistencia legal mutua y otras solicitudes internacionales (R.33).","No tiene Nota interpretativa."],"destacado":false},{"etiqueta":"R.34","nombre":"Guía y retroalimentación","sub":"Sin Nota · Requisitos generales","verbo":"Guío","desc":"Autoridades, supervisores y organismos autorreguladores emiten guías y dan retroalimentación a IF y APNFD, sobre todo para detectar y reportar operaciones sospechosas.","orden":34,"panel":"Recomendación 34","puntos":["Autoridades competentes, supervisores y organismos autorreguladores establecen <b>guías<\/b> y dan <b>retroalimentación<\/b> (R.34).","Objetivo: ayudar a IF y APNFD a aplicar las medidas nacionales y, en particular, a <b>detectar y reportar<\/b> operaciones sospechosas (R.34).","Puede venir parafraseada como «lineamientos» u «orientación» del supervisor.","No tiene Nota interpretativa."],"destacado":false},{"etiqueta":"R.35","nombre":"Sanciones","sub":"Sin Nota · Sanciones","verbo":"Sanciono","desc":"Sanciones efectivas, proporcionales y disuasivas, penales, civiles o administrativas, para quien incumpla las R.6 y 8 a 23, incluidos directores y alta dirección.","orden":35,"panel":"Recomendación 35","puntos":["Gama de sanciones <b>efectivas, proporcionales y disuasivas<\/b>: penales, civiles o administrativas (R.35).","Para personas físicas o morales cubiertas por las R.<b>6 y 8 a 23<\/b> que incumplan (R.35).","Aplicables no sólo a IF y APNFD, sino también a sus <b>directores y alta dirección<\/b> (R.35).","No tiene Nota interpretativa."],"destacado":false}]},{"letra":"G","titulo":"Cooperación internacional","pregunta":"¿Cómo cooperan los países entre sí?","corto":"G · Cooperación","ritmo":"Entre países","color":"morado","items":[{"etiqueta":"R.36","nombre":"Instrumentos internacionales","sub":"Sin Nota","verbo":"Ratifico","desc":"Ser parte e implementar las Convenciones de Viena 1988, Palermo 2000 y contra la Corrupción 2003, y el Convenio contra el Financiamiento del Terrorismo 1999.","orden":36,"panel":"Recomendación 36","puntos":["Medidas inmediatas para ser parte e implementar plenamente: <b>Viena 1988<\/b>, <b>Palermo 2000<\/b>, <b>Convención de la ONU contra la Corrupción 2003<\/b> y <b>Convenio contra el Financiamiento del Terrorismo 1999<\/b> (R.36).","Se alienta ratificar otras, cuando aplique: Convenio sobre Ciberdelincuencia 2001, Convención Interamericana contra el Terrorismo 2002 y Convenio del Consejo de Europa de 2005 (R.36).","No tiene Nota interpretativa."],"destacado":false},{"etiqueta":"R.37","nombre":"Asistencia legal mutua","sub":"Sin Nota","verbo":"Asisto","desc":"Dar con rapidez la más amplia asistencia legal mutua en investigaciones y procesos de LD, FT y delitos precedentes, sin condiciones indebidas ni excusas fiscales o de secreto.","orden":37,"panel":"Recomendación 37","puntos":["La gama <b>más amplia posible<\/b> de asistencia legal mutua, de forma rápida, constructiva y eficaz (R.37).","No negarla <b>sólo<\/b> porque el delito involucra asuntos <b>fiscales<\/b>, ni por leyes de <b>secreto<\/b> de IF o APNFD, salvo privilegio o secreto profesional legal (R.37, incisos c y d).","Autoridad central, sistema de gestión de casos y confidencialidad de las solicitudes (R.37, incisos b y e).","Asistencia <b>aun sin doble incriminación<\/b> si no implica acciones coercitivas; cuando se exija, basta que ambos países penalicen la conducta subyacente (R.37).","No tiene Nota interpretativa."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.38","nombre":"Asistencia legal mutua: congelamiento y decomiso","sub":"Con Nota","verbo":"Recupero","desc":"Actuar rápido ante solicitudes extranjeras para identificar, congelar, incautar y decomisar bienes, reconocer órdenes de otros países y compartir o devolver lo decomisado.","orden":38,"panel":"Recomendación 38","puntos":["Responder con rapidez a solicitudes para identificar, rastrear, evaluar, investigar, congelar, incautar y decomisar bienes del delito y de <b>valor equivalente<\/b> (R.38).","<b>Reconocer y ejecutar<\/b> órdenes extranjeras de congelamiento, incautación o decomiso (R.38).","Administrar los bienes en todas las etapas y <b>compartir o devolver<\/b> lo decomisado (R.38).","<b>Nota:<\/b> incluye solicitudes basadas en decomiso <b>con y sin condena<\/b>, como en la R.4 (INR.38, párr. 1).","Es el espejo internacional de la R.4."],"destacado":false,"ir":"#pares"},{"etiqueta":"R.39","nombre":"Extradición","sub":"Sin Nota","verbo":"Extradito","desc":"Ejecutar extradiciones por LD y FT sin demora indebida; si un país no extradita a sus nacionales, somete el caso a sus propias autoridades para procesarlo.","orden":39,"panel":"Recomendación 39","puntos":["LD y FT deben ser delitos <b>extraditables<\/b> (R.39, inciso a).","Procesos claros y eficientes, con priorización y gestión de casos, sin condiciones irrazonables (R.39).","Extraditar a sus nacionales <b>o<\/b>, si no lo hace sólo por nacionalidad, someter el caso sin demora a sus autoridades para su procesamiento (R.39).","Mecanismos simplificados: transmisión directa de solicitudes de detención provisional, extradición con base sólo en órdenes de aprehensión o sentencias, y extradición simplificada de quien renuncia al procedimiento formal (R.39).","No tiene Nota interpretativa."],"destacado":false},{"etiqueta":"R.40","nombre":"Otras formas de cooperación internacional","sub":"Con Nota","verbo":"Coopero","desc":"Las autoridades competentes cooperan de forma rápida y amplia, espontáneamente y a solicitud, con base legal, por los medios más eficientes y con memorandos si hacen falta.","orden":40,"panel":"Recomendación 40","puntos":["La gama más amplia de cooperación internacional en LD, delitos precedentes y FT, <b>espontáneamente y a solicitud<\/b>, con base legal (R.40).","Usar los medios más eficientes; si hacen falta acuerdos o memorandos de entendimiento, negociarlos y firmarlos a tiempo (R.40).","Canales claros, priorización, ejecución oportuna y resguardo de la información recibida (R.40).","<b>Nota:<\/b> no negar asistencia porque la solicitud también involucre asuntos fiscales, ni por leyes de secreto de IF o APNFD (salvo privilegio o secreto profesional legal), ni porque la contraparte sea de distinta naturaleza (INR.40, párr. 2); reglas específicas para intercambios entre UIF, entre supervisores financieros y entre autoridades de orden público (INR.40, sección B)."],"destacado":false,"ir":"#pares"}]}],"frase":{"titulo":"Para recitar en voz alta: un verbo por recomendación"}},{"tipo":"pasos","id":"ddc","nav":"La cadena DDC","titulo":"La cadena de debida diligencia, de la R.10 a la R.21","intro":"Orden didáctico, no legal: la R.10 fija cuándo y qué medidas aplicar, pero no un orden de pasos. Los pasos 6 y 7 sólo ocurren cuando se da su supuesto.","pasos":[{"nombre":"¿Cuándo aplico DDC?","ref":"R.10 · R.22 · INR.15","gancho":"Relación, ocasional, sospecha o duda.","puntos":["(i) Al establecer una relación de negocios.","(ii) Operaciones ocasionales por encima de <b>USD/EUR 15,000<\/b>, o pagos y transferencias en los supuestos de la Nota a la R.16 (R.10; INR.10, párr. 22).","(iii) Cuando hay <b>sospecha<\/b> de LD/FT, sin importar exenciones o umbrales (R.10; INR.10, párr. 1).","(iv) Cuando hay dudas sobre la veracidad o suficiencia de datos de identificación obtenidos antes (R.10).","APNFD: casinos, operaciones iguales o superiores a USD/EUR 3,000; metales y piedras preciosas, operaciones en efectivo iguales o superiores a USD/EUR 15,000 (INR.22/23, párr. 1). PSAV: operaciones ocasionales por encima de USD/EUR 1,000 (INR.15, párr. 7a)."]},{"nombre":"Identifico y verifico al cliente","ref":"R.10 (a)","gancho":"¿Quién es?","puntos":["Identificar al cliente y verificar su identidad con documentos, datos o información <b>confiables e independientes<\/b> (R.10).","Prohibidas las cuentas anónimas o con nombres evidentemente ficticios (R.10).","Verificar <b>antes o durante<\/b> el establecimiento de la relación; los países pueden permitir completarla lo antes posible después, si el riesgo se gestiona eficazmente y es esencial para no interrumpir el negocio (R.10)."]},{"nombre":"Identifico al beneficiario final","ref":"R.10 (b) · R.24 · R.25","gancho":"¿Quién está detrás?","puntos":["Identificar al beneficiario final y tomar <b>medidas razonables<\/b> para verificarlo (R.10).","En personas morales y estructuras jurídicas: entender la <b>estructura de propiedad y control<\/b> (R.10).","Sólo una persona física puede ser beneficiario final (Glosario).","Umbral de accionistas controladores: puede basarse en un porcentaje, con un máximo de 25% (INR.24, nota al pie 64)."]},{"nombre":"Entiendo el propósito","ref":"R.10 (c)","gancho":"¿Para qué quiere la relación?","puntos":["Entender y, según corresponda, obtener información sobre el <b>propósito y la naturaleza<\/b> que se pretende dar a la relación (R.10)."]},{"nombre":"Doy seguimiento continuo","ref":"R.10 (d)","gancho":"¿Lo que hace cuadra con lo que sé?","puntos":["Escrutar las operaciones durante la relación para asegurar que sean consistentes con el conocimiento del cliente, su negocio y su perfil de riesgo, incluido, cuando sea necesario, el <b>origen de los fondos<\/b> (R.10).","Mantener actualizados los datos de DDC, sobre todo en categorías de mayor riesgo (INR.10, párr. 23)."]},{"nombre":"Ajusto por riesgo","ref":"R.1 · R.10 · R.12 · R.13 · R.19","gancho":"¿Intensifico o simplifico?","puntos":["Se aplican las cuatro medidas; su <b>alcance<\/b> cambia con el enfoque basado en riesgo (R.10).","Intensificar: PEP (R.12), corresponsalía transfronteriza (R.13), países señalados por el GAFI (R.19).","Simplificar: permitido y alentado si el riesgo es menor, pero <b>nunca con sospecha<\/b> de LD/FT ni cuando aplican escenarios específicos de mayor riesgo (INR.10, párr. 21)."]},{"nombre":"¿Y si no puedo completarla?","ref":"R.10 · INR.10","gancho":"No abro o termino, y considero reportar.","puntos":["No abrir la cuenta, no iniciar la relación o no realizar la operación; o terminar la relación (R.10).","<b>Considerar<\/b> presentar un reporte de operación sospechosa (R.10).","Si la DDC alertaría al cliente sospechoso, se puede no continuarla y se presenta el reporte (INR.10, párr. 3)."]},{"nombre":"Conservo","ref":"R.11","gancho":"Cinco años y reconstruible.","puntos":["Operaciones: al menos <b>cinco años<\/b>, con detalle suficiente para reconstruirlas (R.11).","DDC, expedientes, correspondencia y análisis: al menos cinco años <b>después de terminada la relación<\/b> o de la operación ocasional (R.11)."]},{"nombre":"Reporto y no aviso","ref":"R.20 · R.21","gancho":"Con prontitud a la UIF; silencio ante el cliente.","puntos":["Reportar <b>con prontitud<\/b> a la UIF cuando hay sospecha o motivos razonables para sospechar (R.20).","Incluidas las operaciones intentadas y sin importar el monto (INR.20, párr. 3).","Protección legal por reportar de buena fe y prohibición de revelar el reporte (R.21)."]}],"frase":{"titulo":"La cadena en una frase","html":"<b>¿Cuándo?<\/b> → <b>¿Quién es?<\/b> → <b>¿Quién está detrás?<\/b> → <b>¿Para qué?<\/b> → <b>¿Cuadra?<\/b> → <b>¿Más o menos riesgo?<\/b> → <b>¿Puedo?<\/b> → <b>Guardo<\/b> → <b>Reporto y callo<\/b>"}},{"tipo":"tarjetas","id":"nota","nav":"¿Recomendación o Nota?","titulo":"¿Está en la Recomendación o en la Nota?","intro":"El examen cambia una sola palabra de lugar. Aquí, lo que dice el texto de cada recomendación frente a lo que agrega su Nota interpretativa.","tarjetas":[{"encabezado":true,"color":"morado","titulo":"R.1 · Riesgos","subtitulo":"Simplificadas y sospecha","filas":[{"k":"Recomendación","v":"Riesgo menor → permitir y alentar medidas simplificadas, según corresponda."},{"k":"Nota","v":"Nunca simplificadas si hay <b>sospecha<\/b> de LD/FT (INR.1, párr. 2; INR.10, párr. 21). Los países <b>pueden<\/b> exentar de algunas Recomendaciones con riesgo bajo: (a) en circunstancias limitadas y justificadas, para un tipo concreto de IF, actividad o APNFD, o (b) cuando una actividad financiera (distinta de transferir dinero o valores) es ocasional o muy limitada (INR.1, párr. 8)."}]},{"encabezado":true,"color":"turquesa","titulo":"R.3 · Lavado","subtitulo":"Delitos precedentes","filas":[{"k":"Recomendación","v":"Viena y Palermo; todos los delitos graves; la gama más amplia de precedentes."},{"k":"Nota","v":"Métodos para definirlos; con umbral: delitos graves de la ley nacional, o pena máxima de más de 1 año, o mínima de más de 6 meses; 21 categorías designadas; no se exige condena por el precedente (INR.3)."}]},{"encabezado":true,"color":"negro","titulo":"R.5 · Financiamiento al terrorismo","subtitulo":"Qué fondos","filas":[{"k":"Recomendación","v":"Financiar actos, organizaciones y terroristas individuales, aun sin vínculo con un acto específico."},{"k":"Nota","v":"Fondos de origen <b>lícito o ilícito<\/b>; no se exige que se usen en un acto; incluye financiar viajes; la tentativa es delito (INR.5, párrs. 3, 5, 6 y 10)."}]},{"encabezado":true,"color":"negro","titulo":"R.6 · Sanciones por terrorismo","subtitulo":"«Sin demora»","filas":[{"k":"Recomendación","v":"Congelar sin demora; designaciones de la ONU (1267) o nacionales (1373)."},{"k":"Nota","v":"«Sin demora» se define en el <b>Glosario<\/b> (idealmente, horas). La exención humanitaria (resoluciones 2664, 2761 y 2615) está en la Nota, párr. 5bis (junio de 2026)."}]},{"encabezado":true,"color":"principal","titulo":"R.10 y R.22 · Umbrales de DDC","subtitulo":"Qué número y dónde","filas":[{"k":"Recomendación","v":"La R.10 trae en su texto <b>USD/EUR 15,000<\/b>. La R.22 sólo dice «umbral designado aplicable»."},{"k":"Nota","v":"Casinos <b>USD/EUR 3,000<\/b> y metales y piedras en efectivo <b>USD/EUR 15,000<\/b>: Nota a las R.22 y 23. PSAV <b>USD/EUR 1,000<\/b>: Nota a la R.15."}]},{"encabezado":true,"color":"principal","titulo":"R.16 · Transparencia de pagos","subtitulo":"El umbral de 1,000","filas":[{"k":"Recomendación","v":"Información exacta del originador y requerida del beneficiario en toda la cadena; monitoreo y congelamiento."},{"k":"Nota","v":"Umbral <i>de minimis<\/i> <b>opcional<\/b>, no mayor a USD/EUR 1,000, para pagos transfronterizos y nacionales (INR.16, párrs. 8 y 10)."}]},{"encabezado":true,"color":"principal","titulo":"R.18 · Controles internos","subtitulo":"Qué lleva el programa","filas":[{"k":"Recomendación","v":"Programas PLD/FT, programas de grupo e intercambio de información; sucursales y filiales mayoritarias en el extranjero."},{"k":"Nota","v":"Políticas y controles con selección de personal, capacitación continua y auditoría independiente; <b>oficial de cumplimiento a nivel directivo<\/b> (INR.18, párrs. 1 y 3)."}]},{"encabezado":true,"color":"principal","titulo":"R.20 · Reporte","subtitulo":"Intentadas y monto","filas":[{"k":"Recomendación","v":"Sospecha o motivos razonables para sospechar → reportar con prontitud a la UIF, por ley."},{"k":"Nota","v":"Incluidas las <b>intentadas<\/b> y <b>sin importar el monto<\/b>; obligación directa, nunca «reporte indirecto» (INR.20, párrs. 3 y 4)."}]},{"encabezado":true,"color":"turquesa","titulo":"R.24 · Beneficiario final","subtitulo":"El 25%","filas":[{"k":"Recomendación","v":"Registro de beneficiarios finales o mecanismo alternativo; sin nuevas acciones al portador; cuidado con los nominales."},{"k":"Nota","v":"Enfoque de múltiples vías (INR.24, párr. 7); umbral de accionistas controladores con un <b>máximo de 25%<\/b> (INR.24, nota al pie 64)."}]},{"encabezado":true,"color":"negro","titulo":"R.26 · Supervisión de IF","subtitulo":"EBR del supervisor","filas":[{"k":"Recomendación","v":"Regulación y supervisión; sin criminales en el control; sin bancos pantalla."},{"k":"Nota","v":"Qué es el <b>enfoque basado en riesgo de la supervisión<\/b>: cómo el supervisor asigna recursos y define frecuencia e intensidad (INR.26, párrs. 1–2)."}]},{"encabezado":true,"color":"negro","titulo":"R.29 · UIF","subtitulo":"Dos tipos de análisis","filas":[{"k":"Recomendación","v":"Recibe, analiza y disemina; obtiene información adicional de los sujetos obligados."},{"k":"Nota","v":"Análisis <b>operativo<\/b> (objetivos específicos) vs. <b>estratégico<\/b> (tendencias y patrones); diseminación espontánea y a solicitud; independencia operativa (INR.29, párrs. 3, 4 y 8)."}]},{"encabezado":true,"color":"negro","titulo":"R.32 · Efectivo en frontera","subtitulo":"El umbral","filas":[{"k":"Recomendación","v":"Declaración y/o revelación; detener, sancionar y decomisar."},{"k":"Nota","v":"En el sistema de declaración, umbral preestablecido de <b>máximo USD/EUR 15,000<\/b> (INR.32, párr. 3)."}]}],"nota":"<b>Sin Nota interpretativa:<\/b> R.9, 11, 21, 27, 31, 33, 34, 35, 36, 37 y 39. Si una opción cita «la Nota a la R.31», esa opción es falsa."},{"tipo":"tarjetas","id":"pares","nav":"Parejas que confunden","titulo":"Parejas que el examen mezcla","intro":"Mismo tema, dos recomendaciones. Aprende la diferencia en una línea.","tarjetas":[{"barra":true,"color":"negro","titulo":"Terrorismo vs. proliferación","ref":"R.6 · R.7","html":"Ambas: congelar <b>sin demora<\/b>. R.6: designa el Consejo de Seguridad (1267) <b>o el país<\/b> (1373). R.7: designa el Consejo de Seguridad."},{"barra":true,"color":"turquesa","titulo":"Lavado vs. financiamiento al terrorismo","ref":"R.3 · R.5","html":"R.3: Viena y Palermo, delitos precedentes. R.5: Convenio de 1999; el FT es delito precedente de LD. Su Nota agrega que abarca fondos <b>lícitos o ilícitos<\/b> (INR.5, párr. 5)."},{"barra":true,"color":"morado","titulo":"Decomiso en casa vs. a petición de otro país","ref":"R.4 · R.38","html":"R.4: el país identifica, congela, incauta y decomisa. R.38: responde a solicitudes extranjeras y <b>ejecuta órdenes<\/b> de otros países."},{"barra":true,"color":"principal","titulo":"Instituciones financieras vs. APNFD","ref":"R.10 · R.22","html":"R.10: DDC de IF; ocasionales por encima de USD/EUR 15,000. R.22: la misma DDC para APNFD en supuestos específicos; los montos están en la Nota (INR.22/23): casinos desde 3,000; metales y piedras en efectivo desde 15,000."},{"barra":true,"color":"principal","titulo":"PEP extranjera vs. nacional","ref":"R.12","html":"Extranjera: medidas adicionales <b>siempre<\/b>. Nacional o de organismo internacional: medidas razonables para detectarla y, si la relación es de <b>mayor riesgo<\/b>, las medidas adicionales."},{"barra":true,"color":"principal","titulo":"Apoyarse en terceros vs. subcontratar","ref":"R.17 · INR.17","html":"En la R.17 el tercero aplica <b>sus propios<\/b> procedimientos y la responsabilidad última queda en la IF. En la subcontratación o agencia, el tercero aplica los procedimientos <b>de la IF<\/b>; la R.17 no aplica."},{"barra":true,"color":"principal","titulo":"Reportar vs. callar","ref":"R.20 · R.21","html":"R.20: reportar con prontitud a la UIF. R.21: protección legal a quien reporta de buena fe y <b>prohibición de revelar<\/b> el reporte."},{"barra":true,"color":"turquesa","titulo":"Personas morales vs. estructuras jurídicas","ref":"R.24 · R.25","html":"R.24: sociedades y demás personas morales (acciones al portador, nominales, registro). R.25: fideicomisos expresos y figuras similares (fideicomitente, fiduciario, beneficiarios)."},{"barra":true,"color":"negro","titulo":"Supervisar IF, facultades y APNFD","ref":"R.26 · R.27 · R.28","html":"R.26: regulación y supervisión de <b>IF<\/b>. R.27: <b>facultades<\/b> del supervisor (inspeccionar, exigir información, sancionar). R.28: regulación y supervisión de <b>APNFD<\/b>."},{"barra":true,"color":"negro","titulo":"Responsabilidades vs. facultades de quien investiga","ref":"R.30 · R.31","html":"R.30: <b>quién<\/b> investiga y la investigación financiera paralela. R.31: <b>qué puede hacer<\/b> (medidas obligatorias, operaciones encubiertas, entrega vigilada). La R.31 no tiene Nota."},{"barra":true,"color":"morado","titulo":"Asistencia legal mutua vs. otras formas de cooperación","ref":"R.37 · R.40","html":"R.37: asistencia legal mutua en investigaciones y procesos. R.40: cooperación entre autoridades (UIF, supervisores, orden público), espontánea y a solicitud."},{"barra":true,"color":"oscuro","titulo":"EBR del país y la institución vs. EBR del supervisor","ref":"R.1 · INR.26","html":"R.1: el país y las instituciones evalúan riesgos y ajustan medidas. INR.26: el supervisor asigna sus recursos y fija frecuencia e intensidad de la supervisión según los riesgos."}]},{"tipo":"cifras","id":"cifras","nav":"Umbrales","titulo":"Umbrales y cifras que preguntan","intro":"Cada número con su fuente: Recomendación, Nota interpretativa o Glosario.","cifras":[["40","recomendaciones","En 7 secciones, de la A a la G","Adoptadas en feb-2012 · actualizadas a jun-2026"],["29","con Nota","Tienen Nota interpretativa; 11 no la tienen","Lista de las Recomendaciones (asterisco)"],["15,000","USD/EUR","DDC en operaciones ocasionales de instituciones financieras","R.10 · INR.10, párr. 22"],["3,000","USD/EUR","Casinos: DDC cuando el cliente opera por esa cantidad o más","INR.22/23, párr. 1 · INR.22, párr. 2"],["15,000","USD/EUR","Metales y piedras preciosas: operación en efectivo igual o superior","INR.22/23, párr. 1"],["1,000","USD/EUR","DDC en operaciones ocasionales de proveedores de activos virtuales","INR.15, párr. 7(a)"],["≤1,000","USD/EUR","Umbral de minimis opcional para pagos y transferencias","INR.16, párrs. 8 y 10"],["5","años","Mínimo para conservar registros (DDC: desde que termina la relación o la operación ocasional)","R.11"],["15,000","USD/EUR","Máximo del umbral para declarar efectivo en frontera","INR.32, párr. 3"],["25%","máximo","Umbral de participación para identificar accionistas controladores","INR.24, nota al pie 64"],["21","categorías","Categorías designadas de delitos precedentes","Glosario · INR.3, párr. 4"],["Horas","«sin demora»","Idealmente, desde la designación de la ONU o su Comité (en la 1373: al haber motivos razonables)","Glosario"]]},{"tipo":"repaso","id":"repaso","nav":"Repaso en clase","titulo":"Repaso en clase","intro":"Salen al azar, cambian de orden y no se repiten hasta agotar el banco. Cada respuesta dice por qué es correcta y por qué fallan las otras. Flechas ← → para avanzar; R para revelar.","fallas_titulo":"Dónde se está fallando","fallas":[{"titulo":"¿Recomendación o Nota?","texto":"El examen te da el número y pide elegir el enunciado que corresponde a la Recomendación o a su <b>Nota interpretativa<\/b>. Muchos distractores son verdaderos, pero de la otra parte. Ojo: 11 no tienen Nota: 9, 11, 21, 27, 31, 33, 34, 35, 36, 37 y 39."},{"titulo":"Las que más salieron","texto":"Según quienes ya presentaron: <b>R.1, R.26, R.7, R.3, R.8, R.10<\/b>, y después R.15, R.29, R.5, R.31 y R.27. Este banco les da más preguntas a ésas."},{"titulo":"Parejas que se confunden","texto":"R.6 y R.7 · R.3 y R.5 · R.4 y R.38 · R.20 y R.21 · R.26, R.27 y R.28 · R.30 y R.31 · R.37 y R.40 · apoyarse en terceros (R.17) contra subcontratar."},{"titulo":"Cifras cruzadas","texto":"<b>15,000<\/b>: operaciones ocasionales (R.10) y tope para declarar en frontera (INR.32). <b>3,000<\/b>: casinos (INR.22/23). <b>1,000<\/b>: PSAV (INR.15) y tope del umbral <i>de minimis<\/i> de pagos (INR.16). <b>Cinco años<\/b>: registros (R.11)."},{"titulo":"Palabras que cambian la respuesta","texto":"«Considerar» un reporte no es presentarlo siempre (R.10). «Permitir y alentar» medidas simplificadas no es imponerlas (R.1). Los países «podrán» permitir apoyarse en terceros (R.17). Des onales, en el <b>texto<\/b> de la R.10. 3,000: casinos (INR.22/23). 1,000: PSAV (INR.15).","G009":"Para probar que los bienes vienen del delito <b>no<\/b> se necesita condena por el delito precedente (INR.3). La R.3 tipifica el LD con base en Viena y Palermo.","G001":"Riesgo menor: el país <b>permite y alienta<\/b> medidas simplificadas, según corresponda. Nunca con sospecha de LD/FT (INR.1, párr. 2).","G075":"R.26: regulación y supervisión de <b>IF<\/b>. R.27: <b>facultades<\/b> del supervisor (inspeccionar, exigir información, sancionar). R.28: regulación y supervisión de <b>APNFD<\/b>.","G044":"La R.15 se llama <b>Nuevas tecnologías<\/b> y no es sólo de activos virtuales: también pide evaluar los riesgos de nuevos productos, prácticas y tecnologías <b>antes<\/b> de lanzarlos.","G080":"El texto de la R.29 dice <b>recibir, analizar y diseminar<\/b>. La distinción entre análisis <b>operativo<\/b> y <b>estratégico<\/b> está en su Nota.","G021":"Ambas: congelar <b>sin demora<\/b>. R.6: designa el Consejo de Seguridad (1267) <b>o el país<\/b> (1373). R.7: designa el Consejo de Seguridad.","G114":"En el <b>texto<\/b> de la R.5: financiar organizaciones y terroristas individuales, aun sin acto concreto, y el FT como delito precedente de LD. Viajes, fondos lícitos o ilícitos y tentativa: en la <b>Nota<\/b>.","G014":"R.3: Viena y Palermo, delitos precedentes. R.5: Convenio de 1999; el FT es delito precedente de LD. Su Nota agrega que abarca fondos <b>lícitos o ilícitos<\/b> (INR.5, párr. 5).","G406":"R.26: regulación y supervisión de <b>IF<\/b>. R.27: <b>facultades<\/b> del supervisor (inspeccionar, exigir información, sancionar). R.28: regulación y supervisión de <b>APNFD<\/b>.","G084":"R.30: <b>quién<\/b> investiga y la investigación financiera paralela. R.31: <b>qué puede hacer<\/b> (medidas obligatorias, operaciones encubiertas, entrega vigilada). La R.31 no tiene Nota.","G086":"R.30: <b>quién<\/b> investiga y la investigación financiera paralela. R.31: <b>qué puede ha das obligatorias, operaciones encubiertas, entrega vigilada). La R.31 no tiene Nota.","E048":"R.30: <b>quién<\/b> investiga y la investigación financiera paralela. R.31: <b>qué puede hacer<\/b> (medidas obligatorias, operaciones encubiertas, entrega vigilada). La R.31 no tiene Nota.","E054":"R.37: asistencia legal mutua en investigaciones y procesos. R.40: cooperación entre autoridades (UIF, supervisores, orden público), espontánea y a solicitud.","E055":"R.4: el país identifica, congela, incauta y decomisa. R.38: responde a solicitudes extranjeras y <b>ejecuta órdenes<\/b> de otros países.","E057":"R.37: asistencia legal mutua en investigaciones y procesos. R.40: cooperación entre autoridades (UIF, supervisores, orden público), espontánea y a solicitud."},"cierre":{"boton":"Antes de contestar","titulo":"Tres preguntas antes de marcar cualquier respuesta","pasos":["¿Esto lo dice la Recomendación o su Nota interpretativa?<small>Los distractores más frecuentes cambian una por otra.<\/small>","¿Cuántas capas trae la pregunta?<small>Concepto, figura y caso práctico pueden venir juntos: contesta lo que de verdad se pregunta.<\/small>","¿Qué palabra clave me cambiaron?<small>«Podrá» o «deberá», «siempre» o «según corresponda», un umbral distinto.<\/small>"],"nota":"Si dos reactivos seguidos se parecen, <b>no<\/b> asumas que llevan la misma respuesta: léelos completos, con sus cuatro opciones."},"para":"Practicar con preguntas como las del examen real, en tandas cortas de 10, 20 o 30. Es el que usamos en clase: 156 preguntas, con más peso en las recomendaciones que más salieron en junio."},{"tipo":"simulador","id":"examen","nav":"Simulacro ▸","titulo":"Simulacro completo","intro":"Cada respuesta explica también por qué fallan las otras opciones. Contesta con clic o con las teclas A, B, C, D.","para":"Medirte antes del examen, en casa. Simulacros largos de 30 o 50 preguntas de todo el banco (262), o rondas de 10 por sección para reforzar la que te salga más baja. Al terminar puedes imprimir tus fallas."}],"temas":{"A":"A · Políticas y coordinación (R.1–2)","B":"B · Lavado de dinero y decomiso (R.3–4)","C":"C · Terrorismo y proliferación (R.5–8)","D":"D · Medidas preventivas (R.9–23)","E":"E · Transparencia y beneficiario final (R.24–25)","F":"F · Autoridades (R.26–35)","G":"G · Cooperación internacional (R.36–40)"},"modos":[{"k":"A","l":"A · Políticas y coordinación","tema":"A"},{"k":"B","l":"B · Lavado de dinero y decomiso","tema":"B"},{"k":"C","l":"C · Terrorismo y proliferación","tema":"C"},{"k":"D","l":"D · Medidas preventivas","tema":"D"},{"k":"E","l":"E · Transparencia y beneficiario final","tema":"E"},{"k":"F","l":"F · Autoridades","tema":"F"},{"k":"G","l":"G · Cooperación internacional","tema":"G"},{"k":"rn","l":"¿Recomendación o Nota?","tipos":["trampa"]},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"cif","l":"Umbrales y cifras","tipos":["cifra"]}],"banco":[{"id":"G001","tema":"A","tipo":"caso","q":"La evaluación nacional de riesgos de un país concluye que un tipo de microseguro de vida presenta un riesgo menor de LD/FT. Conforme a la R.1, ¿qué corresponde hacer al país respecto de ese producto?","a":"Permitir y alentar la aplicación de medidas simplificadas, según corresponda","o":["Exentarlo en automático de todas las Recomendaciones","Permitir y alentar la aplicación de medidas simplificadas, según corresponda","Obligar a las aseguradoras a aplicar medidas simplificadas a todos sus clientes, sin excepción ni análisis propio","Suspender la designación de la autoridad coordinadora hasta que concluya la siguiente evaluación nacional"],"x":"La R.1 dice que, ante riesgos menores, los países deben «permitir y alentar» medidas simplificadas «según corresponda»; no las impone ni exime en automático. Las exenciones son una decisión del país y exigen riesgo bajo, ya sea en circunstancias limitadas y justificadas para un tipo concreto de IF, actividad o APNFD, o por tratarse de una actividad financiera ocasional o muy limitada (INR.1, párr. 8).","ref":"R.1; INR.1, párrs. 7 y 8","d":{"Exentarlo en automático de todas las Recomendaciones":"Las exenciones no son automáticas: la INR.1 (párr. 8) las limita a riesgo bajo evaluado, circunstancias limitadas y justificadas, y a un tipo concreto de IF, actividad o APNFD.","Obligar a las aseguradoras a aplicar medidas simplificadas a todos sus clientes, sin excepción ni análisis propio":"Convierte en obligación lo que la R.1 deja como «permitir y alentar… según corresponda»; el país no impone medidas simplificadas sin análisis.","Suspender la designación de la autoridad coordinadora hasta que concluya la siguiente evaluación nacional":"El estándar no prevé suspender la designación; al contrario, la R.1 exige designar una autoridad o mecanismo que coordine la evaluación de riesgos."}},{"id":"G002","tema":"A","tipo":"trampa","q":"Una IF aplica DDC simplificada a un cliente de riesgo bajo y detecta indicios de LD. La regla expresa de que las medidas simplificadas no se permiten cuando hay sospecha, ¿dónde se encuentra?","a":"En las Notas interpretativas de la R.1 y de la R.10","o":["En el Glosario, en «medidas razonables»","En las Notas interpretativas de la R.1 y de la R.10","En el texto de la R.20, junto con la obligación de reportar con prontitud a la UIF","En el texto de la R.1, en el párrafo dedicado a los riesgos menores del país"],"x":"El texto de la R.1 sólo dice que ante riesgos menores se permitan y alienten medidas simplificadas; la prohibición cuando hay sospecha de LD/FT aparece en la INR.1 (párr. 2) y se reitera en la INR.10 (párr. 21). No está en la R.20 ni en el Glosario.","ref":"INR.1, párr. 2; INR.10, párr. 21","d":{"En el Glosario, en «medidas razonables»":"El Glosario define «medidas razonables» como medidas apropiadas y proporcionales al riesgo; no contiene la prohibición de simplificar ante sospecha.","En el texto de la R.20, junto con la obligación de reportar con prontitud a la UIF":"El texto de la R.20 sólo obliga a reportar con prontitud a la UIF; no habla de medidas simplificadas.","En el texto de la R.1, en el párrafo dedicado a los riesgos menores del país":"El texto de la R.1 sólo dice que, ante riesgos menores, se permitan y alienten medidas simplificadas; la excepción por sospecha está en la Nota (INR.1, párr. 2)."}},{"id":"G003","tema":"A","tipo":"memoria","q":"En el contexto de la R.1, ¿qué significa «riesgo de financiamiento a la proliferación»?","a":"Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","o":["Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","El riesgo de que se evadan los controles de exportación de bienes de uso dual previstos en los tratados internacionales de no proliferación","El riesgo de que se financien actos terroristas con armas de destrucción masiva conforme a la resolución 1373 (2001) del Consejo de Seguridad","Cualquier riesgo de que fondos se destinen a armas de destrucción masiva, incluidas las prohibiciones de viaje y las prohibiciones por actividad de la ONU"],"x":"La R.1 acota el riesgo de FP «estricta y únicamente» al incumplimiento o evasión de las sanciones financieras dirigidas de la R.7. No abarca otras medidas de las resoluciones de la ONU, como prohibiciones de viaje (INR.7, nota al pie 21).","ref":"R.1; INR.1, párr. 3","d":{"El riesgo de que se evadan los controles de exportación de bienes de uso dual previstos en los tratados internacionales de no proliferación":"Los controles de exportación de bienes de uso dual vienen de tratados y de la resolución 1540; son obligaciones aparte de la R.7 (INR.7, nota al pie 24).","El riesgo de que se financien actos terroristas con armas de destrucción masiva conforme a la resolución 1373 (2001) del Consejo de Seguridad":"La resolución 1373 es de terrorismo y pertenece a la R.6, no al riesgo de FP de la R.1.","Cualquier riesgo de que fondos se destinen a armas de destrucción masiva, incluidas las prohibiciones de viaje y las prohibiciones por actividad de la ONU":"Demasiado amplio: el riesgo de FP se limita a las sanciones financieras dirigidas de la R.7; prohibiciones de viaje y por actividad quedan fuera (INR.7, nota al pie 21)."}},{"id":"G004","tema":"A","tipo":"caso","q":"Un país determina que cierta categoría de APNFD presenta un riesgo bajo de FP y la exenta de identificar, evaluar y mitigar ese riesgo. Según la Nota a la R.1, ¿qué sigue siendo obligatorio para esa categoría?","a":"La plena implementación de las sanciones financieras dirigidas de la R.7","o":["Una autoevaluación trimestral de riesgo de FP","La DDC reforzada sobre todos los clientes que realizan operaciones con el extranjero","La plena implementación de las sanciones financieras dirigidas de la R.7","Nada adicional: la exención por riesgo bajo alcanza también al congelamiento previsto en la R.7"],"x":"La INR.1 permite exentar de la evaluación y mitigación del riesgo de FP a ciertas IF o APNFD de riesgo bajo, pero aclara que la plena implementación de las sanciones financieras dirigidas de la R.7 es obligatoria en todos los casos; esas obligaciones no se basan en riesgo.","ref":"INR.1, párrs. 3 y 4, y nota al pie 4","d":{"Una autoevaluación trimestral de riesgo de FP":"El estándar no prevé ninguna autoevaluación trimestral de riesgo de FP.","La DDC reforzada sobre todos los clientes que realizan operaciones con el extranjero":"El estándar no exige DDC reforzada a todos los clientes con operaciones con el extranjero; eso nada tiene que ver con la exención de FP de la INR.1.","Nada adicional: la exención por riesgo bajo alcanza también al congelamiento previsto en la R.7":"Error: la INR.1 (nota al pie 4) dice que la plena implementación de las sanciones de la R.7 es obligatoria en todos los casos; el congelamiento no se basa en riesgo."}},{"id":"G005","tema":"A","tipo":"memoria","q":"Según la Nota a la R.1, los requisitos de los Estándares del GAFI relativos al financiamiento a la proliferación se limitan a:","a":"R.1, R.2, R.7 y R.15","o":["R.1, R.6, R.7 y R.16","R.1, R.7, R.10 y R.35","R.2, R.5, R.7 y R.20","R.1, R.2, R.7 y R.15"],"x":"La nota al pie 3 de la INR.1 dice que los requisitos sobre FP se limitan a las R.1, 2, 7 y 15. La R.6 trata de sanciones por terrorismo, no de proliferación, y la R.16 no forma parte de esa lista.","ref":"INR.1, nota al pie 3","d":{"R.1, R.6, R.7 y R.16":"La R.6 es de sanciones por terrorismo, no de proliferación, y la R.16 tampoco está en la lista de la nota al pie 3 de la INR.1.","R.1, R.7, R.10 y R.35":"Las R.10 (DDC) y R.35 (sanciones) no forman parte de la lista; la nota al pie 3 de la INR.1 menciona las R.1, 2, 7 y 15.","R.2, R.5, R.7 y R.20":"Omite la R.1 y la R.15; la R.5 tipifica el FT y la R.20 regula el reporte de operaciones sospechosas, no el FP."}},{"id":"G006","tema":"A","tipo":"memoria","q":"¿Qué recomendación pide que la cooperación entre las autoridades del propio país asegure que los requisitos PLD/FT/CFP sean compatibles con las reglas de protección de datos y privacidad?","a":"R.2 (Cooperación y coordinación nacional)","o":["R.9 (Leyes de secreto de las instituciones financieras)","R.40 (Otras formas de cooperación internacional)","R.2 (Cooperación y coordinación nacional)","R.21 (Revelación y confidencialidad)"],"x":"La R.2 incluye expresamente la cooperación y coordinación entre autoridades para que los requisitos PLD/FT/CFP sean compatibles con la protección de datos y privacidad. La R.9 trata de que el secreto financiero no impida aplicar las Recomendaciones, no de esa coordinación interna.","ref":"R.2","d":{"R.9 (Leyes de secreto de las instituciones financieras)":"La R.9 pide que el secreto financiero no impida aplicar las Recomendaciones; no trata de la coordinación interna con las reglas de protección de datos.","R.40 (Otras formas de cooperación internacional)":"La R.40 regula la cooperación internacional entre autoridades, no la coordinación dentro del propio país.","R.21 (Revelación y confidencialidad)":"La R.21 regula la protección de quien reporta y la prohibición de revelar un reporte, no la compatibilidad con la protección de datos."}},{"id":"G007","tema":"B","tipo":"cifra","q":"Un país aplica un enfoque de umbral para definir los delitos precedentes y su sistema jurídico se basa en penas máximas. Según la Nota a la R.3, como mínimo deben incluirse los delitos castigados con pena máxima de prisión de:","a":"Más de un año","o":["Más de dos años","Más de seis meses","Más de un año","Más de tres años"],"x":"Con enfoque de umbral basado en penas máximas, la INR.3 exige incluir, al menos, los delitos con pena máxima de más de un año de prisión (o los delitos graves de la ley nacional). «Más de seis meses» es el mínimo cuando el sistema se basa en penas mínimas.","ref":"INR.3, párr. 3","d":{"Más de dos años":"El estándar no fija «más de dos años»; con penas máximas, la INR.3 habla de más de un año.","Más de seis meses":"Seis meses es el mínimo para sistemas basados en penas mínimas, no en penas máximas (INR.3, párr. 3).","Más de tres años":"El estándar no fija «más de tres años»; con penas máximas, la INR.3 habla de más de un año."}},{"id":"G008","tema":"B","tipo":"cifra","q":"Ahora el sistema jurídico del país fija penas mínimas para los delitos. Con el enfoque de umbral de la Nota a la R.3, ¿qué delitos deben comprenderse, como mínimo, como precedentes?","a":"Los castigados con pena mínima de más de seis meses de prisión","o":["Los castigados con pena mínima de más de un año de prisión","Los castigados con pena mínima de más de dos años de prisión","Los castigados con pena mínima de más de seis meses de prisión","Los castigados con pena mínima de más de tres meses de prisión"],"x":"Para los países con umbral mínimo de penas, la INR.3 exige incluir todos los delitos castigados con pena mínima de más de seis meses. El año corresponde a los sistemas basados en penas máximas.","ref":"INR.3, párr.
