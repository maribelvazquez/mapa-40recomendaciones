 a la R.32, el umbral preestablecido no debe superar:","a":"USD/EUR 15,000","o":["USD/EUR 3,000","USD/EUR 10,000","USD/EUR 1,000","USD/EUR 15,000"],"x":"La INR.32 fija un umbral máximo preestablecido de USD/EUR 15,000 para el sistema de declaración, que abarca efectivo e instrumentos negociables al portador. El oro, los metales y las piedras preciosas no están incluidos en la R.32 (INR.32, párr. 8).","ref":"INR.32, párr. 3"},{"id":"G089","tema":"G","tipo":"cifra","q":"La R.36 pide a los países ser parte de la Convención de Palermo y de la Convención de las Naciones Unidas contra la Corrupción, entre otros instrumentos. ¿De qué años son, respectivamente?","a":"2000 y 2003","o":["2000 y 1999","1999 y 2005","2000 y 2003","1988 y 2003"],"x":"La R.36 cita la Convención de Palermo (2000) y la Convención contra la Corrupción (2003). El año 1988 es de la Convención de Viena y 1999 del Convenio sobre Financiación del Terrorismo.","ref":"R.36"},{"id":"G090","tema":"F","tipo":"memoria","q":"¿Qué recomendación pide mantener datos completos sobre reportes de operaciones sospechosas recibidos y diseminados, investigaciones, procesos y condenas, bienes congelados, incautados y decomisados, y solicitudes de cooperación internacional?","a":"R.33 (Estadísticas)","o":["R.2 (Cooperación y coordinación nacional)","R.29 (Unidades de inteligencia financiera)","R.33 (Estadísticas)","R.34 (Guía y retroalimentación)"],"x":"La R.33 exige mantener estadísticas completas sobre la eficacia y eficiencia del sistema PLD/FT, con esos rubros. La R.29 regula las funciones de la UIF, aunque los reportes de operaciones sospechosas sean uno de los rubros estadísticos.","ref":"R.33"},{"id":"G091","tema":"F","tipo":"memoria","q":"Los agentes inmobiliarios de un país no saben cómo detectar ni reportar operaciones sospechosas porque las autoridades y su supervisor nunca les han dado orientación. ¿Qué recomendación atiende directamente esta carencia?","a":"R.34, que pide establecer guías y dar retroalimentación","o":["R.34, que pide establecer guías y dar retroalimentación","R.29, que obliga a la UIF a analizar los reportes recibidos","R.28, que pide supervisar a las APNFD con base en riesgo","R.23, que obliga a las APNFD a reportar sus sospechas"],"x":"La R.34 pide a autoridades, supervisores y organismos autorreguladores establecer guías y dar retroalimentación a IF y APNFD, en particular para detectar y reportar operaciones sospechosas. La R.23 impone la obligación de reportar, pero no la de orientar.","ref":"R.34"},{"id":"G092","tema":"F","tipo":"caso","q":"Una casa de cambio incumplió gravemente sus obligaciones de DDC. Según la R.35, las sanciones deben poder aplicarse:","a":"A la institución y también a sus directivos y a su alta dirección","o":["Sólo a la institución, porque la obligación de DDC es corporativa","A la institución y también a sus directivos y a su alta dirección","Sólo por la vía penal, porque las administrativas no son disuasivas","Sólo al oficial de cumplimiento, como responsable del programa"],"x":"La R.35 exige sanciones eficaces, proporcionales y disuasivas, sean penales, civiles o administrativas, aplicables no sólo a las IF y APNFD sino también a sus directivos y alta dirección. No se limita a una vía ni a una sola persona.","ref":"R.35"},{"id":"G093","tema":"G","tipo":"caso","q":"El país A pide asistencia legal mutua al país B por un caso de LD que también involucra evasión fiscal. El país B quiere negarla precisamente por ese motivo. Según la R.37, B:","a":"No debe negarla con el único argumento de que involucra asuntos fiscales","o":["Debe negarla mientras A no acredite la doble incriminación, aun sin medidas coercitivas","Puede negarla, porque los asuntos fiscales están excluidos de la asistencia legal mutua","No debe negarla con el único argumento de que involucra asuntos fiscales","Puede negarla si no hay un memorándum firmado"],"x":"La R.37, inciso (c), prohíbe negarse a ejecutar una solicitud por el solo motivo de que el delito también involucra asuntos fiscales. Además, cuando la asistencia no implica acciones coercitivas, debe prestarse aun sin doble incriminación.","ref":"R.37, inciso (c)"},{"id":"G094","tema":"G","tipo":"trampa","q":"Al reconocer y ejecutar una orden extranjera de congelamiento, aseguramiento o decomiso, la Nota a la R.38 establece que el país requerido:","a":"Debe poder basarse en los hechos probados en la orden extranjera","o":["Debe poder basarse en los hechos probados en la orden extranjera","Sólo puede ejecutarla si deriva de un decomiso basado en una condena","Debe devolver siempre al país requirente la totalidad de los bienes decomisados","Debe iniciar primero una investigación nacional sobre los mismos hechos"],"x":"La INR.38 dice que el país requerido debe poder basarse en los hechos probados en la orden extranjera y que la ejecución no debe condicionarse a una investigación nacional. También abarca solicitudes de decomiso sin condena, y la R.38 prevé compartir o devolver los bienes, no devolverlos siempre.","ref":"INR.38, párrs. 1 y 2; R.38"},{"id":"G095","tema":"G","tipo":"caso","q":"El país B no extradita a sus nacionales. El país A le pide extraditar a un nacional de B acusado de FT. Conforme a la R.39, si A lo solicita, B debe:","a":"Someter el caso sin demora indebida a sus autoridades competentes para su enjuiciamiento","o":["Extraditarlo de todos modos, porque el FT no admite ninguna excepción por nacionalidad","Esperar a que A obtenga una sentencia firme antes de adoptar cualquier medida","Someter el caso sin demora indebida a sus autoridades competentes para su enjuiciamiento","Negar la extradición y archivar el asunto, porque la nacionalidad es causa suficiente"],"x":"La R.39 dice que cada país debe extraditar a sus nacionales o, si no lo hace sólo por razón de nacionalidad, someter el caso sin demora indebida a sus autoridades para su enjuiciamiento, a solicitud del país requirente. Negar y archivar deja un refugio seguro, que la R.39 busca evitar.","ref":"R.39"},{"id":"G096","tema":"G","tipo":"caso","q":"La UIF del país A, de naturaleza administrativa, pide información a la UIF del país B, que es de tipo policial. B duda por la diferencia de naturaleza entre ambas. Según la Nota a la R.40:","a":"Deben intercambiar información, sin importar su distinta naturaleza","o":["B puede negarse, porque sólo coopera con UIF de su mismo modelo institucional","Deben intercambiar información, sin importar su distinta naturaleza","Deben pasar por asistencia legal mutua","Sólo pueden intercambiar si la UIF de A obtiene antes una orden judicial en su país"],"x":"La INR.40 dice que las UIF deben intercambiar información con UIF extranjeras sin importar su naturaleza (administrativa, policial, judicial u otra), y que no debe negarse la cooperación porque la contraparte tenga distinta naturaleza. La asistencia legal mutua es otra vía (R.37), no un requisito para el intercambio entre UIF.","ref":"INR.40, párrs. 2(d) y 7"},{"id":"G097","tema":"C","tipo":"trampa","q":"La exención humanitaria incorporada en junio de 2026 a los estándares sobre sanciones financieras dirigidas por terrorismo, ¿en qué parte de los estándares quedó?","a":"En la Nota interpretativa a la R.6","o":["En el texto de la Recomendación 6","En la Nota interpretativa a la R.6","En la Nota interpretativa a la R.7","En la definición de «sin demora» del Glosario"],"x":"La revisión de junio de 2026 modificó la INR.6 (párr. 5bis y su nota al pie), no el texto de la R.6. La R.7 trata de proliferación y el Glosario sólo define «sin demora».","ref":"INR.6, párr. 5bis; Anexo II"},{"id":"G098","tema":"C","tipo":"memoria","q":"Según la Nota interpretativa a la R.6, al aplicar congelamientos impuestos por el Consejo de Seguridad de la ONU, ¿qué resoluciones deben cumplir los países, según corresponda?","a":"Las resoluciones 2664, 2761 y 2615","o":["Las resoluciones 1267, 1988 y 1718","Las resoluciones 2664, 2761 y 2615","Sólo la resolución 1373 y sus sucesoras","Las resoluciones 1373, 1540 y 2231"],"x":"El párr. 5bis de la INR.6 pide cumplir las resoluciones 2664 (2022), 2761 (2024) y 2615 (2021), que contienen la exención humanitaria. La 1267 y la 1373 son la base de las designaciones, no de la exención.","ref":"INR.6, párr. 5bis"},{"id":"G101","tema":"A","tipo":"caso","q":"Un supervisor concluye que los riesgos específicos de un pequeño sector de APNFD están claramente identificados y entendidos, y decide que cada negocio del sector no necesita elaborar su propia evaluación de riesgos documentada. Según la Nota a la R.1, ¿es válida esa decisión?","a":"Sí; cada negocio queda relevado de documentar su evaluación individual, pero debe seguir entendiendo sus riesgos de LD/FT","o":["No: la R.1 exige a toda IF y APNFD una evaluación individual documentada, sin excepción","Sí, y con ello el sector queda eximido también de entender sus riesgos y de aplicar medidas reforzadas cuando sean mayores","Sí; cada negocio queda relevado de documentar su evaluación individual, pero debe seguir entendiendo sus riesgos de LD/FT","Sólo si el país exenta además al sector de todas las Recomendaciones por realizar una actividad ocasional"],"x":"La INR.1 (párr. 12) permite que las autoridades competentes u organismos autorreguladores determinen que no se requieren evaluaciones individuales documentadas si los riesgos específicos del sector están claramente identificados y entendidos, pero IF y APNFD deben entender siempre sus riesgos. El texto de la R.1 no regula esa documentación, y la discrecionalidad del enfoque basado en riesgo no exime de medidas reforzadas ante riesgos mayores (INR.1, párr. 1).","ref":"R.1; INR.1, párrs. 1 y 12"},{"id":"G102","tema":"A","tipo":"trampa","q":"Un país decide no aplicar ciertas Recomendaciones a una persona que realiza una actividad financiera de forma ocasional o muy limitada, con riesgo bajo de LD/FT. ¿Dónde se prevé esa posibilidad y qué actividad queda excluida de ella?","a":"En la Nota a la R.1, que excluye de esa vía la transferencia de dinero o valores","o":["En el texto de la R.1, que excluye de esa vía la transferencia de dinero o valores","En la Nota a la R.1, que excluye de esa vía la transferencia de dinero o valores","En la Nota a la R.1, que excluye de esa vía el cambio de dinero y divisas","En la Nota a la R.10, que la limita a operaciones ocasionales por debajo de USD/EUR 15,000"],"x":"El párr. 8(b) de la INR.1 permite la exención cuando una actividad financiera distinta de la transferencia de dinero o valores se realiza de forma ocasional o muy limitada, con riesgo bajo de LD/FT. El texto de la R.1 no regula exenciones, y el umbral de USD/EUR 15,000 de la R.10 se refiere a la DDC en operaciones ocasionales, no a exenciones.","ref":"INR.1, párr. 8(b)"},{"id":"G103","tema":"A","tipo":"caso","q":"Un país crea tres comités interinstitucionales: uno para LD, otro para FT y otro para FP. Un evaluador sostiene que eso incumple, porque debe existir un único marco de coordinación. Según la Nota a la R.2, ¿quién tiene razón?","a":"El país: la Nota admite un solo marco o marcos distintos para LD, FT y FP","o":["El evaluador: la Nota exige un solo marco, encabezado siempre por la UIF","El país, siempre que el comité de FP quede subordinado al de LD, como exige la R.1","El evaluador: los marcos separados sólo se admiten si no hay autoridad designada","El país: la Nota admite un solo marco o marcos distintos para LD, FT y FP"],"x":"La INR.2 (párr. 1) dice que los marcos interinstitucionales pueden ser uno solo o distintos para LD, FT y FP, y el párr. 2 dispone que deben encabezarlos una o más autoridades designadas u otro mecanismo. No exige que los dirija la UIF, y ni la R.1 ni la INR.2 subordinan un marco a otro.","ref":"R.2; INR.2, párrs. 1 y 2"},{"id":"G104","tema":"A","tipo":"trampa","q":"La mención de las autoridades de control de importaciones y exportaciones y de los registros de beneficiarios finales, donde existan, como posibles integrantes de los marcos de coordinación contra LD, FT y FP, ¿dónde aparece?","a":"En la Nota interpretativa a la R.2, en una lista que depende de cómo organiza sus funciones cada país","o":["En la Nota interpretativa a la R.2, en una lista que depende de cómo organiza sus funciones cada país","En el texto de la R.2, junto a la compatibilidad con la protección de datos y privacidad","En la Nota interpretativa a la R.1, entre los mecanismos que coordinan la evaluación nacional de riesgos","En la Nota interpretativa a la R.7, por su vínculo con los programas de proliferación"],"x":"El texto de la R.2 sólo menciona a formuladores de políticas, UIF, autoridades de orden público, supervisores y otras autoridades competentes. La lista ampliada, que incluye aduanas, autoridades fiscales, de control de importaciones y exportaciones, y registros de sociedades y de beneficiarios finales, está en la INR.2 (párr. 3) y depende de la organización nacional de funciones.","ref":"INR.2, párr. 3"},{"id":"G105","tema":"A","tipo":"caso","q":"La UIF y la autoridad aduanera de un país sólo se comparten información operativa cuando una se la pide formalmente a la otra. Conforme a la Nota a la R.2, ¿qué le falta a ese esquema?","a":"Que el intercambio oportuno de información sea, cuando proceda, también proactivo y no sólo a petición","o":["Nada: la Nota limita el intercambio operativo entre autoridades nacionales a solicitudes formales","Un tratado de asistencia legal mutua, porque ese intercambio entre autoridades se rige por la R.37","Que el intercambio oportuno de información sea, cuando proceda, también proactivo y no sólo a petición","Que todo intercambio pase por la autoridad coordinadora de políticas, como canal único"],"x":"La INR.2 (párr. 4) pide mecanismos que permitan la cooperación operativa y, cuando proceda, la coordinación y el intercambio oportuno de información entre autoridades nacionales «tanto proactivo como a petición», con apoyos como formatos estándar, canales seguros, equipos conjuntos o plataformas de datos compartidas. El texto de la R.2 no precisa lo proactivo, y la R.37 regula la asistencia legal mutua entre países, no la coordinación interna.","ref":"R.2; INR.2, párr. 4"},{"id":"G106","tema":"B","tipo":"caso","q":"Los principios fundamentales del derecho interno de un país no admiten castigar a una misma persona por un delito y, además, por lavar las ganancias de ese delito. Según la Nota a la R.3, ¿qué margen tiene ese país?","a":"Prever que el delito de LD no se aplique a quien cometió el delito precedente","o":["Nada: debe sancionar el autolavado sin excepción, porque la R.3 abarca todos los delitos graves","Prever que el delito de LD no se aplique a quien cometió el delito precedente","Excluir al autor del precedente sólo cuando ese delito se cometió en el extranjero","Dejar de considerar precedente ese delito y retirarlo de las categorías designadas"],"x":"La INR.3 (párr. 6) dice que los países «podrán» prever que el delito de LD no se aplique a quien cometió el delito precedente cuando lo exijan los principios fundamentales de su derecho interno. Es una facultad acotada: no autoriza a retirar delitos de las categorías designadas ni depende del lugar donde se cometió el precedente.","ref":"R.3; INR.3, párr. 6"},{"id":"G107","tema":"B","tipo":"trampa","q":"Se lava en el país A dinero de una conducta cometida en el país B, donde esa conducta no es delito, pero que habría sido delito precedente de haber ocurrido en A. Según la Nota a la R.3, el país A:","a":"Podrá prever que basta con que la conducta hubiera sido delito precedente de ocurrir en su territorio","o":["Debe tratarla siempre como delito precedente, sin poder exigir que la conducta también sea delito en el país B","Tiene prohibido tratarla como delito precedente, porque falta que sea delito en el país B","Sólo podrá tratarla como delito precedente si el país B lo solicita por asistencia legal mutua","Podrá prever que basta con que la conducta hubiera sido delito precedente de ocurrir en su territorio"],"x":"La INR.3 (párr. 5) exige extender los delitos precedentes a conductas ocurridas en otro país que sean delito allí y que lo habrían sido en el propio país; además, los países «podrán» prever que el único requisito sea esto último. Es una facultad, no una obligación ni una prohibición.","ref":"INR.3, párr. 5"},{"id":"G108","tema":"B","tipo":"trampa","q":"La lista de categorías designadas de delitos, que incluye por ejemplo los delitos fiscales y los delitos ambientales, ¿dónde está y qué exige la Nota a la R.3 respecto de ella?","a":"En el Glosario; la Nota exige incluir una gama de delitos dentro de cada categoría","o":["En el Glosario; la Nota exige incluir una gama de delitos dentro de cada categoría","En el texto de la R.3; la Nota permite elegir sólo las categorías que el país considere graves","En la Nota a la R.3; basta con incluir al menos un delito en la mayoría de las categorías","En el Glosario; la Nota permite omitir categorías si el país define los precedentes por umbral"],"x":"Las categorías designadas de delitos se definen en el Glosario, y la INR.3 (párr. 4) exige que, sea cual sea el enfoque adoptado, cada país incluya como mínimo una gama de delitos dentro de cada categoría. El Glosario deja a cada país definir esos delitos y qué los hace graves, pero no omitir categorías.","ref":"INR.3, párr. 4; Glosario"},{"id":"G109","tema":"B","tipo":"caso","q":"Un investigado por fraude muere antes del juicio. Ya gastó las ganancias del delito, y la fiscalía pretende decomisar sin condena un terreno que compró con dinero lícito, por un valor equivalente. ¿Lo prevé el texto de la R.4?","a":"No: el decomiso sin condena de la R.4 abarca bienes del delito, no bienes de valor equivalente","o":["Sí: la R.4 prevé el decomiso sin condena tanto de bienes del delito como de valor equivalente","Sí, siempre que los herederos no demuestren el origen lícito del terreno, carga que la R.4 impone","No: el decomiso sin condena de la R.4 abarca bienes del delito, no bienes de valor equivalente","No: la R.4 sólo prevé el decomiso sin condena en casos de FT, no en delitos como el fraude"],"x":"La R.4 distingue: el inciso (e) prevé el decomiso basado en condena de bienes del delito y de valor equivalente, y el inciso (f), el decomiso sin condena sólo de bienes del delito (también INR.4, párr. 11, que lo extiende al LD, a los delitos precedentes y al FT). Exigir al infractor que demuestre el origen lícito es algo que los países «deben considerar» (INR.4, párr. 12), no una obligación.","ref":"R.4, incisos (e) y (f); INR.4, párrs. 11 y 12"},{"id":"G110","tema":"B","tipo":"trampa","q":"¿En qué parte de los estándares se establece que preservar el valor de los bienes congelados, incautados o decomisados debe incluir, cuando proceda, su venta anticipada al decomiso?","a":"En la Nota interpretativa a la R.4, en su apartado sobre gestión y disposición de bienes","o":["En el texto de la R.4, en el inciso sobre la administración eficaz de los bienes","En el Glosario, dentro de la definición de «decomiso» como privación permanente","En la Nota interpretativa a la R.7, junto a los intereses que generan las cuentas congeladas","En la Nota interpretativa a la R.4, en su apartado sobre gestión y disposición de bienes"],"x":"El inciso (h) de la R.4 sólo pide administrar eficazmente los bienes congelados, incautados o decomisados; la venta anticipada al decomiso como forma de preservar su valor está en la INR.4 (párr. 14). El Glosario define el decomiso como privación permanente, y la INR.7 trata los intereses de cuentas congeladas, no esta venta.","ref":"INR.4, párr. 14"},{"id":"G111","tema":"B","tipo":"caso","q":"Durante una investigación por corrupción, se detecta que Ernesto «vendió» su casa a su cuñada por una fracción de su valor de mercado y la sigue usando. Según la Nota a la R.4, esa casa:","a":"Puede considerarse bien del delito o de valor equivalente, aunque esté a nombre de un tercero","o":["Puede considerarse bien del delito o de valor equivalente, aunque esté a nombre de un tercero","Queda fuera de las medidas, porque la titularidad formal de un tercero siempre prevalece","Sólo puede alcanzarse si antes se condena a la cuñada por LD como delito autónomo","Puede decomisarse, y la Nota impide proteger a cualquier tercero, incluso a los que actuaron de buena fe"],"x":"La INR.4 (párr. 3) extiende los bienes del delito y de valor equivalente a los que poseen o detentan terceros, sin perjuicio de los terceros de buena fe; da como ejemplos los bienes bajo control efectivo del investigado a nombre de familiares y los transferidos por un monto muy superior o inferior al de mercado. La protección de los terceros de buena fe se mantiene.","ref":"R.4; INR.4, párr. 3"},{"id":"G112","tema":"B","tipo":"trampa","q":"Según la Nota a la R.4, cuando es necesario actuar lo más rápido posible, las autoridades competentes deben poder congelar e incautar bienes del delito y de valor equivalente:","a":"Sin orden judicial y con revisión judicial en un plazo; si eso contraría principios fundamentales, con otro mecanismo que evite a tiempo la disipación","o":["Sólo con orden judicial previa, dictada tras notificar al afectado y escucharlo en audiencia, para respetar sus derechos procesales y de propiedad","Sin orden judicial y con revisión judicial en un plazo; si eso contraría principios fundamentales, con otro mecanismo que evite a tiempo la disipación","Sin orden judicial y sin posibilidad de revisión judicial posterior, pues lo único que importa es evitar la disipación de los bienes del delito y de valor equivalente","Sin orden judicial, pero únicamente cuando se demuestre ante un juez que existe un riesgo inminente y concreto de disipación de los bienes"],"x":"La INR.4 (párr. 6) pide poder congelar e incautar sin orden judicial cuando sea necesario actuar con la mayor rapidez, con revisión judicial dentro de un plazo; si eso contraría principios fundamentales del derecho interno, se admite un mecanismo alternativo que permita actuar con la rapidez suficiente. La solicitud inicial puede ser ex parte (párr. 5a) y las medidas no deben condicionarse, por ejemplo, a demostrar el riesgo de disipación (párr. 5b).","ref":"R.4, inciso (d); INR.4, párrs. 5 y 6"},{"id":"G113","tema":"C","tipo":"caso","q":"Desde el país A, Tomás envía fondos a una organización terrorista que opera sólo en el país B, donde también planea sus actos. Conforme a la Nota a la R.5, el delito de FT:","a":"Debe aplicarse aunque Tomás esté en un país distinto al de la organización o al de los actos","o":["Debe aplicarse aunque Tomás esté en un país distinto al de la organización o al de los actos","Sólo puede perseguirse en el país B, donde se ubica la organización y ocurrirán los actos","Sólo se configura si el país A designó a la organización conforme a la resolución 1373 (2001)","Sólo se configura cuando el acto terrorista ya ocurrió en el país B y puede vincularse a los fondos"],"x":"La INR.5 (párr. 12) dice que los delitos de FT deben aplicarse sin importar si el presunto responsable está en el mismo país o en uno distinto de aquel donde se ubica la organización o donde ocurrió u ocurrirá el acto. La designación conforme a la resolución 1373 pertenece a las sanciones financieras de la R.6, no es requisito del delito, y tampoco se exige vincular los fondos a un acto concreto (párr. 6).","ref":"INR.5, párrs. 6 y 12"},{"id":"G114","tema":"C","tipo":"trampa","q":"¿Cuál de estas afirmaciones aparece en el texto de la R.5 y no sólo en su Nota interpretativa?","a":"Debe tipificarse el financiamiento de terroristas individuales, aun sin vínculo con un acto terrorista específico","o":["El FT incluye financiar el viaje de personas a un Estado distinto al de su residencia o nacionalidad para recibir entrenamiento terrorista","Los delitos de FT deben abarcar cualquier fondo u otro activo, sin importar que su origen sea legítimo o ilegítimo","Debe tipificarse el financiamiento de terroristas individuales, aun sin vínculo con un acto terrorista específico","También debe ser delito la tentativa de cometer el delito de FT, además de las conductas de complicidad y organización"],"x":"El texto de la R.5 pide tipificar el FT con base en el Convenio sobre Financiación del Terrorismo, incluido el financiamiento de organizaciones terroristas y de terroristas individuales aun sin vínculo con un acto específico, y designarlo delito precedente de LD. Los viajes, el origen legítimo o ilegítimo de los fondos y la tentativa son precisiones de la INR.5 (párrs. 3, 5 y 10).","ref":"R.5; INR.5, párrs. 3, 5 y 10"},{"id":"G115","tema":"C","tipo":"caso","q":"Una empresa de logística recauda fondos para una organización terrorista. Los principios fundamentales del derecho interno del país no admiten la responsabilidad penal de las personas morales. Según la Nota a la R.5:","a":"Deben aplicarse a la empresa sanciones civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas","o":["La empresa queda fuera del alcance de la R.5, porque el delito de FT sólo puede atribuirse a personas físicas que actúan con dolo","Deben aplicarse a la empresa sanciones civiles o administrativas, que sustituyen y extinguen la responsabilidad penal de sus directivos","Sólo pueden sancionarse las personas físicas; a la empresa únicamente se le pueden congelar fondos si se la designa conforme a la R.6","Deben aplicarse a la empresa sanciones civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas"],"x":"La INR.5 (párr. 9) exige responsabilidad y sanciones penales para las personas morales y, cuando eso no sea posible por principios fundamentales del derecho interno, civiles o administrativas, sin perjuicio de la responsabilidad penal de las personas físicas. Las sanciones a la empresa no sustituyen las de sus directivos, y todas deben ser eficaces, proporcionales y disuasivas.","ref":"INR.5, párr. 9"},{"id":"G116","tema":"C","tipo":"caso","q":"Marta no aporta ni recauda dinero, pero organiza y dirige a dos personas para que reúnan fondos destinados a un terrorista individual. Según la Nota a la R.5, la conducta de Marta:","a":"También debe ser delito, porque la Nota incluye organizar o dirigir a otros para cometer el delito de FT","o":["No es delito: el FT exige que la persona aporte o recaude fondos directamente y por sí misma","También debe ser delito, porque la Nota incluye organizar o dirigir a otros para cometer el delito de FT","Sólo es delito si los fondos llegan al terrorista y se usan efectivamente en un acto terrorista","Sólo es delito si Marta pertenece formalmente a una organización designada por el Consejo de Seguridad de la ONU"],"x":"La INR.5 (párr. 11b) dice que también debe ser delito organizar o dirigir a otros para cometer el delito de FT. Además, el delito no exige que los fondos se hayan usado en un acto terrorista (párr. 6) ni depende de una designación, que es materia de las sanciones financieras de la R.6.","ref":"INR.5, párrs. 6 y 11(b)"},{"id":"G117","tema":"C","tipo":"caso","q":"Las autoridades de un país tienen motivos razonables para creer que una empresa local apoya un programa de armas de destrucción masiva y quieren designarla ellas mismas para aplicarle las sanciones de la R.7. ¿Qué establecen la R.7 y su Nota?","a":"En la R.7 designan el Consejo de Seguridad o sus Comités; el país podría considerar tener procedimientos para proponerla","o":["Pueden designarla conforme a la resolución 1373 (2001), igual que en las sanciones financieras dirigidas por terrorismo de la R.6","Deben designarla sin demora, porque la Nota a la R.7 obliga a todos los países a presentar propuestas de designación","En la R.7 designan el Consejo de Seguridad o sus Comités; el país podría considerar tener procedimientos para proponerla","Pueden designarla por su cuenta, siempre que la designación no se condicione a la existencia de un proceso penal"],"x":"Según la R.7 y la INR.7 (párrs. 3 y 5), las designaciones las hacen el Consejo de Seguridad o sus Comités de sanciones; no existe una vía nacional como la de la resolución 1373 en la R.6. La INR.7 (párr. 4) dice que los países «podrían considerar» establecer autoridad y procedimientos para proponer designaciones, y el párr. 3 aclara que no hay obligación específica de presentarlas.","ref":"R.7; INR.7, párrs. 3, 4 y 5"},{"id":"G118","tema":"C","tipo":"trampa","q":"Sobre contar con autoridad y procedimientos para proponer personas o entidades al Consejo de Seguridad para su designación, ¿qué contraste hay entre las Notas a la R.6 y a la R.7?","a":"La Nota a la R.6 dice que los países necesitan tenerlos; la Nota a la R.7, que podrían considerar establecerlos","o":["La Nota a la R.7 dice que los países necesitan tenerlos; la Nota a la R.6, que podrían considerar establecerlos","La Nota a la R.6 dice que los países necesitan tenerlos; la Nota a la R.7, que podrían considerar establecerlos","Ambas Notas los establecen como obligación estricta, con el mismo lenguaje y sin distinguir entre ambos regímenes de sanciones","Ninguna de las dos los menciona; sólo aparecen en el Glosario, dentro de la definición de «designación»"],"x":"La INR.6 (párr. 4) dice que los países «necesitan» tener autoridad y procedimientos para proponer designaciones a los Comités 1267 y 1988 y para designar conforme a la resolución 1373. La INR.7 (párr. 4) usa un lenguaje más débil: los países «podrían considerar» establecerlos, pues no hay obligación específica de proponer designaciones (párr. 3).","ref":"INR.7, párrs. 3 y 4; INR.6, párr. 4"},{"id":"G119","tema":"C","tipo":"caso","q":"Una cuenta bancaria quedó congelada conforme a la resolución 1718 (2006) y sigue generando intereses. Según la Nota a la R.7, ¿qué corresponde hacer con esos intereses?","a":"Permitir que se abonen a la cuenta congelada, siempre que también queden sujetos al congelamiento","o":["Permitir que se abonen a la cuenta congelada, siempre que también queden sujetos al congelamiento","Impedir su abono, porque el congelamiento prohíbe cualquier movimiento que incremente el saldo de la cuenta","Entregarlos al titular, porque se generaron con posterioridad a la fecha de la designación","Transferirlos al Estado como decomiso de bienes de valor equivalente, conforme a la R.4"],"x":"La INR.7 (párr. 10) pide permitir que se agreguen a las cuentas congeladas conforme a las resoluciones 1718 o 1737 los intereses u otras ganancias, o los pagos debidos por contratos anteriores, siempre que también queden congelados. El congelamiento no transfiere la propiedad al Estado: eso es el decomiso de la R.4.","ref":"INR.7, párr. 10"},{"id":"G121","tema":"C","tipo":"caso","q":"Tras congelar los fondos de una entidad designada por el Comité 1718, un funcionario afirma que esos fondos ya son propiedad del Estado. Según el Glosario, ¿es correcto?","a":"No: siguen siendo propiedad de quien tenía interés en ellos, aunque el país podrá tomar su control para evitar su fuga","o":["Sí: para la R.7, congelar transfiere la propiedad al Estado mientras la designación del Consejo de Seguridad siga vigente","No: siguen siendo propiedad del titular, y el país tiene prohibido tomar el control de esos fondos o administrarlos","Sí, pero sólo si la designación la hizo el Consejo de Seguridad directamente y no alguno de sus Comités de sanciones","No: siguen siendo propiedad de quien tenía interés en ellos, aunque el país podrá tomar su control para evitar su fuga"],"x":"Para las R.6 y R.7, el Glosario define congelar como prohibir la transferencia, conversión, disposición o movimiento de los fondos; los bienes siguen siendo propiedad de quien tenía interés en ellos, y el país «podrá» tomar su control para protegerlos contra su fuga. Transferir la propiedad al Estado corresponde al decomiso.","ref":"R.7; Glosario (congelar)"},{"id":"G122","tema":"C","tipo":"caso","q":"Un país identificó a las OSFL que entran en la definición del GAFI y concluyó que un grupo de asociaciones culturales presenta un riesgo bajo de abuso para FT. Según la Nota a la R.8, respecto de ese grupo el país:","a":"Podrá centrarse sólo en acciones de acercamiento sobre FT y abstenerse de medidas adicionales de mitigación","o":["Debe aplicar de todos modos los cuatro elementos: acercamiento, supervisión, investigación y respuesta internacional","Podrá centrarse sólo en acciones de acercamiento sobre FT y abstenerse de medidas adicionales de mitigación","Debe exigirles DDC sobre donantes y beneficiarios, aunque con medidas simplificadas por su riesgo bajo","Debe excluirlas de toda medida, incluido el acercamiento, porque la R.8 sólo cubre a OSFL de alto riesgo"],"x":"La INR.8 (párr. 7) dice que, para OSFL de riesgo bajo, los países «podrán» centrarse sólo en el acercamiento sobre FT y abstenerse de medidas adicionales; los cuatro elementos corresponden a las demás situaciones. Las OSFL no son sujetos obligados y no debe exigírseles DDC (párr. 5e).","ref":"INR.8, párrs. 5(e) y 7"},{"id":"G123","tema":"C","tipo":"trampa","q":"¿Cuál de estas afirmaciones aparece en el texto de la R.8 y no sólo en su Nota interpretativa?","a":"Las medidas deben aplicarse sin perturbar ni desalentar indebidamente las actividades legítimas de las OSFL","o":["Las OSFL no son sujetos obligados y no debe exigírseles que apliquen debida diligencia a sus clientes","Las OSFL enfrentan distintos grados de riesgo de abuso para FT, y la mayoría puede representar un riesgo bajo","Un enfoque de «talla única» para supervisar a las OSFL sería incompatible con el enfoque basado en riesgo","Las medidas deben aplicarse sin perturbar ni desalentar indebidamente las actividades legítimas de las OSFL"],"x":"El texto de la R.8 pide identificar a las OSFL de la definición del GAFI, evaluar su riesgo de FT y aplicar medidas focalizadas, proporcionales y basadas en riesgo, sin perturbar ni desalentar indebidamente sus actividades legítimas. Que no son sujetos obligados, que la mayoría puede ser de riesgo bajo y el rechazo a la «talla única» son precisiones de la INR.8 (párrs. 5e, 6 y 7b).","ref":"R.8; INR.8, párrs. 5(e), 6 y 7(b)"},{"id":"G124","tema":"C","tipo":"caso","q":"Las autoridades identifican que una OSFL con programas legítimos de ayuda está siendo usada como conducto para FT. Según la Nota a la R.8, ¿cuál debe ser su primera prioridad?","a":"Investigar y detener el FT, minimizando en lo razonablemente posible el impacto en los beneficiarios legítimos","o":["Esperar a que concluyan los programas de ayuda en curso, para no afectar a los beneficiarios legítimos de la OSFL","Exigir a la OSFL que aplique DDC a sus beneficiarios y presente reportes de operaciones sospechosas","Investigar y detener el FT, minimizando en lo razonablemente posible el impacto en los beneficiarios legítimos","Actuar sólo después de que el Consejo de Seguridad designe a la OSFL conforme a la R.6"],"x":"La INR.8 (párr. 5d) dice que, al identificar OSFL sospechosas o implicadas en FT, la primera prioridad es investigar y detener ese financiamiento, respetando el Estado de derecho y minimizando en lo razonablemente posible el impacto en beneficiarios legítimos, sin que ese interés justifique aplazar acciones inmediatas. Las OSFL no son sujetos obligados, y actuar no depende de una designación.","ref":"INR.8, párr. 5(d)"},{"id":"G125","tema":"C","tipo":"trampa","q":"Según la Nota a la R.8, la identificación de las OSFL y la evaluación de sus riesgos de FT que realiza el país:","a":"Pueden adoptar diversas formas, ser o no un producto escrito, y deben revisarse periódicamente","o":["Pueden adoptar diversas formas, ser o no un producto escrito, y deben revisarse periódicamente","Deben constar siempre en un documento escrito y publicado, que se actualice cada año","Pueden ser o no un producto escrito y, una vez concluidas, no necesitan volver a revisarse","Deben documentarse por escrito, igual que las evaluaciones que la Nota a la R.1 exige a IF y APNFD"],"x":"La INR.8 (párr. 6d) dice que esos ejercicios deben usar todas las fuentes pertinentes y confiables, incluido el diálogo con las OSFL, pueden adoptar diversas formas, «pueden o no» ser un producto escrito y deben revisarse periódicamente. La documentación de evaluaciones que pide la INR.1 (párr. 12) es para IF y APNFD, no para este ejercicio del país.","ref":"INR.8, párr. 6(d); INR.1, párr. 12"},{"id":"G126","tema":"C","tipo":"trampa","q":"Según la Nota a la R.8, las sanciones que las autoridades pueden aplicar por violaciones de las OSFL o de quienes actúan en su nombre pueden incluir:","a":"Congelamiento de cuentas, remoción de fiduciarios, multas y retiro de certificación, licencia o registro","o":["Sólo multas administrativas, sin afectar su registro ni sus cuentas, para no desalentar las actividades legítimas","Sólo sanciones penales, que excluyen cualquier procedimiento civil o administrativo paralelo","Congelamiento de cuentas, remoción de fiduciarios, multas y retiro de certificación, licencia o registro","Únicamente su designación conforme a la R.6 y el decomiso sin condena de todos sus bienes"],"x":"La nota al pie 35 de la INR.8 dice que la gama de sanciones podría incluir congelamiento de cuentas, remoción de fiduciarios, multas, retiro de certificación, de licencia o de registro, sin excluir procedimientos civiles, administrativos o penales paralelos. El párr. 7(b)(iii) pide que sean eficaces, proporcionales y disuasivas.","ref":"INR.8, párr. 7(b)(iii) y nota al pie 35"},{"id":"G201","tema":"D","tipo":"trampa","q":"¿Cuál de estas afirmaciones sobre la R.9 (Leyes de secreto de las instituciones financieras) es correcta?","a":"Obliga a los países y es de las recomendaciones que no tienen Nota interpretativa","o":["Obliga directamente a las IF, y su Nota interpretativa fija las excepciones aplicables","Obliga a los países, y su Nota interpretativa fija las excepciones por secreto profesional","Obliga a los países y es de las recomendaciones que no tienen Nota interpretativa","Obliga a los países, pero sólo respecto de la cooperación internacional (R.37 a R.40)"],"x":"La R.9 dice que los países deben asegurar que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones, y es una de las que no tienen Nota interpretativa. Los distractores más tentadores le atribuyen una Nota inexistente con excepciones; la salvedad del secreto profesional legal aparece en otras partes, como la R.37, inciso (d).","ref":"R.9 (sin Nota interpretativa)"},{"id":"G202","tema":"D","tipo":"caso","q":"En el país Alfa, una ley de secreto bancario impide que las IF compartan información en supuestos que exigen las Recomendaciones del GAFI. ¿Qué establece el estándar al respecto?","a":"El país debe asegurar que esas leyes no inhiban la implementación de las Recomendaciones","o":["El país debe asegurar que esas leyes no inhiban la implementación de las Recomendaciones","Se alienta enfáticamente al país a revisarlas, pero la R.9 no le impone una obligación","El país podrá mantenerlas mientras lo justifique la Nota interpretativa a la R.9","Las IF deben invocar el secreto y considerar un reporte, según la Nota interpretativa a la R.20"],"x":"La R.9 usa «should»: los países deben asegurar que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones. No es una simple invitación («se alienta enfáticamente») y no existe Nota interpretativa a la R.9 que permita mantener esas leyes.","ref":"R.9"},{"id":"G203","tema":"D","tipo":"trampa","q":"¿Dónde se establece que los registros de operaciones de una IF deben permitir reconstruir operaciones individuales, incluidos los montos y el tipo de moneda, para servir de prueba si fuera necesario?","a":"En el propio texto de la R.11, que no tiene Nota interpretativa","o":["En la Nota interpretativa a la R.11, que desarrolla ese requisito","En la Nota interpretativa a la R.10, sobre DDC continua","En la Nota interpretativa a la R.16, sobre las IF intermediarias","En el propio texto de la R.11, que no tiene Nota interpretativa"],"x":"El requisito de reconstruir operaciones individuales (montos y tipo de moneda) está en el propio texto de la R.11, que no tiene Nota. La INR.16 sí pide a la IF intermediaria conservar cinco años la información recibida cuando hay limitaciones técnicas, y la INR.10 habla de mantener actualizada la información de DDC, pero ninguna contiene esta regla.","ref":"R.11 (sin Nota interpretativa)"},{"id":"G204","tema":"D","tipo":"caso","q":"Con la autorización apropiada, una autoridad nacional competente pide a una IF los registros de las operaciones de un cliente. La IF sólo conserva los de operaciones internacionales, porque las nacionales «ya quedan en el sistema de pagos». Conforme a la R.11:","a":"Incumple: la obligación abarca registros de operaciones tanto nacionales como internacionales","o":["Cumple: la Nota interpretativa a la R.11 limita la conservación a operaciones transfronterizas","Incumple: la obligación abarca registros de operaciones tanto nacionales como internacionales","Cumple, porque la Nota a la R.16 exime a las transferencias nacionales de conservar información","Incumple sólo respecto de las operaciones nacionales por encima de USD/EUR 15,000"],"x":"La R.11 exige conservar al menos cinco años todos los registros necesarios de operaciones, «tanto nacionales como internacionales», sin umbral. La R.11 no tiene Nota, y la INR.16 no exime de conservar: pide mantener la información de ordenante y beneficiario conforme a la R.11.","ref":"R.11; INR.16, párr. 22"},{"id":"G205","tema":"D","tipo":"trampa","q":"La obligación de tomar medidas razonables para determinar si los beneficiarios de una póliza de seguro de vida son PEP, a más tardar al momento del pago, ¿dónde se establece?","a":"En la Nota interpretativa a la R.12, sobre seguros de vida","o":["En la Nota interpretativa a la R.10, sobre beneficiarios de seguros","En la Nota interpretativa a la R.12, sobre seguros de vida","En el texto de la R.12, junto con sus medidas (a) a (d)","En el Glosario, en la definición de personas expuestas políticamente"],"x":"La INR.12 pide determinar si los beneficiarios de un seguro de vida (y, cuando se requiera, su beneficiario final) son PEP, a más tardar al momento del pago. El distractor más tentador es la INR.10, que regula la DDC de esos beneficiarios y su verificación al pago, pero no la detección de PEP.","ref":"INR.12"},{"id":"G206","tema":"D","tipo":"caso","q":"Una IF abre una cuenta a un familiar de un jefe de Estado extranjero en funciones. El familiar no ocupa ningún cargo público. Conforme a la R.12, además de la DDC normal:","a":"Aplican los requisitos de PEP extranjera, porque la R.12 los extiende a familiares y allegados","o":["Nada más: la Nota a la R.12 limita las medidas adicionales a quien ejerce la función pública","Aplican las medidas (b) a (d) sólo si la relación es de riesgo mayor, como con las PEP nacionales","Nada más, porque el Glosario excluye a las personas de rango medio o de menor jerarquía","Aplican los requisitos de PEP extranjera, porque la R.12 los extiende a familiares y allegados"],"x":"El texto de la R.12 dice que los requisitos para todos los tipos de PEP se aplican también a sus familiares y allegados; como la PEP es extranjera, rigen las medidas (a) a (d). La condición de «riesgo mayor» es propia de las PEP nacionales y de organismos internacionales, y la INR.12 sólo trata de seguros de vida.","ref":"R.12"},{"id":"G207","tema":"D","tipo":"trampa","q":"Para saber si un cliente o su beneficiario final es una PEP extranjera, el texto de la R.12 exige a las IF:","a":"Tener sistemas apropiados de gestión de riesgos que permitan determinarlo","o":["Tener sistemas apropiados de gestión de riesgos que permitan determinarlo","Tomar medidas razonables para determinarlo, como con las PEP nacionales","Consultar la lista oficial de PEP extranjeras que prevé la Nota a la R.12","Obtener la aprobación de la alta dirección antes de hacer esa determinación"],"x":"Para PEP extranjeras, el inciso (a) de la R.12 pide sistemas apropiados de gestión de riesgos; las «medidas razonables» son la fórmula para PEP nacionales y de organismos internacionales. La aprobación de la alta dirección es para establecer o continuar la relación, y la INR.12 no prevé ninguna lista.","ref":"R.12, inciso (a)"},{"id":"G208","tema":"D","tipo":"caso","q":"Un banco abre una relación transfronteriza a una casa de bolsa extranjera para liquidar operaciones con valores por cuenta de los clientes de ésta. ¿Debe aplicar los criterios (a) a (e) de la R.13?","a":"Sí: la Nota a la R.13 incluye relaciones similares establecidas para operaciones con valores","o":["No: el Glosario define la corresponsalía como servicios entre bancos, así que la R.13 no aplica","Sí, pero sólo cuando la casa de bolsa actúa como principal y no por cuenta de sus clientes","Sí: la Nota a la R.13 incluye relaciones similares establecidas para operaciones con valores","No, salvo que la casa de bolsa sea de un país para el que el GAFI pida DDC reforzada"],"x":"La R.13 abarca la corresponsalía transfronteriza «y otras relaciones similares», y la INR.13 da como ejemplo las establecidas para operaciones con valores o transferencias de fondos, ya sea que la institución actúe como principal o por cuenta de sus clientes. La definición de corresponsalía bancaria del Glosario no limita ese alcance.","ref":"INR.13; R.13"},{"id":"G209","tema":"D","tipo":"trampa","q":"La definición de «cuentas de transferencia de pagos» (payable-through accounts) como cuentas corresponsales que usan directamente terceros para realizar negocios por cuenta propia, ¿dónde se encuentra?","a":"En la Nota interpretativa a la R.13; el Glosario general sólo remite a ella","o":["En el Glosario general, dentro de la definición de corresponsalía bancaria","En el texto de la R.13, inciso (e), junto con la obligación de DDC","En la Nota interpretativa a la R.16, en su glosario de términos específicos","En la Nota interpretativa a la R.13; el Glosario general sólo remite a ella"],"x":"La definición está en la INR.13; el Glosario general sólo remite a esa Nota. El inciso (e) de la R.13 menciona estas cuentas y pide verificar la DDC del banco respondiente, pero no las define, y la corresponsalía bancaria del Glosario sólo las enlista entre los servicios.","ref":"INR.13; Glosario (cuentas de transferencia de pagos)"},{"id":"G210","tema":"D","tipo":"caso","q":"Un proveedor de servicios de transferencia de dinero o valores opera con una red de agentes, todos con registro propio ante una autoridad competente. Conforme a la R.14, ¿qué deben asegurar los países respecto de esos agentes?","a":"Que el proveedor los incluya en sus programas PLD/FT y vigile que cumplan con ellos","o":["Nada más: con registro propio, la Nota a la R.14 exime al proveedor de vigilarlos","Que el proveedor los incluya en sus programas PLD/FT y vigile que cumplan con ellos","Que el proveedor los trate como terceros en quienes se apoya, conforme a la Nota a la R.17","Que los incluya en su programa sólo si son filiales de propiedad mayoritaria (Nota a la R.18)"],"x":"El texto de la R.14 pide que los proveedores que usan agentes los incluyan en sus programas PLD/FT y los monitoreen, con independencia de que el agente tenga licencia o registro propio. La INR.14 sólo trata de no duplicar licencias para IF ya autorizadas, y la INR.17 excluye las relaciones de agencia del apoyo en terceros.","ref":"R.14; INR.14; INR.17, párr. 1"},{"id":"G211","tema":"D","tipo":"trampa","q":"Respecto de las personas físicas o morales que prestan servicios de transferencia de dinero o valores sin licencia ni registro, el texto de la R.14 establece que los países:","a":"Deben tomar acciones para identificarlas y aplicarles sanciones apropiadas","o":["Podrán tomar acciones para identificarlas, si su marco legal lo permite","Deben identificarlas, aunque las sanciones se precisan sólo en la Nota a la R.14","Deben tomar acciones para identificarlas y aplicarles sanciones apropiadas","Deben incorporarlas a la lista vigente de agentes accesible a las autoridades"],"x":"La R.14 usa «should»: los países deben tomar acciones para identificar a quienes prestan estos servicios sin licencia o registro y aplicarles sanciones apropiadas; ambas cosas están en el texto. La INR.14 no habla de sanciones, sino de no imponer una licencia separada a IF ya autorizadas.","ref":"R.14; INR.14"},{"id":"G212","tema":"D","tipo":"caso","q":"Un PSAV ordenante obtiene y conserva la información requerida del ordenante y del beneficiario, y la envía de inmediato y de forma segura al PSAV beneficiario por un canal distinto, sin adjuntarla directamente a la transferencia de activos virtuales. Según la Nota a la R.15:","a":"Es válido: puede enviarse directa o indirectamente, sin ir adjunta a la transferencia","o":["Es válido: puede enviarse directa o indirectamente, sin ir adjunta a la transferencia","No es válido: el texto de la R.16 exige que la información viaje con la transferencia en toda la cadena","Es válido sólo si la transferencia no supera USD/EUR 1,000, umbral de la Nota a la R.15","No es válido: debe enviarse en los tres días hábiles previstos en la Nota a la R.16"],"x":"La INR.15, párr. 7(b), exige enviar la información de inmediato y de forma segura, y su nota al pie 49 aclara que puede hacerse directa o indirectamente, sin adjuntarla a la transferencia de activos virtuales. El distractor más tentador traslada la regla general del texto de la R.16; los USD/EUR 1,000 son el umbral de DDC para operaciones ocasionales de PSAV.","ref":"INR.15, párr. 7(b) y nota al pie 49"},{"id":"G213","tema":"D","tipo":"memoria","q":"Según la Nota a la R.15, en materia de medidas preventivas, ¿qué requisitos se aplican a los PSAV?","a":"Los de las R.10 a R.21, con precisiones de la Nota para las R.10 y R.16","o":["Los de las R.10 a R.21, con precisiones de la Nota para las R.10 y R.16","Los de las R.10 a R.23, incluidos los de APNFD, con las mismas precisiones","Sólo los de las R.10 y R.11, porque la R.15 remite a DDC y registros","Los de las R.10 a R.21, salvo la R.16, que no aplica a activos virtuales"],"x":"La INR.15, párr. 7, aplica a los PSAV los requisitos de las R.10 a R.21, con dos precisiones: el umbral de USD/EUR 1,000 para operaciones ocasionales (R.10) y la información de ordenante y beneficiario en transferencias de activos virtuales (R.16). La R.16 sí aplica; las R.22 y 23 son para APNFD.","ref":"INR.15, párr. 7"},{"id":"G214","tema":"D","tipo":"caso","q":"Una empresa no cubierta en otra parte de las Recomendaciones custodia y administra, como negocio, activos virtuales por cuenta de sus clientes, sin cambiarlos por moneda fiduciaria. ¿Es PSAV?","a":"Sí: la custodia o administración de activos virtuales es una actividad de la definición","o":["No: el Glosario sólo considera PSAV a quien cambia activos virtuales por moneda fiduciaria","No: la Nota a la R.15 sólo considera PSAV a quien opera por encima de USD/EUR 1,000","Sí: la custodia o administración de activos virtuales es una actividad de la definición","Sí, pero sólo por ser persona moral; la Nota a la R.15 no pide licencia a personas físicas"],"x":"La definición de PSAV del Glosario incluye cinco actividades, entre ellas la custodia o administración de activos virtuales, no sólo el cambio por moneda fiduciaria. Los USD/EUR 1,000 de la INR.15 son el umbral de DDC en operaciones ocasionales, no un requisito de la definición, y la INR.15, párr. 3, también pide licencia o registro a los PSAV personas físicas.","ref":"R.15; Glosario (proveedor de servicios de activos virtuales); INR.15, párr. 3"},{"id":"G215","tema":"D","tipo":"caso","q":"Un país adoptó un umbral de minimis de USD/EUR 1,000. Una IF ordena una transferencia transfronteriza de USD 600 con nombre y número de cuenta del ordenante y del beneficiario, sin indicios de LD/FT. Según la Nota a la R.16, ¿debe verificarse la exactitud de esa información?","a":"No; sólo debe verificar la información de su cliente si surge sospecha de LD/FT","o":["Sí: el texto de la R.16 pide información exacta del ordenante en toda transferencia, sin excepción","No; sólo debe verificar la información de su cliente si surge sospecha de LD/FT","Sí, porque toda transferencia ocasional exige DDC completa conforme a la Nota a la R.10","No, y bajo el umbral puede omitir también el número de cuenta del beneficiario"],"x":"Bajo el umbral de minimis, la INR.16 (párr. 8) pide incluir nombres y números de cuenta, pero esa información no necesita verificarse salvo sospecha de LD/FT, caso en el que la IF verifica la de su cliente. El distractor más tentador lee el «exacta» del texto de la R.16 como absoluto e ignora la precisión de la Nota.","ref":"INR.16, párr. 8"},{"id":"G216","tema":"D","tipo":"memoria","q":"Cuando una IF se apoya en un tercero de su mismo grupo financiero, las «autoridades competentes relevantes» pueden considerar que aplica ciertos criterios mediante el programa del grupo. Según la Nota a la R.17, ¿quiénes son esas autoridades?","a":"La de origen, para las políticas del grupo, y las anfitrionas, para sucursales y filiales","o":["Sólo la autoridad del país donde está el tercero, como lo precisa el texto de la R.17","La UIF del país de origen, que según la Nota a la R.20 vigila los programas de grupo","Sólo el supervisor de origen, al que la Nota a la R.18 manda informar sobre el grupo","La de origen, para las políticas del grupo, y las anfitrionas, para sucursales y filiales"],"x":"La INR.17, párr. 2, define «autoridades competentes relevantes» como la autoridad de origen, para entender las políticas y controles del grupo, y las autoridades anfitrionas, para las sucursales y filiales. El distractor más tentador toma de la INR.18 el deber de informar al supervisor de origen, que es otra regla y no excluye a las anfitrionas.","ref":"INR.17, párr. 2"},{"id":"G217","tema":"D","tipo":"caso","q":"Una IF acepta a un cliente que le presenta un tercero regulado y supervisado, que ya le aplicó su propia DDC. Según los criterios de la R.17, ¿qué debe obtener la IF de inmediato?","a":"La información necesaria sobre los elementos (a) a (c) de las medidas de DDC de la R.10","o":["Copias de todos los documentos de identificación, que el tercero debe entregarle ya","La información necesaria sobre los elementos (a) a (c) de las medidas de DDC de la R.10","Nada de inmediato: la Nota a la R.17 le permite recabar la información en la primera operación","La información sobre los elementos (a) a (d) de la DDC, incluida la debida diligencia continua"],"x":"El criterio (a) de la R.17 pide obtener de inmediato la información sobre los elementos (a) a (c) de la DDC. Las copias de la documentación no se obtienen en ese momento: basta asegurarse de que el tercero las entregará sin demora cuando se le pidan (criterio b), y la debida diligencia continua (d) no está entre los elementos en que la R.17 permite apoyarse.","ref":"R.17, criterios (a) y (b)"},{"id":"G218","tema":"D","tipo":"caso","q":"El programa PLD/FT de un banco incluye políticas y controles, capacitación continua del personal y auditoría independiente; sin embargo, contrata personal sin ninguna revisión previa. Según la Nota a la R.18, ¿qué le falta?","a":"Procedimientos adecuados de selección que aseguren altos estándares al contratar","o":["Procedimientos adecuados de selección que aseguren altos estándares al contratar","Nada: el texto de la R.18 sólo exige implementar programas, sin detallar su contenido","Un registro de sus empleados conservado al menos cinco años, conforme a la R.11","La aprobación previa de la UIF para cada contratación en el área de cumplimiento"],"x":"La INR.18, párr. 1(a), incluye en el programa procedimientos adecuados de selección para asegurar altos estándares al contratar empleados. El texto de la R.18 exige implementar programas, pero es la Nota la que enumera sus componentes (controles internos, selección de personal, capacitación continua y auditoría independiente), y la pregunta se refiere a la Nota.","ref":"INR.18, párr. 1(a)"},{"id":"G219","tema":"D","tipo":"caso","q":"Frente a un país con deficiencias en sus sistemas PLD/FT, el país Beta decide prohibir que sus IF se apoyen en terceros ubicados ahí para realizar elementos de la DDC. ¿Cómo se ubica esta medida en los estándares?","a":"Es un ejemplo de contramedida que los países podrían aplicar, según la Nota a la R.19","o":["Contradice la R.17, que sólo permite tomar en cuenta el riesgo país, no prohibir el apoyo","Sólo sería válida si el GAFI la pidió, porque un país no aplica contramedidas por su cuenta","Es una medida de DDC reforzada de las que enumera la Nota a la R.10 en su párrafo 20","Es un ejemplo de contramedida que los países podrían aplicar, según la Nota a la R.19"],"x":"La INR.19, párr. 2(f), da como ejemplo de contramedida prohibir que las IF se apoyen en terceros ubicados en el país de que se trate. La R.19 permite aplicar contramedidas también sin llamado del GAFI, y el párrafo 20 de la INR.10 enumera medidas de DDC reforzada de las IF, no contramedidas de los países.","ref":"INR.19, párr. 2(f); R.19"},{"id":"G220","tema":"D","tipo":"memoria","q":"Según la Nota a la R.19, ¿qué medidas de debida diligencia reforzada podrían aplicar las IF en sus relaciones con personas de países de mayor riesgo?","a":"Las del párrafo 20 de la Nota a la R.10 y otras de efecto similar para mitigar riesgos","o":["Sólo las contramedidas de los incisos (a) a (i) que enumera la propia Nota a la R.19","Sólo las medidas (b), (c) y (d) de la R.12, que la Nota a la R.19 vuelve obligatorias","Las del párrafo 20 de la Nota a la R.10 y otras de efecto similar para mitigar riesgos","Sólo las que detalle el GAFI en su llamado, sin otras medidas de efecto similar"],"x":"La INR.19, párr. 1, remite a las medidas de DDC reforzada del párrafo 20 de la INR.10 y a cualquier otra con efecto similar para mitigar riesgos. Los incisos (a) a (i) de la misma Nota son ejemplos de contramedidas que aplican los países, no medidas de DDC de las IF.","ref":"INR.19, párr. 1; INR.10, párr. 20"},{"id":"G221","tema":"D","tipo":"trampa","q":"Para la R.20, «actividad delictiva» puede entenderse como todos los actos delictivos que constituirían delito precedente de LD o, como mínimo, los delitos precedentes que exige la R.3. Según la Nota a la R.20, ¿cuál es la postura del GAFI?","a":"Se alienta enfáticamente a los países a adoptar la primera alternativa","o":["Los países deben adoptar la primera; la segunda es sólo una opción transitoria","Los países podrán elegir cualquiera, sin que el GAFI exprese preferencia","Se alienta enfáticamente a los países a adoptar la primera alternativa","Se alienta enfáticamente a los países a adoptar la segunda, más acotada"],"x":"La INR.20, párr. 1, dice «strongly encouraged»: se alienta enfáticamente a adoptar la primera alternativa (todos los actos que constituirían delito precedente). No es una obligación («deben») ni una elección neutra; la segunda alternativa es el mínimo aceptable.","ref":"INR.20, párr. 1"},{"id":"G222","tema":"D","tipo":"caso","q":"Una IF sospecha que un cliente envía fondos a un terrorista individual, pero no logra vincularlos con ningún acto terrorista específico. Conforme a la R.20 y su Nota, la IF:","a":"Debe reportar: el FT abarca a terroristas individuales aun sin vínculo con un acto específico","o":["No debe reportar mientras no identifique el acto terrorista concreto que se pretende financiar","Sólo debe congelar los fondos, pues en estos casos la R.6 desplaza la obligación de reportar","Debe reportar sólo si el monto supera USD/EUR 15,000, umbral de DDC fijado en la R.10","Debe reportar: el FT abarca a terroristas individuales aun sin vínculo con un acto específico"],"x":"La INR.20, párr. 2, precisa que la referencia al FT de la R.20 abarca el financiamiento de actos terroristas y también de organizaciones terroristas o terroristas individuales, aun sin vínculo con un acto específico. El reporte no depende de un monto ni lo sustituye el congelamiento de la R.6.","ref":"INR.20, párrs. 2 y 3"},{"id":"G223","tema":"D","tipo":"trampa","q":"Durante el monitoreo, una IF advierte motivos razonables para sospechar que los fondos de un cliente, cuya DDC está completa y actualizada, provienen de un fraude. ¿Qué exige la R.20?","a":"Reportar su sospecha con prontitud a la UIF; bastan los motivos razonables para sospechar","o":["Reportar su sospecha con prontitud a la UIF; bastan los motivos razonables para sospechar","Sólo considerar un reporte, como prevé la R.10 cuando no puede completarse la DDC","Reportar hasta tener certeza del delito precedente, según precisa la Nota a la R.20","Terminar la relación y reportar en los tres días hábiles que fija la Nota a la R.16"],"x":"La R.20 obliga a reportar con prontitud cuando la IF sospecha o tiene motivos razonables para sospechar que los fondos son producto de una actividad delictiva. «Considerar» un reporte es la fórmula de la R.10 para cuando no se puede completar la DDC, y la INR.20 no exige certeza del delito.","ref":"R.20; R.10"},{"id":"G224","tema":"D","tipo":"trampa","q":"La protección legal frente a la responsabilidad penal y civil para quien reporta de buena fe a la UIF, aun sin saber con precisión cuál era la actividad delictiva subyacente, ¿dónde se establece?","a":"En el texto de la R.21, inciso (a); esa recomendación no tiene Nota","o":["En la Nota interpretativa a la R.21, que desarrolla la protección legal","En el texto de la R.21, inciso (a); esa recomendación no tiene Nota","En la Nota interpretativa a la R.20, junto con las operaciones intentadas","En la Nota interpretativa a la R.23, junto con el secreto profesional"],"x":"La protección por reportar de buena fe, aunque no se conozca con precisión la actividad delictiva y sin importar si ocurrió, está en el inciso (a) de la R.21, que no tiene Nota. La INR.20 trata de operaciones intentadas y sin importar el monto, y la INR.23 del secreto profesional de abogados y contadores.","ref":"R.21, inciso (a) (sin Nota interpretativa)"},{"id":"G225","tema":"D","tipo":"caso","q":"Un empleado de un banco, con la intención de disuadir a un cliente de seguir con una actividad ilegal, le cuenta que el área de cumplimiento está presentando un reporte de operación sospechosa sobre él. Conforme a los estándares:","a":"Incurre en revelación prohibida: la R.21 alcanza a los directivos, funcionarios y empleados","o":["No hay revelación: la Nota a la R.23 dice que intentar disuadir al cliente no es tipping-off","No hay falta: la prohibición de la R.21 obliga a la institución, pero no a sus empleados","No hay falta, porque la R.21 no pretende inhibir el intercambio de información de la R.18","Incurre en revelación prohibida: la R.21 alcanza a los directivos, funcionarios y empleados"],"x":"La R.21, inciso (b), prohíbe por ley a las IF, sus directivos, funcionarios y empleados revelar que se presenta un reporte de operación sospechosa. La excepción de disuadir al cliente de la INR.23, párr. 4, es sólo para abogados, notarios, otros profesionales jurídicos independientes y contadores que actúan como tales, no para empleados de un banco.","ref":"R.21, inciso (b); INR.23, párr. 4"},{"id":"G226","tema":"D","tipo":"caso","q":"Un casino identifica a cada cliente en la entrada. Después, un cliente cambia USD 4,000 en fichas y el casino no puede relacionar esa operación con los datos que tomó en la puerta. Según la Nota a la R.22:","a":"Incumple: identificar en la entrada puede no bastar y debe poder vincular la DDC con las operaciones","o":["Incumple: identificar en la entrada puede no bastar y debe poder vincular la DDC con las operaciones","Cumple: la Nota a la R.22 considera suficiente, en todos los casos, la identificación en la entrada","Cumple, porque en casinos la DDC sólo se exige por encima de USD/EUR 15,000, como en la R.10","Incumple sólo si el casino opera por internet o en un barco, según la nota al pie del Glosario"],"x":"La INR.22, párr. 2, pide DDC en operaciones iguales o superiores a USD/EUR 3,000 y aclara que identificar en la entrada podría bastar, pero no necesariamente; el casino debe poder vincular la DDC de cada cliente con sus operaciones. Los USD/EUR 15,000 son el umbral de la R.10 y el de metales y piedras preciosas en efectivo, y los casinos por internet o en barcos están incluidos, no son un requisito.","ref":"INR.22, párr. 2; INR.22/23, párr. 1"},{"id":"G227","tema":"D","tipo":"caso","q":"Una red de despachos contables opera con la misma estructura que un grupo financiero: una matriz controla y coordina a sus filiales, sujetas a políticas PLD/FT a nivel de grupo. Para efectos de la R.23, ¿se le aplican los requisitos de la R.18 para grupos financieros?","a":"Sí: la Nota a las R.22 y 23 los aplica a grupos de APNFD con esa misma estructura","o":["No: la R.18 y su Nota se refieren a grupos financieros, por lo que no alcanzan a APNFD","Sólo se alienta enfáticamente a aplicarlos, según el párrafo 3 de la Nota a la R.23","Sí: la Nota a las R.22 y 23 los aplica a grupos de APNFD con esa misma estructura","Sí, pero sólo si alguna filial está en un país señalado por el GAFI conforme a la R.19"],"x":"La INR.22/23, párr. 2, dice que, para la R.23, los requisitos de la R.18 sobre «grupos financieros» se aplican a los grupos de APNFD que operan con la misma estructura; para otras estructuras con propiedad, dirección o control de cumplimiento comunes, los países deben considerar aplicarlos. El párrafo 3 de la INR.23 trata del envío de reportes a organismos autorreguladores.","ref":"R.23; INR.22/23, párr. 2"},{"id":"G228","tema":"D","tipo":"trampa","q":"Respecto del resto de las actividades profesionales de los contadores, incluida la auditoría, el texto de la R.23 establece que se alienta enfáticamente a los países a:","a":"Extenderles también la obligación de reportar operaciones sospechosas","o":["Excluirlas del reporte, por estar cubiertas por el secreto profesional de la Nota a la R.23","Extenderles también la obligación de reportar operaciones sospechosas","Aplicarles el umbral de USD/EUR 15,000 de la Nota a las R.22 y 23 antes de reportar","Someterlas sólo a DDC conforme a la R.22, sin obligación de reportar"],"x":"El inciso (a) de la R.23 alienta enfáticamente a los países a extender la obligación de reportar al resto de las actividades profesionales de los contadores, incluida la auditoría. El secreto profesional de la INR.23 exime de reportar cierta información, no excluye actividades completas, y el umbral de USD/EUR 15,000 es para metales y piedras preciosas en efectivo.","ref":"R.23, inciso (a)"},{"id":"G301","tema":"E","tipo":"trampa","q":"¿En qué parte de los estándares del GAFI se establece que los países deben seguir un enfoque de múltiples vías para que la autoridad competente pueda determinar oportunamente quién es el beneficiario final de una sociedad?","a":"En la Nota interpretativa a la R.24, sección de información de beneficiario final","o":["En el texto de la R.24, junto con la prohibición de emitir nuevas acciones al portador","En la Nota interpretativa a la R.10, dentro de la DDC de clientes que son personas morales","En la Nota interpretativa a la R.24, sección de información de beneficiario final","En el Glosario, como parte de la definición de beneficiario final de personas morales"],"x":"El enfoque de múltiples vías está en la INR.24, párr. 7 (sociedad que obtiene y conserva la información, autoridad u organismo público que la conserva o mecanismo alternativo, y medidas complementarias). El texto de la R.24 sólo habla de «un registro de beneficiarios finales o un mecanismo alternativo»; la INR.10 regula la DDC de la IF, no el diseño del sistema del país.","ref":"INR.24, párr. 7; R.24"},{"id":"G302","tema":"E","tipo":"caso","q":"La sociedad Ferrocal, que no cotiza en bolsa, tiene acciones al portador emitidas hace años. Su país eligió convertirlas a forma nominativa dentro de un plazo razonable. Antes de que concluya la conversión, un tenedor quiere votar en la asamblea. Según la Nota a la R.24:","a":"El tenedor debe notificar a la sociedad y ésta registrar su identidad antes de que pueda ejercer sus derechos","o":["El tenedor puede votar libremente hasta que venza el plazo, porque las acciones existentes conservan plena validez","El tenedor debe entregar sus títulos para cancelarlos de inmediato, porque la R.24 exige eliminar las acciones existentes","El tenedor sólo debe identificarse ante la sociedad si su participación supera el 25 % del capital social","El tenedor debe notificar a la sociedad y ésta registrar su identidad antes de que pueda ejercer sus derechos"],"x":"La INR.24, párr. 12(c), exige que, mientras no concluya la conversión o la inmovilización, el tenedor notifique a la sociedad y ésta registre su identidad antes de ejercer cualquier derecho. La R.24 prohíbe emitir nuevas acciones al portador, pero para las existentes pide prevenir su mal uso, no cancelarlas de inmediato; el 25 % de la nota al pie 64 es el tope del umbral para accionistas controladores, no una condición para identificar al tenedor.","ref":"INR.24, párr. 12(c); R.24"},{"id":"G303","tema":"E","tipo":"caso","q":"Una sociedad constituida en el país X opera en el país Y con sucursal, empleados y relaciones de negocios significativas con IF locales. Conforme a los criterios de Y, tiene vínculos suficientes con ese país y presenta riesgos de LD. Según la Nota a la R.24, el país Y:","a":"Debe asegurar que sus autoridades puedan obtener o acceder oportunamente a la información de su beneficiario final","o":["Queda liberado, porque la R.24 sólo abarca a las personas morales que se constituyen dentro del propio país","Debe asegurar que sus autoridades puedan obtener o acceder oportunamente a la información de su beneficiario final","Sólo puede pedir esa información al país X por asistencia legal mutua, sin exigir ningún mecanismo propio","Debe obligar a la sociedad a constituirse de nuevo en Y como condición para seguir operando en su territorio"],"x":"La INR.24, párr. 1, extiende el acceso oportuno a la información de beneficiario final a las personas morales no constituidas en el país que presenten riesgos de LD/FT y tengan vínculos suficientes con él, y la nota al pie 66 da como ejemplos la sucursal, el personal y las relaciones significativas con IF. El texto de la R.24 no hace esa distinción, pero su Nota sí: no se limita a las sociedades locales.","ref":"INR.24, párr. 1 y notas al pie 66 y 67"},{"id":"G304","tema":"E","tipo":"cifra","q":"Según la Nota a la R.25, ¿durante cuánto tiempo, como mínimo, deben conservar los fiduciarios la información de beneficiario final del fideicomiso?","a":"Al menos cinco años después de que cese su participación en el fideicomiso","o":["Al menos cinco años después de que cese su participación en el fideicomiso","Al menos cinco años después de que el fideicomiso deje de ser cliente de la IF","Al menos diez años después de que cese su participación en el fideicomiso","Al menos cinco años contados a partir de la constitución del fideicomiso"],"x":"La INR.25, párr. 8, fija al menos cinco años desde que cesa la participación del fiduciario en el fideicomiso. El plazo que corre desde que el cliente deja de serlo de la IF o del intermediario (o desde la disolución) está en la Nota vecina, la INR.24, párr. 8, para personas morales.","ref":"INR.25, párr. 8; INR.24, párr. 8"},{"id":"G305","tema":"E","tipo":"trampa","q":"Respecto del protector de un fideicomiso expreso (si lo hay) y de cualquier otra persona física que ejerza el control efectivo último sobre él, ¿cuál afirmación es correcta sobre dónde se exige la información de su identidad?","a":"No figuran en el texto de la R.25; los incorporan su Nota interpretativa y el Glosario","o":["Figuran en el texto de la R.25, en la misma lista que el fideicomitente y el fiduciario","No figuran en el texto de la R.25; los incorporan su Nota interpretativa y el Glosario","Sólo se exigen respecto de las personas morales, conforme a la Nota interpretativa a la R.24","No se exigen en ningún documento del GAFI; son una buena práctica sugerida para fiduciarios"],"x":"El texto de la R.25 sólo enumera fideicomitente(s), fiduciario(s) y beneficiario(s); el protector y la persona física con control efectivo último aparecen en la INR.25, párr. 1, y en la definición de beneficiario final del Glosario. La INR.24 trata personas morales y no menciona al protector.","ref":"R.25; INR.25, párr. 1; Glosario (beneficiario final)"},{"id":"G306","tema":"E","tipo":"caso","q":"En el país Z no existe la figura del fideicomiso. Ramiro, residente en Z, es fiduciario de un fideicomiso expreso regido por la ley del país W. Según la Nota a la R.25:","a":"Z no está obligado a reconocer los fideicomisos, pero debe exigir a Ramiro la información de beneficiario final","o":["Z queda fuera de la R.25, que sólo aplica a países cuyo derecho regula los fideicomisos expresos","Z debe reformar su legislación para reconocer legalmente los fideicomisos antes de poder exigirle cualquier dato a Ramiro","Z no está obligado a reconocer los fideicomisos, pero debe exigir a Ramiro la información de beneficiario final","Sólo el país W, cuya ley rige el fideicomiso, puede exigir a Ramiro que obtenga y conserve la información de beneficiario final"],"x":"La INR.25, párr. 1, obliga a exigir la información a los fiduciarios residentes en el país o que administren ahí fideicomisos, sin importar la ley que los rija, y el párr. 11 aclara que los países no están obligados a dar reconocimiento legal a los fideicomisos. Por eso Z no queda fuera ni necesita reformar su ley para exigírsela a Ramiro.","ref":"INR.25, párrs. 1 y 11"},{"id":"G307","tema":"G","tipo":"trampa","q":"¿En qué parte de los estándares del GAFI se pide a los países tomar medidas inmediatas para ser parte de la Convención de Viena, la Convención de Palermo, la Convención contra la Corrupción y el Convenio sobre Financiamiento del Terrorismo, e implementarlos plenamente?","a":"En el texto de la R.36, la cual no tiene Nota interpretativa propia","o":["En la Nota interpretativa a la R.36, sección de instrumentos de la ONU","En el texto de la R.36, la cual no tiene Nota interpretativa propia","En la Nota interpretativa a la R.37, como condición para la asistencia","En el Glosario, en la definición de «instrumentos internacionales»"],"x":"La obligación está en el texto mismo de la R.36, que carece de Nota interpretativa; por eso cualquier opción que cite «la Nota a la R.36» o «la Nota a la R.37» es falsa, pues ninguna de las dos existe. El Glosario no define «instrumentos internacionales».","ref":"R.36"},{"id":"G308","tema":"G","tipo":"trampa","q":"Respecto del Convenio del Consejo de Europa sobre Ciberdelincuencia (2001), ¿qué establece la R.36 para los países?","a":"Los alienta a ratificarlo y a implementarlo, cuando aplique en su caso","o":["Los alienta a ratificarlo y a implementarlo, cuando aplique en su caso","Les exige ratificarlo sólo si son miembros del Consejo de Europa, según la Nota a la R.36","Les exige tomar medidas inmediatas para ser parte de él e implementarlo plenamente","No lo menciona, porque la R.36 se limita a las convenciones de las Naciones Unidas"],"x":"La R.36 distingue dos niveles: «deben» tomar medidas inmediatas para ser parte de Viena, Palermo, la Convención contra la Corrupción y el Convenio sobre FT, mientras que «se alienta» a ratificar, cuando aplique, otras como el Convenio sobre Ciberdelincuencia, la Convención Interamericana contra el Terrorismo y el Convenio del Consejo de Europa de 2005. La R.36 no tiene Nota.","ref":"R.36"},{"id":"G309","tema":"G","tipo":"caso","q":"El país Q es parte de la Convención de Viena y del Convenio sobre Financiamiento del Terrorismo, pero no de la Convención de Palermo ni de la Convención contra la Corrupción. Su equipo jurídico sostiene que con eso ya cumple la R.36. Según la R.36, Q:","a":"Debe tomar medidas inmediatas para ser parte de las cuatro convenciones e implementarlas plenamente","o":["Cumple, porque la R.36 pide ser parte de al menos dos de las cuatro convenciones que enumera como obligatorias","Sólo se le alienta a ratificar Palermo y la Convención contra la Corrupción, cuando aplique","Cumple si incorpora a su derecho interno el contenido de ambas convenciones, aunque nunca llegue a ser parte de ellas","Debe tomar medidas inmediatas para ser parte de las cuatro convenciones e implementarlas plenamente"],"x":"La R.36 pide tomar medidas inmediatas para ser parte de las cuatro convenciones (Viena 1988, Palermo 2000, contra la Corrupción 2003 y FT 1999) y aplicarlas plenamente; no basta con dos ni con copiar su contenido sin ser parte. El «aliento» cuando aplique es sólo para otras convenciones, como la de Ciberdelincuencia.","ref":"R.36"},{"id":"G310","tema":"G","tipo":"caso","q":"El país A pide asistencia legal mutua al país B en una investigación de LD. La solicitud no implica acciones coercitivas, pero la conducta investigada no es delito en B. Según la R.37, B:","a":"Debe prestar la asistencia aunque no haya doble incriminación, porque no implica acciones coercitivas","o":["Puede negarla, porque sin doble incriminación la R.37 sólo pide considerar medidas para ampliar la asistencia","Debe negarla, porque la doble incriminación es requisito indispensable de toda asistencia legal mutua","Debe prestar la asistencia aunque no haya doble incriminación, porque no implica acciones coercitivas","Debe prestarla sólo si la Nota interpretativa a la R.37 incluye esa conducta en su lista de delitos"],"x":"La R.37 dice que los países deben prestar asistencia legal mutua a pesar de la falta de doble incriminación si no implica acciones coercitivas. El «considerar» se refiere a adoptar medidas para dar un alcance amplio a la asistencia sin doble incriminación en los demás casos, no a este. La R.37 no tiene Nota interpretativa.","ref":"R.37"},{"id":"G311","tema":"G","tipo":"trampa","q":"¿Dónde se establece que los países deben usar una autoridad central u otro mecanismo oficial establecido para transmitir y ejecutar las solicitudes de asistencia legal mutua, y mantener un sistema de gestión de casos?","a":"En el texto de la R.37, inciso (b), sobre la priorización y ejecución de solicitudes","o":["En la Nota interpretativa a la R.37, en su sección sobre autoridades centrales","En el texto de la R.37, inciso (b), sobre la priorización y ejecución de solicitudes","En la Nota interpretativa a la R.40, entre los principios del intercambio entre UIF","En el texto de la R.39, que exige esa autoridad central para las extradiciones"],"x":"La autoridad central y el sistema de gestión de casos están en la R.37, inciso (b); la R.37 no tiene Nota interpretativa. La R.39 pide un sistema de gestión de casos para la extradición, pero no menciona una autoridad central, y la INR.40, que regula las otras formas de cooperación, no prevé esa figura.","ref":"R.37, inciso (b)"},{"id":"G312","tema":"G","tipo":"caso","q":"El país B recibe una solicitud de asistencia legal mutua por LD que pide registros que un banco resguarda bajo la ley de secreto bancario de B, e información que un abogado conserva en circunstancias amparadas por el secreto profesional legal. Según la R.37:","a":"B no puede negarse por el secreto bancario; la salvedad se limita a lo amparado por el secreto profesional legal","o":["B no puede negarse por el secreto bancario; la salvedad se limita a lo amparado por el secreto profesional legal","B debe entregar ambas, porque la R.37 no admite ninguna salvedad por secreto o confidencialidad profesional","B puede negarse respecto de ambas, porque las leyes de secreto de IF y APNFD prevalecen sobre la asistencia","B puede negarse respecto de los registros bancarios, porque la Nota interpretativa a la R.37 exceptúa el secreto bancario"],"x":"La R.37, inciso (d), prohíbe negar la asistencia porque las leyes exijan a IF o APNFD guardar secreto, salvo cuando la información está amparada por el privilegio o el secreto profesional l
