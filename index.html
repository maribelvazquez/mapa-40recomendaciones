> (INR.5, párr. 5)."},{"barra":true,"color":"morado","titulo":"Decomiso en casa vs. a petición de otro país","ref":"R.4 · R.38","html":"R.4: el país identifica, congela, incauta y decomisa. R.38: responde a solicitudes extranjeras y <b>ejecuta órdenes<\/b> de otros países."},{"barra":true,"color":"principal","titulo":"Instituciones financieras vs. APNFD","ref":"R.10 · R.22","html":"R.10: DDC de IF; ocasionales por encima de USD/EUR 15,000. R.22: la misma DDC para APNFD en supuestos específicos; los montos están en la Nota (INR.22/23): casinos desde 3,000; metales y piedras en efectivo desde 15,000."},{"barra":true,"color":"principal","titulo":"PEP extranjera vs. nacional","ref":"R.12","html":"Extranjera: medidas adicionales <b>siempre<\/b>. Nacional o de organismo internacional: medidas razonables para detectarla y, si la relación es de <b>mayor riesgo<\/b>, las medidas adicionales."},{"barra":true,"color":"principal","titulo":"Apoyarse en terceros vs. subcontratar","ref":"R.17 · INR.17","html":"En la R.17 el tercero aplica <b>sus propios<\/b> procedimientos y la responsabilidad última queda en la IF. En la subcontratación o agencia, el tercero aplica los procedimientos <b>de la IF<\/b>; la R.17 no aplica."},{"barra":true,"color":"principal","titulo":"Reportar vs. callar","ref":"R.20 · R.21","html":"R.20: reportar con prontitud a la UIF. R.21: protección legal a quien reporta de buena fe y <b>prohibición de revelar<\/b> el reporte."},{"barra":true,"color":"turquesa","titulo":"Personas morales vs. estructuras jurídicas","ref":"R.24 · R.25","html":"R.24: sociedades y demás personas morales (acciones al portador, nominales, registro). R.25: fideicomisos expresos y figuras similares (fideicomitente, fiduciario, beneficiarios)."},{"barra":true,"color":"negro","titulo":"Supervisar IF, facultades y APNFD","ref":"R.26 · R.27 · R.28","html":"R.26: regulación y supervisión de <b>IF<\/b>. R.27: <b>facultades<\/b> del supervisor (inspeccionar, exigir información, sancionar). R.28: regulación y supervisión de <b>APNFD<\/b>."},{"barra":true,"color":"negro","titulo":"Responsabilidades vs. facultades de quien investiga","ref":"R.30 · R.31","html":"R.30: <b>quién<\/b> investiga y la investigación financiera paralela. R.31: <b>qué puede hacer<\/b> (medidas obligatorias, operaciones encubiertas, entrega vigilada). La R.31 no tiene Nota."},{"barra":true,"color":"morado","titulo":"Asistencia legal mutua vs. otras formas de cooperación","ref":"R.37 · R.40","html":"R.37: asistencia legal mutua en investigaciones y procesos. R.40: cooperación entre autoridades (UIF, supervisores, orden público), espontánea y a solicitud."},{"barra":true,"color":"gris","titulo":"EBR del país y la institución vs. EBR del supervisor","ref":"R.1 · INR.26","html":"R.1: el país y las instituciones evalúan riesgos y ajustan medidas. INR.26: el supervisor asigna sus recursos y fija frecuencia e intensidad de la supervisión según los riesgos."}]},{"tipo":"cifras","id":"cifras","nav":"Umbrales","titulo":"Umbrales y cifras que preguntan","intro":"Cada número con su fuente: Recomendación, Nota interpretativa o Glosario.","cifras":[["40","recomendaciones","En 7 secciones, de la A a la G","Adoptadas en feb-2012 · actualizadas a jun-2026"],["29","con Nota","Tienen Nota interpretativa; 11 no la tienen","Lista de las Recomendaciones (asterisco)"],["15,000","USD/EUR","DDC en operaciones ocasionales de instituciones financieras","R.10 · INR.10, párr. 22"],["3,000","USD/EUR","Casinos: DDC cuando el cliente opera por esa cantidad o más","INR.22/23, párr. 1 · INR.22, párr. 2"],["15,000","USD/EUR","Metales y piedras preciosas: operación en efectivo igual o superior","INR.22/23, párr. 1"],["1,000","USD/EUR","DDC en operaciones ocasionales de proveedores de activos virtuales","INR.15, párr. 7(a)"],["≤1,000","USD/EUR","Umbral de minimis opcional para pagos y transferencias","INR.16, párrs. 8 y 10"],["5","años","Mínimo para conservar registros (DDC: desde que termina la relación o la operación ocasional)","R.11"],["15,000","USD/EUR","Máximo del umbral para declarar efectivo en frontera","INR.32, párr. 3"],["25%","máximo","Umbral de participación para identificar accionistas controladores","INR.24, nota al pie 64"],["21","categorías","Categorías designadas de delitos precedentes","Glosario · INR.3, párr. 4"],["Horas","«sin demora»","Idealmente, desde la designación de la ONU o su Comité (en la 1373: al haber motivos razonables)","Glosario"]]},{"tipo":"simulador","id":"examen","nav":"Practicar ▸"}],"temas":{"A":"A · Políticas y coordinación (R.1–2)","B":"B · Lavado de dinero y decomiso (R.3–4)","C":"C · Terrorismo y proliferación (R.5–8)","D":"D · Medidas preventivas (R.9–23)","E":"E · Transparencia y beneficiario final (R.24–25)","F":"F · Autoridades (R.26–35)","G":"G · Cooperación internacional (R.36–40)"},"modos":[{"k":"A","l":"A · Políticas y coordinación","tema":"A"},{"k":"B","l":"B · Lavado de dinero y decomiso","tema":"B"},{"k":"C","l":"C · Terrorismo y proliferación","tema":"C"},{"k":"D","l":"D · Medidas preventivas","tema":"D"},{"k":"E","l":"E · Transparencia y beneficiario final","tema":"E"},{"k":"F","l":"F · Autoridades","tema":"F"},{"k":"G","l":"G · Cooperación internacional","tema":"G"},{"k":"rn","l":"¿Recomendación o Nota?","tipos":["trampa"]},{"k":"caso","l":"Casos prácticos","tipos":["caso"]},{"k":"cif","l":"Umbrales y cifras","tipos":["cifra"]}],"banco":[{"id":"G001","tema":"A","tipo":"caso","q":"La evaluación nacional de riesgos de un país concluye que un tipo de microseguro de vida presenta un riesgo menor de LD/FT. Conforme a la R.1, ¿qué corresponde hacer al país respecto de ese producto?","a":"Permitir y alentar la aplicación de medidas simplificadas, según corresponda","o":["Exentarlo en automático de todas las Recomendaciones","Permitir y alentar la aplicación de medidas simplificadas, según corresponda","Obligar a las aseguradoras a aplicar medidas simplificadas a todos sus clientes, sin excepción ni análisis propio","Suspender la designación de la autoridad coordinadora hasta que concluya la siguiente evaluación nacional"],"x":"La R.1 dice que, ante riesgos menores, los países deben «permitir y alentar» medidas simplificadas «según corresponda»; no las impone ni exime en automático. Las exenciones son una decisión del país y exigen riesgo bajo, ya sea en circunstancias limitadas y justificadas para un tipo concreto de IF, actividad o APNFD, o por tratarse de una actividad financiera ocasional o muy limitada (INR.1, párr. 8).","ref":"R.1; INR.1, párrs. 7 y 8"},{"id":"G002","tema":"A","tipo":"trampa","q":"Una IF aplica DDC simplificada a un cliente de riesgo bajo y detecta indicios de LD. La regla expresa de que las medidas simplificadas no se permiten cuando hay sospecha, ¿dónde se encuentra?","a":"En las Notas interpretativas de la R.1 y de la R.10","o":["En el Glosario, en «medidas razonables»","En las Notas interpretativas de la R.1 y de la R.10","En el texto de la R.20, junto con la obligación de reportar con prontitud a la UIF","En el texto de la R.1, en el párrafo dedicado a los riesgos menores del país"],"x":"El texto de la R.1 sólo dice que ante riesgos menores se permitan y alienten medidas simplificadas; la prohibición cuando hay sospecha de LD/FT aparece en la INR.1 (párr. 2) y se reitera en la INR.10 (párr. 21). No está en la R.20 ni en el Glosario.","ref":"INR.1, párr. 2; INR.10, párr. 21"},{"id":"G003","tema":"A","tipo":"memoria","q":"En el contexto de la R.1, ¿qué significa «riesgo de financiamiento a la proliferación»?","a":"Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","o":["Estricta y únicamente la posible violación, falta de implementación o evasión de las sanciones financieras dirigidas de la R.7","El riesgo de que se evadan los controles de exportación de bienes de uso dual previstos en los tratados internacionales de no proliferación","El riesgo de que se financien actos terroristas con armas de destrucción masiva conforme a la resolución 1373 (2001) del Consejo de Seguridad","Cualquier riesgo de que fondos se destinen a armas de destrucción masiva, incluidas las prohibiciones de viaje y las prohibiciones por actividad de la ONU"],"x":"La R.1 acota el riesgo de FP «estricta y únicamente» al incumplimiento o evasión de las sanciones financieras dirigidas de la R.7. No abarca otras medidas de las resoluciones de la ONU, como prohibiciones de viaje (INR.7, nota al pie 21).","ref":"R.1; INR.1, párr. 3"},{"id":"G004","tema":"A","tipo":"caso","q":"Un país determina que cierta categoría de APNFD presenta un riesgo bajo de FP y la exenta de identificar, evaluar y mitigar ese riesgo. Según la Nota a la R.1, ¿qué sigue siendo obligatorio para esa categoría?","a":"La plena implementación de las sanciones financieras dirigidas de la R.7","o":["Una autoevaluación trimestral de riesgo de FP","La DDC reforzada sobre todos los clientes que realizan operaciones con el extranjero","La plena implementación de las sanciones financieras dirigidas de la R.7","Nada adicional: la exención por riesgo bajo alcanza también al congelamiento previsto en la R.7"],"x":"La INR.1 permite exentar de la evaluación y mitigación del riesgo de FP a ciertas IF o APNFD de riesgo bajo, pero aclara que la plena implementación de las sanciones financieras dirigidas de la R.7 es obligatoria en todos los casos; esas obligaciones no se basan en riesgo.","ref":"INR.1, párrs. 3 y 4, y nota al pie 4"},{"id":"G005","tema":"A","tipo":"memoria","q":"Según la Nota a la R.1, los requisitos de los Estándares del GAFI relativos al financiamiento a la proliferación se limitan a:","a":"R.1, R.2, R.7 y R.15","o":["R.1, R.6, R.7 y R.16","R.1, R.7, R.10 y R.35","R.2, R.5, R.7 y R.20","R.1, R.2, R.7 y R.15"],"x":"La nota al pie 3 de la INR.1 dice que los requisitos sobre FP se limitan a las R.1, 2, 7 y 15. La R.6 trata de sanciones por terrorismo, no de proliferación, y la R.16 no forma parte de esa lista.","ref":"INR.1, nota al pie 3"},{"id":"G006","tema":"A","tipo":"memoria","q":"¿Qué recomendación pide que la cooperación entre las autoridades del propio país asegure que los requisitos PLD/FT/CFP sean compatibles con las reglas de protección de datos y privacidad?","a":"R.2 (Cooperación y coordinación nacional)","o":["R.9 (Leyes de secreto de las instituciones financieras)","R.40 (Otras formas de cooperación internacional)","R.2 (Cooperación y coordinación nacional)","R.21 (Revelación y confidencialidad)"],"x":"La R.2 incluye expresamente la cooperación y coordinación entre autoridades para que los requisitos PLD/FT/CFP sean compatibles con la protección de datos y privacidad. La R.9 trata de que el secreto financiero no impida aplicar las Recomendaciones, no de esa coordinación interna.","ref":"R.2"},{"id":"G007","tema":"B","tipo":"cifra","q":"Un país aplica un enfoque de umbral para definir los delitos precedentes y su sistema jurídico se basa en penas máximas. Según la Nota a la R.3, como mínimo deben incluirse los delitos castigados con pena máxima de prisión de:","a":"Más de un año","o":["Más de dos años","Más de seis meses","Más de un año","Más de tres años"],"x":"Con enfoque de umbral basado en penas máximas, la INR.3 exige incluir, al menos, los delitos con pena máxima de más de un año de prisión (o los delitos graves de la ley nacional). «Más de seis meses» es el mínimo cuando el sistema se basa en penas mínimas.","ref":"INR.3, párr. 3"},{"id":"G008","tema":"B","tipo":"cifra","q":"Ahora el sistema jurídico del país fija penas mínimas para los delitos. Con el enfoque de umbral de la Nota a la R.3, ¿qué delitos deben comprenderse, como mínimo, como precedentes?","a":"Los castigados con pena mínima de más de seis meses de prisión","o":["Los castigados con pena mínima de más de un año de prisión","Los castigados con pena mínima de más de dos años de prisión","Los castigados con pena mínima de más de seis meses de prisión","Los castigados con pena mínima de más de tres meses de prisión"],"x":"Para los países con umbral mínimo de penas, la INR.3 exige incluir todos los delitos castigados con pena mínima de más de seis meses. El año corresponde a los sistemas basados en penas máximas.","ref":"INR.3, párr. 3"},{"id":"G009","tema":"B","tipo":"caso","q":"En un juicio por LD contra Andrés, su defensa alega que no puede acreditarse que el dinero sea producto de un fraude porque nadie ha sido condenado por ese fraude. Conforme a la Nota a la R.3, ¿qué aplica?","a":"Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","o":["La condena por el delito precedente sólo se exige cuando el valor de los bienes supera el umbral de USD/EUR 15,000","La condena previa por el delito precedente es indispensable, salvo que el fraude se haya cometido en otro país","Para probar que los bienes son producto del delito no debe ser necesaria una condena por el delito precedente","El delito de LD sólo se configura si una sentencia firme declara antes el origen ilícito de cada bien involucrado"],"x":"La INR.3 dice que, al probar que los bienes son producto del delito, no debe ser necesario que alguien haya sido condenado por el delito precedente. Además, el delito de LD se extiende a cualquier bien sin importar su valor, por lo que no hay umbral de monto.","ref":"INR.3, párr. 4"},{"id":"G010","tema":"B","tipo":"memoria","q":"Según la R.3, ¿con base en qué instrumentos deben los países tipificar el delito de LD?","a":"Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","o":["La Convención contra la Corrupción (2003) y el Convenio sobre Financiación del Terrorismo (1999)","La Convención de Palermo (2000) y la Convención Interamericana contra el Terrorismo (2002)","Las Convenciones de las Naciones Unidas de Viena (1988) y de Palermo (2000)","La Convención de Viena (1988) y el Convenio sobre Ciberdelincuencia (2001)"],"x":"La R.3 y su Nota fundan el delito de LD en las Convenciones de Viena (1988) y de Palermo (2000). El Convenio sobre Financiación del Terrorismo es la base del delito de FT (R.5), y los demás instrumentos aparecen en la R.36.","ref":"R.3; INR.3, párr. 1"},{"id":"G011","tema":"B","tipo":"memoria","q":"¿Qué recomendación pide a los países políticas y marcos operativos que prioricen la recuperación de activos, tanto en el contexto nacional como en el internacional?","a":"R.4 (Decomiso y medidas provisionales)","o":["R.36 (Instrumentos internacionales)","R.38 (Asistencia legal mutua: congelamiento y decomiso)","R.4 (Decomiso y medidas provisionales)","R.30 (Responsabilidades de las autoridades de investigación)"],"x":"La R.4 abre con la obligación de priorizar la recuperación de activos en ambos contextos. La R.38 trata de responder a solicitudes extranjeras de congelamiento y decomiso, no de fijar esa prioridad general.","ref":"R.4"},{"id":"G012","tema":"B","tipo":"caso","q":"La UIF de un país recibe información de que una transferencia sospechosa de LD está por ejecutarse y necesita tiempo para analizarla. Según la Nota a la R.4, el país debe facultar a la UIF u otra autoridad para:","a":"Suspender la operación o negar su consentimiento de inmediato, por un plazo máximo especificado","o":["Ordenar al banco que cierre la cuenta y explique al cliente el motivo de la suspensión de su operación","Suspender la operación o negar su consentimiento de inmediato, por un plazo máximo especificado","Decomisar los fondos de inmediato, sin sentencia y sin posibilidad de revisión judicial posterior","Congelar la cuenta por tiempo indefinido hasta que el cliente acredite el origen lícito de sus recursos"],"x":"La INR.4 pide que la UIF u otra autoridad pueda actuar de inmediato para suspender una operación o negar su consentimiento, con una duración máxima especificada que dé tiempo al análisis y, en su caso, a iniciar un congelamiento o incautación. Es una medida temporal: no autoriza plazos indefinidos, cierres de cuenta con aviso al cliente ni decomisos inmediatos.","ref":"R.4, inciso (b); INR.4, párr. 4"},{"id":"G013","tema":"B","tipo":"trampa","q":"Sobre exigir al infractor que demuestre el origen lícito de los bienes que podrían decomisarse, la Nota a la R.4 establece que los países:","a":"Deben considerar adoptar medidas con ese fin","o":["Deben considerar adoptar medidas con ese fin","Tienen prohibido adoptarlas","Sólo pueden adoptarlas en casos de FT vinculados a designaciones de la ONU","Deben adoptarlas obligatoriamente para todos los delitos precedentes"],"x":"La INR.4 usa un modal débil: los países «deben considerar» medidas que exijan al infractor demostrar el origen lícito de los bienes. No es una obligación absoluta ni una prohibición.","ref":"INR.4, párr. 12"},{"id":"G014","tema":"C","tipo":"caso","q":"Luisa entrega a sabiendas parte de su salario a una organización terrorista. La fiscalía no puede demostrar a qué atentado concreto se destinaron los fondos. Según la R.5 y su Nota, ¿se configura el FT?","a":"Sí, aunque los fondos sean lícitos y no se vinculen a un acto concreto","o":["No, porque los fondos son de origen lícito","No, porque debe demostrarse que los fondos se usaron efectivamente en un acto terrorista","Sí, pero sólo si la organización está designada por el Consejo de Seguridad de la ONU","Sí, aunque los fondos sean lícitos y no se vinculen a un acto concreto"],"x":"La R.5 tipifica el financiamiento de organizaciones terroristas aun sin vínculo con un acto específico, y la INR.5 aclara que abarca fondos de origen legítimo o ilegítimo. El FT no exige que los fondos provengan de un delito, a diferencia de lo que ocurre con el LD.","ref":"R.5; INR.5, párrs. 5 y 6"},{"id":"G015","tema":"C","tipo":"caso","q":"Un grupo reúne dinero para pagar los boletos de avión de tres personas que viajarán a un Estado distinto al de su residencia para recibir entrenamiento terrorista. Según la Nota a la R.5, esa recaudación:","a":"Es FT, porque la Nota incluye el financiamiento de viajes con esos fines","o":["Sólo es FT si el dinero proviene de actividades ilícitas ya sentenciadas por un juez","No es FT mientras los viajeros no cometan o intenten cometer un acto terrorista","Es sólo una tentativa no punible","Es FT, porque la Nota incluye el financiamiento de viajes con esos fines"],"x":"La INR.5 incluye en el FT el financiamiento de viajes a otro Estado para perpetrar, planear o preparar actos terroristas, o para dar o recibir entrenamiento terrorista. No hace falta que el acto se cometa, y la tentativa de FT también debe tipificarse (párr. 10).","ref":"INR.5, párr. 3"},{"id":"G016","tema":"C","tipo":"trampa","q":"Un país tipifica el FT únicamente mediante las figuras de complicidad, tentativa o conspiración respecto de otros delitos. Conforme a la Nota a la R.5, esto:","a":"Es insuficiente para cumplir con la Recomendación","o":["Cumple, si las penas son disuasivas","Cumple para personas morales; sólo las personas físicas requieren un tipo autónomo","Es insuficiente para cumplir con la Recomendación","Cumple, si además el FT queda designado como delito precedente de LD"],"x":"La INR.5 dice expresamente que tipificar el FT sólo a partir de la complicidad, la tentativa o la conspiración no basta. Designar el FT como delito precedente es otra obligación de la R.5, que no sustituye al tipo penal autónomo.","ref":"INR.5, párr. 4"},{"id":"G017","tema":"C","tipo":"memoria","q":"En la R.6, ¿quién designa a las personas y entidades sujetas a congelamiento y con base en qué resoluciones?","a":"El Consejo de Seguridad conforme a la 1267 (1999) y sucesoras, y el propio país conforme a la 1373 (2001)","o":["El Consejo de Seguridad conforme a la 1267 (1999) y sucesoras, y el propio país conforme a la 1373 (2001)","El Consejo de Seguridad conforme a la 1373 (2001), y el propio país conforme a la 1267 (1999) y sucesoras","El Consejo de Seguridad conforme a la 1540 (2004), y el propio país conforme a la 2231 (2015) y sucesoras","El Consejo de Seguridad conforme a la 1718 (2006) y sucesoras, y el propio país conforme a la 1737 (2006)"],"x":"La R.6 cubre a las personas designadas por el Consejo de Seguridad o bajo su autoridad (incluida la resolución 1267 y sus sucesoras) y a las designadas por el propio país conforme a la 1373. Las resoluciones 1718 y 1737 corresponden a la proliferación (R.7).","ref":"R.6"},{"id":"G018","tema":"C","tipo":"caso","q":"Las autoridades de un país evalúan designar, conforme a la resolución 1373, a una persona respecto de la cual hay motivos razonables para creer que financia el terrorismo, aunque no existe un proceso penal abierto. Según la Nota a la R.6:","a":"Pueden designarla: la designación no debe condicionarse a que exista un proceso penal","o":["Deben acreditar su culpabilidad más allá de toda duda razonable antes de poder designarla","Sólo pueden proponerla al Comité 1267, único órgano facultado para designar en materia de terrorismo","Deben esperar a que el Ministerio Público inicie formalmente una investigación penal contra ella","Pueden designarla: la designación no debe condicionarse a que exista un proceso penal"],"x":"La INR.6 fija como estándar probatorio los «motivos razonables» o la «base razonable» y dice que las designaciones no deben condicionarse a la existencia de un proceso penal. En la 1373, el propio país designa, así que no depende del Comité 1267.","ref":"INR.6, párr. 4(d)"},{"id":"G019","tema":"C","tipo":"trampa","q":"La obligación de que las IF y APNFD reporten a las autoridades los activos congelados conforme a la R.6, incluidas las operaciones intentadas, ¿dónde se establece?","a":"En la Nota interpretativa de la R.6","o":["En el texto de la R.20","En la Nota interpretativa de la R.6","En el texto de la R.6","En el Glosario general"],"x":"El texto de la R.6 sólo ordena congelar sin demora y no poner fondos a disposición; el reporte de activos congelados y de operaciones intentadas lo detalla la INR.6. No confundir con la R.20, que regula el reporte de operaciones sospechosas.","ref":"INR.6, párr. 6(e)"},{"id":"G020","tema":"C","tipo":"cifra","q":"Según el Glosario, en el caso de designaciones del Consejo de Seguridad o de sus Comités de sanciones, «sin demora» significa, idealmente:","a":"En cuestión de horas desde la designación","o":["En un plazo de tres días hábiles","Dentro de los cinco días hábiles siguientes a la notificación al sujeto obligado","Dentro del mes siguiente, igual que la actualización del beneficiario final","En cuestión de horas desde la designación"],"x":"El Glosario define «sin demora» como, idealmente, en cuestión de horas desde la designación del Consejo de Seguridad o de su Comité. Los tres días hábiles corresponden a otro plazo (INR.16, párr. 12).","ref":"Glosario (sin demora)"},{"id":"G021","tema":"C","tipo":"caso","q":"Un banco detecta que una empresa cliente acaba de ser designada por el Comité 1718 del Consejo de Seguridad. Conforme a la R.7 y su Nota, ¿qué debe hacer?","a":"Congelar sin demora y sin aviso previo sus fondos y no ponerle fondos a disposición","o":["Aplicar DDC reforzada y congelar los fondos sólo si su matriz de riesgo de FP resulta alta","Presentar un reporte de operación sospechosa y esperar instrucciones de la UIF antes de congelar","Congelar sin demora y sin aviso previo sus fondos y no ponerle fondos a disposición","Congelar únicamente los fondos que puedan vincularse con un acto concreto de proliferación"],"x":"La R.7 exige congelar sin demora los fondos de las personas designadas por el Consejo de Seguridad y no ponerles fondos a disposición; la INR.7 añade «sin aviso previo» y abarca todos sus fondos, no sólo los ligados a un acto concreto. No es una obligación basada en riesgo (INR.1, párr. 3).","ref":"R.7; INR.7, párr. 6(a)"},{"id":"G022","tema":"C","tipo":"caso","q":"Los fondos de Rodrigo quedaron congelados porque su nombre coincide con el de una persona designada en materia de proliferación. Tras verificar que no es la persona designada, la Nota a la R.7 prevé:","a":"Descongelarlos oportunamente mediante procedimientos públicamente conocidos","o":["Decomisarlos si no acredita su origen lícito","Mantener el congelamiento hasta que el Consejo de Seguridad lo excluya formalmente de la lista","Que Rodrigo tramite su exclusión de la lista ante el Punto Focal creado por la resolución 1730","Descongelarlos oportunamente mediante procedimientos públicamente conocidos"],"x":"Para los falsos positivos, la INR.7 exige procedimientos públicamente conocidos para descongelar oportunamente una vez verificado que la persona no está designada. El Punto Focal de la resolución 1730 sirve para pedir la exclusión de quienes sí están designados, no para homónimos.","ref":"INR.7, párrs. 7 y 8"},{"id":"G023","tema":"C","tipo":"caso","q":"Una autoridad propone obligar a todas las OSFL del país a aplicar DDC a sus donantes y beneficiarios, sin distinguir niveles de riesgo. Según la Nota a la R.8, la propuesta:","a":"No es acorde: las OSFL no son sujetos obligados y no debe exigírseles DDC","o":["Es acorde, siempre que la DDC se limite a los donativos que superen el umbral de USD/EUR 15,000","No es acorde: las OSFL no son sujetos obligados y no debe exigírseles DDC","Es acorde sólo para OSFL en zonas de conflicto","Es acorde, porque la R.8 exige tratar a las OSFL con las mismas medidas preventivas que a las IF"],"x":"La INR.8 dice que las OSFL no son sujetos obligados, que no debe exigírseles DDC y que las medidas no proporcionales al riesgo de FT evaluado no son acordes con la R.8. El enfoque es focalizado, proporcional y basado en riesgo, no igual al de las IF.","ref":"R.8; INR.8, párr. 5(e)"},{"id":"G024","tema":"C","tipo":"memoria","q":"De acuerdo con la Nota a la R.8, ¿a qué organizaciones se aplica la Recomendación?","a":"Sólo a las que caen en la definición funcional de OSFL del GAFI","o":["A todas las personas morales autorizadas para recibir donativos deducibles de impuestos","Sólo a las que caen en la definición funcional de OSFL del GAFI","A todas las organizaciones del país que operan sin fines de lucro, sin importar su actividad","Sólo a las clasificadas de alto riesgo de LD"],"x":"La INR.8 adopta una definición funcional: persona moral, estructura jurídica u organización que principalmente recauda o desembolsa fondos con fines benéficos, religiosos, culturales, educativos, sociales o fraternos, o para otras «buenas obras». Aclara que no se aplica a todo el universo sin fines de lucro, y el riesgo que interesa es el de FT, no el de LD.","ref":"INR.8, párr. 1"},{"id":"G025","tema":"D","tipo":"memoria","q":"¿Qué recomendación busca que la confidencialidad que la ley impone a las instituciones financieras no obstaculice la aplicación de los estándares del GAFI?","a":"R.9 (Leyes de secreto de las instituciones financieras)","o":["R.37 (Asistencia legal mutua)","R.9 (Leyes de secreto de las instituciones financieras)","R.2 (Cooperación y coordinación nacional)","R.21 (Revelación y confidencialidad)"],"x":"La R.9 pide que las leyes de secreto de las IF no inhiban la implementación de las Recomendaciones. La R.21 usa la palabra «confidencialidad», pero regula la protección de quien reporta y la prohibición de revelar un reporte.","ref":"R.9"},{"id":"G026","tema":"D","tipo":"cifra","q":"Un cliente ocasional acude a una IF para una operación en efectivo que no es una transferencia. Conforme a la R.10, ¿a partir de qué monto debe aplicarse DDC?","a":"Por encima de USD/EUR 15,000","o":["Igual o superior a USD/EUR 3,000","Por encima de USD/EUR 1,000","Por encima de USD/EUR 15,000","Por encima de USD/EUR 10,000"],"x":"La R.10 fija el umbral designado de las operaciones ocasionales en USD/EUR 15,000, y en este caso la cifra está en el propio texto de la Recomendación. USD/EUR 3,000 es el umbral de casinos (INR.22/23) y USD/EUR 1,000 el de PSAV (INR.15).","ref":"R.10; INR.10, párr. 22"},{"id":"G027","tema":"D","tipo":"caso","q":"El mismo cliente ocasional regresa y, en un mismo día, hace cuatro operaciones de USD 5,000 cada una que parecen vinculadas entre sí. Según la Nota a la R.10, la IF:","a":"Debe aplicar DDC, porque se consideran operaciones vinculadas por encima del umbral","o":["No debe aplicar DDC, porque ninguna operación individual supera los USD/EUR 15,000","Debe aplicar DDC, porque se consideran operaciones vinculadas por encima del umbral","Debe aplicar DDC únicamente si el cliente resulta ser PEP o reside en el extranjero","Sólo debe presentar un reporte de operación sospechosa, sin identificar al cliente"],"x":"La INR.10 aclara que superar el umbral incluye tanto una sola operación como varias que parecen vinculadas; aquí suman USD 20,000. Mirar sólo cada operación por separado es justo lo que la Nota busca impedir.","ref":"INR.10, párr. 22"},{"id":"G028","tema":"D","tipo":"caso","q":"Un cliente potencial, representante de una sociedad, se niega a revelar quién es su beneficiario final. Conforme a la R.10, ¿qué debe hacer la IF?","a":"No iniciar la relación y considerar presentar un reporte de operación sospechosa","o":["Abrir la cuenta y completar la DDC en 30 días","No iniciar la relación y considerar presentar un reporte de operación sospechosa","No iniciar la relación y presentar en todos los casos un reporte de operación sospechosa a la UIF","Abrir la cuenta con DDC simplificada y presentar siempre un reporte de operación sospechosa"],"x":"Si no puede cumplir la DDC, la R.10 exige no abrir la cuenta ni iniciar la relación, y «considerar» un reporte de operación sospechosa. El distractor «presentar en todos los casos» convierte en absoluto un modal que el texto deja en «considerar».","ref":"R.10"},{"id":"G029","tema":"D","tipo":"trampa","q":"La regla de que, si una IF cree razonablemente que aplicar la DDC alertará al cliente sospechoso, puede no continuar ese proceso y debe presentar un reporte de operación sospechosa, ¿dónde se encuentra?","a":"En la Nota interpretativa de la R.10","o":["En la Nota interpretativa de la R.20","En el texto de la R.10","En la Nota interpretativa de la R.10","En el texto de la R.21"],"x":"Está en la INR.10 (sección A, DDC y revelación). La R.21 prohíbe revelar que se presenta un reporte y no tiene Nota interpretativa; el texto de la R.10 no contempla dejar de aplicar la DDC por riesgo de alertar al cliente.","ref":"INR.10, párr. 3"},{"id":"G030","tema":"D","tipo":"memoria","q":"Respecto del propósito y la naturaleza que se pretende dar a la relación de negocios, el inciso (c) de la R.10 pide a la IF:","a":"Entenderlos y, cuando proceda, obtener información sobre ellos","o":["Documentarlos sólo si el cliente es PEP","Verificarlos con fuentes independientes antes de iniciar cualquier relación de negocios","Entenderlos y, cuando proceda, obtener información sobre ellos","Obtener siempre documentación comprobatoria de fuentes independientes que los acredite"],"x":"El inciso (c) de la R.10 dice «entender y, cuando proceda, obtener información» sobre el propósito y la naturaleza de la relación. La verificación con fuentes independientes corresponde a la identidad del cliente (inciso a), no al propósito.","ref":"R.10, inciso (c)"},{"id":"G031","tema":"D","tipo":"caso","q":"Una IF analiza a una sociedad con capital muy pulverizado: ninguna persona física tiene una participación de control ni ejerce el control por otros medios. Según la Nota a la R.10, ¿a quién debe identificar la IF en ese supuesto?","a":"A la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía","o":["A la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía","A todos los accionistas con una participación igual o superior al 10 % del capital","A nadie: en ese supuesto la IF queda eximida de identificar al beneficiario final","Al accionista persona moral que tenga la mayor participación en el capital social"],"x":"La INR.10 establece medidas en cascada: participación de control, luego control por otros medios y, si no se identifica a nadie, la persona física que ocupa el cargo de funcionario administrativo de mayor jerarquía. El Glosario aclara que esto no cambia la definición de beneficiario final, que siempre es una persona física; una persona moral no puede serlo.","ref":"INR.10, párr. 5(b)(i) y nota al pie 39; Glosario (beneficiario final, nota al pie 98)"},{"id":"G032","tema":"D","tipo":"caso","q":"Una aseguradora emite una póliza de vida cuyos beneficiarios son «los hijos del asegurado al ocurrir el siniestro». Según la Nota a la R.10, ¿cuándo debe verificarse la identidad de esos beneficiarios?","a":"Al momento del pago de la póliza","o":["Al momento del pago de la póliza","Dentro de los 30 días siguientes a su designación","Al emitirse la póliza de seguro","Sólo si la suma asegurada supera los USD/EUR 15,000"],"x":"Para beneficiarios designados por características o por clase, la INR.10 pide obtener información suficiente desde la designación y verificar su identidad al momento del pago. No hay umbral de monto para esta regla.","ref":"INR.10, párrs. 6 y 7"},{"id":"G033","tema":"D","tipo":"memoria","q":"¿Qué ejemplos da la Nota a la R.10 de situaciones en que puede completarse la verificación de identidad después de establecer la relación, para no interrumpir la operación normal del negocio?","a":"Los negocios no presenciales y las operaciones con valores","o":["Las PEP nacionales y las cuentas de banca privada de alto patrimonio","Las relaciones de corresponsalía y las cuentas de transferencia de pagos","Los negocios no presenciales y las operaciones con valores","Los clientes no residentes y los negocios intensivos en efectivo"],"x":"La INR.10 cita los negocios no presenciales y las operaciones con valores como ejemplos de verificación posterior. Los clientes no residentes, los negocios intensivos en efectivo y la banca privada aparecen, en cambio, como ejemplos de mayor riesgo.","ref":"INR.10, párr. 11"},{"id":"G034","tema":"D","tipo":"cifra","q":"Una IF terminó la relación de negocios con un cliente el 31 de marzo de 2026. Conforme a la R.11, ¿hasta cuándo, como mínimo, debe conservar su expediente de DDC?","a":"Hasta el 31 de marzo de 2031","o":["Hasta el 31 de marzo de 2036","Hasta el 31 de marzo de 2029","Hasta el 31 de marzo de 2027","Hasta el 31 de marzo de 2031"],"x":"La R.11 exige conservar la información de DDC al menos cinco años después de terminada la relación o de la fecha de la operación ocasional. Diez años no es el mínimo del GAFI, y un plazo menor a cinco no cumple.","ref":"R.11"},{"id":"G035","tema":"D","tipo":"memoria","q":"Además de los registros de operaciones y de DDC, la R.11 exige conservar los resultados de los análisis realizados, por ejemplo:","a":"Las indagaciones sobre antecedentes y propósito de operaciones complejas, inusuales y de gran monto","o":["Los dictámenes de auditoría externa sobre los estados financieros anuales de la institución","Las evaluaciones de desempeño del personal de cumplimiento y los registros de sus capacitaciones","Las indagaciones sobre antecedentes y propósito de operaciones complejas, inusuales y de gran monto","Las actas del consejo en las que se aprueba el presupuesto anual del área de cumplimiento"],"x":"La R.11 menciona como ejemplo de análisis a conservar las indagaciones para establecer los antecedentes y el propósito de operaciones complejas, inusuales y de gran monto. Las capacitaciones y la auditoría son elementos de los programas de la R.18, no los ejemplos de análisis que da la R.11.","ref":"R.11"},{"id":"G036","tema":"D","tipo":"caso","q":"Un banco recibe como cliente a un exministro de un país extranjero. Además de la DDC normal, ¿qué exige la R.12?","a":"Aprobación de la alta dirección, medidas razonables sobre origen del patrimonio y de los fondos, y monitoreo reforzado","o":["Aprobación de la alta dirección, medidas razonables sobre origen del patrimonio y de los fondos, y monitoreo reforzado","Monitoreo reforzado durante el cargo y cierre obligatorio de la cuenta un año después de que concluya su función pública","Aprobación de la alta dirección y de las demás medidas adicionales, pero sólo si la relación se califica de riesgo mayor","Aprobación del consejo de administración y reporte a la UIF de cada operación que el exministro realice en la cuenta"],"x":"Para PEP extranjeras, la R.12 exige siempre, además de la DDC normal, sistemas para detectarlas, aprobación de la alta dirección, medidas razonables sobre el origen del patrimonio y de los fondos, y monitoreo reforzado. Condicionar las medidas a un riesgo mayor corresponde a las PEP nacionales o de organismos internacionales.","ref":"R.12, incisos (a) a (d)"},{"id":"G037","tema":"D","tipo":"caso","q":"Ahora el cliente es un senador de su propio país y la IF concluye que la relación no presenta riesgo mayor. Conforme a la R.12:","a":"Aplica la DDC normal; las medidas (b), (c) y (d) se exigen si la relación es de riesgo mayor","o":["Debe obtener siempre la aprobación de la alta dirección, igual que con una PEP extranjera","Aplica la DDC normal; las medidas (b), (c) y (d) se exigen si la relación es de riesgo mayor","Debe negar la relación, porque la R.12 no permite mantener cuentas de PEP nacionales","Debe aplicar DDC simplificada, porque las PEP nacionales se consideran de menor riesgo"],"x":"Para PEP nacionales, la R.12 pide medidas razonables para determinar su calidad y aplicar las medidas (b), (c) y (d) sólo en relaciones de riesgo mayor. A diferencia de las PEP extranjeras, la aprobación de la alta dirección no es automática.","ref":"R.12"},{"id":"G038","tema":"D","tipo":"trampa","q":"¿Dónde se precisa que la definición de PEP no pretende abarcar a los funcionarios de rango medio o de menor jerarquía?","a":"En el Glosario general","o":["En el Glosario general","En el texto de la R.12","En la Nota interpretativa de la R.10","En la Nota interpretativa de la R.12"],"x":"La aclaración sobre mandos medios está en la definición de PEP del Glosario. La INR.12 sólo trata de los beneficiarios de pólizas de seguros de vida que resultan ser PEP.","ref":"Glosario (PEP)"},{"id":"G039","tema":"D","tipo":"caso","q":"El beneficiario de una póliza de seguro de vida resulta ser una PEP y la aseguradora identifica riesgos mayores. Según la Nota a la R.12, además de la DDC normal, debe:","a":"Informar a la alta dirección antes del pago y examinar a fondo toda la relación con el contratante","o":["Obtener autorización previa de la UIF y retener el pago hasta recibir su respuesta por escrito","Informar a la alta dirección antes del pago y examinar a fondo toda la relación con el contratante","Exigir al beneficiario que acredite que dejó su cargo público al menos un año antes de la fecha del pago","Congelar el pago sin demora y reportarlo a la autoridad como aplicación de sanciones financieras dirigidas"],"x":"La INR.12 pide, ante riesgos mayores, informar a la alta dirección antes del pago, examinar a fondo toda la relación con el contratante y considerar un reporte de operación sospechosa. No exige autorización de la UIF ni congelamiento, que es propio de las R.6 y R.7.","ref":"INR.12"},{"id":"G040","tema":"D","tipo":"caso","q":"Un banco recibe una solicitud de corresponsalía de un banco que no tiene presencia física donde fue constituido (sólo un agente local) y que no pertenece a un grupo financiero regulado. Según la R.13:","a":"Debe rechazarla, porque la corresponsalía con bancos pantalla está prohibida","o":["Debe aceptarla con DDC reforzada y reportarla a la UIF como operación inusual","Debe rechazarla, porque la corresponsalía con bancos pantalla está prohibida","Puede aceptarla si el banco solicitante no ofrece cuentas de transferencia de pagos","Puede aceptarla con aprobación de la alta dirección y tras evaluar sus controles PLD/FT"],"x":"Según el Glosario, un banco sin presencia física en su país de constitución y no afiliado a un grupo supervisado es un banco pantalla, y la R.13 prohíbe iniciar o continuar corresponsalía con él. La aprobación de la alta dirección es un requisito para corresponsalías permitidas, no una forma de validar a un banco pantalla.","ref":"R.13; Glosario (banco pantalla)"},{"id":"G041","tema":"D","tipo":"memoria","q":"Respecto de las cuentas de transferencia de pagos (payable-through accounts), la R.13 pide al banco corresponsal estar satisfecho de que el banco respondiente:","a":"Aplicó DDC a los clientes con acceso directo y puede dar esa información si se le pide","o":["Reporta a la UIF del país del corresponsal cada operación realizada por sus propios clientes","Aplicó DDC a los clientes con acceso directo y puede dar esa información si se le pide","Obtuvo autorización de su supervisor antes de abrir cada subcuenta a nombre de sus clientes","Impide a sus clientes el acceso directo a las cuentas que mantiene en el banco corresponsal"],"x":"El inciso (e) de la R.13 exige que el respondiente haya aplicado DDC a los clientes con acceso directo a las cuentas del corresponsal y pueda proporcionar esa información a solicitud. Estas cuentas se definen justamente por el uso directo de terceros (INR.13), por lo que no se trata de impedirlo.","ref":"R.13, inciso (e); INR.13"},{"id":"G042","tema":"D","tipo":"caso","q":"Una empresa de remesas trabaja con 300 agentes que no tienen licencia ni registro propios ante una autoridad. Conforme a la R.14, ¿qué alternativa le permite cumplir?","a":"Mantener una lista vigente de sus agentes accesible a las autoridades competentes","o":["Exigir a cada agente una licencia bancaria completa antes de que pague remesas","Pedir a los agentes que apliquen DDC simplificada a todos los beneficiarios","Reportar a la UIF cada remesa pagada por sus agentes, sin importar el monto","Mantener una lista vigente de sus agentes accesible a las autoridades competentes"],"x":"La R.14 permite que los agentes tengan licencia o registro, o bien que el proveedor mantenga una lista vigente de agentes accesible a las autoridades. Además, debe incluirlos en sus programas PLD/FT y vigilar que cumplan.","ref":"R.14"},{"id":"G043","tema":"D","tipo":"trampa","q":"Un banco ya autorizado, cuya licencia le permite prestar servicios de transferencia de dinero y que está sujeto a todas las obligaciones del GAFI, ¿requiere una licencia o registro separado como proveedor de estos servicios?","a":"No necesariamente: la Nota a la R.14 dice que el país no necesita imponerlo","o":["No, pero sólo si el banco no utiliza agentes para pagar las transferencias a sus clientes","Sí: el texto de la R.14 exige licencia o registro específico a todo proveedor, sin excepción","No necesariamente: la Nota a la R.14 dice que el país no necesita imponerlo","Sí, salvo que sus transferencias queden por debajo del umbral de minimis de USD/EUR 1,000"],"x":"La INR.14 aclara que el país no necesita imponer un sistema separado de licencia o registro a las IF ya autorizadas para prestar estos servicios y sujetas a todas las obligaciones aplicables. El texto de la R.14 exige licencia o registro, pero la excepción está en su Nota.","ref":"INR.14"},{"id":"G044","tema":"D","tipo":"caso","q":"Un banco planea lanzar el próximo mes una aplicación de pagos basada en una tecnología nueva. Según la R.15, ¿cuándo debe evaluar los riesgos de LD/FT del producto?","a":"Antes del lanzamiento, y adoptar medidas para gestionarlos y mitigarlos","o":["Dentro de los seis meses posteriores al lanzamiento, con datos reales de uso","Sólo cuando el supervisor lo solicite durante una visita de inspección","En la siguiente evaluación anual de riesgos, junto con los demás productos","Antes del lanzamiento, y adoptar medidas para gestionarlos y mitigarlos"],"x":"La R.15 dice que, en el caso de las IF, la evaluación de riesgos debe hacerse antes del lanzamiento de nuevos productos, prácticas o tecnologías, con medidas para gestionar y mitigar esos riesgos. Esperar a tener datos reales de uso invierte el orden que exige el texto.","ref":"R.15"},{"id":"G045","tema":"D","tipo":"cifra","q":"Un proveedor de servicios de activos virtuales (PSAV) atiende a un cliente ocasional. Según la Nota a la R.15, ¿por encima de qué monto debe aplicar DDC?","a":"USD/EUR 1,000","o":["USD/EUR 3,000","USD/EUR 15,000","USD/EUR 10,000","USD/EUR 1,000"],"x":"La INR.15 fija en USD/EUR 1,000 el umbral de DDC para operaciones ocasionales de los PSAV. Es un umbral obligatorio para la DDC, a diferencia del umbral de minimis opcional de la INR.16, y distinto de los USD/EUR 15,000 de la R.10 para IF.","ref":"INR.15, párr. 7(a)"},{"id":"G046","tema":"D","tipo":"memoria","q":"Según la Nota a la R.15, ¿quién debe supervisar o monitorear a los PSAV en materia PLD/FT?","a":"Una autoridad competente, y no un organismo autorregulador","o":["Una autoridad competente, y no un organismo autorregulador","Los propios PSAV, mediante esquemas de autorregulación certificados","Un auditor externo acreditado, designado por cada PSAV cada año","Un organismo autorregulador del sector de activos virtuales"],"x":"La INR.15 dice que los PSAV deben ser supervisados o monitoreados por una autoridad competente (no por un organismo autorregulador), con supervisión basada en riesgo. Esto los distingue de ciertas APNFD, que sí pueden quedar a cargo de organismos autorreguladores (R.28).","ref":"INR.15, párr. 5"},{"id":"G047","tema":"D","tipo":"caso","q":"Un PSAV persona moral fue constituido en el país A y ofrece sus servicios a clientes en el país B. Según la Nota a la R.15, como mínimo debe tener licencia o registro en:","a":"El país A; el país B también puede exigírselo","o":["El país B, donde están sus clientes, y nunca en el país A","Ambos países, en todos los casos","El país A; el país B también puede exigírselo","Ningún país, si sólo intercambia unos activos virtuales por otros"],"x":"La INR.15 exige, como mínimo, licencia o registro en la jurisdicción donde se creó el PSAV, y permite que otras jurisdicciones donde ofrece servicios también lo exijan. El intercambio entre activos virtuales es una actividad de PSAV según el Glosario, así que no lo exime.","ref":"INR.15, párr. 3; Glosario (PSAV)"},{"id":"G048","tema":"D","tipo":"trampa","q":"Con la revisión de junio de 2025, ¿cómo trata la Nota a la R.16 los USD/EUR 1,000 en las transferencias transfronterizas?","a":"Los países pueden adoptar un umbral de minimis no mayor a USD/EUR 1,000","o":["Sólo aplica a retiros de efectivo con tarjeta","Los países deben aplicar un umbral fijo de USD/EUR 1,000 a toda transferencia transfronteriza","Los países pueden adoptar un umbral de minimis no mayor a USD/EUR 1,000","Por debajo de USD/EUR 1,000 las transferencias no deben llevar información alguna del ordenante"],"x":"La INR.16 dice que los países «pueden» adoptar un umbral de minimis «no mayor a» USD/EUR 1,000, que es opcional y máximo. Aun por debajo del umbral, la transferencia debe llevar nombre y cuenta (o referencia única) del ordenante y del beneficiario, y ese umbral excluye expresamente los retiros de efectivo.","ref":"INR.16, párrs. 8 y 10"},{"id":"G049","tema":"D","tipo":"memoria","q":"Cuando el ordenante de una transferencia transfronteriza por encima del umbral de minimis es una persona física, ¿qué dato suyo debe acompañar el mensaje, además del nombre, la cuenta y el domicilio?","a":"Su fecha de nacimiento, o sólo el año si no se tiene completa","o":["Su número de pasaporte vigente y todas sus nacionalidades","Su ocupación y el origen de los recursos que está transfiriendo","Su identificador fiscal y el propósito declarado de la operación","Su fecha de nacimiento, o sólo el año si no se tiene completa"],"x":"La INR.16 exige la fecha de nacimiento del ordenante persona física, y basta el año si no se cuenta con la fecha completa. Los identificadores (BIC, LEI o identificador oficial único) se piden para personas morales, y el origen de los recursos no forma parte del mensaje.","ref":"INR.16, párr. 9(d) y nota al pie 55"},{"id":"G050","tema":"D","tipo":"cifra","q":"Una transferencia nacional llegó sólo con el número de cuenta del ordenante, porque la información completa puede obtenerse por otros medios. La IF beneficiaria la solicita. Según la Nota a la R.16, la IF ordenante debe entregarla:","a":"Dentro de los tres días hábiles siguientes a la solicitud","o":["Dentro de los tres días hábiles siguientes a la solicitud","Dentro de las 24 horas naturales siguientes a la solicitud","Dentro de los cinco días hábiles siguientes a la solicitud","Dentro de los 30 días naturales siguientes a la solicitud"],"x":"La INR.16 dispone que la IF ordenante entregue la información dentro de los tres días hábiles siguientes a la solicitud de la IF beneficiaria, de la intermediaria o de las autoridades. Las autoridades del orden público, en cambio, deben poder exigir su entrega inmediata.","ref":"INR.16, párrs. 11 y 12"},{"id":"G051","tema":"D","tipo":"memoria","q":"Cuando un país permite que las IF se apoyen en terceros para realizar elementos de la DDC, la R.17 establece que la responsabilidad última de esas medidas recae en:","a":"La IF que se apoya en el tercero","o":["La IF que se apoya en el tercero","Ambas instituciones, en la proporción que pacten por contrato","El supervisor del tercero","El tercero que aplicó la DDC originalmente al cliente"],"x":"La R.17 dice que, cuando se permite el apoyo en terceros, la responsabilidad última de la DDC permanece en la IF que se apoya en el tercero. Además, la R.17 usa un modal permisivo: los países «podrán» permitirlo.","ref":"R.17"},{"id":"G052","tema":"D","tipo":"trampa","q":"Una IF contrata a un despacho para que aplique la DDC en su nombre, con los procedimientos de la IF y bajo su control. ¿Se rige esta relación por la R.17?","a":"No: la Nota a la R.17 excluye la subcontratación y las relaciones de agencia","o":["No: la Nota a la R.17 excluye la subcontratación y las relaciones de agencia","Sí: es el caso típico de apoyo en terceros que regula el texto de la R.17","Sólo si el despacho forma parte del mismo grupo financiero que la IF","Sí, siempre que el despacho esté ubicado en un país de riesgo bajo"],"x":"La INR.17 aclara que la R.17 no se aplica a la subcontratación ni a las relaciones de agencia, en las que el tercero aplica los procedimientos de la IF bajo su control. En el apoyo en terceros, el tercero usa sus propios procedimientos y suele tener una relación independiente con el cliente.","ref":"INR.17, párr. 1"},{"id":"G053","tema":"D","tipo":"memoria","q":"El consejo de un banco aprobó un documento con políticas, procedimientos y controles, un programa continuo de capacitación del personal y una función de auditoría independiente para probar el sistema. ¿Qué recomendación desarrolla estos elementos?","a":"R.18 (Controles internos y sucursales y filiales extranjeras)","o":["R.26 (Regulación y supervisión de instituciones financieras)","R.1 (Evaluación de riesgos y enfoque basado en riesgo)","R.18 (Controles internos y sucursales y filiales extranjeras)","R.34 (Guía y retroalimentación)"],"x":"Esos tres elementos (políticas, procedimientos y controles; capacitación continua; auditoría independiente) integran los programas PLD/FT de la R.18 y su Nota. La R.26 trata de la regulación y supervisión por parte de las autoridades, no del programa interno de la IF.","ref":"R.18; INR.18, párr. 1"},{"id":"G054","tema":"D","tipo":"memoria","q":"Según la Nota a la R.18, los arreglos de gestión del cumplimiento deben incluir:","a":"La designación de un oficial de cumplimiento a nivel directivo","o":["La contratación de un auditor externo certificado por el supervisor","La designación de un oficial de cumplimiento a nivel directivo","Un comité de cumplimiento integrado sólo por consejeros independientes","Un oficial de cumplimiento que dependa jerárquicamente de la UIF"],"x":"La INR.18 dice que los arreglos de gestión del cumplimiento deben incluir la designación de un oficial de cumplimiento a nivel directivo. La auditoría que exige es una función independiente para probar el sistema, no un auditor certificado por el supervisor.","ref":"INR.18, párr. 3"},{"id":"G055","tema":"D","tipo":"caso","q":"La filial de un grupo financiero opera en un país anfitrión con requisitos PLD/FT menos estrictos que los del país de origen, y la ley local impide aplicar algunas medidas del país de origen. Según la Nota a la R.18, el grupo debe:","a":"Aplicar medidas adicionales para gestionar el riesgo e informar a su supervisor de origen","o":["Cerrar de inmediato la filial, sin posibilidad de aplicar medidas adicionales previas","Aplicar medidas adicionales para gestionar el riesgo e informar a su supervisor de origen","Limitarse a las exigencias del país anfitrión, porque rige el principio de territorialidad","Aplicar las normas del país de origen aunque lo prohíban las leyes del país anfitrión"],"x":"La INR.18 pide aplicar los requisitos del país de origen en la medida en que lo permita la ley del anfitrión; si no lo permite, aplicar medidas adicionales e informar al supervisor de origen. El cierre es una acción que el supervisor de origen puede considerar después, si las medidas adicionales no bastan.","ref":"INR.18, párr. 5"},{"id":"G056","tema":"D","tipo":"caso","q":"El GAFI hace un llamado a aplicar debida diligencia reforzada respecto de cierto país. Un banco recibe instrucciones de pago de una empresa constituida en ese país. Conforme a la R.19, el banco:","a":"Debe aplicar DDC reforzada, eficaz y proporcional a los riesgos","o":["Sólo debe presentar a la UIF un reporte de operación sospechosa por cada pago","Debe aplicar DDC reforzada, eficaz y proporcional a los riesgos","Puede decidir libremente si refuerza la DDC, según su apetito de riesgo","Debe rechazar toda operación con personas de ese país, sin excepción"],"x":"La R.19 obliga a aplicar DDC reforzada, eficaz y proporcional a los riesgos, a las relaciones y operaciones con personas de países respecto de los cuales el GAFI lo pide. No es opcional (INR.10, nota al pie 44) ni equivale a prohibir todas las operaciones.","ref":"R.19"},{"id":"G057","tema":"D","tipo":"memoria","q":"Además de hacerlo cuando el GAFI lo pida, la R.19 establece que los países deben poder aplicar contramedidas:","a":"De manera independiente, sin que medie un llamado del GAFI","o":["Sólo cuando lo autorice una resolución del Consejo de Seguridad","Sólo cuando lo solicite el organismo regional al estilo del GAFI","Sólo después de una evaluación mutua con resultados deficientes","De manera independiente, sin que medie un llamado del GAFI"],"x":"La R.19 dice que los países deben poder aplicar contramedidas cuando el GAFI lo pida y también de manera independiente, siempre de forma eficaz y proporcional a los riesgos. No se condiciona a resoluciones de la ONU ni a evaluaciones mutuas.","ref":"R.19; INR.19, párr. 2"},{"id":"G058","tema":"D","tipo":"trampa","q":"Un cliente intenta depositar USD 300 con indicios claros de que provienen de una extorsión y se retira cuando le piden identificación. ¿Qué exige el GAFI y dónde se precisa?","a":"Reportarla aunque no se concretó ni importe el monto; lo precisa la Nota a la R.20","o":["Reportarla aunque no se concretó ni importe el monto; lo precisa el texto de la R.20","Reportarla sólo si supera el umbral de USD/EUR 15,000; lo fija el texto de la R.10","Reportarla aunque no se concretó ni importe el monto; lo precisa la Nota a la R.20","No reportarla, porque la R.20 sólo abarca las operaciones efectivamente realizadas"],"x":"El texto de la R.20 obliga a reportar con prontitud las sospechas; la precisión de que se reportan también las operaciones intentadas y sin importar el monto está en la INR.20. El distractor más tentador dice lo mismo, pero lo ubica en el texto de la Recomendación.","ref":"INR.20, párr. 3"},{"id":"G059","tema":"D","tipo":"memoria","q":"Según la R.20, si una IF sospecha o tiene motivos razonables para sospechar que ciertos fondos son producto de una actividad delictiva o se relacionan con el FT, debe:","a":"Reportar con prontitud su sospecha a la UIF, por obligación establecida en ley","o":["Reportar con prontitud su sospecha a la UIF, por obligación establecida en ley","Terminar la relación y explicar al cliente el motivo por el que se cierra su cuenta","Congelar sin demora los fondos y notificarlo al Consejo de Seguridad de la ONU","Informar a su supervisor financiero en la siguiente visita de inspección ordinaria"],"x":"La R.20 exige, por ley, reportar con prontitud la sospecha a la UIF. El congelamiento sin demora corresponde a las sanciones financieras dirigidas (R.6 y R.7), y explicar al cliente el motivo violaría la prohibición de revelar (R.21).","ref":"R.20"},{"id":"G060","tema":"D","tipo":"trampa","q":"Un país no tiene una obligación expresa de reportar operaciones sospechosas y argumenta que sus bancos reportan para evitar ser procesados por LD. Según la Nota a la R.20, esto:","a":"No es aceptable: la obligación de reportar debe ser directa y obligatoria","o":["Es aceptable si en la práctica los bancos reportan con prontitud a la UIF","Es aceptable siempre que la UIF emita guías y retroalimentación a los bancos","Es aceptable si se complementa con reportes obligatorios de operaciones en efectivo","No es aceptable: la obligación de reportar debe ser directa y obligatoria"],"x":"La INR.20 exige que el reporte sea una obligación directa y obligatoria, y rechaza el llamado «reporte indirecto», motivado por el temor a ser procesado. Que los bancos reporten en la práctica no subsana la falta de la obligación legal.","ref":"INR.20, párr. 4"},{"id":"G061","tema":"D","tipo":"caso","q":"Un analista de una IF sospecha que los fondos de un cliente provienen de un delito fiscal, aunque no tiene pruebas ni conoce el monto defraudado. Conforme a la R.20 y el Glosario, ¿surge la obligación de reportar?","a":"Sí, porque los delitos fiscales están entre las categorías de delitos designadas","o":["No, porque los delitos fiscales quedan fuera de los delitos precedentes del GAFI","Sólo si el monto supera el umbral de USD/EUR 15,000 previsto en la R.10","Sí, porque los delitos fiscales están entre las categorías de delitos designadas","No, porque debe tener certeza del delito y del monto defraudado antes de reportar"],"x":"La R.20 se activa con la sospecha, no con la certeza, y la «actividad delictiva» remite a los delitos precedentes; el Glosario incluye los delitos fiscales entre las categorías de delitos designadas. La R.21 protege incluso a quien no conocía con precisión el delito subyacente.","ref":"R.20; INR.20, párr. 1; Glosario (categorías de delitos designadas)"},{"id":"G062","tema":"D","tipo":"memoria","q":"Según la nota sobre la base legal de los requisitos para IF, APNFD y PSAV, ¿qué recomendaciones contienen requisitos específicos que deben establecerse en ley?","a":"R.10, R.11 y R.20","o":["R.10, R.12 y R.21","R.11, R.16 y R.20","R.18, R.20 y R.22","R.10, R.11 y R.20"],"x":"La nota sobre la base legal remite a los requisitos específicos de ley de las R.10, 11 y 20; lo demás puede estar en ley o en medios coercitivos. En la R.10 debe constar en ley el principio de aplicar DDC (las obligaciones concretas pueden ir en medios coercitivos); en la R.11, la obligación de conservar registros de operaciones e información de DDC; y en la R.20, la obligación de reportar.","ref":"Nota sobre la base legal, párr. 1; R.10; R.11; R.20"},{"id":"G063","tema":"D","tipo":"caso","q":"Una oficial de cumplimiento reportó de buena fe a la UIF una operación; después se comprobó que no hubo delito. El cliente la demanda por violar la cláusula de confidencialidad de su contrato. Según la R.21:","a":"Está protegida por ley frente a la responsabilidad penal y civil, aunque no haya habido delito","o":["Está protegida por ley frente a la responsabilidad penal y civil, aunque no haya habido delito","Está protegida sólo si identificó con precisión cuál era el delito precedente involucrado","Responde en la vía civil por el incumplimiento contractual, aunque no en la vía penal","Es responsable, porque la protección legal sólo opera cuando el delito llega a comprobarse"],"x":"La R.21 protege por ley, frente a la responsabilidad penal y civil, a quien reporta de buena fe a la UIF, aunque no supiera con precisión cuál era la actividad delictiva y sin importar si esta ocurrió realmente. La protección cubre ambas vías, no sólo la penal.","ref":"R.21, inciso (a)"},{"id":"G064","tema":"D","tipo":"caso","q":"La sucursal de un banco comparte con la función de cumplimiento del grupo el hecho de que presentó un reporte de operación sospechosa sobre un cliente común. ¿Viola esto la prohibición de revelar?","a":"No, porque esa prohibición no pretende inhibir el intercambio de información de la R.18","o":["Sí, porque ningún tercero, ni siquiera dentro del grupo, puede saber que existe el reporte","Sí, salvo que el supervisor autorice por escrito cada intercambio dentro del grupo","No, pero sólo si la función de cumplimiento del grupo está en el mismo país","No, porque esa prohibición no pretende inhibir el intercambio de información de la R.18"],"x":"La R.21 aclara que la prohibición de revelar no pretende inhibir el intercambio de información de la R.18, y la INR.18 prevé que las funciones de grupo reciban información que puede incluir el hecho de que se presentó un reporte, con salvaguardas contra la revelación.","ref":"R.21, inciso (b); INR.18, párr. 4"},{"id":"G065","tema":"D","tipo":"cifra","q":"Según las Notas a las R.22 y R.23, un casino debe aplicar DDC cuando sus clientes realizan operaciones financieras iguales o superiores a:","a":"USD/EUR 3,000","o":["USD/EUR 10,000","USD/EUR 3,000","USD/EUR 15,000","USD/EUR 1,000"],"x":"El umbral designado para casinos es de USD/EUR 3,000, y no aparece en el texto de la R.22 sino en su Nota. USD/EUR 15,000 es el umbral de los comerciantes de metales y piedras preciosas en efectivo y de las operaciones ocasionales de IF.","ref":"INR.22/23, párr. 1; INR.22, párr. 2"},{"id":"G066","tema":"D","tipo":"cifra","q":"Ahora se trata de un comerciante de piedras preciosas que recibe pagos en efectivo. Según las Notas a las R.22 y R.23, ¿a partir de qué monto aplican la DDC y el reporte de operaciones sospechosas?","a":"USD/EUR 15,000","o":["USD/EUR 15,000","USD/EUR 10,000","USD/EUR 7,500","USD/EUR 3,000"],"x":"Para comerciantes de metales y de piedras preciosas en operaciones en efectivo, el umbral es de USD/EUR 15,000, tanto para la DDC (R.22) como para el reporte (R.23). USD/EUR 3,000 es exclusivo de los casinos.","ref":"INR.22/23, párr. 1; R.22, inciso (c); R.23, inciso (b)"},{"id":"G067","tema":"D","tipo":"caso","q":"Un agente inmobiliario interviene en la compraventa de una casa. Según la Nota a la R.22, ¿a quién debe aplicar la DDC?","a":"Tanto al comprador como al vendedor del inmueble","o":["Sólo al comprador, que es quien aporta los recursos","Tanto al comprador como al vendedor del inmueble","Sólo al vendedor, que es quien contrató su servicio","Sólo a quien le paga la comisión por la operación"],"x":"La INR.22 dice que los agentes inmobiliarios deben cumplir la R.10 respecto de compradores y vendedores. Limitarla a quien paga o a quien aporta los recursos deja fuera a una de las partes.","ref":"INR.22, párr. 1"},{"id":"G068","tema":"D","tipo":"trampa","q":"Una abogada, sujeta a obligaciones como APNFD, intenta disuadir a su cliente de realizar una actividad ilegal. Según la Nota a la R.23, esa conducta:","a":"No constituye revelación (tipping-off)","o":["Es válida sólo si ya reportó","Es revelación, salvo que actúe como notaria","Constituye la revelación prohibida por la R.21","No constituye revelación (tipping-off)"],"x":"La INR.23 aclara que, cuando abogados, notarios, otros profesionales jurídicos independientes o contadores intentan disuadir a un cliente de una actividad ilegal, eso no equivale a revelar. La precisión está en la Nota a la R.23, no en el texto de la R.21.","ref":"INR.23, párr. 4"},{"id":"G069","tema":"D","tipo":"caso","q":"Un contador que actúa como profesional jurídico independiente obtiene cierta información mientras determina la situación jurídica de su cliente, en circunstancias sujetas a secreto profesional. Según la Nota a la R.23, respecto de esa información:","a":"No está obligado a reportarla como operación sospechosa","o":["Debe reportarla siempre, porque el secreto profesional no aplica en materia de PLD/FT","Debe enviarla a su colegio profesional","Debe reportarla sólo si la operación es en efectivo y alcanza USD/EUR 15,000","No está obligado a reportarla como operación sospechosa"],"x":"La INR.23 dice que abogados, notarios, otros profesionales jurídicos independientes y contadores que actúan como tales no están obligados a reportar si obtuvieron la información en circunstancias sujetas a secreto profesional o privilegio legal. Enviar reportes a un organismo autorregulador es una opción que el país puede permitir, no una vía para la información privilegiada.","ref":"INR.23, párrs. 1 y 2"},{"id":"G070","tema":"E","tipo":"cifra","q":"Si un país define la participación de control en una persona moral mediante un umbral porcentual de propiedad, ¿qué máximo fija la Nota a la R.24?","a":"25 %","o":["10 %","25 %","50 %","33 %"],"x":"La nota al pie 64 de la INR.24 dice que el umbral se determina según la evaluación de riesgo del país, con un máximo de 25 %. La INR.10 menciona el 25 % sólo como ejemplo; la INR.24 lo convierte en tope.","ref":"INR.24, nota al pie 64"},{"id":"G071","tema":"E","tipo":"caso","q":"Una sociedad que no cotiza en bolsa pretende emitir nuevas acciones al portador para atraer inversionistas. Según la R.24, el país:","a":"No debe permitir la emisión de nuevas acciones al portador","o":["Puede permitirla si la sociedad lleva un registro interno actualizado de sus tenedores","No debe permitir la emisión de nuevas acciones al portador","Puede permitirla si las acciones se inmovilizan en una institución financiera regulada","Debe permitirla con DDC reforzada"],"x":"La R.24 dice que los países no deben permitir la emisión de nuevas acciones al portador. La inmovilización o la conversión a forma nominativa son mecanismos para las acciones al portador ya existentes (INR.24, párr. 12), no para autorizar nuevas. Estos requisitos no aplican a sociedades cotizadas sujetas a requisitos de revelación que aseguren la transparencia del beneficiario final (INR.24, nota al pie 78).","ref":"R.24; INR.24, párr. 12 y nota al pie 78"},{"id":"G072","tema":"E","tipo":"memoria","q":"Para que las autoridades obtengan o accedan rápida y eficientemente a la información de beneficiario final de las personas morales, la R.24 prevé:","a":"Un registro de beneficiarios finales o un mecanismo alternativo","o":["Un registro de beneficiarios finales o un mecanismo alternativo","Un registro público de beneficiarios finales con acceso universal y gratuito","Que la información quede sólo en poder de las IF y APNFD que atienden a la sociedad","Que la información la conserve de forma exclusiva la UIF del país"],"x":"La R.24 dice que la información debe poder obtenerse «a través de un registro de beneficiarios finales o de un mecanismo alternativo», y la INR.24 pide combinar varios mecanismos. El acceso público es algo que los países «podrían considerar», no una obligación.","ref":"R.24; INR.24, párrs. 7 y 11"},{"id":"G073","tema":"E","tipo":"caso","q":"Julián figura como titular del 60 % de las acciones de una sociedad, pero vota y cobra dividendos siguiendo las instrucciones de Elena, persona física que no actúa por cuenta de nadie más. Para efectos del GAFI, ¿quién es el beneficiario final de esa participación de control?","a":"Elena, la persona física por cuenta de quien actúa Julián","o":["Ambos, porque comparten los derechos corporativos y los económicos","Julián, titular registral de las acciones","Elena, la persona física por cuenta de quien actúa Julián","Ninguno, hasta que un registro público reconozca formalmente el mandato"],"x":"Según el Glosario, el accionista nominal nunca es el beneficiario final por las acciones que tiene como nominal; hay que identificar a la persona física por cuenta de quien actúa. Que las acciones estén a su nombre no lo convierte en beneficiario final.","ref":"Glosario (accionista o director nominal); INR.24, nota al pie 80"},{"id":"G074","tema":"E","tipo":"caso","q":"Leonardo es fiduciario de un fideicomiso expreso y, en esa calidad, inicia una relación de negocios con una IF. Según la Nota a la R.25, los países deben asegurar que Leonardo:","a":"Revele su calidad de fiduciario a la IF al iniciar la relación","o":["Revele su calidad de fiduciario a la IF al iniciar la relación","Informe sólo quién es el fideicomitente","Revele su calidad de fiduciario sólo si la operación supera los USD/EUR 15,000","Abra la cuenta a nombre propio, sin mencionar el fideicomiso, por ser el titular legal"],"x":"La INR.25 pide que los fiduciarios revelen su calidad a las IF y APNFD al iniciar una relación de negocios o al realizar una operación ocasional por encima del umbral. El umbral aplica sólo a las operaciones ocasionales, no a la apertura de una relación.","ref":"INR.25, párr. 4"},{"id":"G075","tema":"F","tipo":"caso","q":"Un empresario con antecedentes penales por fraude busca adquirir una participación de control en una casa de bolsa. Según la R.26, las autoridades competentes o supervisores deben:","a":"Tomar las medidas legales o regulatorias necesarias para impedirlo","o":["Tomar las medidas legales o regulatorias necesarias para impedirlo","Permitirlo, pero exigir a la casa de bolsa DDC reforzada durante cinco años","Permitirlo si ya cumplió su condena y otorga una garantía suficiente","Remitir el asunto a la UIF para que decida si lo reporta como operación sospechosa"],"x":"La R.26 exige tomar las medidas legales o regulatorias necesarias para impedir que delincuentes o sus asociados tengan una participación significativa o de control, sean beneficiarios finales de ella u ocupen funciones de dirección en una IF. No prevé permitirlo con garantías ni con DDC reforzada.","ref":"R.26"},{"id":"G076","tema":"F","tipo":"memoria","q":"Para las IF sujetas a los Principios Básicos, la R.26 dispone que:","a":"Las medidas prudenciales relevantes para LD/FT se apliquen de manera similar con fines PLD/FT","o":["Queden exentas de la supervisión PLD/FT, porque ya reciben una supervisión prudencial completa","Sean supervisadas exclusivamente por organismos autorreguladores del propio sector financiero","Las medidas prudenciales relevantes para LD/FT se apliquen de manera similar con fines PLD/FT","Basten un registro simple y un monitoreo, sin supervisión consolidada de grupo con fines PLD/FT"],"x":"La R.26 dice que las medidas regulatorias y de supervisión prudencial que también son relevantes para LD/FT deben aplicarse de manera similar con fines PLD/FT, incluida la supervisión consolidada de grupo. El registro o licencia con supervisión o monitoreo es el régimen para las «otras» IF.","ref":"R.26"},{"id":"G077","tema":"F","tipo":"trampa","q":"La regla de que el supervisor revise el perfil de riesgo de LD/FT de una IF o grupo tanto de forma periódica como ante eventos o cambios importantes en su gestión y operaciones, ¿dónde se establece?","a":"En la Nota interpretativa de la R.26","o":["En el texto de la R.26","En el texto de la R.27","En la Nota interpretativa de la R.1","En la Nota interpretativa de la R.26"],"x":"La INR.26 detalla la supervisión basada en riesgo y pide revisar el perfil de riesgo de la IF o grupo periódicamente y cuando haya eventos o cambios importantes. La R.27 regula las facultades del supervisor y no tiene Nota; la INR.1 pide revisar perfiles de riesgo, pero remite a las Notas de las R.26 y R.28 para cuándo y cómo hacerlo.","ref":"INR.26, párr. 3"},{"id":"G078","tema":"F","tipo":"memoria","q":"¿Qué recomendación establece que los supervisores deben poder realizar inspecciones, obligar a entregar información e imponer sanciones, incluida la facultad de retirar, restringir o suspender la licencia de una IF?","a":"R.27 (Facultades de los supervisores)","o":["R.26 (Regulación y supervisión de instituciones financieras)","R.35 (Sanciones)","R.31 (Facultades de las autoridades de investigación)","R.27 (Facultades de los supervisores)"],"x":"La R.27 regula las facultades de los supervisores: inspeccionar, obligar a entregar información y sancionar, incluso retirando, restringiendo o suspendiendo la licencia. La R.35 exige que existan sanciones eficaces, proporcionales y disuasivas, pero no enumera las facultades del supervisor.","ref":"R.27"},{"id":"G079","tema":"F","tipo":"caso","q":"Un país encarga a un colegio de notarios vigilar el cumplimiento PLD/FT de sus miembros. Según la R.28, este esquema:","a":"Es válido si el organismo autorregulador puede asegurar que sus miembros cumplan","o":["Es válido sólo para los casinos, que admiten un régimen de autorregulación pleno","Es válido si el organismo autorregulador puede asegurar que sus miembros cumplan","No es válido, porque toda APNFD debe ser supervisada por una autoridad pública","Es válido, aunque el colegio no tenga sanciones disponibles contra sus miembros"],"x":"Para las APNFD distintas de los casinos, la R.28 permite que el monitoreo lo haga un supervisor o un organismo autorregulador apropiado, siempre que pueda asegurar que sus miembros cumplan. Los casinos, en cambio, requieren licencia y un régimen integral de regulación y supervisión.","ref":"R.28, inciso (b)"},{"id":"G080","tema":"F","tipo":"trampa","q":"Una UIF utiliza la información disponible, incluida la que le proporcionan otras autoridades, para identificar tendencias y patrones de LD/FT que ayuden a fijar políticas. ¿Qué tipo de análisis es y dónde se define?","a":"Análisis estratégico; se define en la Nota a la R.29","o":["Análisis estratégico; se define en el texto de la R.29","Análisis operativo; se define en la Nota a la R.29","Análisis estratégico; se define en la Nota a la R.29","Análisis táctico; se define en el Glosario general"],"x":"Identificar tendencias y patrones para determinar amenazas, vulnerabilidades y políticas es análisis estratégico. La distinción entre análisis operativo y estratégico está en la INR.29; el texto de la R.29 sólo habla de recibir, analizar y diseminar.","ref":"INR.29, párr. 3"},{"id":"G081","tema":"F","tipo":"caso","q":"Esa misma UIF sigue el rastro de las transferencias de una red y determina vínculos entre tres personas y posibles productos del delito. ¿Qué tipo de análisis realiza?","a":"Análisis operativo","o":["Análisis operativo","Análisis de supervisión","Análisis de riesgo país","Análisis estratégico"],"x":"El análisis operativo identifica objetivos concretos (personas, bienes, redes), sigue el rastro de operaciones y determina vínculos con posibles productos del delito. El estratégico, en cambio, busca tendencias y patrones.","ref":"INR.29, párr. 3"},{"id":"G082","tema":"F","tipo":"memoria","q":"Cuando una autoridad competente solicita información a la UIF, según la Nota a la R.29, la decisión de realizar el análisis o de diseminar la información:","a":"Permanece en la propia UIF","o":["Es de quien la solicita","Corresponde al supervisor de la institución reportante","Permanece en la propia UIF","Requiere una orden judicial previa"],"x":"La INR.29 dice que, ante una solicitud de una autoridad competente, la decisión de analizar o diseminar permanece en la UIF, lo que refleja su independencia operativa. Si la decidiera la autoridad que solicita, esa autonomía desaparecería.","ref":"INR.29, párrs. 4 y 8"},{"id":"G083","tema":"F","tipo":"memoria","q":"¿Qué funciones centrales asigna la R.29 a la UIF?","a":"Recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados","o":["Supervisar a las instituciones financieras, imponerles sanciones y otorgar licencias a las APNFD del país","Recibir los reportes, congelar sin demora las cuentas involucradas y decomisar los bienes de origen ilícito","Recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados","Recibir los reportes, investigar penalmente a los involucrados y ejercer la acción penal ante los tribunales"],"x":"La R.29 define a la UIF como centro nacional para recibir y analizar reportes de operaciones sospechosas y otra información relevante, y diseminar los resultados de ese análisis. Investigar y ejercer la acción penal corresponde a las autoridades de las R.30 y R.31, y supervisar a las R.26 a R.28.","ref":"R.29"},{"id":"G084","tema":"F","tipo":"caso","q":"Una policía investiga una red de narcotráfico que genera grandes ganancias. Conforme a la R.30, además de investigar el delito, las autoridades designadas deben:","a":"Desarrollar una investigación financiera paralela y proactiva","o":["Desarrollar una investigación financiera paralela y proactiva","Solicitar al supervisor bancario una inspección de las cuentas de la red","Remitir el caso a la UIF para que investigue el componente financiero","Esperar la sentencia por narcotráfico antes de rastrear los bienes"],"x":"La R.30 pide, al menos en los delitos que generan grandes ganancias, una investigación financiera paralela y proactiva al investigar el LD, los delitos precedentes y el FT. La UIF analiza y disemina, pero no sustituye a la investigación de las autoridades del orden público.","ref":"R.30; INR.30, párr. 3"},{"id":"G085","tema":"F","tipo":"memoria","q":"¿Qué técnicas de investigación menciona expresamente la R.31?","a":"Operaciones encubiertas, intervención de comunicaciones, acceso a sistemas informáticos y entrega vigilada","o":["Operaciones encubiertas, intervención de comunicaciones, acceso a sistemas informáticos y entrega vigilada","Intervención de comunicaciones, testigos protegidos, cateos sin orden judicial y entregas vigiladas","Agentes encubiertos, pruebas de polígrafo, intervención de comunicaciones y congelamiento sin demora","Operaciones encubiertas, detención sin orden judicial, acceso a sistemas informáticos y entrega vigilada"],"x":"La R.31 enumera las operaciones encubiertas, la intervención de comunicaciones, el acceso a sistemas informáticos y la entrega vigilada. Las detenciones o cateos sin orden judicial, el polígrafo y los testigos protegidos no aparecen en el texto.","ref":"R.31"},{"id":"G086","tema":"F","tipo":"caso","q":"Unos fiscales necesitan saber si un investigado tiene cuentas en el sistema financiero sin alertarlo. Según la R.31, los países deben contar con:","a":"Mecanismos para identificar oportunamente titulares de cuentas y bienes sin notificarlo previamente al propietario","o":["Un requerimiento escrito al investigado para que declare sus cuentas en un plazo de tres días hábiles","Solicitudes a cada banco, que por transparencia deben notificarse también al titular de las cuentas","Mecanismos para identificar oportunamente titulares de cuentas y bienes sin notificarlo previamente al propietario","Una solicitud de asistencia legal mutua previa, aunque las cuentas se encuentren en el propio país"],"x":"La R.31 exige mecanismos para identificar oportunamente si personas físicas o morales tienen o controlan cuentas, y un proceso para identificar bienes sin notificación previa al propietario. Avisar al titular frustraría precisamente ese propósito.","ref":"R.31"},{"id":"G087","tema":"D","tipo":"trampa","q":"¿Cuál de estos grupos está formado únicamente por recomendaciones que no tienen Nota interpretativa?","a":"R.9, R.21, R.31 y R.37","o":["R.11, R.21, R.29 y R.39","R.9, R.20, R.31 y R.37","R.9, R.21, R.31 y R.37","R.27, R.33, R.35 y R.38"],"x":"No tienen Nota las R.9, 11, 21, 27, 31, 33, 34, 35, 36, 37 y 39. La R.20 tiene Nota (operaciones intentadas y sin importar el monto), la R.29 también (análisis operativo y estratégico) y la R.38 también.","ref":"R.9; R.21; R.31; R.37 (sin Nota interpretativa)"},{"id":"G088","tema":"F","tipo":"cifra","q":"Un país adopta un sistema de declaración para el transporte transfronterizo físico de efectivo e instrumentos negociables al portador. Según la Nota
